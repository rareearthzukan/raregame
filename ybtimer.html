<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イッテルビウムの集中タイマー | レアアース17元素</title>
  <style>
    /* サイバーテーマ（デフォルト） */
    :root {
      --bg-deep: #0a0f1d;
      --card-bg: #131c31;
      --primary-neon: #00ffcc;
      --accent-red: #ff3366;
      --accent-blue: #00ccff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --chip-bg: #1e293b;
      --input-bg: #0a0f1d;
    }

    /* ライトテーマ */
    body.light-theme {
      --bg-deep: #f4f7f4;
      --card-bg: #ffffff;
      --primary-neon: #2e7d32;
      --accent-red: #e53935;
      --accent-blue: #0288d1;
      --text-main: #2c3e50;
      --text-muted: #607d8b;
      --border-color: #c8e6c9;
      --chip-bg: #f1f8e9;
      --input-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      transition: background 0.3s, color 0.3s;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      margin-bottom: 8px;
    }

    header { gap: 8px; }
    h1 {
      font-size: clamp(0.95rem, 4.2vw, 1.15rem);
      min-width: 0;
      line-height: 1.25;
      color: var(--primary-neon);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.2s;
      flex: 0 0 auto;
      white-space: nowrap;
      min-width: 7.5em;
      text-align: center;
    }
    @media (max-width: 360px) {
      .theme-toggle-btn { min-width: 6.5em; padding: 6px 8px; font-size: 0.7rem; }
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--border-color);
      transition: background 0.3s, border 0.3s;
    }

    /* キャラクターエリア */
    .chara-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .speech-bubble {
      position: relative;
      background: var(--chip-bg);
      border: 1px solid var(--primary-neon);
      border-radius: 14px;
      padding: 10px 14px;
      width: 100%;
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 10px;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: var(--primary-neon) transparent;
      display: block;
      width: 0;
    }

    .chara-avatar-container {
      width: 110px;
      height: 110px;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    #charaCanvas {
      width: 110px;
      height: 110px;
    }

    .poke-btn {
      margin-top: 4px;
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* モード切り替えタブ */
    .mode-tabs {
      display: flex;
      width: 100%;
      background: var(--chip-bg);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-neon);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 時間選択パネル（プルダウン式） */
    .time-settings-panel {
      width: 100%;
      background: var(--chip-bg);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .time-settings-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      font-size: 0.75rem;
    }

    .time-setting-box {
      background: var(--card-bg);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .time-setting-box label {
      display: block;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-size: 0.7rem;
    }

    .time-setting-box select {
      background: var(--input-bg);
      color: var(--primary-neon);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
    }

    /* タイマー表示エリア */
    .timer-display-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .visual-canvas-container {
      width: 220px;
      height: 220px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #timerCanvas {
      width: 220px;
      height: 220px;
    }

    .digital-time {
      font-size: 2.1rem;
      font-weight: bold;
      color: var(--primary-neon);
      font-family: monospace;
      letter-spacing: 2px;
    }

    .pomo-status-tag {
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      background: var(--chip-bg);
      color: var(--primary-neon);
      border: 1px solid var(--border-color);
    }

    /* コントロールボタン */
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary-neon);
      color: #0a0f1d;
      flex: 2;
    }

    body.light-theme .btn-primary {
      color: #ffffff;
    }

    .btn-secondary {
      background: var(--chip-bg);
      color: var(--text-muted);
      flex: 1;
      border: 1px solid var(--border-color);
    }

    /* ナビゲーションリンク */
    .nav-links {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--primary-neon);
      color: var(--primary-neon);
    }

    footer {
      margin-top: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧪 イッテルビウムの集中タイマー</h1>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ 明るくする</button>
  </header>

  <div class="container">
    <!-- キャラクターエリア -->
    <div class="chara-section">
      <div class="speech-bubble" id="speechBubble">
        「こんにちは。私はイッテルビウムです。落ち着いて集中に取り組んでいきましょう。」
      </div>
      
      <div class="chara-avatar-container" id="charaContainer" onclick="pokeChara()">
        <canvas id="charaCanvas" width="220" height="220"></canvas>
      </div>
      <button class="poke-btn" onclick="pokeChara()">👆 つつく</button>
    </div>

    <!-- モード切り替えタブ -->
    <div class="mode-tabs">
      <button class="tab-btn active" id="tabPomo" onclick="switchMode('pomo')">🍅 ポモドーロ</button>
      <button class="tab-btn" id="tabNormal" onclick="switchMode('normal')">⏳ 通常タイマー</button>
    </div>

    <!-- ポモドーロ状態タグ -->
    <div class="pomo-status-tag" id="pomoStatusTag">集中時間</div>

    <!-- ポモドーロ用時間設定パネル -->
    <div class="time-settings-panel" id="pomoSettingsPanel">
      <div class="time-settings-grid">
        <div class="time-setting-box">
          <label>作業時間</label>
          <select id="workTimeSelect" onchange="updateCustomTimes()">
            <option value="15">15分</option>
            <option value="25" selected>25分</option>
            <option value="45">45分</option>
            <option value="60">60分</option>
          </select>
        </div>
        <div class="time-setting-box">
          <label>小休憩</label>
          <select id="breakTimeSelect" onchange="updateCustomTimes()">
            <option value="3">3分</option>
            <option value="5" selected>5分</option>
            <option value="10">10分</option>
          </select>
        </div>
        <div class="time-setting-box">
          <label>長休憩 (4回目)</label>
          <select id="longBreakSelect" onchange="updateCustomTimes()">
            <option value="15" selected>15分</option>
            <option value="20">20分</option>
            <option value="30">30分</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 通常タイマー用時間設定ボタン -->
    <div class="time-settings-panel" id="normalSettingsPanel" style="display: none;">
      <div style="display: flex; gap: 6px; justify-content: center;">
        <button class="poke-btn" onclick="setStandardTimer(3)">3分</button>
        <button class="poke-btn" onclick="setStandardTimer(5)">5分</button>
        <button class="poke-btn" onclick="setStandardTimer(10)">10分</button>
        <button class="poke-btn" onclick="setStandardTimer(15)">15分</button>
        <button class="poke-btn" onclick="setStandardTimer(30)">30分</button>
      </div>
    </div>

    <!-- タイマービジュアル (Canvas) -->
    <div class="timer-display-area">
      <div class="visual-canvas-container">
        <canvas id="timerCanvas" width="440" height="440"></canvas>
      </div>
      <div class="digital-time" id="digitalTime">25:00</div>
    </div>

    <!-- コントロールボタン -->
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">▶ スタート</button>
      <button class="btn btn-secondary" onclick="resetTimer()">↺ リセット</button>
    </div>

    <!-- 最下部：homeに戻る / mapに戻るボタン -->
    <div class="nav-links">
      <a href="home.html" class="nav-btn">🏠 homeに戻る</a>
      <a href="map.html" class="nav-btn">🗺️ mapに戻る</a>
    </div>
  </div>

  <footer>
    レアアース17元素キャラ図鑑 - イッテルビウム (Yb)
  </footer>

  <script>window.YB_TIMER_UI = true;</script>
  <script src="ybtimer-core.js"></script>
  <script>
    const T = window.YbTimer;
    const $ = id => document.getElementById(id);
    let isLightTheme = false, currentCharaState = 0, pokeTimeout = null, pokeCount = 0;

    /* ---------- キャラ画像 ---------- */
    const charaImages = {}, imgSources = { yb0: 'CharaYb_time0.png', yb1: 'CharaYb_time1.png', yb2: 'CharaYb_time2.png' };
    let loaded = 0, imagesOk = false;
    Object.keys(imgSources).forEach(k => {
      charaImages[k] = new Image(); charaImages[k].src = imgSources[k];
      charaImages[k].onload = () => { if (++loaded === 3) { imagesOk = true; drawCharaAvatar(); } };
    });

    function setupHiDPI(cvs, size) {
      const d = window.devicePixelRatio || 1;
      cvs.width = size * d; cvs.height = size * d;
      cvs.style.width = size + 'px'; cvs.style.height = size + 'px';
      cvs.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
    }

    /* ---------- セリフ ---------- */
    const pokeLines = {
      time: [
        "1日は86,400秒です。そのうちの1,500秒、つまり25分を、今ここに使いましょう。",
        "1分が60秒、1時間が60分なのは、古代メソポタミアの60進法に由来すると言われています。",
        "光は1秒間に地球を約7周半します。とても速いですが、集中の1秒も同じ1秒です。",
        "日本標準時は、兵庫県明石市を通る東経135度の時刻が基準です。1886年に定められました。",
        "現在の1秒は、セシウム133原子の振動を約92億回数えた長さと定められています。",
        "うるう秒は2016年末が最後でした。2035年までに廃止する方針が決まっています。",
        "砂時計は、14世紀ごろのヨーロッパの記録に登場します。電気のない時代の頼もしい計時道具でした。",
        "ポモドーロという名前は、イタリア語で「トマト」の意味です。トマト型のキッチンタイマーが由来です。",
        "ポモドーロ・テクニックは、1980年代の終わりごろにフランチェスコ・シリロさんが考案しました。",
        "地球が1回自転する時間は、星を基準にすると約23時間56分です。24時間より少し短いのです。",
        "GPS衛星には原子時計が載っています。ナノ秒のずれが、位置の誤差につながります。",
        "5分間は300秒です。短く感じても、始めてしまえば意外と進むものですよ。"
      ],
      yb: [
        "私の原子番号は70、元素記号はYbです。ランタノイドの14番目の元素になります。",
        "名前の由来は、スウェーデンのイッテルビー村です。イットリウム、テルビウム、エルビウムも、同じ村の名前から来ています。",
        "私は1878年に、マリニャックさんが発見しました。のちに、この中からルテチウムも分離されています。",
        "私を使った光格子時計は、宇宙の年齢ほどの時間でも、ずれが1秒に満たないと言われる精度です。",
        "私は、将来の「秒の定義」の候補として検討されている元素のひとつです。時間とは、浅からぬ縁があります。",
        "光格子時計では、私の原子を光の格子に閉じ込めます。時計に使う光は、約578ナノメートルの黄緑色です。",
        "私を添加した光ファイバーは、産業用のファイバーレーザーに使われています。金属加工の現場で活躍しています。",
        "Yb:YAGというレーザー結晶があります。私は、高出力レーザーの材料としても使われています。",
        "私の同位体のひとつ、イッテルビウム169は、小型のX線源として医療や検査に使われることがあります。",
        "私は銀白色のやわらかい金属で、融点は約824℃です。意外と、おだやかな性格なのです。",
        "私の安定同位体は7種類あります。数が多いのも、ひそかな自慢です。",
        "地殻に含まれる量は、1トンあたり約3グラムです。レアアースの中では、中くらいの存在です。",
        "ランタノイドは、多くが3価のイオンになります。私は2価にもなりやすい、少し変わり者です。",
        "私の名前を略すと「Yb」です。読み方は、「ワイ・ビー」とお呼びいただいて大丈夫ですよ。"
      ],
      trivia: [
        "レアアースは、全部で17元素です。ランタノイド15種に、スカンジウムとイットリウムが加わります。",
        "名前は「レア」ですが、実は地殻にそれなりに存在します。取り出して精製するのが大変なのです。",
        "ネオジム磁石は、小型で強力です。スマートフォンのスピーカーや、電気自動車のモーターに使われています。",
        "セリウムの名前は、小惑星ケレスに由来します。元素の名前には、宇宙の星から取られたものもあります。",
        "プロメチウムは、安定な同位体を持たない、レアアースでは唯一の放射性元素です。",
        "ガドリニウムの化合物は、MRI検査の造影剤に使われています。",
        "ユウロピウムは、赤色の蛍光体として、昔のテレビや蛍光灯に使われました。",
        "ルテチウムは、PET検査の検出器に使われます。見えない体の中を、写してくれる元素です。",
        "ジスプロシウムの名前は、ギリシャ語の「近づきがたい」に由来します。見つけ出すのに苦労したのです。",
        "ランタンは、ニッケル水素電池の電極に使われます。身近なところに、レアアースは隠れています。",
        "日本の南鳥島周辺の海底には、レアアースを含む泥が見つかっています。将来の資源として注目されています。",
        "イットリウムは、白色LEDの蛍光体に使われます。夜の部屋を照らす光にも、仲間が活躍しています。",
        "サマリウムは、サマルスキー鉱という鉱物から名づけられました。鉱物名は、ロシアの鉱山技師の名前に由来します。",
        "プラセオジムの名前は「緑の双子」、ネオジムは「新しい双子」の意味です。この2つは、長いあいだ1つの元素と思われていました。"
      ],
      focus: [
        "短い休憩は、集中力の回復に役立つとされています。休むのも、作業のうちです。",
        "やりかけの作業のほうが記憶に残りやすい、という心理効果があります。ツァイガルニク効果と呼ばれます。",
        "最初の1分が、いちばん重い一歩です。始めてしまえば、あとは流れに乗れますよ。",
        "水分補給をお忘れなく。小さな休憩のたびに、ひと口どうぞ。",
        "目が疲れたら、遠くを20秒ほど眺めてみましょう。ほんの少しで、ずいぶん楽になります。",
        "背筋をすっと伸ばしてみてください。呼吸が深くなり、気持ちも整います。",
        "作業の区切りに、次にやることを一行だけメモしておくと、再開が楽になります。",
        "完璧を目指すより、まず終わらせてみましょう。直すのは、そのあとで十分です。"
      ]
    };
    const runningLines = [
      "今、計測中です。画面を離れても、私が見守っています。",
      "残り時間は、画面の円と数字でご確認ください。焦らなくて大丈夫です。",
      "その調子です。ひとつずつ、着実に進めていきましょう。",
      "つつかれても、タイマーは止まりません。ご安心ください。",
      "いまの集中は、きっと後で役に立ちます。",
      "呼吸を整えて、もう少しだけ頑張りましょう。"
    ];
    const pokeSpecial = [
      "あの……つつきすぎではありませんか？ 嫌ではありませんが、タイマーも見てあげてくださいね。",
      "20回目です。私の原子は、これくらいでは壊れませんが、集中は途切れてしまいます。",
      "30回です。もしかして、休憩したい気分ですか？",
      "つつく回数の記録更新です。そろそろ、作業に戻りましょうか。"
    ];
    let bag = [];
    function nextPokeLine() {
      if (!bag.length) {
        bag = Object.values(pokeLines).flat();
        for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      }
      return bag.pop();
    }
    function setSpeech(t) { $('speechBubble').innerText = `「${t}」`; }
    function pokeChara() {
      pokeCount++;
      currentCharaState = Math.random() < 0.5 ? 1 : 2;
      drawCharaAvatar();
      const sp = pokeCount % 10 === 0 ? pokeSpecial[(pokeCount / 10 - 1) % pokeSpecial.length] : null;
      setSpeech(sp || (T.anyRunning() && Math.random() < 0.3 ? runningLines[Math.floor(Math.random() * runningLines.length)] : nextPokeLine()));
      if (pokeTimeout) clearTimeout(pokeTimeout);
      pokeTimeout = setTimeout(() => { currentCharaState = 0; drawCharaAvatar(); }, 900);
    }

    function drawCharaAvatar() {
      const ctx = $('charaCanvas').getContext('2d');
      ctx.clearRect(0, 0, 110, 110);
      if (imagesOk) { ctx.drawImage(charaImages['yb' + currentCharaState], 0, 0, 110, 110); return; }
      ctx.fillStyle = isLightTheme ? '#e8f5e9' : '#1e293b';
      ctx.beginPath(); ctx.arc(55, 55, 38, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = isLightTheme ? '#2e7d32' : '#00ffcc'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Yb', 55, 55);
    }

    /* ---------- タイマー描画 ---------- */
    function drawTimerCanvas() {
      const ctx = $('timerCanvas').getContext('2d');
      ctx.clearRect(0, 0, 220, 220);
      if (T.cur().mode === 'pomo') drawTimeTimer(ctx); else drawHourglass(ctx);
    }

    function drawTimeTimer(ctx) {
      const S = T.cur(), cx = 110, cy = 110, R = 98, dark = !isLightTheme;
      const accent = S.phase === 'work' ? (dark ? '#ff3366' : '#e53935') : (dark ? '#00ccff' : '#0288d1');
      const g = ctx.createRadialGradient(cx, cy - 20, 10, cx, cy, R);
      g.addColorStop(0, dark ? '#1a2540' : '#ffffff'); g.addColorStop(1, dark ? '#0f172a' : '#eef3ee');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = dark ? '#00ffcc' : '#2e7d32'; ctx.stroke();

      const progress = S.remaining / S.total, a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * progress;
      if (progress > 0) {
        ctx.fillStyle = accent; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R - 12, a0, a1); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
      }
      for (let i = 0; i < 60; i++) {
        const a = a0 + i * Math.PI / 30, major = i % 5 === 0, r1 = R - 3, r2 = R - (major ? 12 : 7);
        ctx.strokeStyle = dark ? (major ? '#00ffcc' : '#475569') : (major ? '#2c3e50' : '#9aa5a0');
        ctx.lineWidth = major ? 2 : 1;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
      }
      ctx.fillStyle = dark ? '#cbd5e1' : '#2c3e50'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let i = 0; i < 60; i += 5) {
        const a = a0 + i * Math.PI / 30;
        ctx.fillText(String(i), cx + Math.cos(a) * (R - 24), cy + Math.sin(a) * (R - 24));
      }
      if (progress > 0 && progress < 1) {
        ctx.strokeStyle = dark ? '#fff' : '#2c3e50'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a1) * (R - 12), cy + Math.sin(a1) * (R - 12)); ctx.stroke();
      }
      ctx.fillStyle = dark ? '#1e293b' : '#fff'; ctx.strokeStyle = dark ? '#00ffcc' : '#2e7d32'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    function glassPath(cx, top, bottom, neck = 3, halfW = 42) {
      const cy = (top + bottom) / 2, p = new Path2D();
      p.moveTo(cx - halfW, top);
      p.bezierCurveTo(cx - halfW, cy - 34, cx - neck, cy - 22, cx - neck, cy);
      p.bezierCurveTo(cx - neck, cy + 22, cx - halfW, cy + 34, cx - halfW, bottom);
      p.lineTo(cx + halfW, bottom);
      p.bezierCurveTo(cx + halfW, cy + 34, cx + neck, cy + 22, cx + neck, cy);
      p.bezierCurveTo(cx + neck, cy - 22, cx + halfW, cy - 34, cx + halfW, top);
      p.closePath(); return p;
    }

    function drawHourglass(ctx) {
      const S = T.cur(), W = 220, cx = 110, top = 32, bottom = 188, cy = (top + bottom) / 2;
      const progress = S.remaining / S.total, dark = !isLightTheme;
      const line = dark ? '#00ffcc' : '#2e7d32', sand = dark ? '#ffd166' : '#d9a441', glass = glassPath(cx, top, bottom);
      ctx.fillStyle = dark ? 'rgba(0,255,204,0.06)' : 'rgba(46,125,50,0.06)'; ctx.fill(glass);
      ctx.save(); ctx.clip(glass); ctx.fillStyle = sand;
      const levelY = cy - (cy - top) * progress;
      ctx.fillRect(0, levelY, W, cy - levelY);
      const H = (bottom - cy) * 0.9 * (1 - progress);
      if (H > 0) {
        ctx.beginPath(); ctx.moveTo(0, bottom); ctx.lineTo(0, bottom - H * 0.35);
        ctx.quadraticCurveTo(cx, bottom - H * 1.4, W, bottom - H * 0.35); ctx.lineTo(W, bottom); ctx.closePath(); ctx.fill();
      }
      if (S.isRunning && progress > 0) {
        ctx.strokeStyle = sand; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.lineDashOffset = -Date.now() / 25;
        ctx.beginPath(); ctx.moveTo(cx, cy - 4); ctx.lineTo(cx, bottom - H); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.restore();
      ctx.strokeStyle = line; ctx.lineWidth = 3; ctx.stroke(glass);
      ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
      ctx.moveTo(cx - 56, top - 6); ctx.lineTo(cx + 56, top - 6); ctx.moveTo(cx - 56, bottom + 6); ctx.lineTo(cx + 56, bottom + 6); ctx.stroke();
      ctx.lineWidth = 2;
      [-1, 1].forEach(s => { ctx.beginPath(); ctx.moveTo(cx + s * 52, top - 4); ctx.lineTo(cx + s * 52, bottom + 4); ctx.stroke(); });
    }

    /* ---------- UI ---------- */
    const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    function updateUI() {
      const S = T.cur(), r = S.remaining;
      $('digitalTime').innerText = fmt(r);
      const b = $('startBtn');
      b.innerText = S.isRunning ? '❚❚ 一時停止' : '▶ スタート';
      b.style.background = S.isRunning ? '#ff3366' : 'var(--primary-neon)';
      b.style.color = S.isRunning ? '#fff' : (isLightTheme ? '#ffffff' : '#0a0f1d');
      // 裏で動いているタイマーがあれば、タブに残り時間を出す
      const ip = T.info('pomo'), inn = T.info('normal');
      $('tabPomo').innerText = '🍅 ポモドーロ' + (ip.isRunning ? ` ▶ ${fmt(ip.remaining)}` : '');
      $('tabNormal').innerText = '⏳ 通常タイマー' + (inn.isRunning ? ` ▶ ${fmt(inn.remaining)}` : '');
      $('tabPomo').classList.toggle('active', S.mode === 'pomo');
      $('tabNormal').classList.toggle('active', S.mode === 'normal');
      const pomo = S.mode === 'pomo';
      $('pomoStatusTag').style.display = pomo ? 'block' : 'none';
      $('pomoSettingsPanel').style.display = pomo ? 'block' : 'none';
      $('normalSettingsPanel').style.display = pomo ? 'none' : 'block';
      if (pomo) {
        const n = (S.done % 4) + 1;
        $('pomoStatusTag').innerText = S.phase === 'work' ? `🍅 集中時間 (${S.workSec / 60}分) ${n}/4`
          : S.phase === 'shortBreak' ? `☕ 小休憩 (${S.breakSec / 60}分)` : `🌴 長い休憩 (${S.longSec / 60}分)`;
      }
      drawTimerCanvas();
    }

    function toggleTheme() {
      isLightTheme = !isLightTheme;
      document.body.classList.toggle('light-theme', isLightTheme);
      $('themeToggleBtn').innerText = isLightTheme ? '🌙 暗くする' : '☀️ 明るくする';
      try { localStorage.setItem('yb_timer_theme_pref', isLightTheme ? 'light' : 'cyber'); } catch (e) {}
      drawCharaAvatar(); updateUI();
    }
    function toggleTimer() {
      if (T.cur().isRunning) { T.pause(); setSpeech('タイマーを一時停止いたしました。'); }
      else { T.start(); if (T.cur().isRunning) setSpeech('計測を開始します。集中していきましょう。画面を離れても計測は続きます。'); }
    }
    function resetTimer() { T.reset(); setSpeech('タイマーを初期状態にリセットいたしました。'); }
    function switchMode(m) {
      T.setView(m);
      const other = T.info(m === 'pomo' ? 'normal' : 'pomo');
      setSpeech((m === 'pomo' ? 'ポモドーロの表示です。' : '通常タイマー（砂時計）の表示です。') + (other.isRunning ? `もう一方のタイマーも動いています。残り${fmt(other.remaining)}です。` : ''));
    }
    function updateCustomTimes() {
      T.setPomoTimes(+$('workTimeSelect').value * 60, +$('breakTimeSelect').value * 60, +$('longBreakSelect').value * 60);
    }
    function setStandardTimer(min) {
      const was = T.info('normal').isRunning;
      T.setStandard(min); setSpeech(`${min}分タイマーに設定いたしました。` + (was ? '動いていた通常タイマーは、設定し直しました。' : ''));
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupHiDPI($('timerCanvas'), 220); setupHiDPI($('charaCanvas'), 110);
      try { if (localStorage.getItem('yb_timer_theme_pref') === 'light') { isLightTheme = true; document.body.classList.add('light-theme'); $('themeToggleBtn').innerText = '🌙 暗くする'; } } catch (e) {}
      const P = T.state.pomo;
      $('workTimeSelect').value = P.workSec / 60; $('breakTimeSelect').value = P.breakSec / 60; $('longBreakSelect').value = P.longSec / 60;
      window.addEventListener('yb:complete', e => setSpeech(e.detail.message));
      window.addEventListener('yb:change', updateUI);
      window.addEventListener('yb:tick', updateUI);
      setInterval(() => { if (!document.hidden) updateUI(); }, 100);   // 砂のアニメーション用
      drawCharaAvatar(); updateUI();
    });
  </script>
</body>
</html>
