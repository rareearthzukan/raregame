<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イッテルビウムの集中タイマー | レアアース17元素</title>
  <style>
    /* サイバーテーマ（デフォルト） */
    :root {
      --bg-deep: #0a0f1d;
      --card-bg: #131c31;
      --primary-neon: #00ffcc;
      --accent-red: #ff3366;
      --accent-blue: #00ccff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --chip-bg: #1e293b;
      --input-bg: #0a0f1d;
    }

    /* ライトテーマ */
    body.light-theme {
      --bg-deep: #f4f7f4;
      --card-bg: #ffffff;
      --primary-neon: #2e7d32;
      --accent-red: #e53935;
      --accent-blue: #0288d1;
      --text-main: #2c3e50;
      --text-muted: #607d8b;
      --border-color: #c8e6c9;
      --chip-bg: #f1f8e9;
      --input-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      transition: background 0.3s, color 0.3s;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.15rem;
      color: var(--primary-neon);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--border-color);
      transition: background 0.3s, border 0.3s;
    }

    /* キャラクターエリア */
    .chara-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .speech-bubble {
      position: relative;
      background: var(--chip-bg);
      border: 1px solid var(--primary-neon);
      border-radius: 14px;
      padding: 10px 14px;
      width: 100%;
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 10px;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: var(--primary-neon) transparent;
      display: block;
      width: 0;
    }

    .chara-avatar-container {
      width: 110px;
      height: 110px;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    #charaCanvas {
      width: 110px;
      height: 110px;
    }

    .poke-btn {
      margin-top: 4px;
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* モード切り替えタブ */
    .mode-tabs {
      display: flex;
      width: 100%;
      background: var(--chip-bg);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-neon);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 時間選択パネル（プルダウン式） */
    .time-settings-panel {
      width: 100%;
      background: var(--chip-bg);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .time-settings-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      font-size: 0.75rem;
    }

    .time-setting-box {
      background: var(--card-bg);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .time-setting-box label {
      display: block;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-size: 0.7rem;
    }

    .time-setting-box select {
      background: var(--input-bg);
      color: var(--primary-neon);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
    }

    /* タイマー表示エリア */
    .timer-display-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .visual-canvas-container {
      width: 220px;
      height: 220px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #timerCanvas {
      width: 220px;
      height: 220px;
    }

    .digital-time {
      font-size: 2.1rem;
      font-weight: bold;
      color: var(--primary-neon);
      font-family: monospace;
      letter-spacing: 2px;
    }

    .pomo-status-tag {
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      background: var(--chip-bg);
      color: var(--primary-neon);
      border: 1px solid var(--border-color);
    }

    /* コントロールボタン */
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary-neon);
      color: #0a0f1d;
      flex: 2;
    }

    body.light-theme .btn-primary {
      color: #ffffff;
    }

    .btn-secondary {
      background: var(--chip-bg);
      color: var(--text-muted);
      flex: 1;
      border: 1px solid var(--border-color);
    }

    /* ナビゲーションリンク */
    .nav-links {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--primary-neon);
      color: var(--primary-neon);
    }

    footer {
      margin-top: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧪 イッテルビウムの集中タイマー</h1>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ 明るくする</button>
  </header>

  <div class="container">
    <!-- キャラクターエリア -->
    <div class="chara-section">
      <div class="speech-bubble" id="speechBubble">
        「こんにちは。私はイッテルビウムです。落ち着いて集中に取り組んでいきましょう。」
      </div>
      
      <div class="chara-avatar-container" id="charaContainer" onclick="pokeChara()">
        <canvas id="charaCanvas" width="220" height="220"></canvas>
      </div>
      <button class="poke-btn" onclick="pokeChara()">👆 つつく</button>
    </div>

    <!-- モード切り替えタブ -->
    <div class="mode-tabs">
      <button class="tab-btn active" id="tabPomo" onclick="switchMode('pomo')">🍅 ポモドーロ</button>
      <button class="tab-btn" id="tabNormal" onclick="switchMode('normal')">⏳ 通常タイマー</button>
    </div>

    <!-- ポモドーロ状態タグ -->
    <div class="pomo-status-tag" id="pomoStatusTag">集中時間</div>

    <!-- ポモドーロ用時間設定パネル -->
    <div class="time-settings-panel" id="pomoSettingsPanel">
      <div class="time-settings-grid">
        <div class="time-setting-box">
          <label>作業時間</label>
          <select id="workTimeSelect" onchange="updateCustomTimes()">
            <option value="15">15分</option>
            <option value="25" selected>25分</option>
            <option value="45">45分</option>
            <option value="60">60分</option>
          </select>
        </div>
        <div class="time-setting-box">
          <label>小休憩</label>
          <select id="breakTimeSelect" onchange="updateCustomTimes()">
            <option value="3">3分</option>
            <option value="5" selected>5分</option>
            <option value="10">10分</option>
          </select>
        </div>
        <div class="time-setting-box">
          <label>長休憩 (4回目)</label>
          <select id="longBreakSelect" onchange="updateCustomTimes()">
            <option value="15" selected>15分</option>
            <option value="20">20分</option>
            <option value="30">30分</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 通常タイマー用時間設定ボタン -->
    <div class="time-settings-panel" id="normalSettingsPanel" style="display: none;">
      <div style="display: flex; gap: 6px; justify-content: center;">
        <button class="poke-btn" onclick="setStandardTimer(3)">3分</button>
        <button class="poke-btn" onclick="setStandardTimer(5)">5分</button>
        <button class="poke-btn" onclick="setStandardTimer(10)">10分</button>
        <button class="poke-btn" onclick="setStandardTimer(15)">15分</button>
        <button class="poke-btn" onclick="setStandardTimer(30)">30分</button>
      </div>
    </div>

    <!-- タイマービジュアル (Canvas) -->
    <div class="timer-display-area">
      <div class="visual-canvas-container">
        <canvas id="timerCanvas" width="440" height="440"></canvas>
      </div>
      <div class="digital-time" id="digitalTime">25:00</div>
    </div>

    <!-- コントロールボタン -->
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">▶ スタート</button>
      <button class="btn btn-secondary" onclick="resetTimer()">↺ リセット</button>
    </div>

    <!-- 最下部：homeに戻る / mapに戻るボタン -->
    <div class="nav-links">
      <a href="home.html" class="nav-btn">🏠 homeに戻る</a>
      <a href="map.html" class="nav-btn">🗺️ mapに戻る</a>
    </div>
  </div>

  <footer>
    レアアース17元素キャラ図鑑 - イッテルビウム (Yb)
  </footer>

  <script>
    const charaImages = {};
    const imgSources = {
      yb0: 'CharaYb_time0.png',
      yb1: 'CharaYb_time1.png',
      yb2: 'CharaYb_time2.png'
    };

    let loadedImagesCount = 0;
    let imagesLoadedSuccessfully = false;

    Object.keys(imgSources).forEach(key => {
      charaImages[key] = new Image();
      charaImages[key].src = imgSources[key];
      charaImages[key].onload = () => {
        loadedImagesCount++;
        if (loadedImagesCount === 3) {
          imagesLoadedSuccessfully = true;
          drawCharaAvatar();
        }
      };
    });

    let mode = 'pomo';
    let pomoPhase = 'work';
    let pomoCycleCount = 1;

    let isRunning = false;
    let targetEndTime = null;
    let pomoWorkSec = 25 * 60;
    let pomoBreakSec = 5 * 60;
    let pomoLongBreakSec = 15 * 60;
    let totalDurationSec = 25 * 60;
    let remainingSec = 25 * 60;

    let currentCharaState = 0;
    let pokeTimeout = null;
    let audioCtx = null;
    let isLightTheme = false;

    let sandParticles = [];
    const MAX_PARTICLES = 100;
    for (let i = 0; i < MAX_PARTICLES; i++) {
      sandParticles.push({
        x: 0, y: 0,
        vx: (Math.random() - 0.5) * 1.2,
        vy: Math.random() * 2.5 + 2,
        size: Math.random() * 2 + 1,
        active: false
      });
    }

    function toggleTheme() {
      isLightTheme = !isLightTheme;
      document.body.classList.toggle('light-theme', isLightTheme);
      const btn = document.getElementById('themeToggleBtn');
      btn.innerText = isLightTheme ? '🌙 暗くする' : '☀️ 明るくする';
      localStorage.setItem('yb_timer_theme_pref', isLightTheme ? 'light' : 'cyber');
      drawTimerCanvas();
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // 初回スタート時のみ鳴る「ポポポポ…」という可愛らしい効果音
    function playStartPopSound() {
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
          }, idx * 80);
        });
      } catch (e) {}
    }

    function playAlarmSound() {
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [0, 0.2, 0.4].forEach((delay) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(783.99, now + delay);
          gain.gain.setValueAtTime(0.3, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + 0.15);
        });
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('yb_timer_theme_pref');
      if (savedTheme === 'light') {
        isLightTheme = true;
        document.body.classList.add('light-theme');
        document.getElementById('themeToggleBtn').innerText = '🌙 暗くする';
      }

      loadStateFromStorage();
      updateUI();
      drawCharaAvatar();
      drawTimerCanvas();

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isRunning) {
          syncTimer();
        }
      });

      setInterval(() => {
        if (isRunning) {
          syncTimer();
        } else {
          drawTimerCanvas();
        }
      }, 250);
    });

    function syncTimer() {
      if (!targetEndTime) return;
      const now = Date.now();
      const diffSec = Math.ceil((targetEndTime - now) / 1000);

      if (diffSec <= 0) {
        remainingSec = 0;
        isRunning = false;
        targetEndTime = null;
        saveStateToStorage();
        onTimerComplete();
      } else {
        remainingSec = diffSec;
      }
      updateUI();
      drawTimerCanvas();
    }

    function onTimerComplete() {
      playAlarmSound();
      if (mode === 'pomo') {
        if (pomoPhase === 'work') {
          pomoCycleCount++;
          if (pomoCycleCount % 4 === 0) {
            setupPomoPhase('longBreak');
            setSpeech("4セッションを達成しました。しっかり長休憩をとりましょう。");
          } else {
            setupPomoPhase('shortBreak');
            setSpeech("作業お疲れ様でした。準備ができたらスタートをして小休憩に入ってください。");
          }
        } else {
          setupPomoPhase('work');
          setSpeech("休憩時間が終了しました。次の集中セッションに入りましょう。");
        }
      } else {
        setSpeech("設定したお時間になりました。お疲れ様でした。");
      }
      updateUI();
      drawTimerCanvas();
    }

    function setupPomoPhase(phase) {
      pomoPhase = phase;
      if (phase === 'work') totalDurationSec = pomoWorkSec;
      else if (phase === 'shortBreak') totalDurationSec = pomoBreakSec;
      else if (phase === 'longBreak') totalDurationSec = pomoLongBreakSec;
      remainingSec = totalDurationSec;
      isRunning = false;
      targetEndTime = null;
      saveStateToStorage();
    }

    function updateCustomTimes() {
      pomoWorkSec = parseInt(document.getElementById('workTimeSelect').value) * 60;
      pomoBreakSec = parseInt(document.getElementById('breakTimeSelect').value) * 60;
      pomoLongBreakSec = parseInt(document.getElementById('longBreakSelect').value) * 60;

      if (!isRunning && mode === 'pomo') {
        setupPomoPhase(pomoPhase);
        updateUI();
        drawTimerCanvas();
      }
    }

    function setStandardTimer(min) {
      totalDurationSec = min * 60;
      remainingSec = totalDurationSec;
      isRunning = false;
      targetEndTime = null;
      setSpeech(`${min}分タイマーに設定いたしました。`);
      updateUI();
      drawTimerCanvas();
    }

    function toggleTimer() {
      if (isRunning) {
        isRunning = false;
        targetEndTime = null;
        setSpeech("タイマーを一時停止いたしました。");
      } else {
        if (remainingSec <= 0) return;
        initAudio();
        playStartPopSound(); // スタート時の初回ポポポポ音
        isRunning = true;
        targetEndTime = Date.now() + remainingSec * 1000;
        setSpeech("計測を開始します。集中していきましょう。");
      }
      saveStateToStorage();
      updateUI();
    }

    function resetTimer() {
      isRunning = false;
      targetEndTime = null;
      remainingSec = totalDurationSec;
      setSpeech("タイマーを初期状態にリセットいたしました。");
      saveStateToStorage();
      updateUI();
      drawTimerCanvas();
    }

    function switchMode(newMode) {
      if (mode === newMode) return;
      mode = newMode;
      isRunning = false;
      targetEndTime = null;

      if (mode === 'pomo') {
        setupPomoPhase('work');
        setSpeech("ポモドーロモードです。視覚的に残り時間が把握しやすくなっています。");
      } else {
        totalDurationSec = 5 * 60;
        remainingSec = 5 * 60;
        setSpeech("通常タイマーモードです。砂時計の描写で計測を行います。");
      }
      updateUI();
      drawTimerCanvas();
    }

    function setSpeech(text) {
      document.getElementById('speechBubble').innerText = `「${text}」`;
    }

    function pokeChara() {
      currentCharaState = Math.random() < 0.5 ? 1 : 2;
      drawCharaAvatar();
      const dialogues = [
        "私の原子番号は70、イッテルビウムです。高精度な原子時計にも用いられます。",
        "ご安心ください。私はあなたの集中の時間を静かに見守っています。",
        "適度な休憩は作業効率を高める鍵となります。無理をなさらず進めましょう。"
      ];
      setSpeech(dialogues[Math.floor(Math.random() * dialogues.length)]);

      if (pokeTimeout) clearTimeout(pokeTimeout);
      pokeTimeout = setTimeout(() => {
        currentCharaState = 0;
        drawCharaAvatar();
      }, 900);
    }

    function drawCharaAvatar() {
      const cvs = document.getElementById('charaCanvas');
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      if (imagesLoadedSuccessfully) {
        let img = charaImages.yb0;
        if (currentCharaState === 1) img = charaImages.yb1;
        if (currentCharaState === 2) img = charaImages.yb2;
        ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
        return;
      }

      const cx = 110, cy = 110;
      ctx.fillStyle = isLightTheme ? '#e8f5e9' : '#1e293b';
      ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = isLightTheme ? '#2e7d32' : '#00ffcc'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = isLightTheme ? '#2e7d32' : '#00ffcc'; ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Yb', cx, cy);
    }

    function drawTimerCanvas() {
      const cvs = document.getElementById('timerCanvas');
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      if (mode === 'pomo') {
        drawTimeTimer(ctx, cvs.width, cvs.height);
      } else {
        drawHourglassWithParticles(ctx, cvs.width, cvs.height);
      }
    }

    function drawTimeTimer(ctx, w, h) {
      const size = Math.min(w, h);
      const cx = w / 2;
      const cy = h / 2;
      const boxSize = size * 0.9;
      const radius = boxSize * 0.42;

      ctx.save();
      ctx.shadowColor = isLightTheme ? 'rgba(0,0,0,0.06)' : 'rgba(0, 255, 204, 0.2)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = isLightTheme ? '#ffffff' : '#0f172a';
      ctx.strokeStyle = isLightTheme ? '#c8e6c9' : '#00ffcc';
      ctx.lineWidth = 2;

      const rx = cx - boxSize / 2;
      const ry = cy - boxSize / 2;
      ctx.beginPath();
      ctx.roundRect(rx, ry, boxSize, boxSize, 24);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = isLightTheme ? '#fafafa' : '#131c31';
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = isLightTheme ? '#e0e0e0' : '#1e293b';
      ctx.lineWidth = 2;
      ctx.stroke();

      const progress = remainingSec / totalDurationSec;
      const startAngle = -Math.PI / 2;
      const endAngle = startAngle + (Math.PI * 2 * progress);

      if (progress > 0) {
        ctx.fillStyle = (pomoPhase === 'work') 
          ? (isLightTheme ? 'rgba(229, 57, 53, 0.75)' : 'rgba(255, 51, 102, 0.75)') 
          : (isLightTheme ? 'rgba(2, 136, 209, 0.75)' : 'rgba(0, 204, 255, 0.75)');
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius - 2, startAngle, endAngle, false);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = isLightTheme ? '#333333' : '#94a3b8';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < 60; i += 5) {
        const angle = -Math.PI / 2 + (i * (Math.PI * 2 / 60));
        const outerR = radius - 4;
        const innerR = outerR - 10;
        const x1 = cx + Math.cos(angle) * outerR;
        const y1 = cy + Math.sin(angle) * outerR;
        const x2 = cx + Math.cos(angle) * innerR;
        const y2 = cy + Math.sin(angle) * innerR;

        ctx.strokeStyle = isLightTheme ? '#666' : '#00ffcc';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

        const labelR = innerR - 14;
        const lx = cx + Math.cos(angle) * labelR;
        const ly = cy + Math.sin(angle) * labelR;
        ctx.fillText(i.toString(), lx, ly);
      }

      ctx.fillStyle = isLightTheme ? '#ffffff' : '#1e293b';
      ctx.strokeStyle = isLightTheme ? '-ccc' : '#00ffcc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // 砂時計グラフィック（上部に最初からたまる砂 ＋ 落下する砂粒子の再現）
    function drawHourglassWithParticles(ctx, w, h) {
      const cx = w / 2;
      const cy = h / 2;
      const progress = remainingSec / totalDurationSec; // 1 (開始) -> 0 (終了)

      ctx.strokeStyle = isLightTheme ? '#2e7d32' : '#00ffcc';
      ctx.lineWidth = 4;

      // 砂時計の木枠・上下プレート
      ctx.beginPath();
      ctx.moveTo(cx - 50, cy - 90); ctx.lineTo(cx + 50, cy - 90);
      ctx.moveTo(cx - 50, cy + 90); ctx.lineTo(cx + 50, cy + 90);
      ctx.stroke();

      // ガラス管のアウトライン
      ctx.beginPath();
      ctx.moveTo(cx - 45, cy - 80);
      ctx.bezierCurveTo(cx - 40, cy - 25, cx - 10, cy - 4, cx, cy);
      ctx.bezierCurveTo(cx + 10, cy - 4, cx + 40, cy - 25, cx + 45, cy - 80);
      ctx.lineTo(cx - 45, cy - 80);
      ctx.fillStyle = isLightTheme ? 'rgba(46,125,50,0.05)' : 'rgba(0,255,204,0.05)';
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - 45, cy + 80);
      ctx.bezierCurveTo(cx - 40, cy + 25, cx - 10, cy + 4, cx, cy);
      ctx.bezierCurveTo(cx + 10, cy + 4, cx + 40, cy + 25, cx + 45, cy + 80);
      ctx.lineTo(cx - 45, cy + 80);
      ctx.fill(); ctx.stroke();

      // --- 1. 上部にたまっている砂の描写 (progressに応じて上から減っていく) ---
      const topSandHeight = 55 * progress;
      if (topSandHeight > 0) {
        ctx.save();
        ctx.fillStyle = isLightTheme ? '#4caf50' : '#00ffcc';
        ctx.beginPath();
        // 上部ガラスの形状に合わせて台形状に描画
        const topY = cy - 80 + (55 - topSandHeight);
        ctx.moveTo(cx - 38, cy - 20);
        ctx.lineTo(cx + 38, cy - 20);
        ctx.lineTo(cx + 42, topY);
        ctx.lineTo(cx - 42, topY);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // --- 2. 下部にたまっている砂の描写 (時間経過とともに下から積もっていく) ---
      const bottomSandHeight = 70 * (1 - progress);
      if (bottomSandHeight > 0) {
        ctx.fillStyle = isLightTheme ? '#4caf50' : '#00ffcc';
        ctx.fillRect(cx - 38, cy + 80 - bottomSandHeight, 76, bottomSandHeight);
      }

      // --- 3. 中央から落ちる砂の線 ＆ 粒子アニメーション ---
      if (isRunning && remainingSec > 0) {
        ctx.strokeStyle = isLightTheme ? '#81c784' : '#78ffd6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + 75); ctx.stroke();

        sandParticles.forEach(p => {
          if (!p.active) {
            if (Math.random() < 0.5) {
              p.active = true;
              p.x = cx + (Math.random() - 0.5) * 3;
              p.y = cy;
            }
          } else {
            p.y += p.vy;
            ctx.fillStyle = isLightTheme ? '#81c784' : '#78ffd6';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            if (p.y > cy + 80 - bottomSandHeight) p.active = false;
          }
        });
      }
    }

    function updateUI() {
      const m = Math.floor(remainingSec / 60).toString().padStart(2, '0');
      const s = (remainingSec % 60).toString().padStart(2, '0');
      document.getElementById('digitalTime').innerText = `${m}:${s}`;

      const startBtn = document.getElementById('startBtn');
      if (isRunning) {
        startBtn.innerText = '❚❚ 一時停止';
        startBtn.style.background = '#ff3366';
        startBtn.style.color = '#fff';
      } else {
        startBtn.innerText = '▶ スタート';
        startBtn.style.background = 'var(--primary-neon)';
        startBtn.style.color = isLightTheme ? '#ffffff' : '#0a0f1d';
      }

      document.getElementById('tabPomo').classList.toggle('active', mode === 'pomo');
      document.getElementById('tabNormal').classList.toggle('active', mode === 'normal');

      const pomoTag = document.getElementById('pomoStatusTag');
      const pomoSettingsPanel = document.getElementById('pomoSettingsPanel');
      const normalSettingsPanel = document.getElementById('normalSettingsPanel');

      if (mode === 'pomo') {
        pomoTag.style.display = 'block';
        pomoSettingsPanel.style.display = 'block';
        normalSettingsPanel.style.display = 'none';

        if (pomoPhase === 'work') {
          pomoTag.innerText = `🍅 集中時間 (${pomoWorkSec/60}分)`;
        } else if (pomoPhase === 'shortBreak') {
          pomoTag.innerText = `☕ 小休憩 (${pomoBreakSec/60}分)`;
        } else {
          pomoTag.innerText = `🌴 長い休憩 (${pomoLongBreakSec/60}分)`;
        }
      } else {
        pomoTag.style.display = 'none';
        pomoSettingsPanel.style.display = 'none';
        normalSettingsPanel.style.display = 'block';
      }
    }

    function saveStateToStorage() {
      const state = { mode, pomoPhase, pomoCycleCount, isRunning, targetEndTime, pomoWorkSec, pomoBreakSec, pomoLongBreakSec, totalDurationSec, remainingSec };
      localStorage.setItem('yb_timer_state_final_pref', JSON.stringify(state));
    }

    function loadStateFromStorage() {
      const saved = localStorage.getItem('yb_timer_state_final_pref');
      if (!saved) return;
      try {
        const state = JSON.parse(saved);
        mode = state.mode || 'pomo';
        pomoPhase = state.pomoPhase || 'work';
        pomoCycleCount = state.pomoCycleCount || 1;
        pomoWorkSec = state.pomoWorkSec || 25 * 60;
        pomoBreakSec = state.pomoBreakSec || 5 * 60;
        pomoLongBreakSec = state.pomoLongBreakSec || 15 * 60;
        totalDurationSec = state.totalDurationSec || 25 * 60;
        isRunning = state.isRunning || false;
        targetEndTime = state.targetEndTime || null;

        document.getElementById('workTimeSelect').value = pomoWorkSec / 60;
        document.getElementById('breakTimeSelect').value = pomoBreakSec / 60;
        document.getElementById('longBreakSelect').value = pomoLongBreakSec / 60;

        if (isRunning && targetEndTime) {
          const diff = Math.ceil((targetEndTime - Date.now()) / 1000);
          if (diff > 0) remainingSec = diff;
          else { remainingSec = 0; isRunning = false; targetEndTime = null; }
        } else {
          remainingSec = state.remainingSec || totalDurationSec;
        }
      } catch (e) {}
    }
  </script>
