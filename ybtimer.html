<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イッテルビウムの集中ポモドーロ | レアアース17元素</title>
  <style>
    :root {
      --bg-deep: #0a0f1d;
      --card-bg: #131c31;
      --primary-neon: #00ffcc;
      --accent-red: #ff3366;
      --accent-blue: #00ccff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 8px 0;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.2rem;
      color: var(--primary-neon);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-shadow: 0 0 10px rgba(0,255,204,0.3);
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(0,255,204,0.2);
    }

    /* キャラクターエリア */
    .chara-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .speech-bubble {
      position: relative;
      background: #1a2642;
      border: 1px solid var(--primary-neon);
      border-radius: 14px;
      padding: 10px 14px;
      width: 100%;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #a5f3fc;
      margin-bottom: 10px;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,255,204,0.1);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: var(--primary-neon) transparent;
      display: block;
      width: 0;
    }

    .chara-avatar-container {
      width: 110px;
      height: 110px;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    #charaCanvas {
      width: 110px;
      height: 110px;
    }

    .poke-btn {
      margin-top: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .poke-btn:active {
      transform: scale(0.95);
      background: #334155;
    }

    /* モード切り替えタブ */
    .mode-tabs {
      display: flex;
      width: 100%;
      background: #0f172a;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #1e293b;
      color: var(--primary-neon);
      box-shadow: 0 0 10px rgba(0,255,204,0.2);
    }

    /* 時間選択プリセットチップ（ポモドーロ＆通常共通で選択可能） */
    .time-selector-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .selector-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: left;
      width: 100%;
    }

    .presets {
      display: flex;
      gap: 6px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .preset-chip {
      flex: 1;
      padding: 6px 4px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .preset-chip.active {
      background: rgba(0,255,204,0.15);
      border-color: var(--primary-neon);
      color: var(--primary-neon);
    }

    /* タイマー表示エリア */
    .timer-display-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .visual-canvas-container {
      width: 220px;
      height: 220px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #timerCanvas {
      width: 220px;
      height: 220px;
    }

    .digital-time {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary-neon);
      font-family: monospace;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0,255,204,0.3);
    }

    .pomo-status-tag {
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(0,255,204,0.1);
      color: var(--primary-neon);
      border: 1px solid rgba(0,255,204,0.3);
    }

    /* コントロールボタン */
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary-neon);
      color: #0a0f1d;
      flex: 2;
      box-shadow: 0 0 15px rgba(0,255,204,0.4);
    }

    .btn-primary:hover {
      background: #33ffcc;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text-muted);
      flex: 1;
      border: 1px solid #334155;
    }

    .btn-secondary:hover {
      background: #334155;
      color: var(--text-main);
    }

    /* ナビゲーションリンク（home / map） */
    .nav-links {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--primary-neon);
      color: var(--primary-neon);
      background: #131c31;
    }

    footer {
      margin-top: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧪 イッテルビウムのサイバータイマー</h1>
  </header>

  <div class="container">
    <!-- キャラクター吹き出しエリア -->
    <div class="chara-section">
      <div class="speech-bubble" id="speechBubble">
        「やあ！ボクはイッテルビウム。好きな時間を選んで集中モードに入ろうね！」
      </div>
      
      <div class="chara-avatar-container" id="charaContainer" onclick="pokeChara()">
        <canvas id="charaCanvas" width="220" height="220"></canvas>
      </div>
      <button class="poke-btn" onclick="pokeChara()">👆 つつく</button>
    </div>

    <!-- モード切り替えタブ -->
    <div class="mode-tabs">
      <button class="tab-btn active" id="tabPomo" onclick="switchMode('pomo')">🍅 ポモドーロ</button>
      <button class="tab-btn" id="tabNormal" onclick="switchMode('normal')">⏳ 通常タイマー</button>
    </div>

    <!-- ポモドーロ状態タグ -->
    <div class="pomo-status-tag" id="pomoStatusTag">集中時間</div>

    <!-- 時間切り替えボタン（選択式） -->
    <div class="time-selector-area">
      <div class="selector-label" id="selectorLabel">▼ 時間・モードを選択</div>
      <div class="presets" id="presetArea">
        <!-- 動的に切り替わります -->
      </div>
    </div>

    <!-- タイマービジュアル (Canvas) -->
    <div class="timer-display-area">
      <div class="visual-canvas-container">
        <canvas id="timerCanvas" width="440" height="440"></canvas>
      </div>
      <div class="digital-time" id="digitalTime">25:00</div>
    </div>

    <!-- コントロールボタン -->
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">▶ スタート</button>
      <button class="btn btn-secondary" onclick="resetTimer()">↺ リセット</button>
    </div>

    <!-- 最下部：homeに戻る / mapに戻るボタン -->
    <div class="nav-links">
      <a href="home.html" class="nav-btn">🏠 homeに戻る</a>
      <a href="map.html" class="nav-btn">🗺️ mapに戻る</a>
    </div>
  </div>

  <footer>
    レアアース17元素キャラ図鑑 - イッテルビウム (Yb)
  </footer>

  <script>
    // --- 画像アセット設定 ---
    const charaImages = {};
    const imgSources = {
      yb0: 'CharaYb_time0.png',
      yb1: 'CharaYb_time1.png',
      yb2: 'CharaYb_time2.png'
    };

    let loadedImagesCount = 0;
    let imagesLoadedSuccessfully = false;

    Object.keys(imgSources).forEach(key => {
      charaImages[key] = new Image();
      charaImages[key].src = imgSources[key];
      charaImages[key].onload = () => {
        loadedImagesCount++;
        if (loadedImagesCount === 3) {
          imagesLoadedSuccessfully = true;
          drawCharaAvatar();
        }
      };
    });

    // --- 状態管理 ---
    let mode = 'pomo'; // 'pomo' or 'normal'
    let pomoPhase = 'work'; // 'work', 'shortBreak', 'longBreak'
    let pomoCycleCount = 0;

    let isRunning = false;
    let targetEndTime = null;
    let totalDurationSec = 25 * 60;
    let remainingSec = 25 * 60;

    let currentCharaState = 0; // 0: normal, 1: poke1, 2: poke2
    let pokeTimeout = null;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // スタート時の「ポ」音（最初の1回だけ）
    function playStartPopSound() {
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function playAlarmSound() {
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [0, 0.2, 0.4].forEach((delay) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(783.99, now + delay);
          gain.gain.setValueAtTime(0.3, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + 0.15);
        });
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStateFromStorage();
      updateUI();
      drawCharaAvatar();
      drawTimerCanvas();

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isRunning) {
          syncTimer();
        }
      });

      setInterval(() => {
        if (isRunning) {
          syncTimer();
        } else {
          drawTimerCanvas();
        }
      }, 250);
    });

    function syncTimer() {
      if (!targetEndTime) return;
      const now = Date.now();
      const diffSec = Math.ceil((targetEndTime - now) / 1000);

      if (diffSec <= 0) {
        remainingSec = 0;
        isRunning = false;
        targetEndTime = null;
        saveStateToStorage();
        onTimerComplete();
      } else {
        remainingSec = diffSec;
      }
      updateUI();
      drawTimerCanvas();
    }

    function onTimerComplete() {
      playAlarmSound();
      if (mode === 'pomo') {
        if (pomoPhase === 'work') {
          pomoCycleCount++;
          if (pomoCycleCount % 4 === 0) {
            setPhase('longBreak');
            setSpeech("4サイクル達成！15分間の【長い休憩】でリフレッシュしよう！準備ができたらスタートしてね。");
          } else {
            setPhase('shortBreak');
            setSpeech("集中お疲れ様！準備ができたらスタートを押して【5分間の小休憩】に入ろう！");
          }
        } else {
          setPhase('work');
          setSpeech("休憩終了！すっきりしたかな？準備ができたら次の【集中】を始めよう！");
        }
      } else {
        setSpeech("お時間になりました！タイマー終了です。お疲れ様！");
      }
      updateUI();
      drawTimerCanvas();
    }

    function setPhase(phase) {
      pomoPhase = phase;
      if (phase === 'work') {
        totalDurationSec = 25 * 60;
      } else if (phase === 'shortBreak') {
        totalDurationSec = 5 * 60;
      } else if (phase === 'longBreak') {
        totalDurationSec = 15 * 60;
      }
      remainingSec = totalDurationSec;
      isRunning = false;
      targetEndTime = null;
      saveStateToStorage();
    }

    function toggleTimer() {
      if (isRunning) {
        isRunning = false;
        targetEndTime = null;
        setSpeech("タイマーを一時停止したよ。");
      } else {
        if (remainingSec <= 0) return;
        initAudio();
        playStartPopSound();
        isRunning = true;
        targetEndTime = Date.now() + remainingSec * 1000;
        setSpeech("カウントダウン中…集中モード全開で行こう！");
      }
      saveStateToStorage();
      updateUI();
    }

    function resetTimer() {
      isRunning = false;
      targetEndTime = null;
      remainingSec = totalDurationSec;
      setSpeech("タイマーをリセットしたよ。いつでもスタートできるよ！");
      saveStateToStorage();
      updateUI();
      drawTimerCanvas();
    }

    function switchMode(newMode) {
      if (mode === newMode) return;
      mode = newMode;
      isRunning = false;
      targetEndTime = null;

      if (mode === 'pomo') {
        setPhase('work');
        setSpeech("ポモドーロモードだよ！タイムタイマー風のサイバー盤面で時間を把握しよう。");
      } else {
        totalDurationSec = 5 * 60;
        remainingSec = 5 * 60;
        setSpeech("通常タイマーモードだよ！好きな分数を下から選んでね。");
      }
      updateUI();
      drawTimerCanvas();
    }

    function selectPreset(sec, label) {
      isRunning = false;
      targetEndTime = null;
      totalDurationSec = sec;
      remainingSec = sec;
      if (mode === 'pomo') {
        if (sec === 25 * 60) pomoPhase = 'work';
        else if (sec === 5 * 60) pomoPhase = 'shortBreak';
        else if (sec === 15 * 60) pomoPhase = 'longBreak';
      }
      setSpeech(`${label}に設定したよ！準備ができたらスタートしてね。`);
      saveStateToStorage();
      updateUI();
      drawTimerCanvas();
    }

    function setSpeech(text) {
      document.getElementById('speechBubble').innerText = `「${text}」`;
    }

    function pokeChara() {
      currentCharaState = Math.random() < 0.5 ? 1 : 2;
      drawCharaAvatar();
      const dialogues = [
        "ボクの原子番号は70！イッテルビウムだよ！",
        "えへへ、つつかれた！気分転換になったかな？",
        "サイバーなタイマーで効率よく進めようね！"
      ];
      setSpeech(dialogues[Math.floor(Math.random() * dialogues.length)]);

      if (pokeTimeout) clearTimeout(pokeTimeout);
      pokeTimeout = setTimeout(() => {
        currentCharaState = 0;
        drawCharaAvatar();
      }, 900);
    }

    function drawCharaAvatar() {
      const cvs = document.getElementById('charaCanvas');
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      if (imagesLoadedSuccessfully) {
        let img = charaImages.yb0;
        if (currentCharaState === 1) img = charaImages.yb1;
        if (currentCharaState === 2) img = charaImages.yb2;
        ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
        return;
      }

      // フォールバック描画
      const cx = 110, cy = 110;
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Yb', cx, cy);
    }

    function drawTimerCanvas() {
      const cvs = document.getElementById('timerCanvas');
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      if (mode === 'pomo') {
        drawCyberTimeTimer(ctx, cvs.width, cvs.height);
      } else {
        drawHourglass(ctx, cvs.width, cvs.height);
      }
    }

    // サイバー・タイムタイマー風グラフィック
    function drawCyberTimeTimer(ctx, w, h) {
      const size = Math.min(w, h);
      const cx = w / 2;
      const cy = h / 2;
      const boxSize = size * 0.9;
      const radius = boxSize * 0.42;

      // サイバー調の角丸ボディ
      ctx.save();
      ctx.shadowColor = 'rgba(0, 255, 204, 0.2)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 2;

      const rx = cx - boxSize / 2;
      const ry = cy - boxSize / 2;
      ctx.beginPath();
      ctx.roundRect(rx, ry, boxSize, boxSize, 24);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 文字盤
      ctx.fillStyle = '#131c31';
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 残り時間扇形（サイバーネオンカラー）
      const progress = remainingSec / totalDurationSec;
      const startAngle = -Math.PI / 2;
      const endAngle = startAngle + (Math.PI * 2 * progress);

      if (progress > 0) {
        ctx.fillStyle = (pomoPhase === 'work') ? 'rgba(255, 51, 102, 0.7)' : 'rgba(0, 204, 255, 0.7)';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius - 2, startAngle, endAngle, false);
        ctx.closePath();
        ctx.fill();
      }

      // 目盛り
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < 60; i += 5) {
        const angle = -Math.PI / 2 + (i * (Math.PI * 2 / 60));
        const outerR = radius - 4;
        const innerR = outerR - 10;
        const x1 = cx + Math.cos(angle) * outerR;
        const y1 = cy + Math.sin(angle) * outerR;
        const x2 = cx + Math.cos(angle) * innerR;
        const y2 = cy + Math.sin(angle) * innerR;

        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

        const labelR = innerR - 14;
        const lx = cx + Math.cos(angle) * labelR;
        const ly = cy + Math.sin(angle) * labelR;
        ctx.fillText(i.toString(), lx, ly);
      }

      // 中央のノブ
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // サイバー砂時計グラフィック
    function drawHourglass(ctx, w, h) {
      const cx = w / 2;
      const cy = h / 2;
      const progress = remainingSec / totalDurationSec;

      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(cx - 50, cy - 100);
      ctx.lineTo(cx + 50, cy - 100);
      ctx.moveTo(cx - 50, cy + 100);
      ctx.lineTo(cx + 50, cy + 100);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - 45, cy - 90);
      ctx.bezierCurveTo(cx - 40, cy - 30, cx - 10, cy - 5, cx, cy);
      ctx.bezierCurveTo(cx + 10, cy - 5, cx + 40, cy - 30, cx + 45, cy - 90);
      ctx.lineTo(cx - 45, cy - 90);
      ctx.fillStyle = 'rgba(0,255,204,0.05)';
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - 45, cy + 90);
      ctx.bezierCurveTo(cx - 40, cy + 30, cx - 10, cy + 5, cx, cy);
      ctx.bezierCurveTo(cx + 10, cy + 5, cx + 40, cy + 30, cx + 45, cy + 90);
      ctx.lineTo(cx - 45, cy + 90);
      ctx.fill();
      ctx.stroke();

      // 下に溜まる砂
      const sandHeight = 75 * (1 - progress);
      if (sandHeight > 0) {
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(cx - 38, cy + 90 - sandHeight, 76, sandHeight);
      }
    }

    function updateUI() {
      const m = Math.floor(remainingSec / 60).toString().padStart(2, '0');
      const s = (remainingSec % 60).toString().padStart(2, '0');
      document.getElementById('digitalTime').innerText = `${m}:${s}`;

      const startBtn = document.getElementById('startBtn');
      if (isRunning) {
        startBtn.innerText = '❚❚ 一時停止';
        startBtn.style.background = '#ff3366';
        startBtn.style.color = '#fff';
      } else {
        startBtn.innerText = '▶ スタート';
        startBtn.style.background = '#00ffcc';
        startBtn.style.color = '#0a0f1d';
      }

      document.getElementById('tabPomo').classList.toggle('active', mode === 'pomo');
      document.getElementById('tabNormal').classList.toggle('active', mode === 'normal');

      const pomoTag = document.getElementById('pomoStatusTag');
      const presetArea = document.getElementById('presetArea');
      const selectorLabel = document.getElementById('selectorLabel');

      presetArea.innerHTML = '';

      if (mode === 'pomo') {
        pomoTag.style.display = 'block';
        selectorLabel.innerText = '▼ ポモドーロ切り替え';

        const pomoOptions = [
          { label: '集中 (25分)', phase: 'work', sec: 25 * 60 },
          { label: '小休憩 (5分)', phase: 'shortBreak', sec: 5 * 60 },
          { label: '長休憩 (15分)', phase: 'longBreak', sec: 15 * 60 }
        ];

        pomoOptions.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = `preset-chip ${pomoPhase === opt.phase ? 'active' : ''}`;
          btn.innerText = opt.label;
          btn.onclick = () => {
            setPhase(opt.phase);
            setSpeech(`${opt.label}モードに切り替えたよ！準備ができたらスタートしてね。`);
            updateUI();
            drawTimerCanvas();
          };
          presetArea.appendChild(btn);
        });

        if (pomoPhase === 'work') {
          pomoTag.innerText = '🍅 集中時間 (25分)';
          pomoTag.style.color = '#ff3366';
          pomoTag.style.borderColor = 'rgba(255,51,102,0.4)';
        } else if (pomoPhase === 'shortBreak') {
          pomoTag.innerText = '☕ 小休憩 (5分)';
          pomoTag.style.color = '#00ccff';
          pomoTag.style.borderColor = 'rgba(0,204,255,0.4)';
        } else {
          pomoTag.innerText = '🌴 長い休憩 (15分)';
          pomoTag.style.color = '#00ffcc';
          pomoTag.style.borderColor = 'rgba(0,255,204,0.4)';
        }
      } else {
        pomoTag.style.display = 'none';
        selectorLabel.innerText = '▼ タイマー時間を選択';

        const normalOptions = [
          { label: '3分', sec: 3 * 60 },
          { label: '5分', sec: 5 * 60 },
          { label: '10分', sec: 10 * 60 },
          { label: '15分', sec: 15 * 60 },
          { label: '30分', sec: 30 * 60 }
        ];

        normalOptions.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = `preset-chip ${totalDurationSec === opt.sec ? 'active' : ''}`;
          btn.innerText = opt.label;
          btn.onclick = () => selectPreset(opt.sec, opt.label);
          presetArea.appendChild(btn);
        });
      }
    }

    function saveStateToStorage() {
      const state = { mode, pomoPhase, pomoCycleCount, isRunning, targetEndTime, totalDurationSec, remainingSec };
      localStorage.setItem('yb_timer_state_cyber', JSON.stringify(state));
    }

    function loadStateFromStorage() {
      const saved = localStorage.getItem('yb_timer_state_cyber');
      if (!saved) return;
      try {
        const state = JSON.parse(saved);
        mode = state.mode || 'pomo';
        pomoPhase = state.pomoPhase || 'work';
        pomoCycleCount = state.pomoCycleCount || 0;
        totalDurationSec = state.totalDurationSec || 25 * 60;
        isRunning = state.isRunning || false;
        targetEndTime = state.targetEndTime || null;

        if (isRunning && targetEndTime) {
          const diff = Math.ceil((targetEndTime - Date.now()) / 1000);
          if (diff > 0) remainingSec = diff;
          else { remainingSec = 0; isRunning = false; targetEndTime = null; }
        } else {
          remainingSec = state.remainingSec || totalDurationSec;
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
