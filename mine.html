<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16213e">
  <meta name="format-detection" content="telephone=no">
  <title>レアアース・クラフト - 採掘場</title>
  <style>
    :root { --maxw: 720px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* 全体は丁度よかったベストなサイズ感をベースにする */
    html {
      height: 100%;
      font-size: clamp(14px, min(calc(12px + 1.1vw), 3.2vh), 21px);
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body {
      margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
      background: #0b1224; color: #fff; touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }

    /* ─── スクロールバー（幅20px） ─── */
    ::-webkit-scrollbar { width: 20px; height: 20px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00fff5, #3b82f6); border-radius: 10px; box-shadow: 0 0 6px rgba(0, 255, 245, 0.5); border: 4px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #ffde59; background-clip: padding-box; }

    .phone {
      position: fixed; top: 0; bottom: 0; left: 0; right: 0;
      width: 100%; max-width: var(--maxw); margin: 0 auto;
      background: #0f3460; display: flex; flex-direction: column; overflow: hidden;
      padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
      box-shadow: 0 0 0 1px #16213e, 0 0 40px rgba(0,0,0,.6);
    }
    @media (orientation: landscape) and (min-width: 700px) { :root { --maxw: 1200px; } }

    /* ═══ ヘッダー：パラメータが収まるように文字をコンパクトに維持 ═══ */
    .header {
      background: #16213e; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
      padding: calc(.4rem + env(safe-area-inset-top, 0px)) .6rem .4rem;
      font-size: 0.78rem; font-weight: bold; border-bottom: 2px solid #e94560;
    }
    .bgm-btn {
      background: rgba(0, 0, 0, 0.4); border: 1px solid #00fff5; color: #00fff5;
      border-radius: 1rem; padding: .25rem .6rem; min-height: 1.8rem; font-size: .75rem; cursor: pointer;
      display: flex; align-items: center; gap: .2rem; transition: all 0.2s; touch-action: manipulation;
    }
    .bgm-btn.muted { border-color: #e94560; color: #e94560; background: rgba(233, 69, 96, 0.2); }

    /* 工程ナビゲーションバー（ベストな大きさ） */
    .koutei-bar {
      background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #00fff5;
      padding: .4rem .25rem; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0;
    }
    .koutei-wrapper { display: flex; flex-direction: column; align-items: center; gap: .15rem; }
    .koutei-item {
      width: 2.6rem; height: 2.6rem; background: #000; border: 2px solid transparent;
      border-radius: .4rem; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .koutei-item.active { border-color: #00fff5; box-shadow: 0 0 10px rgba(0, 255, 245, 0.8); animation: kouteiGlow 1.2s infinite alternate; }
    @keyframes kouteiGlow {
      from { border-color: #00fff5; box-shadow: 0 0 4px rgba(0,255,245,0.4); }
      to { border-color: #ffde59; box-shadow: 0 0 12px rgba(255,222,89,0.9); }
    }
    .koutei-item img { width: 100%; height: 100%; object-fit: cover; }
    .koutei-label { font-size: .68rem; color: #94a3b8; font-weight: bold; text-align: center; white-space: nowrap; }
    .koutei-wrapper:has(.koutei-item.active) .koutei-label { color: #00fff5; }


    /* ═══ mine専用：ヘッダー（項目が多いので必要なら折り返す） ═══ */
    .header { flex-wrap: wrap; gap: .1rem .5rem; }
    .header > span { white-space: nowrap; }
    .hd-exp { font-size: .68rem; color: #94a3b8; font-weight: normal; }

    /* ═══ コンテンツ ═══ */
    .content {
      flex: 1; min-height: 0; background: linear-gradient(180deg, #1b4f72 0%, #0f3460 100%);
      padding: .6rem .7rem; display: flex; flex-direction: column; gap: .55rem;
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    }
    .col-main, .col-side { display: flex; flex-direction: column; gap: .55rem; min-width: 0; }
    .area-title { font-weight: bold; color: #00fff5; font-size: 1rem; line-height: 1.35; text-align: center; }
    .area-description {
      background: rgba(15, 23, 42, 0.85); border: 1px solid #00fff5; border-radius: .5rem;
      padding: .4rem .6rem; font-size: .8rem; color: #dcdde1; line-height: 1.5; text-align: center;
    }

    /* ─── エリア風景画像：切り取らず「画像全体」を表示（元の縦横比のまま） ─── */
    .area-visual-box {
      position: relative; width: 100%; background: #000; border: 2px solid #ffde59; border-radius: .6rem;
      overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.4); flex-shrink: 0;
      display: flex; justify-content: center; align-items: center;
    }
    .area-visual-img {
      display: block; width: 100%; height: auto; aspect-ratio: auto 16 / 9;
      max-height: 42vh; object-fit: contain; cursor: zoom-in;
    }
    .tool-overlay {
      position: absolute; bottom: .4rem; right: .5rem; font-size: 1.2rem; pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); animation: float 2s infinite alternate;
    }
    @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-2px); } }
    .zoom-btn {
      position: absolute; top: .4rem; right: .4rem; z-index: 3; width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid #00fff5; background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 1.2rem; line-height: 1;
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
      box-shadow: 0 0 10px rgba(0,255,245,0.5); touch-action: manipulation;
    }
    .zoom-btn:active { transform: scale(0.92); }

    /* ─── キャラアニメ（1:1の正方形）＋ 結果ボックス ─── */
    .split-status-section { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .anim-box {
      aspect-ratio: 1 / 1; align-self: start; min-width: 0; background: #000;
      border: 1px solid #00fff5; border-radius: .5rem; overflow: hidden;
    }
    .anim-gif { display: block; width: 100%; height: 100%; object-fit: cover; }
    .result-box {
      align-self: stretch; min-width: 0; min-height: 0; background: rgba(15, 23, 42, 0.85);
      border: 1px solid #ffde59; border-radius: .5rem; padding: .4rem; position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .mining-status-text {
      font-size: .85rem; color: #ffde59; line-height: 1.45; text-align: center; font-weight: bold;
      z-index: 2; transform: translateY(-.9rem);
    }
    .jumping-ore {
      position: absolute; bottom: .5rem; width: 3.2rem; height: 3.2rem; object-fit: contain;
      z-index: 1; opacity: 0; pointer-events: none;
    }
    @keyframes oreJump {
      0% { transform: translateY(40px) scale(0.4) rotate(0deg); opacity: 0; }
      40% { transform: translateY(-8px) scale(1.2) rotate(180deg); opacity: 1; }
      70% { transform: translateY(4px) scale(1) rotate(270deg); opacity: 1; }
      100% { transform: translateY(0px) scale(1) rotate(360deg); opacity: 1; }
    }
    .jump-active { animation: oreJump 0.6s ease-out forwards; }

    /* ─── ボタン ─── */
    .action-stack { display: flex; flex-direction: column; gap: .5rem; }
    .btn-mine, .btn-back, .btn-recycle-shortcut, .btn-next-step {
      width: 100%; min-height: 2.8rem; padding: .5rem; border-radius: .7rem; font-size: .9rem; font-weight: bold;
      cursor: pointer; touch-action: manipulation; font-family: inherit; flex-shrink: 0;
    }
    .btn-mine { background: #e94560; color: #fff; border: none; box-shadow: 0 2px 6px rgba(233, 69, 96, 0.4); }
    .btn-back { background: #16213e; border: 1px solid #00fff5; color: #00fff5; }
    .btn-recycle-shortcut {
      background: rgba(0, 255, 245, 0.15); border: 1px solid #00fff5; color: #00fff5;
      display: flex; align-items: center; justify-content: center; gap: .3rem;
    }
    .btn-recycle-shortcut:active { background: rgba(0, 255, 245, 0.3); }
    .btn-next-step {
      background: linear-gradient(135deg, #00fff5, #3b82f6); color: #0f3460; border: 1px solid #00fff5;
      box-shadow: 0 2px 6px rgba(0, 255, 245, 0.4);
    }
    .btn-mine:active, .btn-back:active, .btn-next-step:active { transform: scale(0.97); }

    /* ─── イットリウムちゃんの案内カード ─── */
    .tb-guide-card {
      display: flex; align-items: center; gap: .6rem; background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00fff5; border-radius: .7rem; padding: .45rem .6rem; text-align: left;
    }
    .tb-avatar-circle {
      width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2px solid #00fff5; object-fit: cover;
      background: #000; flex-shrink: 0; box-shadow: 0 0 6px rgba(0, 255, 245, 0.4);
    }
    .tb-speech-bubble {
      background: #fff; border: 1px solid #cbd5e1; border-radius: .6rem; padding: .45rem .65rem;
      font-size: .8rem; color: #1e293b; line-height: 1.45; position: relative; flex: 1; font-weight: bold;
    }
    .tb-speech-bubble::before {
      content: ''; position: absolute; left: -6px; top: 50%; transform: translateY(-50%);
      border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 6px solid #fff;
    }
    .highlight-material { color: #0f3460; background: rgba(0, 255, 245, 0.25); padding: 0 2px; border-radius: 3px; }
    .highlight-product { color: #d35400; background: rgba(255, 222, 89, 0.35); padding: 0 2px; border-radius: 3px; }

    /* 横長（タブレット横・PC）：左に風景、右にアニメ＋操作の2カラム */
    @media (orientation: landscape) and (min-width: 700px) {
      .content { display: grid; grid-template-columns: 1.5fr 1fr; align-items: start; gap: .7rem; }
      .area-visual-img { max-height: calc(100vh - 17rem); }
      .btn-mine, .btn-back, .btn-recycle-shortcut, .btn-next-step { min-height: 2.4rem; padding: .35rem; }
    }

    /* ─── モーダル追加分 ─── */
    .modal-title.warn { color: #ff4757; }
    .modal-btn-row { display: flex; gap: .5rem; margin-top: .7rem; }
    .jewel-img { width: 5rem; height: 5rem; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); margin: .3rem 0; }
    .jewel-desc { font-size: .8rem; color: #dcdde1; margin-bottom: .7rem; line-height: 1.5; background: rgba(15,23,42,0.8); padding: .5rem; border-radius: .5rem; text-align: left; }
    .levelup-card {
      background: linear-gradient(135deg, #16213e, #0f3460); border: 3px solid #ffde59; border-radius: 1.2rem;
      padding: 1.4rem 1.2rem; width: 100%; max-width: 19rem; text-align: center; box-shadow: 0 0 30px rgba(255, 222, 89, 0.6);
      animation: popup 0.3s ease-out;
    }
    .levelup-emoji { font-size: 2.4rem; margin-bottom: .4rem; }
    .levelup-title { font-size: 1.1rem; font-weight: bold; color: #ffde59; margin-bottom: .2rem; }
    .levelup-sub { font-size: .9rem; color: #cbd5e1; margin-bottom: .7rem; }
    .levelup-lv { font-size: 1.6rem; font-weight: bold; color: #00fff5; margin-bottom: .9rem; }
    .levelup-note { font-size: .75rem; color: #94a3b8; margin-bottom: .9rem; }
    .levelup-btn {
      background: #00fff5; color: #0f3460; border: none; padding: .7rem 1rem; min-height: 2.8rem; font-size: .9rem; font-weight: bold;
      border-radius: .8rem; cursor: pointer; width: 100%; box-shadow: 0 3px 10px rgba(0,255,245,0.4); font-family: inherit; touch-action: manipulation;
    }

    /* ═══ 🔍 画像拡大ビューア（ピンチ・ドラッグ・ホイール・ダブルタップ対応） ═══ */
    .viewer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; background: rgba(5, 8, 18, 0.97); display: none; flex-direction: column; }
    .viewer.open { display: flex; }
    .viewer-stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; cursor: grab; }
    .viewer-stage.dragging { cursor: grabbing; }
    .viewer-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: center center;
      will-change: transform; pointer-events: none; -webkit-user-drag: none;
    }
    .viewer-close {
      position: absolute; z-index: 5; top: calc(.6rem + env(safe-area-inset-top, 0px)); right: calc(.6rem + env(safe-area-inset-right, 0px));
      width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 2px solid #e94560; background: rgba(15,23,42,.85);
      color: #fff; font-size: 1.2rem; cursor: pointer; touch-action: manipulation;
    }
    .viewer-hint {
      position: absolute; z-index: 4; left: 0; right: 4.5rem; top: calc(.9rem + env(safe-area-inset-top, 0px)); padding-left: .8rem;
      font-size: .72rem; color: #94a3b8; pointer-events: none; text-shadow: 0 1px 3px #000;
    }
    .viewer-bar {
      flex-shrink: 0; display: flex; justify-content: center; align-items: center; gap: .6rem; background: #16213e; border-top: 2px solid #00fff5;
      padding: .5rem .8rem calc(.5rem + env(safe-area-inset-bottom, 0px));
    }
    .viewer-bar button {
      min-width: 2.8rem; min-height: 2.8rem; padding: 0 .8rem; border-radius: .7rem; border: 1px solid #00fff5;
      background: rgba(0,255,245,0.12); color: #00fff5; font-size: 1.1rem; font-weight: bold; cursor: pointer; touch-action: manipulation; font-family: inherit;
    }
    .viewer-bar button:active { transform: scale(0.95); }
    .viewer-scale { min-width: 3.5rem; text-align: center; font-weight: bold; font-size: .9rem; color: #ffde59; }

    /* ═══ 下部フッター（ベストな大きさ） ═══ */
    .nav {
      flex-shrink: 0; position: relative; z-index: 50; background: #16213e; border-top: 2px solid #1f293d;
      display: flex; justify-content: space-around; align-items: stretch; gap: .3rem;
      padding: .4rem .5rem calc(.4rem + env(safe-area-inset-bottom, 0px));
    }
    .nav-item {
      color: #a0aec0; cursor: pointer; text-align: center; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 245, 0.2); border-radius: .7rem; padding: .3rem .2rem;
      min-height: 3rem; font-size: .72rem; font-weight: bold; flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
      transition: all 0.2s; touch-action: manipulation;
    }
    .nav-ico { font-size: 1.15rem; line-height: 1; display: block; }
    .nav-item:active { transform: scale(0.95); }
    .nav-item.active { color: #00fff5; background: rgba(0, 255, 245, 0.15); border-color: #00fff5; box-shadow: 0 0 8px rgba(0, 255, 245, 0.3); }

    /* モーダル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 15, 30, 0.85); display: flex; justify-content: center; align-items: center;
      z-index: 200; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); padding: 1rem;
    }
    .modal-content {
      background: #16213e; border: 2px solid #00fff5; border-radius: 1rem; padding: 1.2rem 1rem;
      width: 100%; max-width: 22rem; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 245, 0.3);
      animation: popup 0.3s ease-out;
    }
    .modal-icon { font-size: 2rem; margin-bottom: .2rem; }
    .modal-title { font-size: 1.05rem; font-weight: bold; color: #ffde59; margin-bottom: .4rem; }
    .modal-desc { font-size: .88rem; color: #f1f5f9; margin-bottom: .8rem; line-height: 1.55; white-space: pre-line; }
    @keyframes popup { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <audio id="bgm-mine" preload="auto" loop></audio>
  <audio id="se-futsu" src="SE__mine_futsu.mp3" preload="auto"></audio>
  <audio id="se-houseki" src="SE__mine_houseki.mp3" preload="auto"></audio>
  <audio id="se-type" src="type.mp3" preload="auto"></audio>
  <audio id="se-gogogo" src="gogogo.mp3" preload="auto"></audio>
  <audio id="se-unlock" src="itemget.mp3" preload="auto"></audio>

  <div class="phone">
    <div class="header">
      <span>💰 <span id="money">1,500</span> G</span>
      <span>🌟 Lv.<span id="level">1</span> <span class="hd-exp">(EXP: <span id="exp">0</span>/<span id="max-exp">100</span>)</span></span>
      <span>📦 採掘物: <span id="mud">0</span>個</span>
      <button id="bgm-btn" class="bgm-btn" onclick="toggleBGM()">🎵 ON</button>
    </div>
    
    <!-- 工程ナビゲーションバー -->
    <div class="koutei-bar">
      <div class="koutei-wrapper">
        <div class="koutei-item active"><img src="koutei1.png" alt="採掘" onerror="this.style.display='none'"></div>
        <div class="koutei-label">1.採掘</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item active"><img src="koutei2.png" alt="運搬" onerror="this.style.display='none'"></div>
        <div class="koutei-label">2.運搬</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei3.png" alt="精製" onerror="this.style.display='none'"></div>
        <div class="koutei-label">3.精製</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei4.png" alt="インゴット" onerror="this.style.display='none'"></div>
        <div class="koutei-label">4.素材</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei5.png" alt="製造" onerror="this.style.display='none'"></div>
        <div class="koutei-label">5.製造</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei6.png" alt="出荷" onerror="this.style.display='none'"></div>
        <div class="koutei-label">6.出荷</div>
      </div>
    </div>

    <div class="content">
      <div class="col-main">
        <div class="area-title" id="current-area-title">【 エリア名 】</div>
        <div class="area-description" id="area-feature-text">エリアの特徴説明</div>

        <!-- 風景画像BOX：画像全体を表示。🔍 または画像タップで拡大ビューア -->
        <div class="area-visual-box">
          <img id="area-img" class="area-visual-img" src="area_cn.png" alt="エリアビジュアル" onclick="openViewer()">
          <div class="tool-overlay" id="tool-icon">🚚🚜</div>
          <button type="button" class="zoom-btn" onclick="openViewer()" aria-label="画像を拡大表示">🔍</button>
        </div>
      </div>

      <div class="col-side">
        <!-- 左右分割エリア（アニメは1:1の正方形） -->
        <div class="split-status-section">
          <div class="anim-box">
            <img id="anim-img" class="anim-gif" src="anime_cn.gif" alt="動作アニメ">
          </div>
          <div class="result-box">
            <div class="mining-status-text" id="mining-status">資源を採取する準備ができました</div>
            <img id="jumping-ore-img" class="jumping-ore" src="kouseki1.png" alt="鉱石">
          </div>
        </div>

        <div class="action-stack">
          <button class="btn-mine" onclick="mineMud()">⛏️ 資源を採掘する (<span id="mine-cost">10</span>G +EXP)</button>

          <div class="tb-guide-card">
            <img src="chara0_Y.png" alt="イットリウム" class="tb-avatar-circle" onerror="this.src='navtb.png'">
            <div class="tb-speech-bubble">
              採掘した<span class="highlight-material">採掘物（泥）は</span>精製プラントで加工して、<span class="highlight-product">レアアース元素</span>を取り出そう！
            </div>
          </div>

          <button class="btn-next-step" onclick="goToRefinery()">🧪 精製プラントにすすむ</button>
          <button class="btn-back" onclick="goBackMap()">🗺️ マップに戻ってエリアを変更する</button>
          <button class="btn-recycle-shortcut" onclick="goToRecycle()">♻️ リサイクル工場（資金稼ぎ）へ行く</button>
        </div>
      </div>
    </div>

    <!-- 下部ナビゲーション -->
    <div class="nav">
      <div class="nav-item active" onclick="goBackMap()"><span class="nav-ico">🗺️</span>マップ</div>

    // ピンチ／ダブルタップによる意図しない拡大・表示ブレを防止（iOS Safari 対策含む）
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
      document.addEventListener(ev, e => e.preventDefault())
    );
    document.addEventListener('dblclick', e => e.preventDefault());
    let gameState = JSON.parse(localStorage.getItem('rareEarthGameState')) || { money: 1500, level: 1, exp: 0, mudStock: 5, elements: {}, jewels: [], houseki: {} };
    if (gameState.money === undefined) gameState.money = 1500;
    if (gameState.level === undefined) gameState.level = 1;
    if (gameState.exp === undefined) gameState.exp = 0;
    if (gameState.mudStock === undefined) gameState.mudStock = 5;
    if (!gameState.jewels) gameState.jewels = [];
    if (!gameState.houseki) gameState.houseki = {};

    function saveGameState() {
      localStorage.setItem('rareEarthGameState', JSON.stringify(gameState));
    }

    function getRequiredExp(level) {
      if (level >= 50) return 50000000;
      const expTable = [
        0, 
        100, 300, 600, 1000, 1600, 2400, 3500, 4800, 6500, 8500,
        11000, 14000, 18000, 23000, 29000, 36000, 45000, 56000, 70000, 90000,
        115000, 145000, 180000, 220000, 270000, 330000, 400000, 480000, 580000, 700000,
        850000, 1050000, 1300000, 1600000, 2000000, 2500000, 3100000, 3800000, 4700000, 5800000,
        7200000, 9000000, 11200000, 14000000, 17500000, 22000000, 28000000, 36000000, 48000000
      ];
      return expTable[level] || (level * 2000000);
    }

    function addExp(amount) {
      gameState.exp += amount;
      let leveledUp = false;
      
      while (true) {
        if (gameState.level >= 50) {
          gameState.exp = 0;
          break;
        }
        let reqExp = getRequiredExp(gameState.level);
        if (gameState.exp >= reqExp) {
          gameState.exp -= reqExp;
          gameState.level++;
          leveledUp = true;
        } else {
          break;
        }
      }

      saveGameState();
      updateUI();

      if (leveledUp) {
        triggerLevelUpEffect(gameState.level);
      }
    }

          <button class="levelup-btn" onclick="document.getElementById('commonLevelUpModal').remove()">やったね！</button>

      { id: 100, name: 'レアアース・プリズム鉱', img: 'houseki100.png', desc: 'すべての希土類エネルギーを束ねた究極の幻の鉱物。' }
    ];

    const spotConfig = {
      'baiyun': { name: '中国 モンゴル自治区 白雲鄂博', cost: 10, desc: '世界最大の軽レアアース鉱山。ランタンやセリウムの生産拠点。', img: 'area_cn.png', anim: 'anime_cn.gif', isSea: false },
      'america': { name: 'アメリカ マウンテンパス鉱山', cost: 30, desc: 'かつて世界のユーロピウム供給を支えた歴史ある名門露天掘り鉱山。', img: 'area_us.png', anim: 'anime_us.gif', isSea: false },
      'mount': { name: 'オーストラリア マウント・ウェルド鉱山', cost: 50, desc: '高品質な磁石向け軽レアアース（ネオジム等）を産出する安定供給地。', img: 'area_au.png', anim: 'anime_au.gif', isSea: false },
      'myanmar': { name: 'ミャンマー イオン吸着鉱床', cost: 100, desc: 'EVや風力発電に不可欠な「重レアアース」が豊富にとれる粘土層鉱床。', img: 'area_mm.png', anim: 'anime_mm.png', isSea: false },
      'africa': { name: '🌍 アフリカ新興鉱床', cost: 150, desc: '脱・中国依存に向けて近年世界中から開発が進む注目のフロンティア。', img: 'area_af.png', anim: 'anime_af.gif', isSea: false },
      'greenland': { name: 'グリーンランド クバネフエルド鉱床', cost: 300, desc: '氷河の下に眠る、世界最大級の未開発レアアース・ウラン複合鉱床。', img: 'area_greenisland.png', anim: 'anime_BIG_GL.gif', isSea: false },
      'tahiti': { name: 'タヒチ 南太平洋・マンガン団塊', cost: 200, desc: '深海底に転がる金属塊。重レアアースやコバルトを含む高価なゾーン。', img: 'area_tahiti.png', anim: 'anime_tahiti.gif', isSea: true },
      'okinotori': { name: '日本 沖ノ鳥島沖（EEZ海底泥）', cost: 500, desc: '日本の未来を担う！水深数千mの海底に眠る超高濃度レアアース泥。', img: 'area_japan.png', anim: 'anime_cn.gif', isSea: true }
    };

    const currentSpot = spotConfig[spotId] || spotConfig['baiyun'];

    // BGM切り替え設定
    const bgm = document.getElementById('bgm-mine');
    const bgmBtn = document.getElementById('bgm-btn');
    bgm.volume = 0.4;

    if (currentSpot.isSea) {
      bgm.src = 'BGM_mine2.ogg';
    } else {
      bgm.src = 'BGM_mine.ogg';
    }

    let isMuted = localStorage.getItem('bgmMutedMine') === 'true';

    function updateBgmUI() {
      if (isMuted) {
        bgm.muted = true;
        bgmBtn.innerText = '🔇 OFF';
        bgmBtn.classList.add('muted');
      } else {
        bgm.muted = false;
        bgmBtn.innerText = '🎵 ON';
        bgmBtn.classList.remove('muted');
      }
    }

    function toggleBGM() {
      isMuted = !isMuted;
      localStorage.setItem('bgmMutedMine', isMuted);
      updateBgmUI();
      if (!isMuted) {
        bgm.play().catch(() => {});
      } else {
        bgm.pause();
      }
    }

    function unlockAndPlayMine() {
      if (!isMuted) {
        bgm.play().then(() => {
          document.removeEventListener('click', unlockAndPlayMine);
          document.removeEventListener('touchstart', unlockAndPlayMine);
          document.removeEventListener('keydown', unlockAndPlayMine);
        }).catch(() => {});
      }
    }

    window.addEventListener('load', () => {
      updateBgmUI();
      if (!isMuted) {
        bgm.play().catch(() => {
          document.addEventListener('click', unlockAndPlayMine);
          document.addEventListener('touchstart', unlockAndPlayMine);
          document.addEventListener('keydown', unlockAndPlayMine);
        });
      }
    });

    function updateUI() {
      document.getElementById('money').innerText = gameState.money.toLocaleString();
      document.getElementById('level').innerText = gameState.level;
      
      const reqExp = getRequiredExp(gameState.level);
      const expEl = document.getElementById('exp');
      const maxExpEl = document.getElementById('max-exp');
      if (expEl) expEl.innerText = gameState.level >= 50 ? 'MAX' : gameState.exp;
      if (maxExpEl) maxExpEl.innerText = gameState.level >= 50 ? 'MAX' : reqExp;

      document.getElementById('mud').innerText = gameState.mudStock;
      document.getElementById('current-area-title').innerText = `【 ${currentSpot.name} 】`;
      document.getElementById('area-feature-text').innerText = currentSpot.desc;
      document.getElementById('mine-cost').innerText = currentSpot.cost;
      document.getElementById('area-img').src = currentSpot.img;
      document.getElementById('anim-img').src = currentSpot.anim;

      const toolIcon = document.getElementById('tool-icon');
      if (currentSpot.isSea) {
        toolIcon.innerHTML = '🚢⚓';
      } else {
        toolIcon.innerHTML = '🚚🚜';
      }
    }

    function mineMud() {
      if (gameState.money < currentSpot.cost) {
        document.getElementById('noMoneyModal').style.display = 'flex';
        return;
      }

      gameState.money -= currentSpot.cost;

      // ミャンマーでのカラオケ発生率を 8% (0.08) から 2% (0.02) に大幅ダウン！
      if (spotId === 'myanmar' && Math.random() < 0.02) {
        localStorage.setItem('rareEarthGameState', JSON.stringify(gameState));
        setTimeout(() => {
          location.href = 'karaoke.html';
        }, 300);
        return;
      }

      // 💎 3%の確率で「きれいな鉱物」発生判定
      const isRareJewel = Math.random() < 0.03;
      let obtainedJewel = null;

      if (isRareJewel) {
        const randomIndex = Math.floor(Math.random() * gemsMaster.length);
        obtainedJewel = gemsMaster[randomIndex];
        
        // 🔒 図鑑と確実に同期するための堅牢な保存（配列＆オブジェクト両方に登録）
        if (!gameState.jewels) gameState.jewels = [];
        if (!gameState.jewels.includes(obtainedJewel.id)) gameState.jewels.push(obtainedJewel.id);
        if (!gameState.jewels.includes(`houseki${obtainedJewel.id}`)) gameState.jewels.push(`houseki${obtainedJewel.id}`);

        if (!gameState.houseki) gameState.houseki = {};
        gameState.houseki[obtainedJewel.id] = true;
        gameState.houseki[`houseki${obtainedJewel.id}`] = true;

        const seHouseki = document.getElementById('se-houseki');
        seHouseki.currentTime = 0;
        seHouseki.play().catch(e => console.log('音声再生エラー:', e));
      } else {
        const seFutsu = document.getElementById('se-futsu');
        seFutsu.currentTime = 0;
        seFutsu.play().catch(e => console.log('音声再生エラー:', e));
      }

      const gained = Math.floor(Math.random() * 2) + 1;
      gameState.mudStock += gained;
      gameState.lastMinedSpot = spotId;

      // 採掘EXP獲得 (1回につき25EXP)
      addExp(25);

      saveGameState();
      updateUI();

      const oreImg = document.getElementById('jumping-ore-img');
      
      if (isRareJewel) {
        oreImg.src = obtainedJewel.img;
      } else {
        oreToggle = !oreToggle;
        oreImg.src = oreToggle ? 'kouseki1.png' : 'kouseki2.png';
      }

      oreImg.classList.remove('jump-active');
      void oreImg.offsetWidth;
      oreImg.classList.add('jump-active');

      if (isRareJewel) {
        document.getElementById('mining-status').innerText = `💎 奇跡の発見！\n【${obtainedJewel.name}】`;
        setTimeout(() => {
          showFirstJewelModal(obtainedJewel);
        }, 500);
      } else {
        document.getElementById('mining-status').innerText = `✨ 資源を\n${gained} 個獲得！`;
      }
    }

    function showFirstJewelModal(jewel) {
      document.getElementById('popup-jewel-name').innerText = jewel.name;
      document.getElementById('popup-jewel-img').src = jewel.img;
      document.getElementById('popup-jewel-desc').innerText = jewel.desc;
      document.getElementById('firstJewelModal').style.display = 'flex';
    }

    function closeFirstJewelModal() {
      document.getElementById('firstJewelModal').style.display = 'none';
    }

    function closeNoMoneyModal() {
      document.getElementById('noMoneyModal').style.display = 'none';
    }

    function goToRefinery() {
      const se = document.getElementById('se-gogogo');
      if (se) { se.currentTime = 0; se.play().catch(e => {}); }
      setTimeout(() => {
        location.href = 'seisei.html';
      }, 200);
    }

    function goToRecycle() {
      const se = document.getElementById('se-gogogo');
      if (se) { se.currentTime = 0; se.play().catch(e => console.log('音声再生エラー:', e)); }
      setTimeout(() => {
        location.href = 'recycle.html';
      }, 300);
    }

    function goToRecycleWithSound() {
      goToRecycle();
    }

    function goBackMap() {
      const se = document.getElementById('se-type');
      se.currentTime = 0;
      se.play().catch(e => console.log('音声再生エラー:', e));

      setTimeout(() => {
        location.href = 'map.html';
      }, 150);
    }

    // ═══ 🔍 エリア画像ビューア ═══
    const VIEWER_MAX = 6;
    const vw = { s: 1, x: 0, y: 0, pts: new Map(), d0: 0, s0: 1, moved: false, tapT: 0, tapX: 0, tapY: 0 };
    const vStage = document.getElementById('viewerStage');
    const vImg = document.getElementById('viewerImg');

    function viewerBounds() {
      const r = vStage.getBoundingClientRect();
      const nw = vImg.naturalWidth || r.width, nh = vImg.naturalHeight || r.height;
      const fit = Math.min(r.width / nw, r.height / nh);
      return { mx: Math.max(0, (nw * fit * vw.s - r.width) / 2), my: Math.max(0, (nh * fit * vw.s - r.height) / 2) };
    }
    function applyViewer() {
      const b = viewerBounds();
      vw.x = Math.max(-b.mx, Math.min(b.mx, vw.x));
      vw.y = Math.max(-b.my, Math.min(b.my, vw.y));
      vImg.style.transform = `translate(${vw.x}px, ${vw.y}px) scale(${vw.s})`;
      document.getElementById('viewerScale').textContent = Math.round(vw.s * 100) + '%';
    }
    function viewerZoomAt(cx, cy, ns) {
      ns = Math.min(VIEWER_MAX, Math.max(1, ns));
      const r = vStage.getBoundingClientRect();
      const px = cx - (r.left + r.width / 2), py = cy - (r.top + r.height / 2);
      const k = ns / vw.s;
      vw.x = px - (px - vw.x) * k; vw.y = py - (py - vw.y) * k; vw.s = ns;
      applyViewer();
    }
    function viewerStep(dir) {
      const r = vStage.getBoundingClientRect();
      viewerZoomAt(r.left + r.width / 2, r.top + r.height / 2, vw.s * (dir > 0 ? 1.5 : 1 / 1.5));
    }
    function viewerReset() { vw.s = 1; vw.x = 0; vw.y = 0; applyViewer(); }
    function openViewer() {
      vImg.src = document.getElementById('area-img').src;
      viewerReset();
      document.getElementById('imgViewer').classList.add('open');
    }
    function closeViewer() { document.getElementById('imgViewer').classList.remove('open'); vw.pts.clear(); }
    vImg.addEventListener('load', applyViewer);
    window.addEventListener('resize', () => { if (document.getElementById('imgViewer').classList.contains('open')) applyViewer(); });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('imgViewer').classList.contains('open')) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === '+' || e.key === '=') viewerStep(1);
      else if (e.key === '-') viewerStep(-1);
    });

    vStage.addEventListener('wheel', e => {
      e.preventDefault();
      viewerZoomAt(e.clientX, e.clientY, vw.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
    }, { passive: false });

    vStage.addEventListener('pointerdown', e => {
      vStage.setPointerCapture(e.pointerId);
      vw.pts.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
      if (vw.pts.size === 1) vw.moved = false;
      if (vw.pts.size === 2) {
        const [a, b] = [...vw.pts.values()];
        vw.d0 = Math.hypot(a.x - b.x, a.y - b.y); vw.s0 = vw.s; vw.moved = true;
      }
      vStage.classList.add('dragging');
    });
    vStage.addEventListener('pointermove', e => {
      const p = vw.pts.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 8) vw.moved = true;
      p.x = e.clientX; p.y = e.clientY;
      if (vw.pts.size === 2 && vw.d0 > 0) {
        const [a, b] = [...vw.pts.values()];
        viewerZoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, vw.s0 * Math.hypot(a.x - b.x, a.y - b.y) / vw.d0);
      } else if (vw.pts.size === 1 && vw.s > 1) {
        vw.x += dx; vw.y += dy; applyViewer();
      }
    });
    function endPointer(e) {
      if (!vw.pts.has(e.pointerId)) return;
      vw.pts.delete(e.pointerId);
      if (vw.pts.size === 0) vStage.classList.remove('dragging');
      // ダブルタップ／ダブルクリックで 等倍 ⇔ 2.5倍
      if (e.type === 'pointerup' && vw.pts.size === 0 && !vw.moved) {
        const now = Date.now();
        if (now - vw.tapT < 320 && Math.hypot(e.clientX - vw.tapX, e.clientY - vw.tapY) < 30) {
          viewerZoomAt(e.clientX, e.clientY, vw.s > 1.05 ? 1 : 2.5); vw.tapT = 0;
        } else { vw.tapT = now; vw.tapX = e.clientX; vw.tapY = e.clientY; }
      }
    }
    vStage.addEventListener('pointerup', endPointer);
    vStage.addEventListener('pointercancel', endPointer);

    updateUI();
  </script>
</body>
