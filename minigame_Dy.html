<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>極み！レアアース仕込み堂</title>
<style>
:root{--wood:#2b1810;--noren:#b3201a;--paper:#f6ecd6;--ink:#2a1a12;--gold:#e0a21b;--aq:#e6d765;--og:#d98a2b}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--wood) repeating-linear-gradient(90deg,#33200f 0 38px,#2b1810 38px 40px);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:8px}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.noren{background:var(--noren);color:#fff;text-align:center;padding:10px 6px 14px;border-radius:6px 6px 0 0;font-weight:900;font-size:1.25rem;letter-spacing:.12em;position:relative;box-shadow:0 4px 0 #000 inset}
.noren:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:10px;background:repeating-linear-gradient(90deg,var(--noren) 0 22%,transparent 22% 25%)}
.noren small{display:block;font-size:.7rem;font-weight:400;letter-spacing:.1em;opacity:.85}
.bar{flex-wrap:wrap;display:flex;gap:6px;align-items:center;background:#1a0f09;border:2px solid #6b4423;border-radius:10px;padding:6px 10px;color:#f6ecd6;font-weight:bold;font-size:.9rem;margin-top:6px}
.bar span.g{color:#ffd35a}.bar span.e{color:#8fd0ff}.bar .sp{flex:1}
.nav{color:#f6ecd6;border:1px solid #a9855f;border-radius:8px;padding:5px 9px;font-size:.78rem;text-decoration:none;background:#4a2c18}
.nav:active{transform:scale(.96)}
.oyaji{display:flex;align-items:flex-end;gap:8px}
.chef{position:relative;width:128px;flex:none}
.chef img{width:100%;display:block}
.hb{position:absolute;left:22%;top:25.5%;width:48%;height:6%;background:#fff;border:1.5px solid #222;border-radius:3px;transform:rotate(-1.5deg)}
.hb:before{content:"極";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-size:.62rem;font-weight:900;color:var(--noren);line-height:1}
.hb:after{content:"";position:absolute;right:-9px;top:1px;width:10px;height:14px;background:#fff;border:1.5px solid #222;border-radius:2px 6px 6px 2px;transform:skewY(14deg)}
.steam{position:absolute;top:-6px;right:10px;font-size:1rem;opacity:.7;animation:st 2.4s infinite}
@keyframes st{0%{transform:translateY(8px);opacity:0}50%{opacity:.8}100%{transform:translateY(-10px);opacity:0}}
.bub{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:9px 11px;font-size:.84rem;line-height:1.5;position:relative;margin-bottom:26px}
.bub:before{content:"";position:absolute;left:-12px;bottom:14px;border:7px solid transparent;border-right:9px solid var(--ink)}
.bub b{color:var(--noren)}
.card{background:var(--paper);border:4px solid #6b4423;outline:2px solid #1a0f09;border-radius:12px;padding:14px;text-align:center}
.ttl{font-weight:900;font-size:1.05rem;color:var(--noren);margin-bottom:2px}
.sub{font-size:.78rem;color:#6b5646;margin-bottom:8px;line-height:1.45}
.btn{display:block;width:100%;border:0;border-bottom:5px solid #6d120e;background:var(--noren);color:#fff;font-weight:900;font-size:1.05rem;padding:13px;border-radius:10px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.blue{background:#1f5aa6;border-bottom-color:#12335f}
.btn.wood{background:#6b4423;border-bottom-color:#3a2412}
.row{display:flex;gap:10px}
.fb{font-variant-numeric:tabular-nums;min-height:1.5em;font-weight:900;margin:6px 0;font-size:1.05rem}
.stage{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:8px 0}
.bk{position:relative;width:130px;height:170px;border:4px solid #555;border-top:0;border-radius:0 0 22px 22px;background:#fffdf4cc;overflow:hidden}
.lq{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#f3e77a,var(--aq));opacity:.9}
.lq:before{content:"";position:absolute;left:20%;bottom:6px;width:6px;height:6px;border-radius:50%;background:#fff8;animation:bub 1.6s infinite}
@keyframes bub{to{transform:translateY(-60px);opacity:0}}
.tl{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--noren);z-index:3}.tl span{position:absolute;right:3px;top:-16px;font-size:.66rem;color:var(--noren);font-weight:bold}
.pw{position:absolute;left:50%;bottom:0;width:100px;margin-left:-50px;z-index:2;transform-origin:bottom center}
.st{position:absolute;left:50%;top:-6px;width:7px;margin-left:-3px;background:#cde7f6;opacity:0;z-index:1;border-radius:3px}
.bottle{font-size:2.2rem;transform:rotate(-30deg);margin-bottom:120px}
.meter{height:12px;background:#d9c7a3;border-radius:6px;overflow:hidden;margin:4px 0 8px;border:1px solid #6b4423}
.meter i{display:block;height:100%;background:var(--gold);width:100%}
.tank{position:relative;width:100%;height:150px;border:4px solid #555;border-radius:10px 10px 24px 24px;overflow:hidden;background:#fff8;margin:6px 0}
.tank .og{position:absolute;top:0;left:0;right:0;height:45%;background:var(--og);opacity:.25;transition:opacity .1s}
.tank .aq{position:absolute;bottom:0;left:0;right:0;height:55%;background:var(--aq);opacity:.95;transition:opacity .1s}
.tank .lb{position:absolute;right:6px;font-size:.7rem;font-weight:bold;color:#4a3a2a}
.tank .pad{position:absolute;left:50%;top:6px;width:6px;height:132px;margin-left:-3px;background:#777;border-radius:3px}
.tank .blade{position:absolute;left:50%;top:96px;width:78px;height:10px;margin-left:-39px;transform-style:preserve-3d;animation:blSpin 1.8s linear infinite}
.tank .blade i{position:absolute;inset:0;background:linear-gradient(#bbb,#666);border-radius:5px;border:1px solid #444}
.tank .blade i:nth-child(2){transform:rotateY(90deg)}
@keyframes blSpin{from{transform:perspective(260px) rotateY(0)}to{transform:perspective(260px) rotateY(360deg)}}
.cells{display:flex;gap:3px;justify-content:center;margin:6px 0 2px}
.cells i{width:20px;height:22px;border:2px solid #6b4423;border-radius:3px 3px 8px 8px;background:#fff7}
.cells i.p{background:#ffd35a}.cells i.o{background:#8fd0ff}.cells i.m{background:#ccc}
.lane{position:relative;height:84px;background:repeating-linear-gradient(90deg,#2c2c2c 0 18px,#353535 18px 20px);border-radius:10px;overflow:hidden;margin:8px 0;border:3px solid #6b4423}
.jc{position:absolute;left:36px;top:9px;width:60px;height:64px;border:3px dashed #ffd35a;border-radius:6px;background:#ffd35a22}
.nt{position:absolute;top:19px;width:46px;height:46px;border-radius:6px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.64rem}
.nt.mix{background:#d9822b}.nt.set{background:#2a8f8a}
.order{background:#fff3c4;border:4px solid var(--noren);outline:2px solid #1a0f09;border-radius:10px;padding:10px 12px;font-size:1.05rem;line-height:1.5;display:flex;gap:12px;align-items:center;color:var(--ink);box-shadow:0 4px 0 #000;position:relative}
.order:before{content:"ご注文";position:absolute;top:-12px;left:12px;background:var(--noren);color:#fff;font-size:.72rem;font-weight:900;padding:2px 10px;border-radius:6px;letter-spacing:.1em}
.order .sw{width:66px;height:66px;border-radius:50%;border:3px solid #6b4423;flex:none;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;color:var(--noren)}.order .sw img{width:100%;height:100%;object-fit:contain}
.order b{color:var(--noren);font-size:1.15rem}
.order small{display:block;font-weight:700;color:#6b4a2a;font-size:.76rem}
.pur{font-size:1.5rem;font-weight:900;color:var(--noren)}
.ing{width:190px;margin:6px auto;display:block}
.gauge{position:relative;height:30px;background:#d9c7a3;border-radius:8px;border:2px solid #6b4423;margin:10px 0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#3bb35a99}
.mk{position:absolute;top:-2px;bottom:-2px;width:5px;background:#e53935;border-radius:3px}
.rank{font-size:3.2rem;font-weight:900;color:var(--noren);line-height:1}
.res{background:#fffaf0;border:2px dashed #6b4423;border-radius:10px;padding:10px;margin:8px 0;font-weight:bold;line-height:1.8}
.res .g{color:#c27c00}.res .e{color:#1f5aa6}
.tip{font-size:.74rem;color:#6b5646;text-align:left;line-height:1.5;background:#efe0bd;border-radius:8px;padding:7px 9px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(20,10,5,.94) repeating-linear-gradient(90deg,#33200f 0 38px,#2b1810 38px 40px);transition:opacity .45s}
#intro .it{background:var(--noren);color:#fff;font-weight:900;font-size:1.3rem;letter-spacing:.12em;padding:10px 18px;border-radius:6px;box-shadow:0 4px 0 #000 inset;text-align:center}
#intro .it small{display:block;font-size:.7rem;font-weight:400;letter-spacing:.1em;opacity:.85}
#intro .bub{flex:none;margin:0;width:min(88vw,360px);text-align:center;font-size:1.1rem;font-weight:900;padding:14px 16px}
#intro .bub:before{display:none}
#intro .btn{width:min(80vw,280px);font-size:1.25rem;padding:15px}
</style>
</head>

<script>
// ===== ゲーム本編との連携 =====
// 報酬は本編の rareEarthGameState（money / exp / level）へ直接加算します。
const SAVE_KEY = 'rareEarthSave';
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); }catch(e){ return {}; } }
function reGS(){ try{ return JSON.parse(localStorage.getItem('rareEarthGameState'))||{}; }catch(e){ return {}; } }
function addReward(g,e){   // 本編の保存データ(rareEarthGameState)へ直接反映：お金とEXP
  try{
    const gs=reGS(); if(gs.money==null) gs.money=1500; if(gs.level==null){ gs.level=1; if(gs.mudStock==null) gs.mudStock=5; }
    gs.money+=g; RE.addExp(gs,e,{raw:true});
    localStorage.setItem('rareEarthGameState',JSON.stringify(gs));
  }catch(err){}
  showBar();
}
function showBar(){ const d=reGS(); $('#gv').textContent=(d.money||0).toLocaleString(); $('#ev').textContent=d.exp||0; }

const $=s=>document.querySelector(s);
const ELS=[
['Sc','スカンジウム','Sc₂O₃','#f5f5ee','#e8f2f8','ほぼ無色','航空機用アルミ合金・燃料電池','Y、Ti',0],
['Y','イットリウム','Y₂O₃','#f4f4ec','#eef2f4','ほぼ無色','LED蛍光体・セラミックス','Ho、Dy',0],
['La','ランタン','La₂O₃','#f2f0e8','#eef3f0','ほぼ無色','光学ガラス・触媒','Ce、Pr',0],
['Ce','セリウム','CeO₂','#f3e6a0','#f0f0e0','ほぼ無色','ガラス研磨剤・排ガス触媒','La、Pr',1],
['Pr','プラセオジム','Pr₆O₁₁','#4a3524','#9fd48a','緑色','磁石・着色ガラス','Ce、Nd',1],
['Nd','ネオジム','Nd₂O₃','#b7c4e6','#c9a8e0','紫がかったピンク色','ネオジム磁石','Pr、Sm',0],
['Pm','プロメチウム','Pm₂O₃','#f2d9d0','#f3c9c9','淡いピンク色','夜光塗料・原子力電池','Nd、Sm',0],
['Sm','サマリウム','Sm₂O₃','#f3ebc4','#f5ecb0','淡い黄色','サマリウムコバルト磁石','Nd、Eu',0],
['Eu','ユウロピウム','Eu₂O₃','#f5e6ea','#f4e4e8','ほぼ無色（ごく淡いピンク）','赤色蛍光体','Sm、Gd',0],
['Gd','ガドリニウム','Gd₂O₃','#f4f4f0','#eef0f4','無色','MRI造影剤','Eu、Tb',0],
['Tb','テルビウム','Tb₄O₇','#5b4030','#f5dfe6','ごく淡いピンク色','磁石の耐熱化・緑色蛍光体','Gd、Dy',1],
['Dy','ジスプロシウム','Dy₂O₃','#efe9cf','#e6d765','淡い黄緑色','ネオジム磁石の耐熱化','Tb、Ho',0],
['Ho','ホルミウム','Ho₂O₃','#f2dfa6','#f3d9a0','淡い黄色','レーザー・磁性材料','Dy、Er',0],
['Er','エルビウム','Er₂O₃','#f0c8d2','#f3b8cc','ピンク色','光ファイバー増幅器','Ho、Tm',0],
['Tm','ツリウム','Tm₂O₃','#e4f0e4','#cfe9d4','淡い緑色','携帯型X線源','Er、Yb',0],
['Yb','イッテルビウム','Yb₂O₃','#f4f4ee','#eef2f0','無色','ファイバーレーザー','Tm、Lu',0],
['Lu','ルテチウム','Lu₂O₃','#f4f4f0','#eef0f4','無色','PET用シンチレータ','Yb、Tm',0]
].map(a=>({s:a[0],jp:a[1],o:a[2],ox:a[3],sol:a[4],col:a[5],use:a[6],nb:a[7],hi:a[8]}));
let E=ELS[11], ORD='ingot';
function tip1(){ return E.hi ? `${E.o}のような高次酸化物は塩酸だけでは溶けにくく、過酸化水素などの還元剤で3価にして溶かします。溶液は${E.col}。` : `${E.o} + 6HCl → 2${E.s}Cl₃ + 3H₂O。酸化物が溶けて、${E.col}の塩化${E.jp}溶液になります。`; }
const OT=()=>ORD==='ingot'?'インゴット':'酸化物の粉';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let timers=[], rafs=[], keyFn=null, R;
function cleanup(){ stopLoops(); timers.forEach(clearInterval); rafs.forEach(cancelAnimationFrame); timers=[]; rafs=[]; if(keyFn){removeEventListener('keydown',keyFn);keyFn=null;} }
function say(h){ $('#say').innerHTML=h; }

function powder(c,l){ return `<svg viewBox="0 0 120 70"><path d="M2 69Q28 64 42 36Q60 2 78 36Q92 64 118 69Z" fill="${c}" stroke="#8a7f66" stroke-width="2"/><g fill="#8a7f6688"><circle cx="50" cy="50" r="2"/><circle cx="70" cy="46" r="2"/><circle cx="60" cy="30" r="1.6"/><circle cx="40" cy="62" r="2"/><circle cx="84" cy="60" r="2"/></g><text x="60" y="66" font-size="9" text-anchor="middle" fill="#fff" stroke="#333" stroke-width=".4" font-weight="bold">${l}</text></svg>`; }
function powderBig(q){ return `<div class="ing" style="width:170px;transform:scale(${.6+.4*q})">${powder(E.ox,E.o)}</div>`; }
function ingot(q){ const c=q>.7?['#f4f6f8','#aab2ba','#7d868f']:['#d8d2c4','#9a9488','#6f695d'];
 return `<svg class="ing" viewBox="0 0 160 90" style="transform:scale(${.6+.4*q})"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset=".5" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient></defs>
 <polygon points="34,14 126,14 148,42 12,42" fill="${c[0]}" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
 <polygon points="12,42 148,42 140,78 20,78" fill="url(#ig)" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
 <path d="M40 22L70 22M24 50L48 50" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
 <text x="80" y="66" font-size="14" text-anchor="middle" font-weight="900" fill="#333">${E.s}</text></svg>`; }

function newRound(){ E=ELS[Math.floor(Math.random()*ELS.length)]; ORD=Math.random()<.5?'ingot':'oxide'; R={q1:0,q2:0,purity:70,q4:0,perfect:0,good:0};
  $('#order').innerHTML=`<div class="sw">${charHtml()}</div><div><b>${E.jp}（${E.s}）</b>の<b>${OT()}</b>、頼むよ！<small>主な用途：${E.use}</small></div>`; s1(); }

// ===== 一の型：酸浸出 =====
function s1(){
  cleanup();
  const T=40+Math.floor(Math.random()*31); let p=0, on=false;
  say(`いらっしゃい！ご注文は<b>${E.jp}</b>の<b>${OT()}</b>だな。まずは<b>酸浸出</b>、${E.o}の粉に塩酸をかけて溶かすぜ。<b>ちょうど溶けきる量</b>で止めな！${E.s==='Pm'?'<br>※プロメチウムは放射性で自然界にほぼ無い幻の元素。ゲームだから特別に仕入れたぜ！':''}`);
  $('#main').innerHTML=`<div class="card"><div class="ttl">一の型　酸浸出（粉をスープに溶かす）</div>
  <div class="sub">ボタン長押しで塩酸を注ぎ、目標ラインで離す。少ないと溶け残り、多いと酸のムダ。</div>
  <div class="stage"><div class="bottle">🧴</div><div class="bk" id="bk"><div class="st" id="st"></div><div class="tl" style="bottom:calc(${T}% - 1px)"><span>目標</span></div><div class="lq" id="lq" style="background:${E.sol}"></div><div class="pw" id="pw">${powder(E.ox,E.o)}</div></div></div>
  <div class="fb" id="fb">現在 0%</div><button class="btn" id="pb">塩酸を注ぐ（長押し）</button>
  <div class="tip">${tip1()}</div></div>`;
  const upd=()=>{ $('#lq').style.height=p+'%'; $('#pw').style.transform=`scale(${1},${clamp(1-p/T,0,1)})`; $('#pw').style.opacity=p>=T?0:1; $('#st').style.height=(100-p)+'%'; $('#fb').textContent='現在 '+Math.floor(p)+'%'; };
  const b=$('#pb');
  b.onpointerdown=e=>{ e.preventDefault(); if(on||R.done1)return; on=true; playPour(); $('#st').style.opacity=1; timers.push(setInterval(()=>{ if(p<100){p+=.8;upd();} },30)); };
  const end=()=>{ if(!on)return; on=false; cleanup(); $('#st').style.opacity=0; R.done1=1;
    const d=p-T; R.q1=Math.pow(clamp(1-Math.max(0,Math.abs(d)-3)/16,0,1),1.5);
    const m=Math.abs(d)<=3?'🎯 ぴったり！最高判定！粉が溶けきった！':d<0?'💦 溶け残りだ…収率ダウン':'🧪 酸が余った…中和のコストが増えるぞ';
    $('#fb').textContent=m; setTimeout(s2,1300); };
  b.onpointerup=end; b.onpointerleave=end; b.onpointercancel=end;
}

// ===== 二の型：溶媒抽出（混合） =====
function s2(){
  cleanup(); R.done1=0;
  let prog=0, left=6;
  say(`次は<b>溶媒抽出</b>。水溶液に有機溶媒（抽出剤）を混ぜて、${E.s}を油の層へ引っ張り出す。<b>6秒で激しく混ぜろ！</b>`);
  $('#main').innerHTML=`<div class="card"><div class="ttl">二の型　溶媒抽出（スープと油を混ぜる）</div>
  <div class="sub">連打で撹拌！ ${E.s}が水相から有機相へ移っていく。</div>
  <div class="meter"><i id="tf"></i></div>
  <div class="tank" id="tk"><div class="og" id="og"></div><div class="aq" id="aq" style="background:${E.sol}"></div><div class="pad"></div><div class="blade"><i></i><i></i></div><div class="lb" style="top:4px">有機相（油）</div><div class="lb" style="bottom:4px">水相（酸のスープ）</div></div>
  <div class="fb" id="fb">移行 0%　残り 6.0秒</div><button class="btn" id="mb">激まぜ！</button>
  <div class="tip">実際は有機溶媒（P507やPC-88Aなど）を灯油で希釈し、水相と混ぜて元素ごとの親和性の差で分けます。混ぜた後は静置して2層に分けます。</div></div>`;
  const upd=()=>{ $('#og').style.opacity=.25+.7*prog/100; $('#aq').style.opacity=.95-.7*prog/100; $('#fb').textContent=`移行 ${Math.floor(prog)}%　残り ${left.toFixed(1)}秒`; $('#tf').style.width=left/6*100+'%'; };
  let fin=false; const done=()=>{ if(fin)return; fin=true; cleanup();
    R.q2= prog>=100 ? .55+.45*clamp(left/2.5,0,1) : prog/100*.35; R.q2=clamp(R.q2,0,1);
    $('#fb').textContent= prog>=100?'✨ よく混ざった！':'⏰ 混ぜ足りない…抽出率が下がった'; setTimeout(s3,1100); };
  timers.push(setInterval(()=>{ left=Math.max(0,left-.1); prog=Math.max(0,prog-.9); upd(); if(left<=0)done(); },100));
  $('#mb').onpointerdown=e=>{ e.preventDefault(); if(fin)return; stirTap(); prog=Math.min(100,prog+6); upd(); if(prog>=100)done(); };
}

// ===== 三の型：多段分離（ミキサーセトラー） =====
function s3(){
  cleanup();
  const N=12, W=Math.min(440,$('.wrap').clientWidth)-40, SPD=210;
  let purity=60+20*R.q2, idx=0, resolved=0, notes=[], last=performance.now();
  for(let i=0;i<N;i++) notes.push({t:Math.random()<.5?'mix':'set',x:W+30+i*115,el:null,dead:false});
  say(`肝心の<b>多段分離</b>だ！${E.s}の隣の元素（${E.nb}など）は性質がそっくりで、1回じゃ分けきれねぇ。<b>混ぜて、静めて</b>を何段も繰り返して純度を上げるんだ！`);
  $('#main').innerHTML=`<div class="card"><div class="ttl">三の型　多段分離（ミキサーセトラー）</div>
  <div class="sub">オレンジの「まぜ」(F/D)と青緑の「しずめ」(J/K)。黄色い枠に重なったら押せ！</div>
  <div class="pur" id="pu"></div><div class="cells" id="cl">${'<i></i>'.repeat(N)}</div>
  <div class="lane" id="ln"><div class="jc"></div></div><div class="fb" id="fb">&nbsp;</div>
  <div class="row"><button class="btn" id="bd">まぜ</button><button class="btn blue" id="bk2">しずめ</button></div>
  <div class="tip">1段ごとに少しずつ純度が上がります。実際の工場では数十〜数百段を連ねたカスケードで、99.9%以上に仕上げます。</div></div>`;
  const ln=$('#ln'), cells=[...document.querySelectorAll('#cl i')];
  notes.forEach(n=>{ const e=document.createElement('div'); e.className='nt '+n.t; e.textContent=n.t==='mix'?'まぜ':'しずめ'; ln.appendChild(e); n.el=e; });
  const showP=()=>{ $('#pu').textContent='純度 '+purity.toFixed(2)+'%'; }; showP();
  function judge(n,k){ // k: perfect/good/miss
    n.dead=true; n.el.style.display='none'; resolved++;
    const f={perfect:.62,good:.85,miss:1.04}[k]; purity=clamp(100-(100-purity)*f,40,99.99); if(k==='perfect')R.perfect++; if(k==='good')R.good++;
    cells[idx].className={perfect:'p',good:'o',miss:'m'}[k]; idx++;
    $('#fb').textContent={perfect:'✨ 完璧！',good:'👍 よし',miss:'💦 ミス…'}[k]; showP();
    if(resolved>=N){ cancelAll(); R.purity=purity; setTimeout(s4,900); }
  }
  function cancelAll(){ rafs.forEach(cancelAnimationFrame); rafs=[]; }
  function hit(type){ if(type==='mix')playFile('SE_pappa.mp3');else synthSet(); let best=null,bd=999; notes.forEach(n=>{ if(n.dead)return; const d=Math.abs(n.x+23-66); if(d<bd){bd=d;best=n;} });
    if(!best||bd>55)return; if(best.t!==type)return judge(best,'miss'); judge(best,bd<=26?'perfect':'good'); }
  function loop(now){ const dt=(now-last)/1000; last=now;
    notes.forEach(n=>{ if(n.dead)return; n.x-=SPD*dt; n.el.style.transform=`translateX(${n.x}px)`; n.el.style.left=0; if(n.x+23<66-56) judge(n,'miss'); });
    if(resolved<N) rafs.push(requestAnimationFrame(loop)); }
  rafs.push(requestAnimationFrame(loop));
  $('#bd').onpointerdown=e=>{e.preventDefault();hit('mix');}; $('#bk2').onpointerdown=e=>{e.preventDefault();hit('set');};
  keyFn=e=>{ if('fd'.includes(e.key.toLowerCase()))hit('don'); if('jk'.includes(e.key.toLowerCase()))hit('ka'); }; addEventListener('keydown',keyFn);
}

// ===== 四の型：金属還元・インゴット =====
function s4(){
  cleanup();
  const c=.25+Math.random()*.5, hw=.06; let pos=0,dir=1,stopped=false,last=performance.now();
  say(ORD==='ingot'?'溶液から<b>シュウ酸塩で沈殿</b>させ、焼いて酸化物に戻したら、最後は<b>金属還元</b>！炉の温度ぴったりで<b><ruby>鋳込<rt>いこ</rt></ruby>む</b>んだ！<ruby>鋳込<rt>いこ</rt></ruby>むってのは、型に入れて冷やし固めることだぜ！':'溶液に<b>シュウ酸</b>を入れて沈殿させ、ろ過して<b><ruby>焙焼<rt>ばいしょう</rt></ruby></b>すれば酸化物の粉の出来上がりだ！炉の温度を見極めな！');
  $('#main').innerHTML=`<div class="card"><div class="ttl">${ORD==='ingot'?'四の型　金属還元（インゴットに仕上げる）':'四の型　沈殿と<ruby>焙焼<rt>ばいしょう</rt></ruby>（粉に仕上げる）'}</div>
  <div class="sub">温度メーターが緑のゾーンに来たら${ORD==='ingot'?'「<ruby>鋳込む<rt>いこむ</rt></ruby>」':'「<ruby>焙焼<rt>ばいしょう</rt></ruby>完了」'}！</div>
  <div class="gauge"><div class="zone" style="left:${(c-hw)*100}%;width:${hw*200}%"></div><div class="mk" id="mk"></div></div>
  <div id="ig" style="min-height:96px;font-size:2.4rem;padding-top:20px">🔥</div>
  <div class="fb" id="fb">低温 ⇄ 高温</div><button class="btn" id="cb">${ORD==='ingot'?'<ruby>鋳込む<rt>いこむ</rt></ruby>！':'<ruby>焙焼<rt>ばいしょう</rt></ruby>完了！'}</button>
  <div class="tip">${ORD==='ingot'?'<b><ruby>鋳込む<rt>いこむ</rt></ruby></b>＝溶けた金属を<b>型に入れて冷やし固めること</b>です。精製した酸化物はフッ化物にして金属カルシウムで還元するか、溶融塩電解で金属にします。':'希土類はシュウ酸塩として沈殿します。ろ過・洗浄して900℃前後で<ruby>焙焼<rt>ばいしょう</rt></ruby>すると酸化物の粉になります。'}${E.s}の主な用途：${E.use}。</div></div>`;
  function loop(now){ const dt=(now-last)/1000; last=now; pos+=dir*dt*1.25; if(pos>1){pos=1;dir=-1;} if(pos<0){pos=0;dir=1;} $('#mk').style.left=pos*97+'%'; if(!stopped)rafs.push(requestAnimationFrame(loop)); }
  rafs.push(requestAnimationFrame(loop));
  $('#cb').onpointerdown=e=>{ e.preventDefault(); if(stopped)return; stopped=true; cleanup(); playFile('SE_kirakira.mp3');
    const d=Math.abs(pos-c); R.q4=clamp(1-Math.max(0,d-hw*.6)/.2,0,1);
    $('#ig').innerHTML=ORD==='ingot'?ingot(R.q4):powderBig(R.q4); $('#ig').style.fontSize='1rem'; $('#fb').textContent=R.q4>.8?'✨ 見事な光沢！':'🌡 温度がズレて品質ダウン';
    setTimeout(result,1500); };
}

// ===== 結果 =====
function result(){
  cleanup(); playFile('SE_baikyaku.mp3');
  const q3=(R.perfect+.75*R.good)/12;
  const total=.25*R.q1+.2*R.q2+.35*q3+.2*R.q4;
  const rank=total>=.88?'S':total>=.7?'A':total>=.5?'B':'C';
  const m=ORD==='ingot'?1.3:1; const g=Math.round((15+150*total*total)*m), e=RE.capExp(reGS(),Math.round((5+30*total*total)*m),0.15);
  addReward(g,e);
  const word={S:'極上！こりゃ店の看板だ！',A:'いい仕事だ。また頼むぜ',B:'まずまずだな。次は純度を上げよう',C:'まだ修行が足りねぇな…品質も報酬もイマイチだ'}[rank];
  say(word);
  $('#main').innerHTML=`<div class="card"><div class="ttl">ご注文の品、納品！</div><div class="sub">${E.jp}（${E.s}）の${OT()}</div>${ORD==='ingot'?ingot(total):powderBig(total)}
  <div class="rank">${rank}</div>
  <div class="res">酸浸出 ${Math.round(R.q1*100)}点 ／ 溶媒抽出 ${Math.round(R.q2*100)}点<br>多段分離 ${Math.round(q3*100)}点（純度 ${R.purity.toFixed(2)}%） ／ ${ORD==='ingot'?'還元':'<ruby>焙焼<rt>ばいしょう</rt></ruby>'} ${Math.round(R.q4*100)}点<hr style="border:0;border-top:1px dashed #6b4423;margin:6px 0">
  報酬 <span class="g">+${g} G</span>　経験値 <span class="e">+${e} EXP</span></div>
  <button class="btn" onclick="newRound()">もう一杯、仕込む！</button>
  <div class="row" style="margin-top:8px"><a class="btn wood" style="text-decoration:none;font-size:.9rem" href="home.html">🏠 ホームへ</a><a class="btn wood" style="text-decoration:none;font-size:.9rem" href="map.html">🗺 マップへ</a></div></div>`;
}


// ===== キャラ画像・サウンド設定 =====
const CHAR_SRC=sym=>`chara0_${sym}.png`;   // 各元素キャラPNGの置き場所（例: chars/Nd.png）
const BGM_FILES=['BGM_ramen.ogg','BGM_ramen.mp3'];   // BGMファイル（対応しているブラウザ向けの形式を自動選択。無い形式は無視されます）
const RAW='https://raw.githubusercontent.com/rareearthzukan/raregame/main/';
const DY_IMG=document.querySelector('.chef img').src;
function charFail(i,sym){ if(sym==='Dy'&&!i.dataset.f){ i.dataset.f=1; i.src=DY_IMG; } else i.outerHTML=sym; }
function charHtml(){ return `<img src="${CHAR_SRC(E.s)}" alt="${E.s}" onerror="charFail(this,'${E.s}')">`; }
// ループ系効果音（塩酸を注ぐ／激まぜ）
let sePour=null, seStir=null, stirT=null, bladeT=null;
function playPour(){ if(muted)return; if(!sePour){ sePour=mkAudio('SE_sosogu.mp3'); sePour.loop=true; sePour.volume=.8; } try{ sePour.currentTime=0; }catch(e){} sePour.play().catch(()=>{}); }
function stirTap(){
  const bl=document.querySelector('.tank .blade'); if(bl) bl.style.animationDuration='.22s';
  clearTimeout(bladeT); bladeT=setTimeout(()=>{ const b=document.querySelector('.tank .blade'); if(b) b.style.animationDuration='1.8s'; },400);
  if(muted)return;
  if(!seStir){ seStir=mkAudio('SE_kakuhan.mp3'); seStir.loop=true; seStir.volume=.8; }
  if(seStir.paused) seStir.play().catch(()=>{});
  clearTimeout(stirT); stirT=setTimeout(()=>{ seStir.pause(); },450);
}
function stopLoops(){ try{ if(sePour)sePour.pause(); if(seStir)seStir.pause(); }catch(e){} clearTimeout(stirT); clearTimeout(bladeT); }
let muted=false; try{ muted=localStorage.getItem('rareMute')==='1'; }catch(e){}
let bgm=null, ac=null;
function mkAudio(name){ const a=new Audio(name); a.addEventListener('error',()=>{ console.warn('音声の読み込みに失敗:',a.src); if(!a.dataset.fb){ a.dataset.fb=1; a.src=RAW+name; a.play().catch(()=>{}); } }); return a; }
function playFile(name,vol=.8){ if(muted)return; try{ const a=mkAudio(name); a.volume=vol; a.play().catch(()=>{}); }catch(e){} }
function synthSet(){ if(muted)return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const t=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(130,t+.18);
  g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.26);
  const o2=ac.createOscillator(), g2=ac.createGain(); o2.type='triangle'; o2.frequency.setValueAtTime(900,t+.05); o2.frequency.exponentialRampToValueAtTime(300,t+.16);
  g2.gain.setValueAtTime(.0001,t); g2.gain.setValueAtTime(.22,t+.05); g2.gain.exponentialRampToValueAtTime(.001,t+.2); o2.connect(g2); g2.connect(ac.destination); o2.start(t+.05); o2.stop(t+.22); }catch(e){} }
function pickBgm(){ const a=new Audio();
  const ok=f=>{ const e=f.split('.').pop().toLowerCase();
    if(e==='ogg') return a.canPlayType('audio/ogg; codecs=vorbis')||a.canPlayType('audio/ogg; codecs=opus');
    return a.canPlayType({mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav'}[e]||''); };
  return BGM_FILES.find(ok)||BGM_FILES[0]; }
// 自動再生制限対策：タップ/クリック/キー操作のたびに、鳴っていなければ再生を試す
let started=false;
function tryBgm(){ if(!started||!BGM_FILES.length||muted)return;
  if(!bgm){ bgm=mkAudio(pickBgm()); bgm.loop=true; bgm.volume=.35; }
  if(!bgm.paused)return; bgm.play().catch(()=>{}); }
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,tryBgm,{passive:true}));
function paintMute(){ $('#mt').textContent=muted?'🔇':'🔊'; }
$('#mt').onclick=()=>{ muted=!muted; try{localStorage.setItem('rareMute',muted?'1':'0');}catch(e){} if(muted)stopLoops(); if(muted){ if(bgm)bgm.pause(); } else tryBgm(); paintMute(); };
paintMute();
showBar();
// ===== 開始画面：ボタンを押してからゲーム＆BGM開始 =====
(function(){
  const G=[['今日も、作っていくかい？','作る！'],['まいど！中に入んな','入る'],['へいらっしゃい！いい粉入ってるよ','仕込む！'],['おう、今日も来たな！','暖簾をくぐる']];
  const g=G[Math.floor(Math.random()*G.length)];
  $('#introSay').textContent=g[0]; $('#introBtn').textContent=g[1]; $('#introImg').src=DY_IMG;
  $('#introBtn').onclick=()=>{
    started=true; tryBgm();
    // 効果音を先に読み込んでおく（最初の1回目から確実に鳴らすため）
    sePour=mkAudio('SE_sosogu.mp3'); sePour.loop=true; sePour.volume=.8; sePour.preload='auto'; sePour.load();
    seStir=mkAudio('SE_kakuhan.mp3'); seStir.loop=true; seStir.volume=.8; seStir.preload='auto'; seStir.load();
    ['SE_pappa.mp3','SE_kirakira.mp3','SE_baikyaku.mp3'].forEach(n=>{ const a=new Audio(n); a.preload='auto'; a.load(); });
    const o=$('#intro'); o.style.opacity=0; setTimeout(()=>o.remove(),450);
    newRound();
  };
})();
</script>
