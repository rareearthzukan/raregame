<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>レアアース・クラフト - マイホーム</title>
<style>
:root{--maxw:720px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:clamp(14px,min(calc(12px + 1.1vw),3.2vh),21px);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b1224;color:var(--text,#1e293b);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::-webkit-scrollbar{width:.6rem;height:.6rem}
::-webkit-scrollbar-thumb{background:var(--accent,#3b82f6);border-radius:1rem}
.phone{position:fixed;inset:0;width:100%;max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0);
  box-shadow:0 0 0 1px var(--line),0 0 40px rgba(0,0,0,.6);transition:background .3s}
@media (orientation:landscape) and (min-width:700px){:root{--maxw:1200px}}

.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--card);border-bottom:2px solid var(--line);
  padding:calc(.4rem + env(safe-area-inset-top,0)) .6rem .4rem;font-size:.78rem;font-weight:bold}
.bgm-btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:1rem;padding:.25rem .6rem;min-height:1.8rem;font-size:.75rem;cursor:pointer;font-family:inherit}
.bgm-btn.muted{border-color:#e94560;color:#e94560}
.status{display:flex;gap:.4rem;padding:.4rem .6rem;flex-shrink:0;border-bottom:1px solid var(--line);background:var(--card)}
.badge{flex:1;text-align:center;border:1px solid var(--line);border-radius:.5rem;padding:.25rem;font-size:.7rem;font-weight:bold;color:var(--accent)}

.content{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem;padding:.6rem .7rem;overflow-y:auto;overscroll-behavior:contain}
@media (orientation:landscape) and (min-width:700px){
  .content{display:grid;grid-template-columns:1.3fr 1fr;align-items:stretch}
  .menu{min-height:0}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .6rem;font-size:.8rem}

.stage{position:relative;width:100%;aspect-ratio:4/3.2;overflow:hidden;border-radius:.8rem;flex-shrink:0;
  border:.18rem solid var(--line);box-shadow:inset 0 0 2.5rem rgba(0,0,0,.18);container-type:inline-size}
.layer{position:absolute;inset:0}
.wall{height:64%;background:var(--wall)}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 25% 20%,rgba(255,255,230,.35),transparent 55%)}
.win{position:absolute;left:10%;top:16%;width:24%;height:36%;border:.28rem solid var(--base);border-radius:.3rem .3rem 0 0;z-index:1;
  background:linear-gradient(var(--base),var(--base)) 50% 0/.2rem 100% no-repeat,linear-gradient(var(--base),var(--base)) 0 50%/100% .2rem no-repeat,linear-gradient(180deg,#bfe3f7,#eaf7ff);
  box-shadow:0 .25rem .8rem rgba(0,0,0,.15)}
.floor{position:absolute;left:0;right:0;top:64%;bottom:0;background:var(--floor);border-top:.35rem solid var(--base);box-shadow:inset 0 .8rem 1rem -.5rem rgba(0,0,0,.28)}
#garden{display:none;background:var(--garden)}
#objs{z-index:5}
.door{position:absolute;left:60%;bottom:0;width:19%;height:74%;background:var(--door);border:.25rem solid var(--base);border-bottom:0;border-radius:.3rem .3rem 0 0;box-shadow:inset 0 0 0 .35rem var(--door2),.2rem 0 .6rem rgba(0,0,0,.18);z-index:1;display:none}
.door::after{content:"";position:absolute;right:10%;top:55%;width:.55rem;height:.55rem;border-radius:50%;background:var(--knob);box-shadow:0 .1rem .2rem rgba(0,0,0,.35)}
.flat .wall::after{display:none}.flat .floor{box-shadow:none}

.obj{position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab;z-index:5}
.obj:active{cursor:grabbing;filter:brightness(1.05)}
.obj img{width:100%;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 .3rem .4rem rgba(0,0,0,.28))}
.obj .ph{display:flex;flex-direction:column;align-items:center;font-size:7cqw;line-height:1.1;text-align:center;filter:drop-shadow(0 .2rem .3rem rgba(0,0,0,.3))}
.obj .ph small{font-size:.55rem;background:rgba(0,0,0,.55);color:#fff;border-radius:.4rem;padding:0 .3rem}

/* キャラクター専用バッジ（お仕事アイコン） */
.chara-badge{position:absolute;top:-10px;right:-10px;background:#10b981;color:#fff;font-size:.55rem;padding:2px 5px;border-radius:10px;font-weight:bold;border:1px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3)}

.controls{position:absolute;top:.4rem;left:.4rem;right:.4rem;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:.3rem;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.25rem .4rem;opacity:.94}
.controls b{font-size:.7rem}.dirs{margin-left:auto;display:flex;gap:.2rem}
.dir{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:.4rem;min-width:1.7rem;min-height:1.6rem;font-size:.68rem;font-weight:bold;cursor:pointer;font-family:inherit}
.dir.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}

.menu{flex:1;display:flex;flex-direction:column;min-height:14rem}
.tabs{display:flex;gap:.2rem;margin-bottom:.4rem}
.tab{flex:1;min-height:2rem;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:.5rem;font-size:.68rem;font-weight:bold;cursor:pointer;font-family:inherit;padding:0}
.tab.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.list{flex:1;min-height:0;display:none;flex-direction:column;gap:.4rem;overflow-y:auto}
.list.on{display:flex}
.item{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:.6rem;padding:.4rem .5rem;background:var(--item)}
.item.own{opacity:.8}
.item .nm{flex:1;font-weight:bold;font-size:.78rem}
.item .nm small{display:block;font-weight:normal;font-size:.65rem;opacity:.7}
.swatch{width:2.2rem;height:2.2rem;border-radius:.4rem;border:1px solid var(--line);flex-shrink:0;overflow:hidden;display:flex;flex-direction:column}
.swatch i{flex:1.4}.swatch i+i{flex:1}
.btn{background:var(--accent);color:var(--onaccent);border:none;border-radius:.6rem;min-height:2rem;padding:.3rem .8rem;font-size:.72rem;font-weight:bold;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.done{background:#10b981;color:#fff;cursor:default}
.guide{display:flex;gap:.5rem;align-items:flex-start;border:1px solid var(--line);border-radius:.7rem;padding:.4rem;font-size:.7rem;line-height:1.45}
.guide img{width:2.6rem;height:2.6rem;border-radius:50%;object-fit:contain;background:#fff;flex-shrink:0}
textarea{width:100%;height:5rem;font-size:.65rem;border:1px solid var(--line);border-radius:.5rem;padding:.4rem;resize:none;background:var(--item);color:var(--text);font-family:inherit;-webkit-user-select:text;user-select:text}

.nav{display:flex;gap:.3rem;flex-shrink:0;background:var(--card);border-top:2px solid var(--line);padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom,0))}
.nav div{flex:1;min-height:3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;border:1px solid var(--line);border-radius:.7rem;font-size:.72rem;font-weight:bold;cursor:pointer;opacity:.75}
.nav div.on{opacity:1;color:var(--accent);border-color:var(--accent)}
.nav span{font-size:1.15rem;line-height:1}

#toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0));transform:translate(-50%,1rem);background:#1e293b;color:#fff;border-radius:1.5rem;padding:.5rem 1rem;font-size:.75rem;font-weight:bold;z-index:300;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

.overlay{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(10,15,30,.7);z-index:200;padding:1rem}
.modal{background:#1e293b;color:#fff;border:2px solid var(--accent);border-radius:1rem;padding:1.1rem;width:100%;max-width:24rem;text-align:center}
.modal h3{margin:0 0 .4rem;font-size:1rem}.modal p{margin:0 0 .8rem;font-size:.8rem;line-height:1.5;text-align:left}
.modal .row{display:flex;gap:.5rem;margin-top:.8rem}.modal .row .btn{flex:1}
</style>
</head>
<body>
<audio id="bgm" src="BGM_room.ogg" loop preload="auto"></audio>
<audio id="se-unlock" src="itemget.mp3" preload="auto"></audio>
<audio id="se-gogogo" src="gogogo.mp3" preload="auto"></audio>

<div class="phone" id="phone">
  <div class="header">
    <span>✈️ <span id="miles">0</span> マイル</span>
    <span>💰 <span id="money">0</span> G</span>
    <span>🌟 Lv.<span id="level">1</span></span>
    <button id="bgm-btn" class="bgm-btn" onclick="toggleBGM()">🎵 ON</button>
  </div>
  <div class="status">
    <div class="badge">🏠 居心地 Lv.<span id="roomLevel">1</span></div>
    <div class="badge">✨ 精製ボーナス +<span id="bonus">0</span>%</div>
  </div>

  <div class="content">
    <div class="stage" id="stage">
      <div class="controls">
        <b id="dirTitle">北の壁</b>
        <div class="dirs" style="margin-left:0"><button class="dir" id="undoBtn" onclick="undo()" title="元に戻す">↶</button><button class="dir" id="redoBtn" onclick="redo()" title="やり直す">↷</button><button class="dir" onclick="resetRoom()" title="リセット">🗑️</button></div>
        <div class="dirs" id="dirBtns"></div>
      </div>
      <div id="indoor">
        <div class="layer wall"><div class="win" id="win"></div><div class="door" id="door"></div></div>
        <div class="floor"></div>
      </div>
      <div class="layer" id="garden"></div>
      <div class="layer" id="objs"></div>
    </div>

    <div class="card menu">
      <div class="tabs" id="tabs"></div>
      <div class="list on" id="L-shop"></div>
      <div class="list" id="L-display"></div>
      <div class="list" id="L-theme"></div>
      <div class="list" id="L-music"></div>
      <div class="list" id="L-save">
        <div class="guide"><img src="chara0_Y.png" alt="イットリウム" onerror="this.style.visibility='hidden'">
          <div><b>【イットリウムからのアドバイス】</b><br>普段は<b>自動で保存</b>されるよ！別の端末で遊ぶときや万が一のときだけ「コードコピー」を押してメモ帳に保存してね。</div></div>
        <textarea id="saveCode" placeholder="ここにセーブコードが表示されます / 貼り付けます"></textarea>
        <div style="display:flex;gap:.4rem">
          <button class="btn" style="flex:1" onclick="exportSave()">📋 コードコピー</button>
          <button class="btn" style="flex:1;background:#10b981;color:#fff" onclick="importSave()">📥 コード復元</button>
        </div>
      </div>
    </div>
  </div>

  <div class="nav">
    <div onclick="location.href='map.html'"><span>🗺️</span>マップ</div>
    <div onclick="location.href='seisei.html'"><span>🧪</span>精製</div>
    <div onclick="location.href='factory.html'"><span>🏭</span>工場</div>
    <div onclick="location.href='zukan.html'"><span>📖</span>図鑑</div>
    <div class="on"><span>🏠</span>ホーム</div>
  </div>
</div>

<div id="toast"></div>
<div class="overlay" id="modal"><div class="modal"><h3 id="mTitle"></h3><p id="mDesc"></p>
  <div class="row" id="mRows"><button class="btn" style="background:#94a3b8;color:#fff" onclick="closeModal()">キャンセル</button><button class="btn" id="mOk" style="background:#ef4444;color:#fff">OK</button></div></div></div>

<script>
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));

const IMG_DIR = '';
const furnitureMaster = {

const IMG_PREFIX='home_kagu_';
const MILE_ROWS=[
  ['stool','スツール','🪑',120,0.1,10,88],['cushion','クッション','🟡',80,0.1,8,90],['flower_vase','花瓶','💐',100,0.1,7,70],
  ['nightstand','ナイトテーブル','🛋️',150,0.1,12,86],['wall_clock','壁掛け時計','🕰️',150,0.2,9,38],['wall_art','壁掛けアート','🖼️',180,0.2,14,40],
  ['curtain','カーテン','🪟',200,0.2,22,50],['teddy','テディベア','🧸',200,0.2,9,90],['rug','ラグマット','🟫',250,0.2,32,94],
  ['floor_lamp','フロアライト','💡',300,0.3,9,86],['coffee_table','ローテーブル','🪵',350,0.3,22,90],['mirror','姿見','🪞',300,0.3,10,86],
  ['fan','扇風機','🌀',350,0.4,10,86],['bookshelf','本棚','📚',500,0.5,16,86],['kotatsu','こたつ','🔥',600,0.5,26,92],
  ['wardrobe','クローゼット','🚪',700,0.6,20,86],['bed','ベッド','🛏️',900,0.9,34,90],['aquarium','水槽','🐠',1200,1.0,20,84],
  ['gaming_pc','ゲーミングPC','🖥️',1800,1.6,18,80],['piano','ピアノ','🎹',2000,1.5,30,88]

const GOLD_ROWS=[
  ['bbq','BBQグリル','🍖',10000,0.1,14,88],['robo_cleaner','ロボット掃除機','🤖',12000,0.1,9,92],['chess_table','チェステーブル','♟️',15000,0.1,16,88],
  ['trophy_case','トロフィーケース','🏆',18000,0.2,14,86],['espresso','エスプレッソマシン','☕',20000,0.1,10,76],['vinyl','レコードプレーヤー','💿',25000,0.2,14,80],

  ['wine_cellar','ワインセラー','🍷',70000,0.2,14,86],['sofa_lux','高級レザーソファ','🛋️',80000,0.4,36,92],['library','書斎の大書棚','📚',85000,0.3,32,86],

MILE_ROWS.forEach(r=>furnitureMaster[r[0]]={name:r[1],emoji:r[2],cost:r[3],bonus:r[4],size:r[5],x:50,y:r[6],img:IMG_PREFIX+r[0]+'.png'});

const recipes = [
  {id:'lighter',name:'ライター（石）',img:'seihin_raita.png',emoji:'🔥'},
  {id:'headphones',name:'高音質ヘッドホン',img:'seihin_hedohon.png',emoji:'🎧'},
  {id:'led',name:'省エネLEDライト',img:'seihin_led.png',emoji:'💡'},

  {id:'pc',name:'次世代ノートパソコン',img:'seihin_pasokon.png',emoji:'💻'}

const PROD_SIZE = 12;

const bgmMaster = {
  room:{name:'マイホーム基本BGM',file:'BGM_room.ogg'}, map:{name:'世界マップBGM',file:'BGM_map.ogg'},
  seisei:{name:'元素精製プラントBGM',file:'BGM_seisei.ogg'}, factory:{name:'製造工場BGM',file:'BGM_koujyo.ogg'},
  mine:{name:'採掘場BGM (陸上)',file:'BGM_mine.ogg'}, siwake:{name:'リサイクル工場BGM',file:'BGM_siwake.ogg'},
  hinan:{name:'緊急避難訓練BGM',file:'BGM_hinan.ogg'}, karaoke:{name:'カラオケイベントBGM',file:'karaoke.ogg'}
};

const GARDEN_DEFAULT = `radial-gradient(ellipse 14% 6% at 20% 14%,#fff 60%,transparent 62%),radial-gradient(ellipse 18% 7% at 72% 22%,#fff 60%,transparent 62%),repeating-linear-gradient(90deg,#f5e9d3 0 1.4%,#e9d7b6 1.4% 1.8%) 0 52%/100% 12% no-repeat,linear-gradient(180deg,#7cc4ef 0%,#d8f0fb 52%,#7fcf6b 52%,#4aa84a 100%)`;
const wallBg = (c,pat,wain,rail)=>`linear-gradient(180deg,transparent 74%,${rail} 74% 77%,${wain} 77%),${pat},${c}`;
const planks = (a,b,seam)=>`repeating-linear-gradient(90deg,${seam} 0 .1rem,transparent .1rem 2rem),linear-gradient(180deg,${a},${b})`;

const tiles  = (a,b)=>`conic-gradient(${a} 25%,${b} 0 50%,${a} 0 75%,${b} 0) 0 0/16% 38%`;
const themesMaster = {
  natural:{name:'🌿 ナチュラル（白木と生成り）', wall:wallBg('#f3ead9','repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1.1rem,transparent 1.1rem 2.2rem)','#e4d3b4','#fffaf0'),
    base:'#fffaf0', floor:planks('#d9b382','#c4965f','rgba(90,55,20,.28)'), floorH:planksH('#d9b382','#c4965f','rgba(90,55,20,.28)'), bg:'#f6f1e7', card:'#fffdf8', text:'#4a3f33', line:'#e0d3bd', accent:'#6f9a6b', item:'#faf5ea', onaccent:'#fff'},

function charaCount(lv){ return Math.min(17, lv<3?1:lv<5?2:lv<8?3:4+Math.floor((lv-8)/3)); }
function nextCharaText(){
  const n=charaCount(gameState.level); if(n>=17) return '🎉 全キャラクターが揃いました！';
  let lv=gameState.level+1; while(charaCount(lv)<=n) lv++; return `🔒 次のキャラクターは Lv.${lv} で登場！`;
}

function syncCrafted(){
  if(!gameState.crafted) gameState.crafted={}; let ch=false; const p=gameState.products||{};
  recipes.forEach(r=>{ if(p[r.id]>0&&!gameState.crafted[r.id]){ gameState.crafted[r.id]=true; ch=true; } });
  if(ch) save();
}

function ensureCharas(){
  const ids=Object.keys(CHARAS), want=charaCount(gameState.level||1);
  if(!Array.isArray(gameState.charaOwned)) gameState.charaOwned=[];
  
  // エルビウム(Er)が前半7名（または所持数が7未満の段階）に必ず入るようにする制御
  if(!gameState.charaOwned.includes('Er') && want >= 1 && gameState.charaOwned.length < 7) {
    // まだ7人未満の枠でエルビウムが居なければ優先的に追加する確率を高める
    if(Math.random() < 0.5 || want >= 7) {
      gameState.charaOwned.push('Er');
    }
  }

  let added=0;
  while(gameState.charaOwned.length<want){
    const rest=ids.filter(i=>!gameState.charaOwned.includes(i)); if(!rest.length) break;
    // まだEr未所持ならrestからErを選びやすくする
    let id;
    if(!gameState.charaOwned.includes('Er') && rest.includes('Er') && gameState.charaOwned.length < 7) {
      id = 'Er';
    } else {
      id = rest[Math.floor(Math.random()*rest.length)];
    }
    gameState.charaOwned.push(id);
    gameState.placedItems.push({type:'chara',id,dir:0,s:1,x:25+Math.random()*50,y:90}); added++;
  }
  if(added){ save(); setTimeout(()=>toast('🎉 新しい仲間がお部屋に来たよ！'),600); }

  // Lv.6到達時の挨拶＆チュートリアルチェック
  if(gameState.level >= 6 && !gameState.tutorialShown6) {
    gameState.tutorialShown6 = true;
    save();
    setTimeout(() => {
      askModal('🏠 イットリウム＆初期メンバーからの声かけ！',
        `「プレイヤーさん、Lv.6おめでとう！私たち、お部屋や庭に配置して話しかけてくれたら、いつでも<b>『掘削』『精製』『製品製造』</b>のお手伝いをするよ！<br><br>` +
        `お仕事をお願いすると、決まった時間働いてたくさんの資源や製品を持ち帰ってくれるんだ（たまに<b>大生産フィーバー</b>ですごい量が取れることも…!?）。さっそくお部屋のキャラをタップして仕事を頼んでみてね！」`,
        'わかった！', null, '');
    }, 1000);
  }
}

function openCharaTaskModal(id){
  const c = CHARAS[id];
  const task = gameState.charaTasks[id];
  const now = Date.now();

  if(task && task.endTime > now){
    // 労働中の場合
    const leftMin = Math.ceil((task.endTime - now)/60000);
    askModal(`⏳ ${c.name}はお仕事中です`,
      `<div style="text-align:center"><p>${c.desc}</p>` +
      `<p style="color:#00fff5; font-weight:bold">現在のお仕事: ${task.type==='mine'?'⛏️ 掘削':task.type==='refine'?'🧪 精製':'🏭 製品製造'}</p>` +
      `<p>残り時間: 約 <b>${leftMin}分</b></p></div>`,
      '閉じる', null, '');
    return;
  }

  if(task && task.endTime <= now && !task.claimed){
    // 報酬受取可能状態
    claimTaskReward(id);
    return;
  }

  // 新規お仕事選択モーダル
  const canProd = gameState.level >= 12;
  const html = `
    <div style="font-size:0.8rem">
      <p style="margin:0 0 6px">${c.desc}</p>
      <div style="background:rgba(0,0,0,0.3); padding:8px; border-radius:6px; margin-bottom:8px">
        <b>【得意分野】</b> ${c.type==='mine'?'⛏️ 掘削特化':c.type==='refine'?'🧪 精製特化':'🏭 製造バランス型'}<br>
        • 掘削: ${c.mH}時間で <b>${c.mQ}個</b> の泥収集<br>
        • 精製: ${c.rH}時間で <b>${c.rQ}個</b> のレアアース精製<br>
        • 製造(Lv.12~): ${c.pH}時間で <b>${c.pQ}個</b> の製品制作 ${canProd?'':'<span style="color:#f87171">(🔒Lv12未開放)</span>'}
      </div>
      <p style="text-align:center; font-weight:bold; color:#ffde59; margin:4px 0">どのお仕事をお願いする？（10%で大生産フィーバー！）</p>
      <div style="display:flex; gap:4px; flex-direction:column">
        <button class="btn" style="background:#3b82f6" onclick="startCharaTask('${id}','mine')">⛏️ 掘削を頼む (${c.mH}時間 / ${c.mQ}個)</button>
        <button class="btn" style="background:#10b981" onclick="startCharaTask('${id}','refine')">🧪 精製を頼む (${c.rH}時間 / ${c.rQ}個)</button>
        <button class="btn" style="background:${canProd?'#eab308':'#475569'}" ${canProd?'':'disabled'} onclick="startCharaTask('${id}','prod')">🏭 製品製造を頼む (${c.pH}時間 / ${c.pQ}個)</button>
      </div>
    </div>
  `;
  askModal(`🧑 ${c.name}にお仕事をお願いする`, html, 'やめる', null, '');
  // キャンセルボタン等を非表示にして独自ボタンにするため modal row を書き換え
  document.querySelector('#modal .row').innerHTML = `<button class="btn" style="background:#94a3b8;color:#fff;width:100%" onclick="closeModal()">閉じる</button>`;
}

function startCharaTask(id, type){
  const c = CHARAS[id];
  let hours = type==='mine'? c.mH : type==='refine'? c.rH : c.pH;
  // テストや快適なプレイのため、テスト用に時間を短縮したい場合はここを調整可能（現在リアルタイム設定）
  const durationMs = hours * 3600 * 1000; 

  gameState.charaTasks[id] = {
    type: type,
    startTime: Date.now(),
    endTime: Date.now() + durationMs,
    claimed: false,
    hours: hours
  };
  save();
  closeModal();
  toast(`✨ ${c.name}が ${type==='mine'?'掘削':type==='refine'?'精製':'製品製造'} に出発しました！`);
  updateUI();
}

function checkTaskCompletions(){
  const now = Date.now();
  let updated = false;
  for(let id in gameState.charaTasks){
    const task = gameState.charaTasks[id];
    if(task && task.endTime <= now && !task.claimed){
      // 自動受取または通知可能
    }
  }
}

function claimTaskReward(id){
  const c = CHARAS[id];
  const task = gameState.charaTasks[id];
  if(!task) return;

  // 10%の確率で大生産フィーバー (1.5倍〜2倍)
  const isFever = Math.random() < 0.10;
  const mult = isFever ? (1.5 + Math.random()*0.5) : 1.0;

  let baseQ = task.type==='mine'? c.mQ : task.type==='refine'? c.rQ : c.pQ;
  let finalQ = Math.round(baseQ * mult);

  if(task.type === 'mine'){
    gameState.mudStock = (gameState.mudStock || 0) + finalQ;
  } else if(task.type === 'refine'){
    // レアアース元素ストックへ加算（簡易的にmoneyかランダム元素、今回はmoneyまたは共通レアアース加算として泥から精製品に）
    gameState.money = (gameState.money || 0) + finalQ * 250; 
  } else {
    // 製品製造
    const rId = recipes[Math.floor(Math.random()*recipes.length)].id;
    gameState.products[rId] = (gameState.products[rId] || 0) + finalQ;
  }

  delete gameState.charaTasks[id];
  save();
  closeModal();

  if(isFever){
    askModal(`🔥 大成功！大生産フィーバー発生！！`,
      `<div style="text-align:center"><p style="font-size:2rem">🎉✨</p>` +
      `<p><b>${c.name}</b> の作業が大フィーバー！通常より大量の成果物を持ち帰りました！</p>` +
      `<p style="color:#ffde59; font-size:1.1rem; font-weight:bold">+ ${finalQ} 獲得！</p></div>`,
      'やったね！', null, '');
  } else {
    toast(`🎉 ${c.name}がお仕事を完了して帰ってきました！(+${finalQ})`);
  }
  updateUI();
}


/* renderRoom内でのキャラオブジェクト描画拡張 */
function renderRoom(){
  const box=$('objs'); box.innerHTML='';
  gameState.placedItems.forEach((it,idx)=>{
    if(it.dir!==dir) return;
    let name,src,emoji,size,isChara=false, charaId='';
    if(it.type==='furn'){ const f=furnitureMaster[it.id]; if(!f) return; name=f.name; src=f.img; emoji=f.emoji; size=f.size; }
    else if(it.type==='chara'){
      const c=CHARAS[it.id]; if(!c) return; name=c.name; src=CHARA_PREFIX+it.id+'.png'; emoji='🧪'; size=CHARA_SIZE; isChara=true; charaId=it.id;
    } else { const r=recipes.find(r=>r.id===it.id)||{}; name=r.name||'製品'; src=r.img; emoji=r.emoji; size=PROD_SIZE; }
    it.s=it.s||1;
    const el=document.createElement('div'); el.className='obj';
    el.style.cssText=`left:${it.x}%;top:${it.y}%;width:${size*it.s}%`;
    const im=document.createElement('img'); im.src=IMG_DIR+src; im.alt=name;
    im.onerror=()=>{ im.remove(); el.innerHTML=`<div class="ph">${emoji||'📦'}<small>${name}</small></div>`; };
    el.appendChild(im);

    // キャラクターの場合、作業状態や完了アイコンをバッジ表示
    if(isChara){
      const task = gameState.charaTasks[charaId];
      const now = Date.now();
      let badgeText = '💬 お仕事';
      let badgeBg = '#3b82f6';
      if(task){
        if(task.endTime <= now){ badgeText = '✨ 完了！'; badgeBg = '#f59e0b'; }
        else { badgeText = '⏳ 作業中'; badgeBg = '#64748b'; }
      }
      const badge = document.createElement('div');
      badge.className = 'chara-badge';
      badge.style.background = badgeBg;
      badge.innerText = badgeText;
      el.appendChild(badge);
    }

    drag(el,it,idx,name,size,isChara,charaId); box.appendChild(el);
  });
}

function drag(el,it,idx,name,size,isChara,charaId){
  const P=new Map(); let moved=false,tot=0,pre='',d0=1,s0=1,wp='',wt;
  const dist=()=>{ const a=[...P.values()]; return Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)); };
  const setW=()=>{ el.style.width=size*it.s+'%'; };
  const clamp=v=>Math.max(.3,Math.min(3,v));
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); el.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1){ moved=false; tot=0; pre=cur(); } else if(P.size===2){ d0=dist(); s0=it.s; moved=true; } });
  el.addEventListener('pointermove',e=>{
    const p=P.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(P.size>=2){ it.s=clamp(s0*dist()/d0); setW(); return; }
    tot+=Math.abs(dx)+Math.abs(dy); if(tot>6) moved=true;
    const r=$('stage').getBoundingClientRect();
    it.x=Math.max(0,Math.min(100,it.x+dx/r.width*100)); it.y=Math.max(10,Math.min(100,it.y+dy/r.height*100));
    el.style.left=it.x+'%'; el.style.top=it.y+'%';
  });
  const up=e=>{
    if(!P.delete(e.pointerId)||P.size>0) return;
    if(moved){ if(cur()!==pre){ hist(pre); save(); } return; }
    // タップされた場合：キャラクターなら仕事モーダル、家具等なら片付け確認
    if(isChara){
      openCharaTaskModal(charaId);
    } else {
      askModal('レイアウト変更',`「${name}」をお部屋から片付けますか？`,'片付ける',()=>{ hist(); gameState.placedItems.splice(idx,1); save(); updateUI(); toast('📦 片付けました'); });
    }
  };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{ e.preventDefault(); if(!wp) wp=cur();
    it.s=clamp(it.s*(e.deltaY<0?1.08:.93)); setW();
    clearTimeout(wt); wt=setTimeout(()=>{ if(cur()!==wp){ hist(wp); save(); } wp=''; },400); },{passive:false});
}

function row(thumb,name,sub,btn){ return `<div class="item ${btn.own?'own':''}">${thumb}<div class="nm">${name}${sub?`<small>${sub}</small>`:''}</div>${btn.html}</div>`; }
let shopMode='mile';
function setShopMode(m){ shopMode=m; renderShop(); }
function renderShop(){
  const L=$('L-shop'), top=L.scrollTop;
  const bar=`<div style="display:flex;gap:.3rem;flex-shrink:0"><button class="tab ${shopMode==='mile'?'on':''}" onclick="setShopMode('mile')">✈️ マイルで買う</button><button class="tab ${shopMode==='gold'?'on':''}" onclick="setShopMode('gold')">💰 Gで買う</button></div>`;
  L.innerHTML=bar+Object.keys(furnitureMaster).filter(id=>!!furnitureMaster[id].gold===(shopMode==='gold')).map(id=>{
    const f=furnitureMaster[id], own=gameState.homeFurnishings.includes(id);
    const price=f.gold?`${f.gold.toLocaleString()}G`:`${f.cost}マイル`;
    return row('',f.name,`${price} ／ +${f.bonus}%`,{own,html:own?'<button class="btn done">所持済</button>':`<button class="btn" onclick="buy('${id}')">購入</button>`});
  }).join('');
  L.scrollTop=top;
}
function buy(id){
  const f=furnitureMaster[id];
  if(f.gold){ if((gameState.money||0)<f.gold){ toast('⚠️ ゴールドが足りません！'); return; } gameState.money-=f.gold; }
  else { if(gameState.miles<f.cost){ toast('⚠️ マイルが足りません！'); return; } gameState.miles-=f.cost; }
  gameState.homeFurnishings.push(id); save();
  $('se-unlock').currentTime=0; $('se-unlock').play().catch(()=>{}); toast(`🎉 『${f.name}』を購入！`); updateUI();
}
function renderDisplay(){
  let h=gameState.charaOwned.map(id=>{ const c=CHARAS[id]; return row('',`🧑 ${c.name}`,'',{html:`<button class="btn" style="background:#8b5cf6;color:#fff" onclick="place('chara','${id}')">配置</button>`}); }).join('')+gameState.homeFurnishings.map(id=>{ const f=furnitureMaster[id]; if(!f) return '';
    return row('',f.name,'',{html:`<button class="btn" onclick="place('furn','${id}')">配置</button>`}); }).join('');
  recipes.forEach(r=>{ const n=(gameState.products||{})[r.id]||0;
    if(gameState.crafted&&gameState.crafted[r.id]) h+=row('',r.name,n>0?`在庫:${n}`:'製造済み',{html:`<button class="btn" style="background:#eab308;color:#fff" onclick="place('prod','${r.id}')">配置</button>`}); });
  $('L-display').innerHTML=h+`<div style="text-align:center;opacity:.7;padding:.5rem;font-size:.7rem">${nextCharaText()}</div>`;
}
function place(type,id){
  const f=furnitureMaster[id]; hist();
  gameState.placedItems.push({type,id,dir,s:1,x:(f?f.x:30+Math.random()*40),y:(f?f.y:(type==='chara'?90:80))});
  save(); $('se-gogogo').currentTime=0; $('se-gogogo').play().catch(()=>{}); toast('✨ 配置！ドラッグで移動・2本指で拡大縮小'); updateUI();
}
function renderTheme(){
  if(gameState.level<3){ $('L-theme').innerHTML='<div style="text-align:center;opacity:.7;padding:1rem;font-size:.75rem">🔒 Lv.3 到達でテイスト変更が解放されます！</div>'; return; }
  $('L-theme').innerHTML=Object.keys(themesMaster).map(k=>{ const t=themesMaster[k], cur=gameState.currentTheme===k;
    const sw=`<div class="swatch"><i style="background:${t.wall}"></i><i style="background:${t.floor}"></i></div>`;
    return row(sw,t.name,'',{own:cur,html:cur?'<button class="btn done">適用中</button>':`<button class="btn" onclick="setTheme('${k}')">変更</button>`}); }).join('');
}
function setTheme(k){ gameState.currentTheme=k; save(); applyTheme(k); updateUI(); toast('🎨 テイストを変更しました！'); }
function renderMusic(){
  if(gameState.level<5){ $('L-music').innerHTML='<div style="text-align:center;opacity:.7;padding:1rem;font-size:.75rem">🔒 Lv.5 到達でジュークボックスが解放されます！</div>'; return; }
  $('L-music').innerHTML=Object.keys(bgmMaster).map(k=>{ const cur=gameState.currentBgm===k;
    return row('',`🎵 ${bgmMaster[k].name}`,'',{own:cur,html:cur?'<button class="btn done">再生中</button>':`<button class="btn" onclick="setBgm('${k}')">再生</button>`}); }).join('');
}
function setBgm(k){ gameState.currentBgm=k; save(); updateBgmSource(); if(!isMuted) bgm.play().catch(()=>{}); updateUI(); toast(`🎶 「${bgmMaster[k].name}」に変更`); }

function exportSave(){
  try{ const enc=btoa(unescape(encodeURIComponent(localStorage.getItem('rareEarthGameState')||JSON.stringify(gameState))));
    const ta=$('saveCode'); ta.value=enc; ta.select();
    navigator.clipboard.writeText(enc).then(()=>toast('📋 コピーしました！')).catch(()=>toast('📋 生成しました（手動でコピーしてね）'));
  }catch(e){ toast('⚠️ エクスポートに失敗しました'); }
}
function importSave(){
  const c=$('saveCode').value.trim(); if(!c){ toast('⚠️ 復元コードを入力してください'); return; }
  askModal('セーブデータの復元','現在のデータが上書きされます。よろしいですか？','復元する',()=>{
    try{ const p=JSON.parse(decodeURIComponent(escape(atob(c)))); if(!p||typeof p!=='object') throw 0;
      localStorage.setItem('rareEarthGameState',JSON.stringify(p)); gameState=p;
      Object.keys(defaults).forEach(k=>{ if(gameState[k]===undefined) gameState[k]=defaults[k]; });
      applyTheme(gameState.currentTheme); updateBgmSource(); ensureCharas(); syncCrafted(); updateUI(); toast('✨ 復元しました！');
    }catch(e){ toast('⚠️ 無効なセーブコードです'); } });
}

let past=[], future=[];
const cur=()=>JSON.stringify(gameState.placedItems);
function hist(s){ past.push(s||cur()); if(past.length>50) past.shift(); future=[]; histBtns(); }
function histBtns(){ $('undoBtn').disabled=!past.length; $('redoBtn').disabled=!future.length; }
function restore(s){ gameState.placedItems=JSON.parse(s); save(); updateUI(); histBtns(); }
function undo(){ if(!past.length) return; future.push(cur()); restore(past.pop()); }
function redo(){ if(!future.length) return; past.push(cur()); restore(future.pop()); }
function resetRoom(){
  askModal('お部屋のリセット','本当にリセットしてよいですか？\n置いた家具・製品・キャラをすべて片付けます。','はい',()=>{ hist(); gameState.placedItems=[]; save(); updateUI(); toast('🧹 リセットしました'); },'いいえ');
}

window.addEventListener('load',()=>{
  buildControls(); switchTab('shop'); changeDirection(0);
  updateBgmSource(); updateBgmUI(); applyTheme(gameState.currentTheme); ensureCharas(); syncCrafted(); updateUI(); histBtns();
  if(!isMuted) bgm.play().catch(()=>['click','touchstart'].forEach(e=>document.addEventListener(e,unlock)));
});
</script>
