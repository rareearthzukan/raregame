<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>レアアース・クラフト - マイホーム</title>
<style>
:root{--maxw:720px;--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--line:#334155;--accent:#3b82f6;--item:#0f172a;--onaccent:#fff;--wall:#334155;--base:#000;--floor:#1e293b;--door:#64748b;--door2:#475569;--knob:#cbd5e1;--garden:transparent}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:clamp(14px,min(calc(12px + 1.1vw),3.2vh),21px);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b1224;color:var(--text,#1e293b);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::-webkit-scrollbar{width:.6rem;height:.6rem}
::-webkit-scrollbar-thumb{background:var(--accent,#3b82f6);border-radius:1rem}
.phone{position:fixed;inset:0;width:100%;max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0);
  box-shadow:0 0 0 1px var(--line),0 0 40px rgba(0,0,0,.6);transition:background .3s}
@media (orientation:landscape) and (min-width:700px){:root{--maxw:1200px}}

.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--card);border-bottom:2px solid var(--line);
  padding:calc(.4rem + env(safe-area-inset-top,0)) .6rem .4rem;font-size:.78rem;font-weight:bold}
.bgm-btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:1rem;padding:.25rem .6rem;min-height:1.8rem;font-size:.75rem;cursor:pointer;font-family:inherit}
.bgm-btn.muted{border-color:#e94560;color:#e94560}
.status{display:flex;gap:.4rem;padding:.4rem .6rem;flex-shrink:0;border-bottom:1px solid var(--line);background:var(--card)}
.badge{flex:1;text-align:center;border:1px solid var(--line);border-radius:.5rem;padding:.25rem;font-size:.7rem;font-weight:bold;color:var(--accent)}

.content{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem;padding:.6rem .7rem;overflow-y:auto;overscroll-behavior:contain}
@media (orientation:landscape) and (min-width:700px){
  .content{display:grid;grid-template-columns:1.2fr 1fr;align-items:stretch}
  .menu{min-height:0}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .6rem;font-size:.8rem}

.stage{position:relative;width:100%;aspect-ratio:4/3.2;overflow:hidden;border-radius:.8rem;flex-shrink:0;
  border:.18rem solid var(--line);box-shadow:inset 0 0 2.5rem rgba(0,0,0,.18);container-type:inline-size}
.layer{position:absolute;inset:0}
.wall{height:64%;background:var(--wall)}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 25% 20%,rgba(255,255,230,.35),transparent 55%)}
.win{position:absolute;left:10%;top:16%;width:24%;height:36%;border:.28rem solid var(--base);border-radius:.3rem .3rem 0 0;z-index:1;
  background:linear-gradient(var(--base),var(--base)) 50% 0/.2rem 100% no-repeat,linear-gradient(var(--base),var(--base)) 0 50%/100% .2rem no-repeat,linear-gradient(180deg,#bfe3f7,#eaf7ff);
  box-shadow:0 .25rem .8rem rgba(0,0,0,.15)}
.floor{position:absolute;left:0;right:0;top:64%;bottom:0;background:var(--floor);border-top:.35rem solid var(--base);box-shadow:inset 0 .8rem 1rem -.5rem rgba(0,0,0,.28)}
#garden{display:none;background:var(--garden)}
#objs{z-index:5}
.door{position:absolute;left:60%;bottom:0;width:19%;height:74%;background:var(--door);border:.25rem solid var(--base);border-bottom:0;border-radius:.3rem .3rem 0 0;box-shadow:inset 0 0 0 .35rem var(--door2),.2rem 0 .6rem rgba(0,0,0,.18);z-index:1;display:none}
.door::after{content:"";position:absolute;right:10%;top:55%;width:.55rem;height:.55rem;border-radius:50%;background:var(--knob);box-shadow:0 .1rem .2rem rgba(0,0,0,.35)}
.flat .wall::after{display:none}.flat .floor{box-shadow:none}

/* オブジェクトのスタイル（小さい家具もタッチできるように反応エリアを拡張） */
.obj{position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab;z-index:5;min-width:36px;min-height:36px;display:flex;align-items:flex-end;justify-content:center;padding:4px}
/* 元素キャラは常に一番手前（最前面） */
.obj.is-chara{z-index:120 !important}
.obj:active{cursor:grabbing;filter:brightness(1.05)}
.obj img{width:100%;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 .3rem .4rem rgba(0,0,0,.28))}
.obj .ph{display:flex;flex-direction:column;align-items:center;font-size:7cqw;line-height:1.1;text-align:center;filter:drop-shadow(0 .2rem .3rem rgba(0,0,0,.3))}
.obj .ph small{font-size:.55rem;background:rgba(0,0,0,.55);color:#fff;border-radius:.4rem;padding:0 .3rem}

/* キャラクターの動き：常に息・ぐにぐに／ときどきしぐさ（位置は動かさない） */
.obj.is-chara img,.obj.is-chara .ph{transform-origin:50% 100%;animation:charaBreath var(--bt,3.4s) ease-in-out infinite;animation-delay:var(--bd,0s)}
.obj.is-chara.jelly img,.obj.is-chara.jelly .ph{animation-name:charaJelly}
.obj.is-chara.g-wiggle img,.obj.is-chara.g-wiggle .ph{animation:gWiggle 1s ease-in-out 1}
.obj.is-chara.g-hop img,.obj.is-chara.g-hop .ph{animation:gHop .8s ease-out 1}
.obj.is-chara.g-happy img,.obj.is-chara.g-happy .ph{animation:gHappy 1.2s ease-in-out 1}
@keyframes charaBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.965)}}
@keyframes charaJelly{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(-4%) scale(.94,1.08)}45%{transform:translateY(0) scale(1.1,.9)}70%{transform:translateY(-2%) scale(.97,1.04)}}
@keyframes gWiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg)}35%{transform:rotate(6deg)}55%{transform:rotate(-5deg)}75%{transform:rotate(4deg)}}
@keyframes gHop{0%,100%{transform:translateY(0) scale(1.05,.93)}40%{transform:translateY(-14%) scale(.95,1.07)}70%{transform:translateY(0) scale(1.06,.92)}}
@keyframes gHappy{0%,100%{transform:scale(1)}20%{transform:translateY(-8%) scale(.96,1.06)}40%{transform:scale(1.07,.93)}60%{transform:translateY(-6%) scale(.97,1.05)}80%{transform:scale(1.03,.97)}}
.fx{position:absolute;left:50%;top:-6%;font-size:1.1rem;pointer-events:none;z-index:3;text-shadow:0 0 6px #fff;animation:fxUp 1.6s ease-out forwards}
@keyframes fxUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.obj.is-chara img,.fx{animation:none!important}}
.chara-badge{position:absolute;top:-10px;right:-10px;background:#10b981;color:#fff;font-size:.55rem;padding:2px 5px;border-radius:10px;font-weight:bold;border:1px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3);pointer-events:none}

.controls{position:absolute;top:.4rem;left:.4rem;right:.4rem;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:.3rem;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.25rem .4rem;opacity:.94}
.controls b{font-size:.7rem}.dirs{margin-left:auto;display:flex;gap:.2rem}
.dir{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:.4rem;min-width:1.7rem;min-height:1.6rem;font-size:.68rem;font-weight:bold;cursor:pointer;font-family:inherit}
.dir.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}

.menu{flex:1;display:flex;flex-direction:column;min-height:16rem}
.tabs{display:flex;gap:.2rem;margin-bottom:.4rem;flex-shrink:0}
.tab{flex:1;min-height:2rem;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:.5rem;font-size:.68rem;font-weight:bold;cursor:pointer;font-family:inherit;padding:0}
.tab.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.list{flex:1;min-height:12rem;display:none;flex-direction:column;gap:.4rem;overflow-y:auto}
.list.on{display:flex}

.item{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:.6rem;padding:.4rem .5rem;background:var(--item);cursor:pointer;transition:background .2s}
.item:hover{background:rgba(59,130,246,0.1)}
.item.own{opacity:.85}
.item .thumb{width:2.2rem;height:2.2rem;border-radius:.4rem;border:1px solid var(--line);flex-shrink:0;overflow:hidden;background:#0b1224;display:flex;align-items:center;justify-content:center;position:relative}
.item .thumb img{width:100%;height:100%;object-fit:contain;display:block}
.item .thumb .emoji-ph{font-size:1.2rem;line-height:1;display:none}
.item .nm{flex:1;font-weight:bold;font-size:.78rem}
.item .nm small{display:block;font-weight:normal;font-size:.65rem;opacity:.7}

.swatch{width:2.2rem;height:2.2rem;border-radius:.4rem;border:1px solid var(--line);flex-shrink:0;overflow:hidden;display:flex;flex-direction:column}
.swatch i{flex:1.4}.swatch i+i{flex:1}
.btn{background:var(--accent);color:var(--onaccent);border:none;border-radius:.6rem;min-height:2rem;padding:.3rem .8rem;font-size:.72rem;font-weight:bold;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.done{background:#10b981;color:#fff;cursor:default}
.guide{display:flex;gap:.5rem;align-items:flex-start;border:1px solid var(--line);border-radius:.7rem;padding:.4rem;font-size:.7rem;line-height:1.45}
.guide img{width:2.6rem;height:2.6rem;border-radius:50%;object-fit:contain;background:#fff;flex-shrink:0}
textarea{width:100%;height:5rem;font-size:.65rem;border:1px solid var(--line);border-radius:.5rem;padding:.4rem;resize:none;background:var(--item);color:var(--text);font-family:inherit;-webkit-user-select:text;user-select:text}

.nav{display:flex;gap:.3rem;flex-shrink:0;background:var(--card);border-top:2px solid var(--line);padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom,0))}
.nav div{flex:1;min-height:3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;border:1px solid var(--line);border-radius:.7rem;font-size:.72rem;font-weight:bold;cursor:pointer;opacity:.75}
.nav div.on{opacity:1;color:var(--accent);border-color:var(--accent)}
.nav span{font-size:1.15rem;line-height:1}

#toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0));transform:translate(-50%,1rem);background:#1e293b;color:#fff;border-radius:1.5rem;padding:.5rem 1rem;font-size:.75rem;font-weight:bold;z-index:300;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

.overlay{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(10,15,30,.7);z-index:200;padding:1rem}
.modal{background:#1e293b;color:#fff;border:2px solid var(--accent,#3b82f6);border-radius:1rem;padding:1.1rem;width:100%;max-width:24rem;text-align:center}
.modal h3{margin:0 0 .4rem;font-size:1rem}.modal p,.modal .mdesc{margin:0 0 .8rem;font-size:.8rem;line-height:1.5;text-align:left}
.modal .row{display:flex;gap:.5rem;margin-top:.8rem}.modal .row .btn{flex:1}

/* ═════ キャラ メニュー（子供向け・大きなタイル式） ═════ */
.cs-ov{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(10,15,30,.72);z-index:210;padding:1rem}
.cs{position:relative;width:100%;max-width:22rem;max-height:92vh;overflow-y:auto;background:#1e293b;color:#fff;border:.15rem solid #475569;border-radius:1.2rem;padding:1rem .9rem .9rem;text-align:center;animation:csPop .18s ease-out}
@keyframes csPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.cs-x{position:absolute;top:.5rem;right:.5rem;width:2.2rem;height:2.2rem;border-radius:50%;border:0;background:#334155;color:#fff;font-size:1rem;cursor:pointer;font-family:inherit}
.cs-head{display:flex;align-items:center;gap:.7rem;text-align:left;padding-right:2.4rem}
.cs-av{width:4.6rem;height:4.6rem;border-radius:50%;background:#fff;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border:.18rem solid #fbbf24}
.cs-av img{width:100%;height:100%;object-fit:contain}
.cs-av span{display:none;font-size:2.2rem}
.cs-name{font-size:1.15rem;font-weight:bold}
.cs-tag{display:inline-block;margin-top:.25rem;font-size:.72rem;background:#334155;border-radius:1rem;padding:.15rem .6rem}
.cs-bubble{position:relative;background:#fff;color:#1e293b;border-radius:.9rem;padding:.6rem .75rem;margin:.8rem 0;font-size:.9rem;font-weight:bold;line-height:1.55;text-align:left}
.cs-bubble.c{text-align:center;font-size:1rem}
.cs-bubble::before{content:"";position:absolute;top:-.45rem;left:2rem;border:.5rem solid transparent;border-top:0;border-bottom-color:#fff}
.cs-memo{background:rgba(0,0,0,.28);border-radius:.8rem;padding:.6rem .75rem;font-size:.8rem;line-height:1.65;text-align:left;margin-bottom:.7rem}
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.cs-grid3{grid-template-columns:repeat(3,1fr)}
.cs-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;border:0;border-radius:1rem;padding:.7rem .3rem;min-height:5.2rem;color:#fff;font-family:inherit;font-weight:bold;cursor:pointer;box-shadow:0 .22rem 0 rgba(0,0,0,.35)}
.cs-tile .ic{font-size:2rem;line-height:1.1}
.cs-tile .lb{font-size:1rem}
.cs-tile small{font-size:.66rem;font-weight:normal;opacity:.95;line-height:1.35}
.cs-tile:active{transform:translateY(.15rem);box-shadow:0 .06rem 0 rgba(0,0,0,.35)}
.cs-tile[disabled]{background:#475569!important;opacity:.65;box-shadow:none;cursor:default}
.cs-play{grid-column:1/-1;min-height:5.8rem;background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.cs-play .ic{font-size:2.4rem}.cs-play .lb{font-size:1.15rem}
.cs-work{background:linear-gradient(#3b82f6,#2563eb)}
.cs-talk{background:linear-gradient(#10b981,#059669)}
.cs-star{position:absolute;top:-.5rem;left:50%;transform:translateX(-50%);background:#fbbf24;color:#422006;font-size:.6rem;font-weight:bold;border-radius:1rem;padding:.05rem .45rem;white-space:nowrap}
.cs-sub{margin-top:.8rem;width:100%;background:transparent;border:.1rem solid #64748b;color:#cbd5e1;border-radius:.8rem;padding:.55rem;font-size:.8rem;cursor:pointer;font-family:inherit}
.cs-sub.put{border-style:dashed}
.cs-bar{height:.85rem;background:#334155;border-radius:1rem;overflow:hidden}
.cs-bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#10b981)}
.cs-left{margin-top:.45rem;font-size:.95rem;font-weight:bold}

/* ═════ 絞り込みチップ（ショップ／配置） ═════ */
.fbar{padding:.1rem 0 .4rem;display:flex;flex-direction:column;gap:.35rem;flex-shrink:0;border-bottom:1px solid var(--line)}
.frow{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.fl{flex-basis:100%;font-size:.62rem;font-weight:bold;opacity:.7;margin-bottom:-.1rem}
.chip{flex-shrink:0;display:flex;align-items:center;gap:.2rem;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:1rem;padding:.15rem .5rem;min-height:1.85rem;font-size:.7rem;font-weight:bold;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip i{font-style:normal;font-size:.6rem;opacity:.75}
.chip.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.fcount{font-size:.65rem;opacity:.7}
.sec{font-size:.72rem;font-weight:bold;opacity:.85;padding:.2rem .1rem 0}
.empty{text-align:center;opacity:.7;padding:1.2rem .5rem;font-size:.78rem;line-height:1.6}
.new{display:inline-block;background:#ef4444;color:#fff;border-radius:.5rem;font-size:.55rem;padding:0 .3rem;font-weight:bold;vertical-align:middle}
.price.ok{color:#16a34a;font-weight:bold}.price.no{opacity:.6}
.dot{display:inline-block;background:#ef4444;color:#fff;border-radius:1rem;font-size:.55rem;min-width:1rem;padding:0 .25rem;margin-left:.15rem;line-height:1.1rem}
</style>
</head>
<body>
<audio id="bgm" src="BGM_room.ogg" loop preload="auto"></audio>
<audio id="se-unlock" src="itemget.mp3" preload="auto"></audio>
<audio id="se-gogogo" src="gogogo.mp3" preload="auto"></audio>

<div class="phone" id="phone">
  <div class="header">
    <span>✈️ <span id="miles">0</span> マイル</span>
    <span>💰 <span id="money">0</span> G</span>
    <span>🌟 Lv.<span id="level">1</span></span>
    <button id="bgm-btn" class="bgm-btn" onclick="toggleBGM()">🎵 ON</button>
  </div>
  <div class="status">
    <div class="badge">🏠 居心地 Lv.<span id="roomLevel">1</span></div>
    <div class="badge">✨ 精製ボーナス +<span id="bonus">0</span>%</div>
  </div>

  <div class="content">
    <div class="stage" id="stage">
      <div class="controls">
        <b id="dirTitle">北の壁</b>
        <div class="dirs" style="margin-left:0"><button class="dir" id="undoBtn" onclick="undo()" title="元に戻す">↶</button><button class="dir" id="redoBtn" onclick="redo()" title="やり直す">↷</button><button class="dir" onclick="resetRoom()" title="リセット">🗑️</button></div>
        <div class="dirs" id="dirBtns"></div>
      </div>
      <div id="indoor">
        <div class="layer wall"><div class="win" id="win"></div><div class="door" id="door"></div></div>
        <div class="floor"></div>
      </div>
      <div class="layer" id="garden"></div>
      <div class="layer" id="objs"></div>
    </div>

    <div class="card menu">
      <div class="tabs" id="tabs"></div>
      <div class="list on" id="L-shop"></div>
      <div class="list" id="L-display"></div>
      <div class="list" id="L-theme"></div>
      <div class="list" id="L-music"></div>
      <div class="list" id="L-save">
        <div class="guide"><img src="chara0_Y.png" alt="イットリウム" onerror="this.style.visibility='hidden'">
          <div><b>【イットリウムからのアドバイス】</b><br>普段は<b>自動で保存</b>されるよ！別の端末で遊ぶときや万が一のときだけ「コードコピー」を押してメモ帳に保存してね。</div></div>
        <textarea id="saveCode" placeholder="ここにセーブコードが表示されます / 貼り付けます"></textarea>
        <div style="display:flex;gap:.4rem">
          <button class="btn" style="flex:1" onclick="exportSave()">📋 コードコピー</button>
          <button class="btn" style="flex:1;background:#10b981;color:#fff" onclick="importSave()">📥 コード復元</button>
        </div>
      </div>
    </div>
  </div>

  <div class="nav">
    <div onclick="location.href='map.html'"><span>🗺️</span>マップ</div>
    <div onclick="location.href='seisei.html'"><span>🧪</span>精製</div>
    <div onclick="location.href='factory.html'"><span>🏭</span>工場</div>
    <div onclick="location.href='zukan.html'"><span>📖</span>図鑑</div>
    <div class="on"><span>🏠</span>ホーム</div>
  </div>
</div>

<div id="toast"></div>
<div class="overlay" id="modal"><div class="modal"><h3 id="mTitle"></h3><div id="mDesc" class="mdesc"></div>
  <div class="row" id="mRows"><button class="btn" style="background:#94a3b8;color:#fff" onclick="closeModal()">キャンセル</button><button class="btn" id="mOk" style="background:#ef4444;color:#fff">OK</button></div></div></div>

<div class="cs-ov" id="csOv" onclick="if(event.target===this)csClose()"><div class="cs" id="cs"></div></div>

<script src="areaconfig.js"></script>
<script>
try { ['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault())); } catch(e){}

const IMG_DIR = '';
const furnitureMaster = {
  'desk_l' : { name:'スタンダードなデスク',           cost:200,   bonus:0.3, img:'home_kagu0.png', size:28, x:30, y:88, emoji:'🗄️' },
  'sofa_m' : { name:'クラシカルなソファ',         cost:300,  bonus:1.0, img:'home_kagu1.png', size:34, x:55, y:92, emoji:'🛋️' },

function applyTheme(k){
  try {
    const t=themesMaster[k]||themesMaster.natural, pEl=$('phone');

    const s=pEl.style;
    ['wall','base','floor','bg','card','text','line','accent','item','onaccent'].forEach(p=>s.setProperty('--'+p,t[p]||''));

function charaCount(lv){ return Math.min(17, lv<3?1:lv<5?2:lv<8?3:4+Math.floor((lv-8)/3)); }
function nextCharaText(){
  const n=charaCount(gameState.level||1); if(n>=17) return '🎉 全キャラクターが揃いました！';
  let lv=(gameState.level||1)+1; while(charaCount(lv)<=n) lv++; return `🔒 次のキャラクターは Lv.${lv} で登場！`;
}

function syncCrafted(){
  if(!gameState.crafted) gameState.crafted={}; let ch=false; const p=gameState.products||{};
  recipes.forEach(r=>{ if(p[r.id]>0&&!gameState.crafted[r.id]){ gameState.crafted[r.id]=true; ch=true; } });
  if(ch) save();
}

function ensureCharas(){
  try {
    const ids=Object.keys(CHARAS), want=charaCount(gameState.level||1);
    if(!Array.isArray(gameState.charaOwned)) gameState.charaOwned=[];
    if(!gameState.placedItems) gameState.placedItems=[];
    
    let added=0; const addedNames=[];
    while(gameState.charaOwned.length<want){
      const rest=ids.filter(i=>!gameState.charaOwned.includes(i)); if(!rest.length) break;
      // 最初の仲間も含めて、まだ来ていない子（全17人）からランダムに選ぶ
      const id = rest[Math.floor(Math.random()*rest.length)];
      gameState.charaOwned.push(id);
      gameState.placedItems.push({type:'chara',id,dir:0,s:1,x:25+Math.random()*50,y:90}); added++; addedNames.push((CHARAS[id]&&CHARAS[id].name)||id);
    }
    if(added){ save(); setTimeout(()=>toast('🎉 '+addedNames.join('・')+' がお部屋に来たよ！'),600); }

    if((gameState.level||1) >= 6 && !gameState.tutorialShown6) {
      gameState.tutorialShown6 = true; save();
      setTimeout(() => {
        askModal('🏠 初期メンバーからの声かけ！',
          `「プレイヤーさん、Lv.6おめでとう！お部屋や庭に配置して話しかけてくれたら、<b>『あそぶ』『おしごと』『おはなし』</b>ができるよ！ いらなくなったら<b>『しまう』</b>もできるからね！」`,
          'わかった！', null, '');
      }, 1000);
    }
  } catch(e){}
}

function fmtHours(h){ const m=Math.round(h*60), H=Math.floor(m/60), M=m%60; return H&&M?`${H}時間${M}分`:H?`${H}時間`:`${M}分`; }
function fmtLeft(ms){ const m=Math.max(1,Math.ceil(ms/60000)); return m>=60?`${Math.floor(m/60)}時間${m%60}分`:`${m}分`; }

function csShow(inner){
  const o=$('csOv'), b=$('cs'); if(!o||!b) return;
  const wasOpen=o.style.display==='flex';
  b.innerHTML=`<button class="cs-x" onclick="csClose()" aria-label="とじる">✕</button>`+inner;
  b.scrollTop=0; o.style.display='flex';
  /* キャラをタップした指が離れた直後のクリックが、開いたばかりのボタンに当たらないよう、少しの間だけ無反応にする */
  if(!wasOpen){ o.style.pointerEvents='none'; clearTimeout(csShow._t); csShow._t=setTimeout(()=>{ o.style.pointerEvents=''; },500); }
}
function csClose(){ const o=$('csOv'); if(o){ o.style.display='none'; o.style.pointerEvents=''; } }
function csHead(id,tag){
  const c=CHARAS[id];
  return `<div class="cs-head"><div class="cs-av"><img src="${CHARA_PREFIX}${id}.png" alt="${c.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span>🧪</span></div>
    <div><div class="cs-name">${c.name}</div><div class="cs-tag">${tag}</div></div></div>`;
}
function playTile(id){
  const g=MINIGAMES[id]; if(!g) return '';
  return `<button class="cs-tile cs-play" onclick="playGame('${id}')"><span class="ic">${g.emoji}</span><span class="lb">あそぶ</span><small>${g.name}</small></button>`;
}
function playGame(id){
  const g=MINIGAMES[id]; if(!g) return;
  csClose();
  if(g.fn && typeof window[g.fn]==='function') window[g.fn]();
  else if(g.url){
    const go=()=>{ location.href=g.url; };
    if(/^https?:/.test(location.protocol) && window.fetch){
      fetch(g.url,{method:'HEAD',cache:'no-store'}).then(r=>{ if(r.ok) go(); else toast('🚧 このゲームは じゅんびちゅうだよ'); }).catch(go);
    } else go();
  }
}

  if(!gameState.charaTasks) gameState.charaTasks={};
  const task=gameState.charaTasks[id], now=Date.now();

  if(task && task.endTime>now){            // おしごと中
    const w=WORK[task.type]||WORK.mine, total=task.endTime-task.startTime;
    const pct=Math.min(100,Math.max(0,(now-task.startTime)/total*100));

      `<div class="cs-bubble c">${w.emoji} ${w.name}にいってるよ！<br>もうすこしまっててね</div>

function startCharaTask(id, type){
  const c = CHARAS[id]; if(!c) return;
  let hours = type==='mine'? c.mH : type==='refine'? c.rH : c.pH;
  const durationMs = hours * 3600 * 1000; 
  if(!gameState.charaTasks) gameState.charaTasks={};
  gameState.charaTasks[id] = { type, startTime: Date.now(), endTime: Date.now() + durationMs, claimed: false, hours };
  save(); closeModal();
  toast(`✨ ${c.name}が ${type==='mine'?'掘削':type==='refine'?'精製':'製品製造'} に出発しました！`);
  updateUI();
}

function claimTaskReward(id){
  const c = CHARAS[id]; if(!c || !gameState.charaTasks) return;
  const task = gameState.charaTasks[id]; if(!task) return;

  const isFever = Math.random() < 0.10;
  const mult = isFever ? (1.5 + Math.random()*0.5) : 1.0;
  let baseQ = task.type==='mine'? c.mQ : task.type==='refine'? c.rQ : c.pQ;
  let finalQ = Math.round(baseQ * mult);

  if(task.type === 'mine'){ gameState.mudStock = (gameState.mudStock || 0) + finalQ; }
  else if(task.type === 'refine'){ gameState.money = (gameState.money || 0) + finalQ * 250; }
  else {
    const rId = recipes[Math.floor(Math.random()*recipes.length)].id;
    if(!gameState.products) gameState.products={};
    gameState.products[rId] = (gameState.products[rId] || 0) + finalQ;
  }

  delete gameState.charaTasks[id];
  save(); closeModal();

  if(isFever){
    askModal(`🔥 大成功！大生産フィーバー発生！！`,
      `<div style="text-align:center"><p style="font-size:2rem">🎉✨</p>` +
      `<p><b>${c.name}</b> の作業が大フィーバー！通常より大量の成果物を持ち帰りました！</p>` +
      `<p style="color:#ffde59; font-size:1.1rem; font-weight:bold">+ ${finalQ} 獲得！</p></div>`,
      'やったね！', null, '');
  } else {
    toast(`🎉 ${c.name}がお仕事を完了して帰ってきました！(+${finalQ})`);
  }
  updateUI();
}

/* ═════════ ドラッグ・操作ダイアログ・マウスホイール対応 ═════════ */
function drag(el,it,idx,name,size,isChara,charaId){
  const P=new Map(); let moved=false,tot=0,pre='',d0=1,s0=1,wp='',wt;
  const dist=()=>{ const a=[...P.values()]; return Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)); };
  const setW=()=>{ el.style.width=size*it.s+'%'; };
  const clamp=v=>Math.max(.3,Math.min(3,v));

  /* ダブルクリック / 長押し時の操作ダイアログ（PC拡大縮小救済機能） */
  const openOptionModal=()=>{
    if(isChara){ openCharaTaskModal(charaId); return; }
    const html = `
      <div style="font-size:0.8rem; text-align:center">
        <p style="margin-bottom:12px"><b>「${name}」</b>のレイアウト変更</p>
        <div style="display:flex; justify-content:center; gap:8px; margin-bottom:12px">
          <button class="btn" style="background:#3b82f6" onclick="changeSizeScale(${idx},-0.25)">🔍 縮小 (-)</button>
          <button class="btn" style="background:#3b82f6" onclick="changeSizeScale(${idx},0.25)">🔍 拡大 (+)</button>
        </div>
        <div style="display:flex; justify-content:center; gap:8px; margin-bottom:12px">
          <button class="btn" style="background:#8b5cf6" onclick="bringToFront(${idx})">🔝 最前列に置く</button>
          <button class="btn" style="background:#ef4444" onclick="removePlacedItem(${idx})">📦 片付ける</button>
        </div>
      </div>
    `;
    askModal('アイテム操作', html, '閉じる', null, '');
  };

  el.addEventListener('dblclick', (e)=>{ e.preventDefault(); openOptionModal(); });

  el.addEventListener('pointerdown',e=>{ 
    e.preventDefault(); 
    el.setPointerCapture(e.pointerId); 
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1){ moved=false; tot=0; pre=cur(); } 
    else if(P.size===2){ d0=dist(); s0=it.s; moved=true; } 
  });

  el.addEventListener('pointermove',e=>{
    const p=P.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(P.size>=2){ it.s=clamp(s0*dist()/d0); setW(); return; }
    tot+=Math.abs(dx)+Math.abs(dy); if(tot>6) moved=true;
    const stageEl = $('stage'); if(!stageEl) return;
    const r=stageEl.getBoundingClientRect();
    it.x=Math.max(0,Math.min(100,it.x+dx/r.width*100)); it.y=Math.max(10,Math.min(100,it.y+dy/r.height*100));
    el.style.left=it.x+'%'; el.style.top=it.y+'%';
  });

  const up=e=>{
    if(!P.delete(e.pointerId)||P.size>0) return;
    if(moved){ if(cur()!==pre){ hist(pre); save(); } return; }
    if(isChara){ openCharaTaskModal(charaId); }
    else { openOptionModal(); }
  };

  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);

  /* PC向け：マウスホイールでの直感的なサイズ変更（拡大・縮小） */
  el.addEventListener('wheel',e=>{ 
    e.preventDefault(); 
    if(!wp) wp=cur();
    it.s=clamp(it.s*(e.deltaY<0?1.08:.92)); 
    setW();
    clearTimeout(wt); 
    wt=setTimeout(()=>{ if(cur()!==wp){ hist(wp); save(); } wp=''; },400); 
  },{passive:false});
}

function changeSizeScale(idx, delta){
  if(!gameState.placedItems || !gameState.placedItems[idx]) return;
  hist();
  const it = gameState.placedItems[idx];
  it.s = Math.max(0.3, Math.min(3.0, (it.s || 1) + delta));
  save(); closeModal(); updateUI();
  toast('✨ サイズを変更しました');
}

function bringToFront(idx){
  if(!gameState.placedItems || !gameState.placedItems[idx]) return;
  hist();
  const item = gameState.placedItems.splice(idx, 1)[0];
  gameState.placedItems.push(item);
  save(); closeModal(); updateUI();
  toast('🔝 最前列に移動しました');
}

function removePlacedItem(idx){
  if(!gameState.placedItems || !gameState.placedItems[idx]) return;
  hist();
  const item = gameState.placedItems[idx];
  let name = 'アイテム';
  if(item.type==='furn' && furnitureMaster[item.id]) name = furnitureMaster[item.id].name;
  gameState.placedItems.splice(idx, 1);
  save(); closeModal(); updateUI();
  toast(`📦 『${name}』を片付けました`);
}

  const ids=Object.keys(furnitureMaster);
  const okS=id=>shopF.s==='all'||furnSeries(id)===shopF.s, okT=id=>shopF.t==='all'||furnCat(id)===shopF.t;
  const cS=countBy(ids,furnSeries,okT), cT=countBy(ids,furnCat,okS);
  const shown=ids.filter(id=>okS(id)&&okT(id));
  shown.sort((a,b)=>own.has(a)-own.has(b));            // まだ持ってないものを上に
  const bar=`<div class="fbar">${chipRow('シリーズ',SERIES,shopF.s,'setShopS',cS)}${chipRow('しゅるい',CATS,shopF.t,'setShopT',cT)}<div class="fcount">${shown.length}こ ・ 「もってる」は下にまとめたよ</div></div>`;
  L.innerHTML = bar + (shown.length?shown.map(id=>shopRow(id,furnitureMaster[id],own.has(id))).join(''):'<div class="empty">ここにはまだないよ<br>べつの ぶんるいを えらんでね</div>');
  L.scrollTop=toTop?0:top;
}

function openPreview(id){
  const f = furnitureMaster[id]; if(!f) return;
  const own = (gameState.homeFurnishings||[]).includes(id);
  const price = f.gold ? `${f.gold.toLocaleString()} G` : `${f.cost} マイル`;
  
  const html = `
    <div style="text-align:center">
      <div style="width:7rem;height:7rem;margin:0 auto 0.6rem;background:#0b1224;border:2px solid var(--line);border-radius:.8rem;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
        <img src="${IMG_DIR}${f.img}" alt="${f.name}" style="max-width:90%;max-height:90%;object-fit:contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span style="font-size:3rem;display:none">${f.emoji||'📦'}</span>
      </div>
      <p style="font-size:0.85rem;margin:0 0 4px">価格: <b>${price}</b></p>
      <p style="font-size:0.8rem;color:#38bdf8;margin:0 0 10px">居心地ボーナス: <b>+${f.bonus}%</b></p>
      <p style="font-size:0.75rem;opacity:0.8;margin:0 0 10px">お部屋に配置すると居心地レベルが上がり、精製や報酬がアップします！</p>
    </div>
  `;

  if(own){
    askModal(`📦 ${f.name} (所持済み)`, html, '閉じる', null, '');
  } else {
    askModal(`🛒 ${f.name} の購入確認`, html, '購入する', ()=>{ buy(id); }, 'キャンセル');
  }
}

function buy(id){
  const f=furnitureMaster[id]; if(!f) return;
  if(f.gold){ if((gameState.money||0)<f.gold){ toast('⚠️ ゴールドが足りません！'); return; } gameState.money-=f.gold; }
  else { if((gameState.miles||0)<f.cost){ toast('⚠️ マイルが足りません！'); return; } gameState.miles-=f.cost; }
  if(!gameState.homeFurnishings) gameState.homeFurnishings=[];
  if(!gameState.homeFurnishings.includes(id)){ gameState.homeFurnishings.push(id); if(!Array.isArray(gameState.newFurn)) gameState.newFurn=[]; gameState.newFurn.push(id); }
  save();
  const seU=$('se-unlock'); if(seU){ seU.currentTime=0; seU.play().catch(()=>{}); }
  toast(`🎉 『${f.name}』を購入！「📦配置」にあるよ`); updateUI();
}

let dispF={k:'all',s:'all',t:'all'};
function setDispK(k){ dispF.k=k; if(k!=='furn'&&k!=='all'){} renderDisplay(true); }
function setDispS(k){ dispF.s=k; renderDisplay(true); }
function setDispT(k){ dispF.t=k; renderDisplay(true); }
function thumbOf(src,name,emoji){ return `<div class="thumb"><img src="${src}" alt="${name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="emoji-ph">${emoji||'📦'}</span></div>`; }

function renderDisplay(toTop){
  const L=$('L-display'); if(!L) return;
  const top=L.scrollTop, placed=gameState.placedItems||[];
  const newSet=new Set(gameState.newFurn||[]);
  const charaIds=(gameState.charaOwned||[]).filter(id=>CHARAS[id]);
  // 新しく買ったものを先頭、あとは新しい順
  let furnIds=[...(gameState.homeFurnishings||[])].filter(id=>furnitureMaster[id]).reverse();
  furnIds=[...furnIds.filter(id=>newSet.has(id)),...furnIds.filter(id=>!newSet.has(id))];
  const prods=recipes.filter(r=>gameState.crafted&&gameState.crafted[r.id]);
  const placedCnt={}; placed.forEach(i=>{ if(i.type==='furn') placedCnt[i.id]=(placedCnt[i.id]||0)+1; });

  // タブの🆕マーク
  const tb=$('tab-display'); if(tb){ const n=newSet.size; tb.innerHTML='📦配置'+(n?`<span class="dot">${n}</span>`:''); }

  const K=[{k:'all',e:'🌈',n:'ぜんぶ'},{k:'chara',e:'🧑',n:'なかま'},{k:'furn',e:'🛋️',n:'かぐ'},{k:'prod',e:'📦',n:'せいひん'}];
  const kc={all:charaIds.length+furnIds.length+prods.length,chara:charaIds.length,furn:furnIds.length,prod:prods.length};
  let bar=`<div class="fbar">${chipRow('なにを',K,dispF.k,'setDispK',kc)}`;
  let shownF=furnIds;
  if(dispF.k==='furn'){
    const okS=id=>dispF.s==='all'||furnSeries(id)===dispF.s, okT=id=>dispF.t==='all'||furnCat(id)===dispF.t;
    const cS=countBy(furnIds,furnSeries,okT), cT=countBy(furnIds,furnCat,okS);
    shownF=furnIds.filter(id=>okS(id)&&okT(id));
    bar+=chipRow('シリーズ',SERIES,dispF.s,'setDispS',cS)+chipRow('しゅるい',CATS,dispF.t,'setDispT',cT)+`<div class="fcount">${shownF.length}こ</div>`;
  }
  bar+='</div>';

  const showC=dispF.k==='all'||dispF.k==='chara', showF=dispF.k==='all'||dispF.k==='furn', showP=dispF.k==='all'||dispF.k==='prod';
  const head=(t)=>dispF.k==='all'?`<div class="sec">${t}</div>`:'';
  let h='';
  if(showC&&charaIds.length){
    h+=head('🧑 なかま');
    charaIds.forEach(id=>{
      const c=CHARAS[id], pl=placed.find(i=>i.type==='chara'&&i.id===id);
      const sub=pl?`📍 ${dirNames[pl.dir]||''}にいるよ`:(TYPE_TAG[c.type]||'');
      const btn=pl?`<button class="btn" style="background:#f97316;color:#fff" onclick="removeChara('${id}')">しまう</button>`
                  :`<button class="btn" style="background:#8b5cf6;color:#fff" onclick="place('chara','${id}')">配置</button>`;
      h+=row(thumbOf(CHARA_PREFIX+id+'.png',c.name,'🧪'),`🧑 ${c.name}`,sub,{html:btn});
    });
  }
  if(showF&&shownF.length){
    h+=head('🛋️ かぐ');
    shownF.forEach(id=>{
      const f=furnitureMaster[id], n=placedCnt[id]||0;
      const sub=n?`📍 おへやに ×${n}`:'✨ まだおいてないよ';
      h+=row(thumbOf(IMG_DIR+f.img,f.name,f.emoji),`${newSet.has(id)?'<span class="new">🆕</span> ':''}${f.name}`,sub,{html:`<button class="btn" onclick="place('furn','${id}')">配置</button>`});
    });
  }
  if(showF&&dispF.k==='furn'&&!shownF.length) h+='<div class="empty">ここにはまだないよ<br>ショップで かって みよう！</div>';
  if(showP&&prods.length){
    h+=head('📦 せいひん');
    prods.forEach(r=>{ const n=(gameState.products||{})[r.id]||0;
      h+=row(thumbOf(IMG_DIR+r.img,r.name,r.emoji),r.name,n>0?`在庫:${n}`:'製造済み',{html:`<button class="btn" style="background:#eab308;color:#fff" onclick="place('prod','${r.id}')">配置</button>`}); });
  }
  if(dispF.k==='all'||dispF.k==='chara') h+=`<div style="text-align:center;opacity:.7;padding:.5rem;font-size:.7rem">${nextCharaText()}</div>`;
  L.innerHTML=bar+h;
  L.scrollTop=toTop?0:top;
}

function place(type,id){
  const f=furnitureMaster[id];
  if(type==='chara' && (gameState.placedItems||[]).some(i=>i.type==='chara'&&i.id===id)){ toast('もうおへやにいるよ！'); return; }
  hist();
  if(type==='furn'&&Array.isArray(gameState.newFurn)) gameState.newFurn=gameState.newFurn.filter(x=>x!==id);
  if(!gameState.placedItems) gameState.placedItems=[];
  gameState.placedItems.push({type,id,dir,s:1,x:(f?f.x:30+Math.random()*40),y:(f?f.y:(type==='chara'?90:80))});
  save(); const seG=$('nyu2'); if(seG){ seG.currentTime=0; seG.play().catch(()=>{}); }
  toast(type==='chara'?`✨ ${CHARAS[id]?CHARAS[id].name:''}をよんだよ！タップして話しかけてね`:'✨ 配置！ドラッグで移動・ホイールやタップ操作で拡大縮小'); updateUI();
}

function renderTheme(){
  const L=$('L-theme'); if(!L) return;
  if((gameState.level||1)<3){ L.innerHTML='<div style="text-align:center;opacity:.7;padding:1rem;font-size:.75rem">🔒 Lv.3 到達でテイスト変更が解放されます！</div>'; return; }
  const inObs=dir===OBS_DIR;
  const sel=inObs?(gameState.obsTheme||OBS_DEFAULT_THEME):gameState.currentTheme;
  let h='';
  if(inObs){
    h+='<div class="sec">🔭 観測室だけの壁紙・ゆかを選べます（ほかの部屋は変わりません）</div>';
    h+=row('<div class="thumb"><span class="emoji-ph" style="display:block">🏠</span></div>','ホームと同じ','',{own:sel==='home',html:sel==='home'?'<button class="btn done">適用中</button>':`<button class="btn" onclick="setTheme('home')">変更</button>`});
  } else if(obsOpen()){
    h+='<div class="sec">🏠 ホーム（北・東・南・西・お庭）の壁紙・ゆかです</div>';
  }
  h+=Object.keys(themesMaster).map(k=>{ const t=themesMaster[k], cur=sel===k;
    const sw=`<div class="swatch"><i style="background:${t.wall}"></i><i style="background:${t.floor}"></i></div>`;
    return row(sw,t.name,'',{own:cur,html:cur?'<button class="btn done">適用中</button>':`<button class="btn" onclick="setTheme('${k}')">変更</button>`}); }).join('');

}
function setTheme(k){
  if(dir===OBS_DIR) gameState.obsTheme=k; else gameState.currentTheme=k;
  save(); applyTheme(roomThemeKey()); updateUI();
  toast(dir===OBS_DIR?'🎨 観測室のテイストを変更しました！':'🎨 テイストを変更しました！');
}

function renderMusic(){
  const L=$('L-music'); if(!L) return;
  if((gameState.level||1)<5){ L.innerHTML='<div style="text-align:center;opacity:.7;padding:1rem;font-size:.75rem">🔒 Lv.5 到達でジュークボックスが解放されます！</div>'; return; }
  const inObs=dir===OBS_DIR;
  const sel=inObs?(gameState.obsBgm||'home'):gameState.currentBgm;
  let h='';
  if(inObs){
    h+='<div class="sec">🔭 観測室だけのBGMを選べます（ほかの部屋は変わりません）</div>';
    h+=row('','🏠 ホームと同じBGM','',{own:sel==='home',html:sel==='home'?'<button class="btn done">再生中</button>':`<button class="btn" onclick="setBgm('home')">再生</button>`});
  } else if(obsOpen()){
    h+='<div class="sec">🏠 ホーム（北・東・南・西・お庭）のBGMです</div>';
  }
  h+=Object.keys(bgmMaster).map(k=>{ const cur=sel===k;
    return row('',`🎵 ${bgmMaster[k].name}`,'',{own:cur,html:cur?'<button class="btn done">再生中</button>':`<button class="btn" onclick="setBgm('${k}')">再生</button>`}); }).join('');
  L.innerHTML=h;
}
function setBgm(k){
  if(dir===OBS_DIR) gameState.obsBgm=k; else gameState.currentBgm=k;
  save(); updateBgmSource(); if(!isMuted && bgm) bgm.play().catch(()=>{}); updateUI();
  toast(k==='home'?'🎶 観測室のBGMをホームと同じにしました':`🎶 「${bgmMaster[k].name}」に変更${dir===OBS_DIR?'（観測室）':''}`);
}

function exportSave(){
  try{ const enc=btoa(unescape(encodeURIComponent(localStorage.getItem('rareEarthGameState')||JSON.stringify(gameState))));
    const ta=$('saveCode'); if(ta){ ta.value=enc; ta.select(); }
    navigator.clipboard.writeText(enc).then(()=>toast('📋 コピーしました！')).catch(()=>toast('📋 生成しました（手動でコピーしてね）'));
  }catch(e){ toast('⚠️ エクスポートに失敗しました'); }
}
function importSave(){
  const ta=$('saveCode'), c=ta?ta.value.trim():'';
  if(!c){ toast('⚠️ 復元コードを入力してください'); return; }
  askModal('セーブデータの復元','現在のデータが上書きされます。よろしいですか？','復元する',()=>{
    try{ const p=JSON.parse(decodeURIComponent(escape(atob(c)))); if(!p||typeof p!=='object') throw 0;
      localStorage.setItem('rareEarthGameState',JSON.stringify(p)); gameState=p;
      Object.keys(defaults).forEach(k=>{ if(gameState[k]===undefined) gameState[k]=defaults[k]; });
      applyTheme(roomThemeKey()); updateBgmSource(); ensureCharas(); syncCrafted(); updateUI(); toast('✨ 復元しました！');
    }catch(e){ toast('⚠️ 無効なセーブコードです'); } });
}

let past=[], future=[];
const cur=()=>JSON.stringify(gameState.placedItems||[]);
function hist(s){ past.push(s||cur()); if(past.length>50) past.shift(); future=[]; histBtns(); }
function histBtns(){
  const uB=$('undoBtn'), rB=$('redoBtn');
  if(uB) uB.disabled=!past.length; if(rB) rB.disabled=!future.length;
}
function restore(s){ gameState.placedItems=JSON.parse(s); save(); updateUI(); histBtns(); }
function undo(){ if(!past.length) return; future.push(cur()); restore(past.pop()); }
function redo(){ if(!future.length) return; past.push(cur()); restore(future.pop()); }
function resetRoom(){
  const name=dirNames[dir]||'この部屋';
  askModal('お部屋のリセット',`本当にリセットしてよいですか？<br><b>${name}</b>に置いた家具・製品・キャラを片付けます。<br>ほかの部屋はそのままです。`,'はい',()=>{
    hist(); gameState.placedItems=(gameState.placedItems||[]).filter(it=>it.dir!==dir); save(); updateUI(); toast(`🧹 ${name}をリセットしました`); },'いいえ');
}

/* ═════════ キャラクターの動き（息・ぐにぐに・ときどきしぐさ） ═════════
   ・MOTION_JELLY のIDは「ぐにぐに」、それ以外は「息」の動き
   ・ときどき GESTURES のしぐさ（wiggle=体を揺らして手を振る風 / hop=ぴょん / happy=うれしい＋マーク）
   ・差し替え画像があれば表情も変わる（同じフォルダに置くだけ・なければ何もしない）
       chara0_◯◯_smile.png（にこっ）  chara0_◯◯_blink.png（瞬き）  chara0_◯◯_wave.png（手を振る） */
const MOTION_JELLY=['Tb'];
const GESTURES={Sc:['wiggle','happy'],Y:['hop','wiggle'],La:['happy'],Ce:['wiggle'],Pr:['hop','happy'],Nd:['hop','wiggle'],Pm:['happy'],Sm:['wiggle'],
  Eu:['happy'],Gd:['wiggle'],Tb:['hop','happy'],Dy:['wiggle'],Ho:['happy'],Er:['happy'],Tm:['wiggle'],Yb:['happy'],Lu:['wiggle']};
const FX_MARK={Eu:'✨',Tb:'✨',Ho:'♪',Pr:'⭐',_:'💕'};   // うれしい時に出るマーク
const GAP_MIN=5, GAP_MAX=11;                            // しぐさの間隔（秒）
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const LIVE={}, GST={}, EXPR={};
function probeExpr(id){ if(EXPR[id]) return; EXPR[id]={};
  ['smile','blink','wave'].forEach(k=>{ const i=new Image(); i.onload=()=>{ EXPR[id][k]=i.src; }; i.src=IMG_DIR+CHARA_PREFIX+id+'_'+k+'.png'; }); }
function liveChara(el,id){
  let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))%997;
  el.classList.add(MOTION_JELLY.includes(id)?'jelly':'breath');
  el.style.setProperty('--bt',(3+(h%15)/10)+'s'); el.style.setProperty('--bd',(-(h%30)/10)+'s');
  const now=performance.now();
  GST[id]=GST[id]||{g:now+(2+Math.random()*6)*1000,b:now+(2+Math.random()*4)*1000};
  LIVE[id]={el}; probeExpr(id);
  el.addEventListener('pointerdown',()=>{ el.dataset.hold='1'; });
  const rel=()=>{ delete el.dataset.hold; };
  el.addEventListener('pointerup',rel); el.addEventListener('pointercancel',rel);
}
function swapImg(img,src,ms){ const o=img.src; img.src=src; setTimeout(()=>{ if(img.isConnected) img.src=o; },ms); }
function doGesture(id,el){
  const img=el.querySelector('img');
  const list=GESTURES[id]||['wiggle','hop','happy'], g=list[Math.random()*list.length|0], E=EXPR[id]||{};
  if(g==='happy'){
    const f=document.createElement('span'); f.className='fx'; f.textContent=FX_MARK[id]||FX_MARK._; el.appendChild(f); setTimeout(()=>f.remove(),1700);
    if(E.smile&&img) swapImg(img,E.smile,1400);
  } else if(g==='wiggle'&&E.wave&&img) swapImg(img,E.wave,900);
  el.classList.add('g-'+g); setTimeout(()=>el.classList.remove('g-'+g),1300);
}
setInterval(()=>{
  if(REDUCE||document.hidden) return;
  const now=performance.now();
  for(const id in LIVE){
    const el=LIVE[id].el; if(!el.isConnected){ delete LIVE[id]; continue; }
    if(el.dataset.hold) continue;
    const s=GST[id];
    if(now>=s.g){ doGesture(id,el); s.g=now+(GAP_MIN+Math.random()*(GAP_MAX-GAP_MIN))*1000; }
    if(now>=s.b){ const E=EXPR[id]||{}, img=el.querySelector('img'); if(E.blink&&img) swapImg(img,E.blink,140); s.b=now+(3+Math.random()*4)*1000; }
  }
},200);

window.addEventListener('load',()=>{
  try {
    try { RE.initCommon(gameState,{page:'home',busy:homeBusy,delay:1500}); } catch(e){}   // 他ページで貯まった経験値のレベル確定＋貿易ナビ＋解放のお知らせ
    buildControls(); switchTab('shop'); changeDirection(0);
    updateBgmSource(); updateBgmUI(); applyTheme(gameState.currentTheme||'natural'); ensureCharas(); syncCrafted(); updateUI(); histBtns(); showGdReward(); checkObsUnlock();
    if(!isMuted && bgm) bgm.play().catch(()=>['click','touchstart'].forEach(e=>document.addEventListener(e,unlock)));
  } catch(e){}
});
