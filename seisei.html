<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16213e">
  <meta name="format-detection" content="telephone=no">
  <title>レアアース・クラフト - 精製プラント</title>
  <style>
    :root { --maxw: 720px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* 全体は丁度よかったベストなサイズ感をベースにする */
    html {
      height: 100%;
      font-size: clamp(14px, min(calc(12px + 1.1vw), 3.2vh), 21px);
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body {
      margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
      background: #0b1224; color: #fff; touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }

    /* ─── スクロールバー（幅20px） ─── */
    ::-webkit-scrollbar { width: 20px; height: 20px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00fff5, #3b82f6); border-radius: 10px; box-shadow: 0 0 6px rgba(0, 255, 245, 0.5); border: 4px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #ffde59; background-clip: padding-box; }

    .phone {
      position: fixed; top: 0; bottom: 0; left: 0; right: 0;
      width: 100%; max-width: var(--maxw); margin: 0 auto;
      background: #0f3460; display: flex; flex-direction: column; overflow: hidden;
      padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
      box-shadow: 0 0 0 1px #16213e, 0 0 40px rgba(0,0,0,.6);
    }
    @media (orientation: landscape) and (min-width: 700px) { :root { --maxw: 1200px; } }

    /* ═══ ヘッダー：パラメータが収まるように文字をコンパクトに維持 ═══ */
    .header {
      background: #16213e; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
      padding: calc(.4rem + env(safe-area-inset-top, 0px)) .6rem .4rem;
      font-size: 0.78rem; font-weight: bold; border-bottom: 2px solid #e94560;
    }
    .bgm-btn {
      background: rgba(0, 0, 0, 0.4); border: 1px solid #00fff5; color: #00fff5;
      border-radius: 1rem; padding: .25rem .6rem; min-height: 1.8rem; font-size: .75rem; cursor: pointer;
      display: flex; align-items: center; gap: .2rem; transition: all 0.2s; touch-action: manipulation;
    }
    .bgm-btn.muted { border-color: #e94560; color: #e94560; background: rgba(233, 69, 96, 0.2); }

    /* 工程ナビゲーションバー（ベストな大きさ） */
    .koutei-bar {
      background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #00fff5;
      padding: .4rem .25rem; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0;
    }
    .koutei-wrapper { display: flex; flex-direction: column; align-items: center; gap: .15rem; }
    .koutei-item {
      width: 2.6rem; height: 2.6rem; background: #000; border: 2px solid transparent;
      border-radius: .4rem; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .koutei-item.active { border-color: #00fff5; box-shadow: 0 0 10px rgba(0, 255, 245, 0.8); animation: kouteiGlow 1.2s infinite alternate; }
    @keyframes kouteiGlow {
      from { border-color: #00fff5; box-shadow: 0 0 4px rgba(0,255,245,0.4); }
      to { border-color: #ffde59; box-shadow: 0 0 12px rgba(255,222,89,0.9); }
    }
    .koutei-item img { width: 100%; height: 100%; object-fit: cover; }
    .koutei-label { font-size: .68rem; color: #94a3b8; font-weight: bold; text-align: center; white-space: nowrap; }
    .koutei-wrapper:has(.koutei-item.active) .koutei-label { color: #00fff5; }


    .header { flex-wrap: wrap; gap: .1rem .5rem; }
    .header > span { white-space: nowrap; }

    /* ═══ コンテンツ ═══ */
    .content {
      flex: 1; min-height: 0; background: linear-gradient(180deg, #1b4f72 0%, #0f3460 100%);
      padding: .6rem .7rem; display: flex; flex-direction: column; gap: .55rem;
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative;
    }
    #refineryMain { display: flex; flex-direction: column; gap: .55rem; flex: 1 0 auto; width: 100%; }
    .card { background: rgba(22, 33, 62, 0.9); border: 1px solid #00fff5; border-radius: .8rem; padding: .55rem .7rem; font-size: .8rem; }
    .card-title { font-size: .95rem; font-weight: bold; color: #00fff5; margin-bottom: .4rem; }

    /* 精製カットイン：画像は切り取らず全体表示（枠は固定比率なのでボタン位置が動かない） */
    .gacha-result-box {
      background: #fff; border: 2px solid #ffde59; border-radius: .8rem; padding: .5rem .6rem; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: .3rem; position: relative;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
    }
    .chara-img-wrap { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 36vh; }
    .chara-avatar-img {
      display: block; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15));
    }
    .zoom-btn {
      position: absolute; top: .4rem; right: .4rem; z-index: 3; width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid #00fff5; background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 1.2rem; line-height: 1;
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
      box-shadow: 0 0 10px rgba(0,255,245,0.5); touch-action: manipulation;
    }
    .zoom-btn:active { transform: scale(0.92); }

    .pop-anim { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .chara-name-tag {
      font-size: .85rem; font-weight: bold; color: #0f3460; width: 100%; line-height: 1.35;
      min-height: 2.7em; display: flex; align-items: center; justify-content: center;
    }
    .speech-bubble {
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: .6rem; padding: .35rem .5rem; font-size: .78rem;
      color: #1e293b; width: 100%; line-height: 1.4; font-weight: bold; min-height: 2.9em;
      display: flex; align-items: center; justify-content: center;
    }

    /* ボタン */
    .btn {
      background: #e94560; color: #fff; border: none; padding: .6rem; min-height: 2.8rem; font-size: .9rem; font-weight: bold;
      border-radius: .8rem; cursor: pointer; width: 100%; margin-top: .4rem; box-shadow: 0 3px 10px rgba(233, 69, 96, 0.4);
      transition: transform 0.1s; touch-action: manipulation; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-next-step {
      background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff; border: 1px solid #2ecc71; padding: .5rem; min-height: 2.8rem;
      font-size: .9rem; font-weight: bold; border-radius: .8rem; cursor: pointer; width: 100%; box-shadow: 0 3px 8px rgba(46, 204, 113, 0.4);
      transition: transform 0.1s; touch-action: manipulation; font-family: inherit;
    }
    .btn-next-step:active { transform: scale(0.97); }
    .btn-recycle-shortcut {
      background: rgba(0, 255, 245, 0.15); border: 1px solid #00fff5; color: #00fff5; padding: .5rem; min-height: 2.8rem;
      border-radius: .8rem; cursor: pointer; font-size: .82rem; font-weight: bold; line-height: 1.35; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: .3rem; transition: all 0.2s; touch-action: manipulation; font-family: inherit;
    }
    .btn-recycle-shortcut:active { background: rgba(0, 255, 245, 0.3); transform: scale(0.97); }
    .action-stack { display: flex; flex-direction: column; gap: .5rem; width: 100%; margin-top: auto; }

    .inventory-list {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: .25rem; font-size: .78rem; max-height: 8rem; overflow-y: auto;
      background: rgba(15, 23, 42, 0.6); padding: .4rem; border: 1px solid #00fff5; border-radius: .5rem;
    }
    .inv-item { padding: .15rem 0; }

    .tb-guide-card {
      display: flex; align-items: center; gap: .6rem; background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00fff5; border-radius: .8rem; padding: .45rem .6rem;
    }
    .tb-avatar-circle {
      width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2px solid #00fff5; object-fit: cover;
      background: #000; flex-shrink: 0; box-shadow: 0 0 8px rgba(0, 255, 245, 0.4);
    }
    .tb-speech-bubble {
      background: #fff; border: 1px solid #cbd5e1; border-radius: .7rem; padding: .45rem .65rem; font-size: .8rem;
      color: #1e293b; line-height: 1.45; position: relative; flex: 1; font-weight: 500;
    }
    .tb-speech-bubble::before {
      content: ''; position: absolute; left: -6px; top: 50%; transform: translateY(-50%);
      border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 6px solid #fff;
    }
    .highlight-material { color: #0f3460; background: rgba(0, 255, 245, 0.25); padding: 0 2px; border-radius: 3px; font-weight: bold; }
    .highlight-product { color: #d35400; background: rgba(255, 222, 89, 0.35); padding: 0 2px; border-radius: 3px; font-weight: bold; }

    /* ─── 避難訓練ミニゲーム ─── */
    #minigameContainer { display: none; flex: 1; flex-direction: column; gap: .5rem; position: relative; }
    .status-panel {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .2rem .6rem;
      background: rgba(22,33,62,0.8); border: 1px solid #00fff5; padding: .4rem .6rem; border-radius: .5rem; font-size: .78rem;
    }
    .message-banner {
      background: #fff; color: #0f3460; padding: .5rem .7rem; border-radius: .7rem; font-size: .9rem; font-weight: bold;
      text-align: center; min-height: 2.4rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,255,245,0.3); border: 2px solid #00fff5; flex-shrink: 0;
    }
    .game-area {
      width: min(100%, max(14rem, calc(100vh - 19rem))); aspect-ratio: 1 / 1; margin: 0 auto; flex-shrink: 0;
      background: rgba(15,23,42,0.9); border: 2px solid #00fff5; border-radius: .8rem; padding: .5rem;
      display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: .4rem; position: relative;
    }
    .card-door {
      background: #16213e; border: 2px solid #00fff5; border-radius: .5rem; cursor: pointer; touch-action: manipulation;
      display: flex; align-items: flex-end; justify-content: center; position: relative; overflow: hidden; transition: transform 0.2s; min-width: 0; min-height: 0;
    }
    .card-door.flipped { background: #0f3460; border-color: #ffde59; }
    .card-door img.chara-img { width: 95%; height: 95%; object-fit: contain; object-position: bottom center; display: none; }
    .card-door.flipped img.chara-img { display: block; }
    .card-door img.card-back { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: block; }
    .card-door.flipped img.card-back { display: none; }

    /* モーダル内パーツ */
    .modal-content { max-height: calc(100vh - 2rem); overflow-y: auto; }
    .guide-container {
      display: flex; align-items: center; gap: .6rem; background: rgba(22, 33, 62, 0.95); border: 1px solid #00fff5;
      border-radius: .7rem; padding: .5rem; margin-bottom: .5rem; text-align: left;
    }
    .guide-icon { width: 3rem; height: 3rem; border-radius: 50%; border: 2px solid #00fff5; object-fit: cover; flex-shrink: 0; background: #16213e; }
    .guide-bubble {
      position: relative; background: #f8f9fa; border: 1px solid #00fff5; border-radius: .6rem; padding: .4rem .55rem;
      font-size: .8rem; color: #1a1a2e; font-weight: bold; flex: 1; line-height: 1.4;
    }
    .visual-comparison { display: flex; justify-content: center; align-items: center; gap: .6rem; margin: .5rem 0; }
    .box-large, .box-small {
      background: #0f3460; border-radius: .5rem; display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .box-large { width: 4.3rem; height: 4.3rem; border: 2px solid #ffde59; color: #ffde59; }
    .box-small { width: 3.2rem; height: 3.2rem; border: 1.5px solid #00fff5; color: #00fff5; border-radius: .4rem; }

    /* 横長（タブレット横・PC）：左に精製カード、右に在庫・案内・ボタン */
    @media (orientation: landscape) and (min-width: 700px) {
      #refineryMain { display: grid; grid-template-columns: 1.2fr 1fr; align-items: start; gap: .7rem; }
      #refineryMain > .card-gacha { grid-column: 1; grid-row: 1 / span 3; }
      #refineryMain > .card-inv, #refineryMain > .tb-guide-card, #refineryMain > .action-stack { grid-column: 2; }
      .chara-img-wrap { max-height: calc(100vh - 25rem); min-height: 12rem; }
      .inventory-list { max-height: 9rem; }
    }

    /* ═══ 🔍 画像拡大ビューア（ピンチ・ドラッグ・ホイール・ダブルタップ対応） ═══ */
    .viewer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; background: rgba(5, 8, 18, 0.97); display: none; flex-direction: column; }
    .viewer.open { display: flex; }
    .viewer-stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; cursor: grab; }
    .viewer-stage.dragging { cursor: grabbing; }
    .viewer-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: center center;
      will-change: transform; pointer-events: none; -webkit-user-drag: none;
    }
    .viewer-close {
      position: absolute; z-index: 5; top: calc(.6rem + env(safe-area-inset-top, 0px)); right: calc(.6rem + env(safe-area-inset-right, 0px));
      width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 2px solid #e94560; background: rgba(15,23,42,.85);
      color: #fff; font-size: 1.2rem; cursor: pointer; touch-action: manipulation;
    }
    .viewer-hint {
      position: absolute; z-index: 4; left: 0; right: 4.5rem; top: calc(.9rem + env(safe-area-inset-top, 0px)); padding-left: .8rem;
      font-size: .72rem; color: #94a3b8; pointer-events: none; text-shadow: 0 1px 3px #000;
    }
    .viewer-bar {
      flex-shrink: 0; display: flex; justify-content: center; align-items: center; gap: .6rem; background: #16213e; border-top: 2px solid #00fff5;
      padding: .5rem .8rem calc(.5rem + env(safe-area-inset-bottom, 0px));
    }
    .viewer-bar button {
      min-width: 2.8rem; min-height: 2.8rem; padding: 0 .8rem; border-radius: .7rem; border: 1px solid #00fff5;
      background: rgba(0,255,245,0.12); color: #00fff5; font-size: 1.1rem; font-weight: bold; cursor: pointer; touch-action: manipulation; font-family: inherit;
    }
    .viewer-bar button:active { transform: scale(0.95); }
    .viewer-scale { min-width: 3.5rem; text-align: center; font-weight: bold; font-size: .9rem; color: #ffde59; }

    /* ═══ 下部フッター（ベストな大きさ） ═══ */
    .nav {
      flex-shrink: 0; position: relative; z-index: 50; background: #16213e; border-top: 2px solid #1f293d;
      display: flex; justify-content: space-around; align-items: stretch; gap: .3rem;
      padding: .4rem .5rem calc(.4rem + env(safe-area-inset-bottom, 0px));
    }
    .nav-item {
      color: #a0aec0; cursor: pointer; text-align: center; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 245, 0.2); border-radius: .7rem; padding: .3rem .2rem;
      min-height: 3rem; font-size: .72rem; font-weight: bold; flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
      transition: all 0.2s; touch-action: manipulation;
    }
    .nav-ico { font-size: 1.15rem; line-height: 1; display: block; }
    .nav-item:active { transform: scale(0.95); }
    .nav-item.active { color: #00fff5; background: rgba(0, 255, 245, 0.15); border-color: #00fff5; box-shadow: 0 0 8px rgba(0, 255, 245, 0.3); }

    /* モーダル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 15, 30, 0.85); display: flex; justify-content: center; align-items: center;
      z-index: 200; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); padding: 1rem;
    }
    .modal-content {
      background: #16213e; border: 2px solid #00fff5; border-radius: 1rem; padding: 1.2rem 1rem;
      width: 100%; max-width: 22rem; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 245, 0.3);
      animation: popup 0.3s ease-out;
    }
    .modal-icon { font-size: 2rem; margin-bottom: .2rem; }
    .modal-title { font-size: 1.05rem; font-weight: bold; color: #ffde59; margin-bottom: .4rem; }
    .modal-desc { font-size: .88rem; color: #f1f5f9; margin-bottom: .8rem; line-height: 1.55; white-space: pre-line; }
    @keyframes popup { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- BGMおよび効果音の読み込み[cite: 6] -->
  <audio id="bgm" src="BGM_seisei.ogg" loop preload="auto"></audio>
  <audio id="bgm-hinan" src="BGM_hinan.ogg" loop preload="auto"></audio>
  <audio id="se-nyu1" src="nyu1.mp3" preload="auto"></audio>
  <audio id="se-nyu2" src="nyu2.mp3" preload="auto"></audio>
  <audio id="se-itemget" src="itemget.mp3" preload="auto"></audio>
  <audio id="se-fuseikai" src="mini_fuseikai.mp3" preload="auto"></audio>
  <audio id="se-gogogo" src="gogogo.mp3" preload="auto"></audio>
  <audio id="se-type" src="SE_gacha.mp3" preload="auto"></audio>
  <audio id="se-seikai" src="mini_seikai.mp3" preload="auto"></audio>

  <div class="phone">
    <!-- ヘッダー[cite: 6] -->
    <div class="header">
      <span>💰 <span id="money">1,500</span> G</span>
      <span>🌟 Lv.<span id="level">1</span></span>
      <span>📦 泥: <span id="mud">5</span>個</span>
      <button id="bgm-btn" class="bgm-btn" onclick="toggleBGM()">🎵 ON</button>
    </div>

    <!-- 工程ナビゲーションバー[cite: 6] -->
    <div class="koutei-bar">
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei1.png" alt="採掘" onerror="this.style.display='none'"></div>
        <div class="koutei-label">1.採掘</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei2.png" alt="運搬" onerror="this.style.display='none'"></div>
        <div class="koutei-label">2.運搬</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item active"><img src="koutei3.png" alt="精製" onerror="this.style.display='none'"></div>
        <div class="koutei-label">3.精製</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item active"><img src="koutei4.png" alt="インゴット" onerror="this.style.display='none'"></div>
        <div class="koutei-label">4.素材</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei5.png" alt="製造" onerror="this.style.display='none'"></div>
        <div class="koutei-label">5.製造</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei6.png" alt="出荷" onerror="this.style.display='none'"></div>
        <div class="koutei-label">6.出荷</div>
      </div>
    </div>

    <!-- コンテンツエリア -->
    <div class="content">

      <!-- 通常の精製画面メイン -->
      <div id="refineryMain">
        <div class="card card-gacha">
          <div class="card-title">🧪 元素精製プラント</div>

          <div class="gacha-result-box">
            <!-- 画像は全体表示。🔍 または画像タップで拡大ビューア -->
            <div class="chara-img-wrap">
              <img class="chara-avatar-img" id="chara-img" src="seisei.png" alt="精製プラント" onerror="this.src='chara0_Y.png'" onclick="openViewer()">
              <button type="button" class="zoom-btn" onclick="openViewer()" aria-label="画像を拡大表示">🔍</button>
            </div>
            <div class="chara-name-tag" id="chara-name">🏭 プラント待機中</div>
            <div class="speech-bubble" id="chara-speech">精製ボタンを押すと、元素が抽出されます！</div>
          </div>

          <button class="btn" onclick="refineElement()">✨ 泥を精製する (コスト: 50G / 泥1個)</button>
        </div>

        <div class="card card-inv">
          <div class="card-title">📦 所持元素コレクション</div>
          <div class="inventory-list" id="inventory-box"></div>
        </div>

        <div class="tb-guide-card">

  <script>
    // ピンチ／ダブルタップによる意図しない拡大・表示ブレを防止（iOS Safari 対策含む）
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
      document.addEventListener(ev, e => e.preventDefault())
    );
    document.addEventListener('dblclick', e => e.preventDefault());
    let savedData = JSON.parse(localStorage.getItem('rareEarthGameState'));
    let gameState = savedData || {
      money: 1500,
      level: 1,
      mudStock: 5,
      elements: {}
    };

    // BGM設定[cite: 6]
    const bgm = document.getElementById('bgm');
    const bgmHinan = document.getElementById('bgm-hinan');
    const bgmBtn = document.getElementById('bgm-btn');
    bgm.volume = 0.3;
    bgmHinan.volume = 0.3;

    let isMuted = localStorage.getItem('bgmMutedSeisei') === 'true';

    function updateBgmUI() {
      if (isMuted) {
        bgm.muted = true;
        bgmHinan.muted = true;
        bgmBtn.innerText = '🔇 OFF';
        bgmBtn.classList.add('muted');
      } else {
        bgm.muted = false;
        bgmHinan.muted = false;
        bgmBtn.innerText = '🎵 ON';
        bgmBtn.classList.remove('muted');
      }
    }

    function toggleBGM() {
      isMuted = !isMuted;
      localStorage.setItem('bgmMutedSeisei', isMuted);
      updateBgmUI();
      let activeBgm = document.getElementById('minigameContainer').style.display === 'flex' ? bgmHinan : bgm;
      if (!isMuted) {
        activeBgm.play().catch(() => {});
      } else {
        bgm.pause();
        bgmHinan.pause();
      }
    }

    function startBgmOnFirstInteraction() {
      updateBgmUI();
      if (!isMuted) {
        bgm.play().then(() => {
          document.removeEventListener('click', startBgmOnFirstInteraction);
          document.removeEventListener('touchstart', startBgmOnFirstInteraction);
        }).catch(err => {});
      }
    }

    window.addEventListener('load', () => {
      updateBgmUI();
      if (!isMuted) {
        bgm.play().catch(() => {
          document.addEventListener('click', startBgmOnFirstInteraction);
          document.addEventListener('touchstart', startBgmOnFirstInteraction);
        });
      }
    });

    const allKeys = ['Y', 'La', 'Ce', 'Pr', 'Nd', 'Pm', 'Sm', 'Eu', 'Gd', 'Tb', 'Dy', 'Ho', 'Er', 'Tm', 'Yb', 'Lu', 'Sc'];
    if (!gameState.elements) {
      gameState.elements = {};
    }
    allKeys.forEach(k => {
      if (gameState.elements[k] === undefined) {
        gameState.elements[k] = 0;
      }
    });

    const elementsMaster = {
      'Y':  { name: 'イットリウム', symbol: 'Y', img: 'chara0_Y.png', speech: '「赤色ディスプレイやセラミックで大活躍！」', type: 'heavy', atomicNumber: 39 },
      'La': { name: 'ランタン', symbol: 'La', img: 'chara0_La.png', speech: '「カメラのレンズをピカピカにするよ！」', type: 'light', atomicNumber: 57 },
      'Ce': { name: 'セリウム', symbol: 'Ce', img: 'chara0_Ce.png', speech: '「車の排ガスをキレイにするお仕事はお任せ！」', type: 'light', atomicNumber: 58 },

      'Nd': { name: 'ネオジム', symbol: 'Nd', img: 'chara0_Nd.png', speech: '「ボクの強力な磁力、いろんな製品に役立ててよね！」', type: 'light', atomicNumber: 60 },
      'Pm': { name: 'プロメチウム', symbol: 'Pm', img: 'chara0_Pm.png', speech: '「…ボクの貴重なエネルギー、大切に扱してね。」', type: 'heavy', atomicNumber: 61 },

      'Eu': { name: 'ユウロピウム', symbol: 'Eu', img: 'chara0_Eu.png', speech: '「真っ赤な蛍光体として鮮やかに照らし出すよ！」', type: 'heavy', atomicNumber: 63 },

    function updateUI() {
      document.getElementById('money').innerText = gameState.money.toLocaleString();
      document.getElementById('level').innerText = gameState.level;
      document.getElementById('mud').innerText = gameState.mudStock;

      const invBox = document.getElementById('inventory-box');
      invBox.innerHTML = '';
      
      let hasItem = false;
      for (let key in gameState.elements) {
        if (gameState.elements[key] > 0) {
          hasItem = true;
          const div = document.createElement('div');
          div.className = 'inv-item';
          div.innerText = `🔹 ${elementsMaster[key].name}:${gameState.elements[key]}個`;
          invBox.appendChild(div);
        }
      }
      if (!hasItem) {
        invBox.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #8a8a8a; padding: 0.375rem 0;">まだ元素がありません。精製しよう！</div>';
      }
    }

    function getRandomElementKey() {
      const keys = Object.keys(elementsMaster);
      let pool = [];
      keys.forEach(k => {
        if (elementsMaster[k].type === 'light') {
          pool.push(k, k, k);
        } else {
          pool.push(k);
        }
      });
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function executeNormalRefine(targetKey, multiplier = 1) {
      const picked = elementsMaster[targetKey];
      gameState.elements[targetKey] += multiplier;

      const imgEl = document.getElementById('chara-img');
      imgEl.src = picked.img;
      imgEl.alt = picked.name;
      
      let multText = multiplier > 1 ? ` 【${multiplier}倍ボーナス達成！】` : multiplier === 0 ? ` 【ハズレ…0個】` : '';
      document.getElementById('chara-name').innerText = `✨ ${picked.name} (${targetKey}) を ${multiplier}個 精製！${multText}`;
      document.getElementById('chara-speech').innerText = picked.speech;

      imgEl.classList.remove('pop-anim');
      void imgEl.offsetWidth; 
      imgEl.classList.add('pop-anim');

      localStorage.setItem('rareEarthGameState', JSON.stringify(gameState));
      updateUI();
    }

    function showShortageModal(type) {
      const modal = document.getElementById('minigameModal');
      const content = document.getElementById('modal-content-inner');

      const isMudOnlyShortage = (gameState.mudStock <= 0 && gameState.money >= 50);

      let navImg = "navtb.png";
      let navName = "テルビウム";

      let bubbleText = "";
      let titleText = "";
      let descText = "";
      let actionBtnHTML = "";

        titleText = "泥（レアアース泥）が足りません！";

        descText = "マップ（採掘エリア）に戻って新しいレアアース泥を獲得してください。";
        actionBtnHTML = `<button class="btn" style="margin-top:0; background:#00fff5; color
