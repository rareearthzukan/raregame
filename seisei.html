<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16213e">
  <meta name="format-detection" content="telephone=no">
  <title>レアアース・クラフト - 精製プラント</title>
  <style>
    :root { --maxw: 720px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html {
      height: 100%;
      font-size: clamp(14px, min(calc(12px + 1.1vw), 3.2vh), 21px);
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body {
      margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
      background: #0b1224; color: #fff; touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }

    /* ─── スクロールバー ─── */
    ::-webkit-scrollbar { width: 16px; height: 16px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00fff5, #3b82f6); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }

    .phone {
      position: fixed; top: 0; bottom: 0; left: 0; right: 0;
      width: 100%; max-width: var(--maxw); margin: 0 auto;
      background: #0f3460; display: flex; flex-direction: column; overflow: hidden;
      padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
      box-shadow: 0 0 0 1px #16213e, 0 0 40px rgba(0,0,0,.6);
      z-index: 10;
    }
    @media (orientation: landscape) and (min-width: 700px) { :root { --maxw: 1200px; } }

    /* ═══ ヘッダー ═══ */
    .header {
      background: #16213e; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
      padding: calc(.4rem + env(safe-area-inset-top, 0px)) .6rem .4rem;
      font-size: 0.78rem; font-weight: bold; border-bottom: 2px solid #e94560; z-index: 20;
    }
    .bgm-btn {
      background: rgba(0, 0, 0, 0.4); border: 1px solid #00fff5; color: #00fff5;
      border-radius: 1rem; padding: .25rem .6rem; min-height: 1.8rem; font-size: .75rem; cursor: pointer;
      display: flex; align-items: center; gap: .2rem; transition: all 0.2s; touch-action: manipulation;
    }
    .bgm-btn.muted { border-color: #e94560; color: #e94560; background: rgba(233, 69, 96, 0.2); }

    /* 工程ナビゲーションバー */
    .koutei-bar {
      background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #00fff5;
      padding: .4rem .25rem; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 20;
    }
    .koutei-wrapper { display: flex; flex-direction: column; align-items: center; gap: .15rem; }
    .koutei-item {
      width: 2.6rem; height: 2.6rem; background: #000; border: 2px solid transparent;
      border-radius: .4rem; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .koutei-item.active { border-color: #00fff5; box-shadow: 0 0 10px rgba(0, 255, 245, 0.8); animation: kouteiGlow 1.2s infinite alternate; }
    @keyframes kouteiGlow {
      from { border-color: #00fff5; box-shadow: 0 0 4px rgba(0,255,245,0.4); }
      to { border-color: #ffde59; box-shadow: 0 0 12px rgba(255,222,89,0.9); }
    }
    .koutei-item img { width: 100%; height: 100%; object-fit: cover; }
    .koutei-label { font-size: .68rem; color: #94a3b8; font-weight: bold; text-align: center; white-space: nowrap; }
    .koutei-wrapper:has(.koutei-item.active) .koutei-label { color: #00fff5; }

    .header { flex-wrap: wrap; gap: .1rem .5rem; }
    .header > span { white-space: nowrap; }

    /* ═══ コンテンツ ═══ */
    .content {
      flex: 1; min-height: 0; background: linear-gradient(180deg, #1b4f72 0%, #0f3460 100%);
      padding: .6rem .7rem; display: flex; flex-direction: column; gap: .55rem;
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative;
      z-index: 15;
    }
    #refineryMain { display: flex; flex-direction: column; gap: .55rem; flex: 1 0 auto; width: 100%; }
    .card { background: rgba(22, 33, 62, 0.9); border: 1px solid #00fff5; border-radius: .8rem; padding: .55rem .7rem; font-size: .8rem; }
    .card-title { font-size: .95rem; font-weight: bold; color: #00fff5; margin-bottom: .4rem; }

    .gacha-result-box {
      background: #fff; border: 2px solid #ffde59; border-radius: .8rem; padding: .5rem .6rem; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: .3rem; position: relative;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
    }
    .chara-img-wrap { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 36vh; }
    .chara-avatar-img {
      display: block; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15));
    }
    .zoom-btn {
      position: absolute; top: .4rem; right: .4rem; z-index: 25; width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 2px solid #00fff5; background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 1.2rem; line-height: 1;
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
      box-shadow: 0 0 10px rgba(0,255,245,0.5); touch-action: manipulation;
    }
    .zoom-btn:active { transform: scale(0.92); }

    .pop-anim { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .chara-name-tag {
      font-size: .85rem; font-weight: bold; color: #0f3460; width: 100%; line-height: 1.35;
      min-height: 2.7em; display: flex; align-items: center; justify-content: center;
    }
    .speech-bubble {
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: .6rem; padding: .35rem .5rem; font-size: .78rem;
      color: #1e293b; width: 100%; line-height: 1.4; font-weight: bold; min-height: 2.9em;
      display: flex; align-items: center; justify-content: center;
    }

    /* ボタン群 */
    .btn {
      background: #e94560; color: #fff; border: none; padding: .6rem; min-height: 2.8rem; font-size: .9rem; font-weight: bold;
      border-radius: .8rem; cursor: pointer; width: 100%; margin-top: .4rem; box-shadow: 0 3px 10px rgba(233, 69, 96, 0.4);
      transition: transform 0.1s; touch-action: manipulation; font-family: inherit; position: relative; z-index: 25;
    }
    .btn:active { transform: scale(0.97); }
    .btn-next-step {
      background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff; border: 1px solid #2ecc71; padding: .5rem; min-height: 2.8rem;
      font-size: .9rem; font-weight: bold; border-radius: .8rem; cursor: pointer; width: 100%; box-shadow: 0 3px 8px rgba(46, 204, 113, 0.4);
      transition: transform 0.1s; touch-action: manipulation; font-family: inherit; position: relative; z-index: 25;
    }
    .btn-next-step:active { transform: scale(0.97); }
    .btn-recycle-shortcut {
      background: rgba(0, 255, 245, 0.15); border: 1px solid #00fff5; color: #00fff5; padding: .5rem; min-height: 2.8rem;
      border-radius: .8rem; cursor: pointer; font-size: .82rem; font-weight: bold; line-height: 1.35; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: .3rem; transition: all 0.2s; touch-action: manipulation; font-family: inherit; position: relative; z-index: 25;
    }
    .btn-recycle-shortcut:active { background: rgba(0, 255, 245, 0.3); transform: scale(0.97); }
    .action-stack { display: flex; flex-direction: column; gap: .5rem; width: 100%; margin-top: auto; }

    .inventory-list {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: .25rem; font-size: .78rem; max-height: 8rem; overflow-y: auto;
      background: rgba(15, 23, 42, 0.6); padding: .4rem; border: 1px solid #00fff5; border-radius: .5rem;
    }
    .inv-item { padding: .15rem 0; }

    .tb-guide-card {
      display: flex; align-items: center; gap: .6rem; background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00fff5; border-radius: .8rem; padding: .45rem .6rem;
    }
    .tb-avatar-circle {
      width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2px solid #00fff5; object-fit: cover;
      background: #000; flex-shrink: 0; box-shadow: 0 0 8px rgba(0, 255, 245, 0.4);
    }
    .tb-speech-bubble {
      background: #fff; border: 1px solid #cbd5e1; border-radius: .7rem; padding: .45rem .65rem; font-size: .8rem;
      color: #1e293b; line-height: 1.45; position: relative; flex: 1; font-weight: 500;
    }
    .tb-speech-bubble::before {
      content: ''; position: absolute; left: -6px; top: 50%; transform: translateY(-50%);
      border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 6px solid #fff;
    }
    .highlight-material { color: #0f3460; background: rgba(0, 255, 245, 0.25); padding: 0 2px; border-radius: 3px; font-weight: bold; }
    .highlight-product { color: #d35400; background: rgba(255, 222, 89, 0.35); padding: 0 2px; border-radius: 3px; font-weight: bold; }

    /* 避難訓練ミニゲームエリア */
    #minigameContainer { display: none; flex: 1; flex-direction: column; gap: .5rem; position: relative; }
    .status-panel {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .2rem .6rem;
      background: rgba(22,33,62,0.8); border: 1px solid #00fff5; padding: .4rem .6rem; border-radius: .5rem; font-size: .78rem;
    }
    .message-banner {
      background: #fff; color: #0f3460; padding: .5rem .7rem; border-radius: .7rem; font-size: .9rem; font-weight: bold;
      text-align: center; min-height: 2.4rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,255,245,0.3); border: 2px solid #00fff5; flex-shrink: 0;
    }
    .game-area {
      width: min(100%, max(14rem, calc(100vh - 19rem))); aspect-ratio: 1 / 1; margin: 0 auto; flex-shrink: 0;
      background: rgba(15,23,42,0.9); border: 2px solid #00fff5; border-radius: .8rem; padding: .5rem;
      display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: .4rem; position: relative;
    }
    .card-door {
      background: #16213e; border: 2px solid #00fff5; border-radius: .5rem; cursor: pointer; touch-action: manipulation;
      display: flex; align-items: flex-end; justify-content: center; position: relative; overflow: hidden; transition: transform 0.2s; min-width: 0; min-height: 0;
    }
    .card-door.flipped { background: #0f3460; border-color: #ffde59; }
    .card-door img.chara-img { width: 95%; height: 95%; object-fit: contain; object-position: bottom center; display: none; }
    .card-door.flipped img.chara-img { display: block; }
    .card-door img.card-back { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: block; }
    .card-door.flipped img.card-back { display: none; }

    @media (orientation: landscape) and (min-width: 700px) {
      #refineryMain { display: grid; grid-template-columns: 1.2fr 1fr; align-items: start; gap: .7rem; }
      #refineryMain > .card-gacha { grid-column: 1; grid-row: 1 / span 3; }
      #refineryMain > .card-inv, #refineryMain > .tb-guide-card, #refineryMain > .action-stack { grid-column: 2; }
      .chara-img-wrap { max-height: calc(100vh - 25rem); min-height: 12rem; }
      .inventory-list { max-height: 9rem; }
    }

    /* ═══ 🔍 画像拡大ビューア ═══ */
    .viewer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; background: rgba(5, 8, 18, 0.97); display: none; flex-direction: column; }
    .viewer.open { display: flex; }
    .viewer-stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; cursor: grab; }
    .viewer-stage.dragging { cursor: grabbing; }
    .viewer-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: center center;
      will-change: transform; pointer-events: none; -webkit-user-drag: none;
    }
    .viewer-close {
      position: absolute; z-index: 310; top: calc(.6rem + env(safe-area-inset-top, 0px)); right: calc(.6rem + env(safe-area-inset-right, 0px));
      width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 2px solid #e94560; background: rgba(15,23,42,.85);
      color: #fff; font-size: 1.2rem; cursor: pointer; touch-action: manipulation;
    }
    .viewer-hint {
      position: absolute; z-index: 305; left: 0; right: 4.5rem; top: calc(.9rem + env(safe-area-inset-top, 0px)); padding-left: .8rem;
      font-size: .72rem; color: #94a3b8; pointer-events: none; text-shadow: 0 1px 3px #000;
    }
    .viewer-bar {
      flex-shrink: 0; display: flex; justify-content: center; align-items: center; gap: .6rem; background: #16213e; border-top: 2px solid #00fff5;
      padding: .5rem .8rem calc(.5rem + env(safe-area-inset-bottom, 0px)); z-index: 310;
    }
    .viewer-bar button {
      min-width: 2.8rem; min-height: 2.8rem; padding: 0 .8rem; border-radius: .7rem; border: 1px solid #00fff5;
      background: rgba(0,255,245,0.12); color: #00fff5; font-size: 1.1rem; font-weight: bold; cursor: pointer; touch-action: manipulation; font-family: inherit;
    }
    .viewer-bar button:active { transform: scale(0.95); }
    .viewer-scale { min-width: 3.5rem; text-align: center; font-weight: bold; font-size: .9rem; color: #ffde59; }

    /* ═══ 下部フッター（ナビゲーション） ═══ */
    .nav {
      flex-shrink: 0; position: relative; z-index: 50; background: #16213e; border-top: 2px solid #1f293d;
      display: flex; justify-content: space-around; align-items: stretch; gap: .3rem;
      padding: .4rem .5rem calc(.4rem + env(safe-area-inset-bottom, 0px));
    }
    .nav-item {
      color: #a0aec0; cursor: pointer; text-align: center; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 245, 0.2); border-radius: .7rem; padding: .3rem .2rem;
      min-height: 3rem; font-size: .72rem; font-weight: bold; flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
      transition: all 0.2s; touch-action: manipulation; z-index: 55;
    }
    .nav-ico { font-size: 1.15rem; line-height: 1; display: block; }
    .nav-item:active { transform: scale(0.95); }
    .nav-item.active { color: #00fff5; background: rgba(0, 255, 245, 0.15); border-color: #00fff5; box-shadow: 0 0 8px rgba(0, 255, 245, 0.3); }

    /* モーダル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 15, 30, 0.85); display: flex; justify-content: center; align-items: center;
      z-index: 200; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); padding: 1rem;
    }
    .modal-content {
      background: #16213e; border: 2px solid #00fff5; border-radius: 1rem; padding: 1.2rem 1rem;
      width: 100%; max-width: 22rem; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 245, 0.3);
      animation: popup 0.3s ease-out; position: relative; z-index: 210;
    }
    .modal-title { font-size: 1.05rem; font-weight: bold; color: #ffde59; margin-bottom: .4rem; }
    .modal-desc { font-size: .88rem; color: #f1f5f9; margin-bottom: .8rem; line-height: 1.55; white-space: pre-line; }
    @keyframes popup { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- BGMおよび効果音 -->
  <audio id="bgm" src="BGM_seisei.ogg" loop preload="auto"></audio>
  <audio id="bgm-hinan" src="BGM_hinan.ogg" loop preload="auto"></audio>
  <audio id="se-nyu1" src="nyu1.mp3" preload="auto"></audio>
  <audio id="se-nyu2" src="nyu2.mp3" preload="auto"></audio>
  <audio id="se-itemget" src="itemget.mp3" preload="auto"></audio>
  <audio id="se-fuseikai" src="mini_fuseikai.mp3" preload="auto"></audio>
  <audio id="se-gogogo" src="gogogo.mp3" preload="auto"></audio>
  <audio id="se-type" src="SE_gacha.mp3" preload="auto"></audio>
  <audio id="se-seikai" src="mini_seikai.mp3" preload="auto"></audio>

  <div class="phone">
    <!-- ヘッダー -->
    <div class="header">
      <span>💰 <span id="money">1,500</span> G</span>
      <span>🌟 Lv.<span id="level">1</span></span>
      <span>📦 掘削物: <span id="mud">5</span>個</span>
      <button id="bgm-btn" class="bgm-btn" onclick="toggleBGM()">🎵 ON</button>
    </div>

    <!-- 工程ナビゲーションバー -->
    <div class="koutei-bar">
      <div class="koutei-wrapper" onclick="goToMap()" style="cursor: pointer;">
        <div class="koutei-item"><img src="koutei1.png" alt="採掘" onerror="this.style.display='none'"></div>
        <div class="koutei-label">1.採掘</div>
      </div>
      <div class="koutei-wrapper" onclick="goToMap()" style="cursor: pointer;">
        <div class="koutei-item"><img src="koutei2.png" alt="運搬" onerror="this.style.display='none'"></div>
        <div class="koutei-label">2.運搬</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item active"><img src="koutei3.png" alt="精製" onerror="this.style.display='none'"></div>
        <div class="koutei-label">3.精製</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item active"><img src="koutei4.png" alt="インゴット" onerror="this.style.display='none'"></div>
        <div class="koutei-label">4.素材</div>
      </div>
      <div class="koutei-wrapper" onclick="goToFactory()" style="cursor: pointer;">
        <div class="koutei-item"><img src="koutei5.png" alt="製造" onerror="this.style.display='none'"></div>
        <div class="koutei-label">5.製造</div>
      </div>
      <div class="koutei-wrapper" onclick="goToFactory()" style="cursor: pointer;">
        <div class="koutei-item"><img src="koutei6.png" alt="出荷" onerror="this.style.display='none'"></div>
        <div class="koutei-label">6.出荷</div>
      </div>
    </div>

    <!-- コンテンツエリア -->
    <div class="content">

      <!-- 通常の精製画面メイン -->
      <div id="refineryMain">
        <div class="card card-gacha">
          <div class="card-title">🧪 元素精製プラント</div>

          <div class="gacha-result-box">
            <div class="chara-img-wrap">
              <img class="chara-avatar-img" id="chara-img" src="seisei.png" alt="精製プラント" onerror="this.src='chara0_Y.png'" onclick="openViewer()">
              <button type="button" class="zoom-btn" onclick="openViewer()" aria-label="画像を拡大表示">🔍</button>
            </div>
            <div class="chara-name-tag" id="chara-name">🏭 プラント待機中</div>
            <div class="speech-bubble" id="chara-speech">精製ボタンを押すと、元素が抽出されます！</div>
          </div>

          <button class="btn" onclick="refineElement()">✨ 精製する (コスト: 50G / 掘削物1個)</button>
        </div>

        <div class="card card-inv">
          <div class="card-title">📦 所持元素コレクション</div>
          <div class="inventory-list" id="inventory-box"></div>
        </div>

        <div class="tb-guide-card">
          <img src="navtb.png" alt="テルビウム" class="tb-avatar-circle" onerror="this.src='chara0_Tb.png'">
          <div class="tb-speech-bubble">
            掘削物を精製して<span class="highlight-material">レアアースの素材</span>を作ったら、次はそれらを材料に<span class="highlight-product">工業製品</span>をつくってみよう！
          </div>
        </div>

        <div class="action-stack">
          <button class="btn-next-step" onclick="goToFactory()">🏭 製造工場にすすむ</button>
          <button class="btn-recycle-shortcut" onclick="goToRecycle()">♻️ お金が足りない場合はリサイクル工場で働く</button>
        </div>
      </div>

      <!-- 避難訓練ミニゲームエリア -->
      <div id="minigameContainer">
        <div class="status-panel">
          <span>安全確認: <span id="pairs">0</span> / 8組</span>
          <span>⏱️ 経過: <span id="time">0</span>秒 | ミス: <span id="miss">0</span>回</span>
        </div>

        <div id="messageBanner" class="message-banner">
          各エリアのドアを開けて安全を確認しよう！
        </div>

        <div class="game-area" id="gameArea"></div>
      </div>
    </div>

    <!-- モーダル（共通） -->
    <div id="minigameModal" class="modal-overlay" style="display: none;">
      <div class="modal-content" id="modal-content-inner">
      </div>
    </div>

    <!-- 下部ナビゲーション -->
    <div class="nav">
      <div class="nav-item" onclick="goToMap()"><span class="nav-ico">🗺️</span>マップ</div>
      <div class="nav-item active" onclick="location.href='seisei.html'"><span class="nav-ico">🧪</span>精製</div>
      <div class="nav-item" onclick="goToFactory()"><span class="nav-ico">🏭</span>工場</div>

  <script>
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
      document.addEventListener(ev, e => e.preventDefault())

    document.addEventListener('dblclick', e => e.preventDefault());
    
    let savedData = JSON.parse(localStorage.getItem('rareEarthGameState'));
    let gameState = savedData || {
      money: 1500,
      level: 1,
      mudStock: 5,
      elements: {}
    };

    const bgm = document.getElementById('bgm');
    const bgmHinan = document.getElementById('bgm-hinan');
    const bgmBtn = document.getElementById('bgm-btn');
    bgm.volume = 0.3;
    bgmHinan.volume = 0.3;

    let isMuted = localStorage.getItem('bgmMutedSeisei') === 'true';

    function updateBgmUI() {
      if (isMuted) {
        bgm.muted = true;
        bgmHinan.muted = true;
        bgmBtn.innerText = '🔇 OFF';
        bgmBtn.classList.add('muted');
      } else {
        bgm.muted = false;
        bgmHinan.muted = false;
        bgmBtn.innerText = '🎵 ON';
        bgmBtn.classList.remove('muted');
      }
    }

    function toggleBGM() {
      isMuted = !isMuted;
      localStorage.setItem('bgmMutedSeisei', isMuted);
      updateBgmUI();
      let activeBgm = document.getElementById('minigameContainer').style.display === 'flex' ? bgmHinan : bgm;
      if (!isMuted) {
        activeBgm.play().catch(() => {});
      } else {
        bgm.pause();
        bgmHinan.pause();
      }
    }

    function startBgmOnFirstInteraction() {
      updateBgmUI();
      if (!isMuted) {
        bgm.play().then(() => {
          document.removeEventListener('click', startBgmOnFirstInteraction);
          document.removeEventListener('touchstart', startBgmOnFirstInteraction);
        }).catch(err => {});
      }
    }

    window.addEventListener('load', () => {
      updateBgmUI();
      if (!isMuted) {
        bgm.play().catch(() => {
          document.addEventListener('click', startBgmOnFirstInteraction);
          document.addEventListener('touchstart', startBgmOnFirstInteraction);
        });
      }
    });

    const allKeys = ['Y', 'La', 'Ce', 'Pr', 'Nd', 'Pm', 'Sm', 'Eu', 'Gd', 'Tb', 'Dy', 'Ho', 'Er', 'Tm', 'Yb', 'Lu', 'Sc'];

    function updateUI() {
      document.getElementById('money').innerText = gameState.money.toLocaleString();
      document.getElementById('level').innerText = gameState.level;
      document.getElementById('mud').innerText = gameState.mudStock;

      const invBox = document.getElementById('inventory-box');
      invBox.innerHTML = '';
      
      let hasItem = false;
      for (let key in gameState.elements) {
        if (gameState.elements[key] > 0) {
          hasItem = true;
          const div = document.createElement('div');
          div.className = 'inv-item';
          div.innerText = `🔹 ${elementsMaster[key].name}: ${gameState.elements[key]}個`;
          invBox.appendChild(div);
        }
      }
      if (!hasItem) {
        invBox.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #8a8a8a; padding: 0.375rem 0;">まだ元素がありません。精製しよう！</div>';
      }
    }

    function getRandomElementKey() {
      const keys = Object.keys(elementsMaster);
      let pool = [];
      keys.forEach(k => {
        if (elementsMaster[k].type === 'light') {
          pool.push(k, k, k);
        } else {
          pool.push(k);
        }
      });
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function executeNormalRefine(targetKey, multiplier = 1) {
      const picked = elementsMaster[targetKey];
      gameState.elements[targetKey] += multiplier;

      const imgEl = document.getElementById('chara-img');
      imgEl.src = picked.img;
      imgEl.alt = picked.name;
      
      let multText = multiplier > 1 ? ` 【${multiplier}倍ボーナス達成！】` : multiplier === 0 ? ` 【ハズレ…0個】` : '';
      document.getElementById('chara-name').innerText = `✨ ${picked.name} (${targetKey}) を ${multiplier}個 精製！${multText}`;
      document.getElementById('chara-speech').innerText = picked.speech;

      imgEl.classList.remove('pop-anim');
      void imgEl.offsetWidth; 
      imgEl.classList.add('pop-anim');

      localStorage.setItem('rareEarthGameState', JSON.stringify(gameState));
      updateUI();
    }

    function showShortageModal(type) {
      const modal = document.getElementById('minigameModal');
      const content = document.getElementById('modal-content-inner');

      const isMudOnlyShortage = (gameState.mudStock <= 0 && gameState.money >= 50);

      let navImg = "navtb.png";
      let navName = "テルビウム";

      let bubbleText = "";
      let titleText = "";
      let descText = "";
      let actionBtnHTML = "";

      if (isMudOnlyShortage) {
        titleText = "掘削物が足りません！";
        bubbleText = "掘削物がなくなっちゃったね！資金はまだあるから、MAPに行って掘削物を掘ってこよう！";
        descText = "マップ（採掘エリア）に戻って新しい掘削物を獲得してください。";
        actionBtnHTML = `<button class="btn" style="margin-top:0; background:#00fff5; color:#0f3460;" onclick="goToMap()">🗺️ MAPに戻る</button>`;
      } else if (type === 'money' || gameState.money < 50) {
        titleText = "資金が足りません！";
        bubbleText = "精製資金が足りなくなっちゃったみたい…！リサイクル工場（都市鉱山）に行って資金を稼いでこよう！";
        descText = "リサイクル工場で不用品を分解・精製して資金を確保してください。";
        actionBtnHTML = `<button class="btn" style="margin-top:0; background:#00fff5; color:#0f3460;" onclick="goToRecycle()">♻️ 工場へ行く</button>`;
      } else {
        titleText = "掘削物・資金が足りません！";
        bubbleText = "掘削物も資金も不足しているよ！まずはリサイクル工場かマップで準備を整えよう！";
        descText = "マップで掘削物を探すか、工場で資金を集めてください。";
        actionBtnHTML = `<button class="btn" style="margin-top:0; background:#00fff5; color:#0f3460;" onclick="goToRecycle()">♻️ 工場へ行く</button>`;
      }

      content.innerHTML = `
        <div class="guide-container" style="display:flex; align-items:center; gap:.6rem; background:rgba(22, 33, 62, 0.95); border:1px solid #00fff5; border-radius:.7rem; padding:.5rem; margin-bottom:.5rem; text-align:left;">
          <img src="${navImg}" alt="${navName}" style="width:3rem; height:3rem; border-radius:50%; border:2px solid #00fff5; object-fit:cover; flex-shrink:0;" onerror="this.src='chara0_Tb.png'">
          <div style="background:#f8f9fa; border:1px solid #00fff5; border-radius:.6rem; padding:.4rem .55rem; font-size:.8rem; color:#1a1a2e; font-weight:bold; flex:1; line-height:1.4;">
            ${bubbleText}
          </div>
        </div>
        <div style="font-size: 0.95rem; font-weight: bold; color: #ff4757; margin-bottom: 0.3rem;">⚠️ ${titleText}</div>
        <div style="font-size: 0.8rem; color: #dcdde1; margin-bottom: 0.8rem; line-height: 1.4;">
          ${descText}
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn" style="margin-top:0; background:#333; color:#aaa;" onclick="closeMinigameModal()">キャンセル</button>
          ${actionBtnHTML}
        </div>
      `;
      modal.style.display = 'flex';
    }

    function goToRecycle() {
      const se = document.getElementById('se-gogogo');
      if (se) { se.currentTime = 0; se.play().catch(e => {}); }
      setTimeout(() => { location.href = 'recycle.html'; }, 200);
    }

    function goToFactory() {
      const se = document.getElementById('se-gogogo');
      if (se) { se.currentTime = 0; se.play().catch(e => {}); }
      setTimeout(() => { location.href = 'factory.html'; }, 200);
    }

    function goToMap() {
      const se = document.getElementById('se-gogogo');
      if (se) { se.currentTime = 0; se.play().catch(e => {}); }
      setTimeout(() => { location.href = 'map.html'; }, 200);
    }

    function refineElement() {
      if (gameState.mudStock <= 0) {
        showShortageModal('mud');
        return;
      }
      if (gameState.money < 50) {
        showShortageModal('money');
        return;
      }

      const soundId = Math.random() < 0.5 ? 'se-nyu1' : 'se-nyu2';
      const se = document.getElementById(soundId);
      if (se) { se.currentTime = 0; se.play().catch(e => {}); }

      gameState.money -= 50;
      gameState.mudStock--;

      const targetKey = getRandomElementKey();

      if (Math.random() < 0.03) {
        showHinanModal();
      } else {
        const roll = Math.random();
        if (roll < 0.10) {
          showHighLowMinigame(targetKey);
        } else {
          executeNormalRefine(targetKey, 1);
          
          if (targetKey === 'Ho' && Math.random() < 0.08) {
            setTimeout(showHoBilliardsModal, 500);
          }
        }
      }
    }

    function showHoBilliardsModal() {
      const modal = document.getElementById('minigameModal');
      const content = document.getElementById('modal-content-inner');
      const hoData = elementsMaster['Ho'];

      content.innerHTML = `
        <div style="font-size: 1.1rem; font-weight: bold; color: #ffde59; margin-bottom: 0.4rem;">🎯 ホルミウム・ビリヤード発生！</div>
        
        <div style="background: #ffffff; border: 2px solid #ffde59; border-radius: 0.5rem; padding: 0.4rem; margin-bottom: 0.5rem; text-align: center;">
          <img src="${hoData.img}" style="width: 5rem; height: 5rem; object-fit: contain;" alt="${hoData.name}" onerror="this.src='chara0_Ho.png'">
        </div>

        <div style="font-size: 0.8rem; color: #f1f5f9; background: rgba(15,23,42,0.8); border: 1px solid #00fff5; border-radius: 0.5rem; padding: 0.5rem; margin-bottom: 0.7rem; text-align: left; line-height: 1.4; font-weight: bold;">
          「正確無比な医療用レーザーをしっかりサポート！よし、ビリヤードの腕前も披露しちゃうよ！」
        </div>

        <div style="font-size: 0.75rem; color: #dcdde1; margin-bottom: 0.7rem; line-height: 1.4;">
          ホルミウムと一緒にレーザー・バンクショットで病気をやっつけに行こう！
        </div>

        <div style="display: flex; gap: 0.5rem;">
          <button class="btn" style="margin-top:0; background:#333; color:#aaa;" onclick="closeMinigameModal()">あとで</button>
          <button class="btn" style="margin-top:0; background:#00fff5; color:#0f3460;" onclick="startHoBilliards()">🎮 チャレンジする！</button>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function startHoBilliards() {
      const se = document.getElementById('se-gogogo');
      if (se) { se.currentTime = 0; se.play().catch(e => {}); }
      setTimeout(() => {
        location.href = 'ho_billiards.html';
      }, 200);
    }

    function showHinanModal() {
      const modal = document.getElementById('minigameModal');
      const content = document.getElementById('modal-content-inner');

      content.innerHTML = `
        <div style="font-size: 1.8rem;">🚨</div>
        <div style="font-size: 1rem; font-weight: bold; color: #00fff5; margin: 0.3rem 0;">【緊急警報】セキュリティ訓練</div>
        
        <div style="font-size: 0.78rem; color: #dcdde1; text-align: left; line-height: 1.4; margin-bottom: 0.4rem; background: rgba(15,23,42,0.8); padding: 0.4rem; border-radius: 0.4rem;">
          本日は、緊急避難訓練を実施します📢各エリアに点在しているスタッフのペアを確認し、全員の安全を確保してください！
        </div>

        <div style="margin: 0.3rem 0; text-align: center;">
          <img src="chara_Pm.png" alt="案内スタッフ" style="width: 5rem; height: 5rem; object-fit: contain;" onerror="this.src='chara0_Pm.png'">
        </div>

        <button class="btn" style="background: #00fff5; color: #0f3460; font-size: 0.85rem; padding: 0.6rem; margin-top: 0.4rem;" onclick="startHinanMinigame()">
          🚀 訓練を開始する！
        </button>

        <div style="margin-top: 0.5rem; text-align: center;">
          <span style="font-size: 0.72rem; color: #64748b; cursor: pointer; text-decoration: underline; opacity: 0.8; display: inline-block; padding: 0.4rem;" onclick="closeMinigameModal()">
            …またの機会にしてください。
          </span>
        </div>
      `;
      modal.style.display = 'flex';
    }

    let hinanFlippedCards = [];
    let hinanMatchedPairs = 0;
    let hinanMissCount = 0;
    let hinanSeconds = 0;
    let hinanTimerInterval = null;
    let hinanIsLocked = false;

    function startHinanMinigame() {
      closeMinigameModal();
      document.getElementById('refineryMain').style.display = 'none';
      document.getElementById('minigameContainer').style.display = 'flex';

      if (!isMuted) {
        bgm.pause();
        bgmHinan.currentTime = 0;
        bgmHinan.play().catch(e => {});
      }

      hinanSeconds = 0;
      hinanMatchedPairs = 0;
      hinanMissCount = 0;
      document.getElementById('pairs').innerText = hinanMatchedPairs;
      document.getElementById('time').innerText = hinanSeconds;
      document.getElementById('miss').innerText = hinanMissCount;
      document.getElementById('messageBanner').innerText = "各エリアのドアを開けて安全を確認しよう！";

      if (hinanTimerInterval) clearInterval(hinanTimerInterval);
      hinanTimerInterval = setInterval(() => {
        hinanSeconds++;
        document.getElementById('time').innerText = hinanSeconds;
      }, 1000);

      initHinanBoard();
    }

    function initHinanBoard() {
      const gameArea = document.getElementById('gameArea');
      gameArea.innerHTML = '';

      let shuffledChars = [...allKeys].sort(() => 0.5 - Math.random());
      let selectedChars = shuffledChars.slice(0, 8);

      let cardArray = [...selectedChars, ...selectedChars];
      cardArray.sort(() => 0.5 - Math.random());

      cardArray.forEach((charName) => {
        const card = document.createElement('div');
        card.className = 'card-door';
        card.dataset.char = charName;

        card.innerHTML = `
          <img class="chara-img" src="chara0_${charName}.png" alt="${charName}" onerror="this.src='chara0_Y.png'">
          <img class="card-back" src="card_back.png" alt="ドア" onerror="this.outerHTML='<div style=\\\'font-size:16px; color:#00fff5;\\\'>🚪</div>'">
        `;

        card.addEventListener('click', () => flipHinanCard(card));
        gameArea.appendChild(card);
      });
    }

    function flipHinanCard(card) {
      if (hinanIsLocked) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      const seType = document.getElementById('se-type');
      if (seType) { seType.currentTime = 0; seType.play().catch(e => {}); }

      card.classList.add('flipped');
      hinanFlippedCards.push(card);

      if (hinanFlippedCards.length === 2) {
        checkHinanMatch();
      }
    }

    function checkHinanMatch() {
      hinanIsLocked = true;
      const [card1, card2] = hinanFlippedCards;
      const charName = card1.dataset.char;
      const charObj = elementsMaster[charName] || { name: charName };
      const charFullName = charObj.name;

      if (charName === card2.dataset.char) {
        const seSeikai = document.getElementById('se-seikai');
        if (seSeikai) { seSeikai.currentTime = 0; seSeikai.play().catch(e => {}); }

        card1.classList.add('matched');
        card2.classList.add('matched');
        hinanMatchedPairs++;
        document.getElementById('pairs').innerText = hinanMatchedPairs;
        hinanFlippedCards = [];
        hinanIsLocked = false;

        const templates = [
          `${charFullName}無事でーす！`,
          `${charFullName}、ペア確認できました！`,
          `${charFullName}いま～す`,
          `${charFullName}無事です👍`
        ];
        const randomMsg = templates[Math.floor(Math.random() * templates.length)];

        if (hinanMatchedPairs === 8) {
          document.getElementById('messageBanner').innerText = "安全ヨシ！お疲れ様でした！";
          if (hinanTimerInterval) clearInterval(hinanTimerInterval);
          setTimeout(endHinanMinigame, 1500);
        } else {
          document.getElementById('messageBanner').innerText = randomMsg;
        }

      } else {
        hinanMissCount++;
        document.getElementById('miss').innerText = hinanMissCount;

        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          hinanFlippedCards = [];
          hinanIsLocked = false;

    function evalHighLow(targetKey, baseNum, baseSymbol, secretNum, secretName, secretSymbol, playerGuess) {

      if (secretNum >= baseNum) {
        leftSymbol = secretSymbol; leftNum = secretNum;

    function closeMinigameModal() {
      document.getElementById('minigameModal').style.display = 'none';
    }

    const VIEWER_MAX = 6;
    const vw = { s: 1, x: 0, y: 0, pts: new Map(), d0: 0, s0: 1, moved: false, tapT: 0, tapX: 0, tapY: 0 };
    const vStage = document.getElementById('viewerStage');
    const vImg = document.getElementById('viewerImg');

    function viewerBounds() {
      const r = vStage.getBoundingClientRect();
      const nw = vImg.naturalWidth || r.width, nh = vImg.naturalHeight || r.height;
      const fit = Math.min(r.width / nw, r.height / nh);
      return { mx: Math.max(0, (nw * fit * vw.s - r.width) / 2), my: Math.max(0, (nh * fit * vw.s - r.height) / 2) };
    }
    function applyViewer() {
      const b = viewerBounds();
      vw.x = Math.max(-b.mx, Math.min(b.mx, vw.x));
      vw.y = Math.max(-b.my, Math.min(b.my, vw.y));
      vImg.style.transform = `translate(${vw.x}px, ${vw.y}px) scale(${vw.s})`;
      document.getElementById('viewerScale').textContent = Math.round(vw.s * 100) + '%';
    }
    function viewerZoomAt(cx, cy, ns) {
      ns = Math.min(VIEWER_MAX, Math.max(1, ns));
      const r = vStage.getBoundingClientRect();
      const px = cx - (r.left + r.width / 2), py = cy - (r.top + r.height / 2);
      const k = ns / vw.s;
      vw.x = px - (px - vw.x) * k; vw.y = py - (py - vw.y) * k; vw.s = ns;
      applyViewer();
    }
    function viewerStep(dir) {
      const r = vStage.getBoundingClientRect();
      viewerZoomAt(r.left + r.width / 2, r.top + r.height / 2, vw.s * (dir > 0 ? 1.5 : 1 / 1.5));
    }
    function viewerReset() { vw.s = 1; vw.x = 0; vw.y = 0; applyViewer(); }
    function openViewer() {
      vImg.src = document.getElementById('chara-img').src;
      viewerReset();
      document.getElementById('imgViewer').classList.add('open');
    }
    function closeViewer() { document.getElementById('imgViewer').classList.remove('open'); vw.pts.clear(); }
    vImg.addEventListener('load', applyViewer);
    window.addEventListener('resize', () => { if (document.getElementById('imgViewer').classList.contains('open')) applyViewer(); });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('imgViewer').classList.contains('open')) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === '+' || e.key === '=') viewerStep(1);
      else if (e.key === '-') viewerStep(-1);
    });

    vStage.addEventListener('wheel', e => {
      e.preventDefault();
      viewerZoomAt(e.clientX, e.clientY, vw.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
    }, { passive: false });

    vStage.addEventListener('pointerdown', e => {
      vStage.setPointerCapture(e.pointerId);
      vw.pts.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
      if (vw.pts.size === 1) vw.moved = false;
      if (vw.pts.size === 2) {
        const [a, b] = [...vw.pts.values()];
        vw.d0 = Math.hypot(a.x - b.x, a.y - b.y); vw.s0 = vw.s; vw.moved = true;
      }
      vStage.classList.add('dragging');
    });
    vStage.addEventListener('pointermove', e => {
      const p = vw.pts.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 8) vw.moved = true;
      p.x = e.clientX; p.y = e.clientY;
      if (vw.pts.size === 2 && vw.d0 > 0) {
        const [a, b] = [...vw.pts.values()];
        viewerZoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, vw.s0 * Math.hypot(a.x - b.x, a.y - b.y) / vw.d0);
      } else if (vw.pts.size === 1 && vw.s > 1) {
        vw.x += dx; vw.y += dy; applyViewer();
      }
    });
    function endPointer(e) {
      if (!vw.pts.has(e.pointerId)) return;
      vw.pts.delete(e.pointerId);
      if (vw.pts.size === 0) vStage.classList.remove('dragging');
      if (e.type === 'pointerup' && vw.pts.size === 0 && !vw.moved) {
        const now = Date.now();
        if (now - vw.tapT < 320 && Math.hypot(e.clientX - vw.tapX, e.clientY - vw.tapY) < 30) {
          viewerZoomAt(e.clientX, e.clientY, vw.s > 1.05 ? 1 : 2.5); vw.tapT = 0;
        } else { vw.tapT = now; vw.tapX = e.clientX; vw.tapY = e.clientY; }
      }
    }
    vStage.addEventListener('pointerup', endPointer);
    vStage.addEventListener('pointercancel', endPointer);

    updateUI();
  </script>
</body>
