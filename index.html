<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レアアース・クラフト - レアアース17元素キャラ図鑑</title>
<meta name="description" content="スマホ、電気自動車、最新の医療機器……。現代の産業や医療に欠かせないレアアースの「唯一無二の力」を体験するゲーム。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1224;--panel:#16213e;--deep:#0f3460;--cyan:#00fff5;--pink:#e94560;--yellow:#ffde59;--ink:#eaf2ff;--mute:#9db0cf;--maxw:720px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(15px,calc(13px + .9vw),19px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;line-height:1.7;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:var(--maxw);margin:0 auto;background:var(--deep);min-height:100vh;box-shadow:0 0 0 1px var(--panel),0 0 40px rgba(0,0,0,.6)}
.hero{background:linear-gradient(135deg,var(--panel),var(--deep));min-height:4rem}
.hero img{display:block;width:100%;height:auto}
.title{padding:1.3rem 1.2rem .4rem}
.site{margin:0;font-size:.78rem;color:var(--cyan);font-weight:700}
h1{margin:.2rem 0 .6rem;font-size:2rem;line-height:1.25;font-weight:900;letter-spacing:.02em}
.lead{margin:0;font-size:.92rem;color:var(--ink)}
.start{margin:1.2rem 1.2rem 0;padding:1rem;background:var(--panel);border:1px solid var(--cyan);border-radius:.9rem}
.status{margin:0 0 .8rem;font-size:.85rem;color:var(--mute);display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.status b{color:var(--yellow);font-size:1rem}
.btn{display:block;width:100%;min-height:3rem;border:0;border-radius:.8rem;font:inherit;font-weight:900;font-size:1.05rem;cursor:pointer;background:var(--cyan);color:var(--deep);margin-top:.5rem}
.btn.sub{background:transparent;color:var(--ink);border:1px solid var(--mute);font-weight:700;font-size:.9rem;min-height:2.6rem}
.btn.ghost{background:none;border:0;color:var(--mute);font-weight:500;font-size:.8rem;text-decoration:underline;min-height:2.2rem}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h2{margin:2rem 1.2rem .2rem;font-size:1.15rem;font-weight:900}
.sub-h{margin:0 1.2rem 1rem;font-size:.8rem;color:var(--mute)}
.line{list-style:none;margin:0;padding:0 1.2rem;position:relative}
.line::before{content:"";position:absolute;left:calc(1.2rem + 1.45rem);top:1.5rem;bottom:1.5rem;width:3px;background:linear-gradient(var(--cyan),var(--pink));opacity:.7}
.line li{position:relative;display:flex;gap:.9rem;align-items:center;padding:.5rem 0}
.ico{flex:none;width:3rem;height:3rem;background:#000;border:2px solid var(--cyan);border-radius:.5rem;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico .em{display:none;font-size:1.5rem}
.ico.noimg .em{display:block}
.line h3{margin:0;font-size:.98rem;font-weight:900}
.line p{margin:0;font-size:.8rem;color:var(--mute);line-height:1.5}
footer{margin-top:2rem;padding:1.2rem;border-top:2px solid var(--pink);background:var(--panel);font-size:.75rem;color:var(--mute)}
footer a{color:var(--cyan)}footer p{margin:.2rem 0}
/* チュートリアル */
#tut{position:fixed;inset:0;z-index:20;background:rgba(5,9,20,.94);display:none;overflow-y:auto}
#tut.open{display:block}
.tbox{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--deep);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.tbar{display:flex;justify-content:space-around;background:rgba(15,23,42,.9);border-bottom:1px solid var(--cyan);padding:.5rem .25rem}
.tbar div{text-align:center;font-size:.6rem;opacity:.45;transition:opacity .25s}
.tbar div.on{opacity:1}
.tbar .ico{width:2.4rem;height:2.4rem;margin:0 auto .1rem;border-color:transparent}
.tbar .on .ico{border-color:var(--yellow)}
.tbody{flex:1;padding:1.2rem;display:flex;flex-direction:column;align-items:center;text-align:center}
.big{width:7rem;height:7rem;border-radius:1rem;margin-bottom:.8rem}
.big .em{font-size:3.4rem}
.chip{display:inline-block;background:var(--pink);color:#fff;font-size:.75rem;font-weight:700;padding:.1rem .8rem;border-radius:1rem}
#tt{margin:.4rem 0;font-size:1.5rem;font-weight:900;line-height:1.3}
.guide{display:flex;gap:.6rem;align-items:center;text-align:left;background:rgba(22,33,62,.9);border:1px solid var(--cyan);border-radius:.8rem;padding:.6rem;margin-top:.6rem;width:100%}
.guide img{width:4rem;height:4rem;object-fit:contain;flex:none}
.bubble{background:#f8f9fa;color:#1a1a2e;font-weight:700;font-size:.9rem;line-height:1.55;border-radius:.6rem;padding:.55rem .75rem;flex:1}
.tnav{display:flex;gap:.6rem;padding:.8rem 1.2rem 1rem;align-items:center}
.tnav .btn{margin:0;flex:1}.tnav .btn.sub{flex:none;width:6rem}
.dots{text-align:center;font-size:.75rem;color:var(--mute);padding-bottom:.2rem}
.skip{display:block;margin:0 auto .8rem;width:auto;padding:0 1rem}
@media (prefers-reduced-motion:reduce){.tbar div{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="header.png" alt="レアアース17元素キャラ図鑑 - 未来をつくる元素たち -" onerror="this.remove()"></div>

  <section class="title">
    <p class="site">レアアース17元素キャラ図鑑 - 未来をつくる元素たち -</p>
    <h1>レアアース・クラフト</h1>
    <p class="lead">スマホ、電気自動車、最新の医療機器……。現代の産業や医療に欠かせない場所で活躍する大切な成分、それがレアアース。掘って、精製して、つくって、届けながら、彼らの「唯一無二の力」を体験しよう。</p>
  </section>

  <section class="start" aria-live="polite">
    <p class="status" id="status"></p>
    <div id="actions"></div>
  </section>

  <h2>レアアースが製品になるまで</h2>
  <p class="sub-h">ゲームは、この6つの工程をたどって進みます。</p>
  <ol class="line" id="line"></ol>

  <footer>
    <p>知れば知るほど愛着がわく、17元素の物語。</p>
    <p><a href="https://17rareearth.github.io/17character/">レアアース17元素キャラ図鑑 公式サイトへ</a></p>
    <p>イラスト：バルバロッサ上田 ／ BGM：MusMus ／ 効果音：効果音ラボ</p>
  </footer>
</div>

<div id="tut" role="dialog" aria-modal="true" aria-label="あそびかた">
  <div class="tbox">
    <div class="tbar" id="tbar"></div>
    <div class="tbody">
      <div class="ico big" id="tico"></div>
      <span class="chip" id="tw"></span>
      <div id="tt"></div>
      <div class="guide">
        <img src="navtb.png" alt="テルビウム" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='hata_cn.png'}else{this.remove()}">
        <div class="bubble" id="tb"></div>
      </div>
    </div>
    <div class="dots" id="td"></div>
    <div class="tnav">
      <button class="btn sub" id="tprev">もどる</button>
      <button class="btn" id="tnext">つぎへ</button>
    </div>
    <button class="btn ghost skip" id="tskip"></button>
  </div>
</div>

<script>
const KEY='rareEarthGameState', TUT='rareEarthTutorialDone', STEP='rareEarthTutorialStep'; // STEP/TUT は tutorial.js と共通（STEP: なし=未開始 / 数字=途中 / -1=完了）
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const del=k=>{try{localStorage.removeItem(k)}catch(e){}};
const go=()=>{location.href='map.html'};

// 工程（ゲーム上部の 1.採掘〜6.出荷 と同じ並び）
const STEPS=[
 {n:1,k:'採掘',e:'⛏️',w:'マップ画面',d:'世界地図から採掘エリアを選ぶ',t:'世界地図から気になるエリアを選んで出発！移動にはゴールドがかかるけど、マイルも貯まるよ。エリアごとに眠っているレアアースが違うんだ。'},
 {n:2,k:'運搬',e:'🚚',w:'採掘のあと',d:'掘り出した掘削物を持ち帰る',t:'掘り出した「掘削物」を持ち帰ろう。たくさん持ち帰るほど、次の精製がはかどるよ。'},
 {n:3,k:'精製',e:'🧪',w:'精製画面',d:'掘削物から元素をとり出す',t:'精製プラントで、掘削物1個につき50Gで元素をとり出せるよ。お金が足りないときは、リサイクル工場で働いてかせごう。'},
 {n:4,k:'素材',e:'🔩',w:'精製画面',d:'元素がインゴットなどの素材になる',t:'精製した元素は素材として、所持元素コレクションに並ぶよ。次の製品づくりの大切な材料になるんだ。'},
 {n:5,k:'製造',e:'🏭',w:'工場画面',d:'素材を使って製品をクラフト',t:'工場で素材を使って、レアアースが活躍する工業製品をクラフトしよう！'},
 {n:6,k:'出荷',e:'📦',w:'工場画面',d:'製品を売却してお金と経験値に',t:'できた製品は小口売却で出荷！ゴールドとEXPが増えて、レベルが上がると新しい展開が待っているよ。'}
];
const SLIDES=[
 {k:'ようこそ！',e:'✨',w:'あそびかた',t:'ようこそ、レアアースの世界へ！案内役のテルビウムだよ。まずは、レアアースが製品になるまでの6つの工程を見ていこう。',on:0},
 ...STEPS.map(s=>({k:s.n+'. '+s.k,e:s.e,w:s.w,t:s.t,on:s.n,img:'koutei'+s.n+'.png'})),
 {k:'もっと楽しむ',e:'🏠',w:'図鑑・ホーム',t:'図鑑では17元素のキャラクターを解放できるよ。ホームに家具を置くと居心地が上がって、精製ボーナスがつくよ。進行は自動で保存されるから安心してね！',on:6}
];

const icon=(s,cls)=>`<div class="ico ${cls||''}">${s.img?`<img src="${s.img}" alt="${s.k}" onerror="this.parentNode.classList.add('noimg')">`:''}<span class="em">${s.e}</span></div>`;

// 工程ライン
document.getElementById('line').innerHTML=STEPS.map(s=>`<li>${icon({...s,img:'koutei'+s.n+'.png'})}<div><h3>${s.n}. ${s.k}</h3><p>${s.d}</p></div></li>`).join('');

// スタート状態
let save=null;try{save=JSON.parse(get(KEY))}catch(e){}
const step=get(STEP), hasSave=!!save, inProg=step!==null&&step!=='-1', done=get(TUT)==='1'||step==='-1';
const st=document.getElementById('status'), ac=document.getElementById('actions');
const btn=(label,cls,fn)=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=label;b.onclick=fn;ac.appendChild(b)};
if(hasSave||inProg){
  st.innerHTML=hasSave
    ?`<span>Lv.<b>${save.level||1}</b></span><span><b>${(save.money??0).toLocaleString()}</b> G</span><span><b>${save.miles??0}</b> m</span>`
    :'ゲーム内チュートリアルの途中です。';
  btn('つづきから','',go);
  btn('しくみを見る','sub',()=>openTut('replay'));
  btn('はじめからやり直す','ghost',()=>{
    if(confirm('保存されているデータを消して、はじめからやり直します。よろしいですか？')){
      [KEY,'currentSelectedSpot',TUT,STEP].forEach(del);location.reload();
    }});
}else if(!done){
  st.textContent='はじめての方は、しくみの紹介のあと、ゲーム内のチュートリアルが始まります。';
  btn('はじめる','',()=>openTut('first'));
}else{
  st.textContent='準備ができたら出発しよう。';
  btn('あそぶ','',go);
  btn('しくみを見る','sub',()=>openTut('replay'));
}

// チュートリアル
const T=id=>document.getElementById(id);
let idx=0,mode='first';
T('tbar').innerHTML=STEPS.map(s=>`<div>${icon({...s,img:'koutei'+s.n+'.png'})}${s.n}.${s.k}</div>`).join('');
function render(){
  const s=SLIDES[idx];
  [...T('tbar').children].forEach((c,i)=>c.classList.toggle('on',s.on>i||s.on===6));
  T('tico').outerHTML=icon(s,'big').replace('class="ico big','id="tico" class="ico big');
  T('tw').textContent=s.w;T('tt').textContent=s.k;T('tb').textContent=s.t;
  T('td').textContent=(idx+1)+' / '+SLIDES.length;
  T('tprev').style.visibility=idx?'visible':'hidden';
  const last=idx===SLIDES.length-1;
  T('tnext').textContent=last?'マップへ出発！':'つぎへ';
}
function openTut(m){mode=m;idx=0;T('tskip').textContent=m==='first'?'紹介をスキップしてマップへ':'とじる';T('tut').classList.add('open');document.body.style.overflow='hidden';render();T('tnext').focus()}
function closeTut(){T('tut').classList.remove('open');document.body.style.overflow=''}
// 初回は、ゲーム内チュートリアル(tutorial.js)を開始状態(0)にしてマップへ。完了の記録は tutorial.js 側が行う
function finish(){if(mode==='first'&&get(STEP)===null)set(STEP,'0');go()}
function next(){idx<SLIDES.length-1?(idx++,render()):finish()}
function prev(){if(idx>0){idx--;render()}}
T('tnext').onclick=next;T('tprev').onclick=prev;
T('tskip').onclick=()=>mode==='first'?finish():closeTut();
addEventListener('keydown',e=>{if(!T('tut').classList.contains('open'))return;
  if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape')T('tskip').click()});
let x0=null;
T('tut').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
T('tut').addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-60)next();else if(dx>60)prev()});
</script>
</body>
</html>
