<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レアアース・クラフト - セキュリティ訓練</title>
  <style>
    body { background-color: #1a1a2e; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .phone { width: 360px; height: 740px; background: #0f3460; border: 4px solid #16213e; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box; }
    
    /* ヘッダー */
    .header { background: #16213e; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; border-bottom: 2px solid #00fff5; flex-shrink: 0; }
    
    /* BGMトグルボタン */
    .bgm-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #00fff5;
      color: #00fff5;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s;
    }
    .bgm-btn.muted {
      border-color: #e94560;
      color: #e94560;
      background: rgba(233, 69, 96, 0.2);
    }

    .content { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; box-sizing: border-box; }
    
    /* ステータスパネル */
    .status-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(22,33,62,0.8);
      border: 1px solid #00fff5;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
    }

    /* 常に上に大きく表示する吹き出しエリア */
    .message-banner {
      background: #fff;
      color: #0f3460;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,255,245,0.3);
      border: 2px solid #00fff5;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* ゲームエリア（4×4 = 16枚 / 8ペア） */
    .game-area {
      flex: 1;
      background: rgba(15,23,42,0.9);
      border: 2px solid #00fff5;
      border-radius: 12px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      box-sizing: border-box;
      position: relative;
    }

    /* カード（ドア）スタイル */
    .card {
      background: #16213e;
      border: 2px solid #00fff5;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: flex-end; /* キャラクターを下寄りに配置してドアから立っている風にする */
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .card.flipped {
      background: #0f3460;
      border-color: #ffde59;
    }
    
    /* 表面のキャラクター画像（大きく・下寄り） */
    .card img.chara-img {
      width: 95%;
      height: 95%;
      object-fit: contain;
      object-position: bottom center;
      display: none;
    }
    .card.flipped img.chara-img {
      display: block;
    }

    /* 裏面のドアカード画像（card_back.png） */
    .card img.card-back {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }
    .card.flipped img.card-back {
      display: none;
    }

    .btn-back { background: #e94560; color: #fff; border: none; padding: 8px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 11px; margin-top: 4px; }

    /* --- モーダル共通 --- */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(2px);
      box-sizing: border-box;
      padding: 16px;
    }

    .modal-content {
      background: #16213e;
      border: 2px solid #00fff5;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 270px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 245, 0.3);
      animation: popup 0.3s ease-out;
      box-sizing: border-box;
    }

    @keyframes popup {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .result-breakdown {
      background: rgba(15,23,42,0.8);
      border: 1px solid #00fff5;
      border-radius: 8px;
      padding: 8px;
      margin: 8px 0;
      font-size: 11px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- 指定のBGMおよび効果音 -->
  <audio id="bgm" src="BGM_hinan.ogg" loop preload="auto"></audio>
  <audio id="seType" src="SE_gacha.mp3" preload="auto"></audio>
  <audio id="seSeikai" src="mini_seikai.mp3" preload="auto"></audio>

  <div class="phone">
    <div class="header">
      <span>🚨 セキュリティ避難訓練</span>
      <span>⏱️ 経過: <span id="time">0</span>秒</span>
      <button id="bgm-btn" class="bgm-btn" onclick="toggleBGM()">🎵 ON</button>
    </div>
    
    <div class="content">
      <div class="status-panel">
        <span>安全確認: <span id="pairs">0</span> / 8組</span>
        <span>ミス回数: <span id="miss">0</span>回</span>
      </div>

      <!-- 上部に大きく配置した吹き出しバナー -->
      <div id="messageBanner" class="message-banner">
        各エリアのドアを開けて安全を確認しよう！
      </div>

      <!-- ゲームエリア（4×4 = 16枚 / 8ペア） -->
      <div class="game-area" id="gameArea"></div>

      <button class="btn-back" onclick="location.href='map.html'">🗺️ マップに戻る</button>
    </div>

    <!-- スタート説明画面モーダル -->
    <div id="startModal" class="modal-overlay">
      <div class="modal-content">
        <div style="font-size: 28px;">🚨</div>
        <div style="font-size: 15px; font-weight: bold; color: #00fff5; margin: 6px 0;">【緊急警報】セキュリティ訓練</div>
        <div style="font-size: 11px; color: #dcdde1; text-align: left; line-height: 1.4; margin-bottom: 12px; background: rgba(15,23,42,0.8); padding: 8px; border-radius: 6px;">
          本日は、緊急避難訓練を実施します📢各エリアに点在しているスタッフのペアを確認し、全員の安全を確保してください！
        </div>
        <button class="btn-back" style="background: #00fff5; color: #0f3460; font-size: 12px; padding: 10px;" onclick="startGame()">
          🚀 訓練スタート！
        </button>
      </div>
    </div>

    <!-- 結果モーダル -->
    <div id="resultModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div style="font-size: 28px;">✨</div>
        <div style="font-size: 15px; font-weight: bold; color: #00fff5; margin: 4px 0;">安全確認完了！</div>
        
        <div class="result-breakdown">
          <div class="result-row">
            <span>⏱️ 訓練時間:</span>
            <span style="color:#00fff5;"><span id="finalTime">0</span>秒</span>
          </div>
          <div class="result-row">
            <span>❌ ミス回数:</span>
            <span style="color:#ff4757;"><span id="finalMiss">0</span>回</span>
          </div>
          <div style="border-top: 1px dashed #00fff5; margin-top: 2px; padding-top: 4px; font-weight: bold; display: flex; justify-content: space-between;">
            <span>💰 訓練報酬:</span>
            <span style="color:#55ff55;" id="totalMoney">+800 G</span>
          </div>
        </div>

        <button class="btn-back" style="background: #00fff5; color: #0f3460; font-size: 12px; padding: 10px;" onclick="saveAndReturn()">
          💰 資金を受け取ってマップへ
        </button>
      </div>
    </div>
  </div>

  <script>
    // BGM設定
    const bgm = document.getElementById('bgm');
    const bgmBtn = document.getElementById('bgm-btn');
    bgm.volume = 0.3;

    let isMuted = localStorage.getItem('bgmMuted') === 'true';

    function updateBgmUI() {
      if (isMuted) {
        bgm.muted = true;
        bgmBtn.innerText = '🔇 OFF';
        bgmBtn.classList.add('muted');
      } else {
        bgm.muted = false;
        bgmBtn.innerText = '🎵 ON';
        bgmBtn.classList.remove('muted');
      }
    }

    function toggleBGM() {
      isMuted = !isMuted;
      localStorage.setItem('bgmMuted', isMuted);
      updateBgmUI();
      if (!isMuted) {
        bgm.play().catch(e => console.log('BGM再生エラー:', e));
      } else {
        bgm.pause();
      }
    }

    function tryPlayBgm() {
      updateBgmUI();
      if (!isMuted && bgm.paused) {
        bgm.play().then(() => {
          document.removeEventListener('click', tryPlayBgm);
          document.removeEventListener('touchstart', tryPlayBgm);
        }).catch(err => {});
      }
    }

    document.addEventListener('click', tryPlayBgm);
    document.addEventListener('touchstart', tryPlayBgm);

    // 17種類のキャラクターリスト
    const allCharacters = [
      'Ce', 'Dy', 'Er', 'Eu', 'Gd', 'Ho', 'La', 'Lu', 
      'Nd', 'Pm', 'Pr', 'Sc', 'Sm', 'Tb', 'Tm', 'Y'
    ];

    let flippedCards = [];
    let matchedPairs = 0;
    let missCount = 0;
    let seconds = 0;
    let timerInterval;
    let isLocked = false;
    let earnedReward = 800;

    function startGame() {
      tryPlayBgm();
      document.getElementById('startModal').style.display = 'none';
      
      seconds = 0;
      matchedPairs = 0;
      missCount = 0;
      document.getElementById('pairs').innerText = matchedPairs;
      document.getElementById('miss').innerText = missCount;
      document.getElementById('messageBanner').innerText = "各エリアのドアを開けて安全を確認しよう！";

      timerInterval = setInterval(() => {
        seconds++;
        document.getElementById('time').innerText = seconds;
      }, 1000);

      initBoard();
    }

    function initBoard() {
      const gameArea = document.getElementById('gameArea');
      gameArea.innerHTML = '';

      // 17種類からランダムに8種類を選ぶ（8ペア = 16枚）
      let shuffledChars = [...allCharacters].sort(() => 0.5 - Math.random());
      let selectedChars = shuffledChars.slice(0, 8);

      let cardArray = [...selectedChars, ...selectedChars];
      cardArray.sort(() => 0.5 - Math.random());

      cardArray.forEach((charName) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.char = charName;

        card.innerHTML = `
          <img class="chara-img" src="chara0_${charName}.png" alt="${charName}">
          <img class="card-back" src="card_back.png" alt="ドア">
        `;

        card.addEventListener('click', () => flipCard(card));
        gameArea.appendChild(card);
      });
    }

    function flipCard(card) {
      if (isLocked) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      // カードめくり音: SE_gacha.mp3
      document.getElementById('seType').currentTime = 0;
      document.getElementById('seType').play().catch(e => {});

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      isLocked = true;
      const [card1, card2] = flippedCards;
      const charName = card1.dataset.char;

      if (charName === card2.dataset.char) {
        // 正解音: mini_seikai.mp3
        document.getElementById('seSeikai').currentTime = 0;
        document.getElementById('seSeikai').play().catch(e => {});

        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        document.getElementById('pairs').innerText = matchedPairs;
        flippedCards = [];
        isLocked = false;

        // メッセージのパターン
        const templates = [
          `${charName}無事でーす！`,
          `${charName}、ペア確認できました！`,
          `${charName}いま～す`,
          `${charName}無事です👍`
        ];
        const randomMsg = templates[Math.floor(Math.random() * templates.length)];

        if (matchedPairs === 8) {
          // 全8組クリア時
          document.getElementById('messageBanner').innerText = "安全ヨシ！お疲れ様でした！";
          clearInterval(timerInterval);
          setTimeout(endGame, 1500);
        } else {
          document.getElementById('messageBanner').innerText = randomMsg;
        }

      } else {
        missCount++;
        document.getElementById('miss').innerText = missCount;

        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isLocked = false;
        }, 800);
      }
    }

    function endGame() {
      earnedReward = Math.max(400, 1200 - (seconds * 10) - (missCount * 30));

      document.getElementById('finalTime').innerText = seconds;
      document.getElementById('finalMiss').innerText = missCount;
      document.getElementById('totalMoney').innerText = `+${earnedReward.toLocaleString()} G`;

      window.earnedMoney = earnedReward;
      document.getElementById('resultModal').style.display = 'flex';
    }

    function saveAndReturn() {
      let gameState = JSON.parse(localStorage.getItem('rareEarthGameState')) || { money: 1500, level: 1, mudStock: 5 };
      gameState.money += (window.earnedMoney || 0);
      localStorage.setItem('rareEarthGameState', JSON.stringify(gameState));
      location.href = 'map.html';
    }
  </script>
</body>
</html>
