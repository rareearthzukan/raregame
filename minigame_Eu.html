<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ユウロピウムの鉱物鑑定ハイアンドロー</title>
<style>
:root{color-scheme:dark;--gold:#d9ae4a;--gold2:#fff1b0;--felt:#0f4a2e;--k:min(1vw,.5vh);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#031009;color:#f6ecd0;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--k)*1.6);padding:8px 12px 10px;overflow:hidden;overflow:clip;
background:radial-gradient(ellipse at 50% 28%,#1f7248 0,#115133 48%,#06271a 100%)}
#app::before{content:"";position:absolute;left:-18%;right:-18%;bottom:-22%;height:58%;border:3px solid var(--gold);border-radius:50%;box-shadow:0 0 0 5px #0b3a25,0 0 0 7px #d9ae4a77;opacity:.55;pointer-events:none}
#app>*{position:relative}
.gt{background:linear-gradient(var(--gold2),var(--gold) 55%,#8c6212);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--k)*4.6)}
.top b{font-size:calc(var(--k)*5.4)}
.eu{display:flex;align-items:center;gap:10px}
.eu img{width:calc(var(--k)*23);height:auto;filter:drop-shadow(0 0 10px #ff4d5a99);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.panel{border:2px solid var(--gold);border-radius:12px;background:linear-gradient(#124f31,#0a3822);box-shadow:inset 0 0 0 3px #0a3822,inset 0 0 0 4px #d9ae4a88,0 4px 14px #0009}
.bubble{flex:1;padding:calc(var(--k)*2.6) 14px;text-align:center;font-size:calc(var(--k)*4.3);line-height:1.45;min-height:calc(var(--k)*17);display:flex;align-items:center;justify-content:center;margin-left:6px}
.bubble::before{content:"";position:absolute;left:-11px;top:42%;border:9px solid transparent;border-right:11px solid var(--gold);border-left:0}
.info{text-align:center;font-size:calc(var(--k)*3.9);letter-spacing:.04em}
.backs{display:flex;justify-content:center;gap:10px;height:calc(var(--k)*13)}
.back{width:calc(var(--k)*9.6);height:100%;border-radius:7px;border:2px solid var(--gold);background:radial-gradient(circle at 50% 50%,#1d6a42,#0a3a24);display:grid;place-items:center;font-size:calc(var(--k)*5);transition:opacity .5s,transform .5s}
.back.gone{opacity:0;transform:translateY(14px)}
.arena{display:flex;justify-content:center;align-items:flex-start;gap:calc(var(--k)*3)}
.side{display:flex;flex-direction:column;align-items:center;width:calc(var(--k)*33)}
.side small{font-size:calc(var(--k)*3.6);color:#e8d9a4}
.nm{font-size:calc(var(--k)*3.5);min-height:1.3em;text-align:center}
.val{font-size:calc(var(--k)*8);line-height:1;min-height:1em}
.val.w{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.35)}}
.vs{align-self:center;margin-top:calc(var(--k)*6);width:calc(var(--k)*13)}
.gc{position:relative;width:100%;aspect-ratio:1/1.12;border-radius:9px;border:2.5px solid var(--gold);padding:5%;display:flex;flex-direction:column;
background:radial-gradient(circle at 50% 40%,#92102f,#4b0716 75%);box-shadow:inset 0 0 0 2px #2a0309,inset 0 0 0 3px #d9ae4a99,0 3px 10px #000a;cursor:default}
.gc.tap{cursor:pointer;transition:transform .2s}
.gc.tap:hover,.gc.tap:focus-visible{transform:translateY(-6px);outline:none;box-shadow:inset 0 0 0 2px #2a0309,inset 0 0 0 3px #d9ae4a99,0 0 16px #ffd86b}
.gc .art{flex:1;min-height:0}
.gc svg{width:100%;height:100%;display:block;overflow:visible}
.gc .st{text-align:center;font-size:calc(var(--k)*3.3);line-height:1;color:#ffd24a;text-shadow:0 1px 2px #000;letter-spacing:0;white-space:nowrap;min-height:1em}
.gc .tg{position:absolute;left:-2px;top:-2px;background:#0d2b55;border:1px solid #d9ae4a;border-radius:6px 0 6px 0;font-size:calc(var(--k)*2.9);padding:1px 5px;color:#fff}
.gc.back2{background:repeating-linear-gradient(45deg,#0c3a25 0 7px,#0f4a2e 7px 14px);display:grid;place-items:center;font-size:calc(var(--k)*11)}
.gc.flip{animation:flip .7s}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.gc.used{opacity:.28;filter:grayscale(.7);pointer-events:none}
.sp{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.score{text-align:center;font-size:calc(var(--k)*5.6)}
.hand{display:flex;justify-content:center;gap:calc(var(--k)*2.8)}
.hand .gc{width:calc(var(--k)*27.5)}
.msg{text-align:center;font-size:calc(var(--k)*3.9);min-height:1.5em;color:#f3e3a6}
.act{display:flex;gap:10px;margin-top:auto}
.act button{flex:1;font:inherit;font-size:calc(var(--k)*5.2);font-weight:700;letter-spacing:.12em;color:#3d2603;padding:calc(var(--k)*3) 0;border-radius:999px;border:2px solid #fff3c4;cursor:pointer;
background:linear-gradient(#ffe9a0,#e3b647 55%,#b9861f);box-shadow:0 4px 0 #7a5410,0 8px 16px #000a}
.act button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5410}
.act button:disabled{opacity:.4;filter:grayscale(.6);cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#end{position:absolute;inset:0;z-index:9;background:rgba(2,12,7,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#end[hidden]{display:none}
#end h2{margin:0;font-size:clamp(30px,9vw,44px);letter-spacing:.14em}
#end img{width:120px;filter:drop-shadow(0 0 14px #ff4d5a99)}
.bubble{white-space:pre-line}
.help{font:inherit;font-weight:700;width:calc(var(--k)*8);height:calc(var(--k)*8);border-radius:50%;border:2px solid var(--gold);background:#0a3822;color:var(--gold2);cursor:pointer;margin-left:8px;font-size:calc(var(--k)*4.4)}
#app>.ov{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#1f7248,#115133 50%,#06271a);display:flex;flex-direction:column;align-items:center;gap:calc(var(--k)*3);padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));z-index:10;text-align:center}
#app>.ov[hidden]{display:none}
.ov::after{content:"";position:absolute;inset:8px;border:2px solid var(--gold);border-radius:16px;box-shadow:inset 0 0 0 3px #0a3822,inset 0 0 0 4px #d9ae4a77;pointer-events:none}
#app>#guide{z-index:11}#app>#rps{z-index:9}
.ov h1{margin:0;font-size:clamp(40px,13vw,62px);letter-spacing:.12em;line-height:1.1}
.tdeco{display:flex;gap:8px;justify-content:center;margin-top:calc(var(--k)*3)}
.td{width:calc(var(--k)*13);aspect-ratio:1;animation:bob 3s ease-in-out infinite}.td:nth-child(2n){animation-delay:-1s}.td:nth-child(3n){animation-delay:-2s}
.ov .big{width:calc(var(--k)*46);height:auto;filter:drop-shadow(0 0 16px #ff4d5aaa);animation:bob 3s ease-in-out infinite}
.tsub{font-size:calc(var(--k)*4.6);color:#f3e3a6;letter-spacing:.1em}
.ov .act{width:min(82%,320px);flex-direction:column}
.act button.sub{background:linear-gradient(#124f31,#0a3822);color:var(--gold2);border-color:var(--gold);box-shadow:0 3px 0 #04170d,0 6px 12px #000a}
.mini{align-self:flex-end;font:inherit;font-size:calc(var(--k)*3.6);color:#e8d9a4;background:none;border:1px solid #d9ae4a77;border-radius:999px;padding:4px 14px;cursor:pointer;position:relative;z-index:2}
.bubble2{white-space:pre-line;width:100%;padding:calc(var(--k)*4) 16px;font-size:calc(var(--k)*5);line-height:1.7;min-height:calc(var(--k)*34);display:flex;align-items:center;justify-content:center}
.dots{color:var(--gold);letter-spacing:.2em;font-size:calc(var(--k)*4)}
.rhands{display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*5);margin-top:calc(var(--k)*4)}
.rhands small{display:block;font-size:calc(var(--k)*3.8);color:#e8d9a4;margin-bottom:4px}
.hnd{width:calc(var(--k)*30);aspect-ratio:1;border:2.5px solid var(--gold);border-radius:14px;background:radial-gradient(circle,#92102f,#4b0716 75%);display:grid;place-items:center;font-size:calc(var(--k)*15);box-shadow:inset 0 0 0 3px #2a0309,0 3px 10px #000a}
.rbtns{display:flex;gap:calc(var(--k)*4);margin-top:calc(var(--k)*3)}
.rb{font:inherit;width:calc(var(--k)*25);aspect-ratio:1;border-radius:50%;border:2px solid #fff3c4;background:linear-gradient(#ffe9a0,#e3b647 55%,#b9861f);color:#3d2603;font-weight:700;font-size:calc(var(--k)*3.8);cursor:pointer;box-shadow:0 4px 0 #7a5410,0 8px 14px #000a;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.rb span{font-size:calc(var(--k)*10)}.rb:active{transform:translateY(3px)}.rb:disabled{opacity:.4}
@media (max-height:700px){.backs{height:calc(var(--k)*10)}.back{width:calc(var(--k)*7.4)}.bubble{min-height:calc(var(--k)*13)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hand .gc{width:calc(var(--k)*16)}.hand{gap:calc(var(--k)*2)}.hand .gc .st{font-size:calc(var(--k)*2.6)}.hand .gc .tg{font-size:calc(var(--k)*2.4)}
.back.lit{background:#06222e;border-color:#8ff;color:#8ff;box-shadow:0 0 12px #6ff;font-size:calc(var(--k)*4.6);align-content:center;text-align:center;line-height:1}
.back.lit small{display:block;font-size:calc(var(--k)*2.4)}
.help:disabled{opacity:.4;cursor:default}
#lampB:not(:disabled){border-color:#8ff;box-shadow:0 0 10px #6ff}
#endM{line-height:1.5}#endM .gc{width:calc(var(--k)*30);margin:8px auto}
.hand .gc{aspect-ratio:1/1.3}
.gc .cn{text-align:center;font-weight:700;line-height:1.1;min-height:2.3em;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px #000;overflow:hidden}
#pvC .gc{width:calc(var(--k)*34);margin:0 auto;aspect-ratio:1/1.2}
#pv .cn,#endM .cn{font-size:calc(var(--k)*3.6)!important}
#pv{justify-content:center}#pvD{min-height:0!important}
.act button:disabled{opacity:.5}
</style>
</head>

<div id="app">
 <div class="top"><span>💰 <b class="gt" id="gold">308,597</b> <span class="gt">G</span></span><span><button class="help" id="lampB" style="width:auto;padding:0 10px;border-radius:999px" aria-label="ブラックライトを使う">🔦 ×<span id="lamp">0</span></button><button class="help" id="help" aria-label="あそびかた">？</button></span></div>
 <div class="eu"><img id="euImg" alt="ユウロピウム"><div class="panel bubble" id="bubble"></div></div>
 <div class="info gt" id="info"></div>
 <div class="backs" id="backs"></div>
 <div class="arena">
  <div class="side"><small>あなた</small><div class="gc back2" id="cYou" style="opacity:.25">？</div><div class="nm" id="nYou"></div><div class="val gt" id="vYou"></div></div>
  <svg class="vs" viewBox="0 0 100 100" aria-label="VS"><circle cx="50" cy="50" r="44" fill="#14391f" stroke="#d9ae4a" stroke-width="4"/><circle cx="50" cy="50" r="36" fill="none" stroke="#d9ae4a" stroke-width="1.5" stroke-dasharray="3 4"/><text x="50" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#f2cf72" font-family="serif">VS</text></svg>
  <div class="side"><small>ユウロピウム</small><div class="gc back2" id="cEu" style="opacity:.25">？</div><div class="nm" id="nEu"></div><div class="val gt" id="vEu"></div></div>
 </div>
 <div class="score gt" id="score"></div>
 <div class="hand" id="hand"></div>
 <div class="msg" id="msg"></div>
 <div class="act" id="act"></div>
 <div id="end" hidden><img id="endImg" alt=""><h2 class="gt" id="endT"></h2><div id="endM"></div><div class="act" style="width:100%;max-width:320px;flex-direction:column"><button id="again">もう一度あそぶ</button><button class="sub" id="toTitle">タイトルへ</button><button class="sub" onclick="location.href='zukan.html'">図鑑へ</button></div></div>

 <div class="ov" id="rps" hidden><div class="eu" style="width:100%"><img id="rEu" alt="ユウロピウム"><div class="panel bubble" id="rTxt"></div></div>
  <div class="rhands"><div><small>あなた</small><div class="hnd" id="hY">❔</div></div><div class="gt" style="font-size:calc(var(--k)*7)">VS</div><div><small>ユウロピウム</small><div class="hnd" id="hE">❔</div></div></div>
  <div class="rbtns" id="rBtns"><button class="rb" data-h="0"><span>✊</span>グー</button><button class="rb" data-h="1"><span>✌️</span>チョキ</button><button class="rb" data-h="2"><span>✋</span>パー</button></div>
  <div class="act"><button id="rGo" hidden>勝負をはじめる</button></div></div>
 <div class="ov" id="pv" hidden><div id="pvT" class="gt" style="font-size:calc(var(--k)*6)"></div><div id="pvC"></div><div class="panel bubble2" id="pvD"></div><div class="act"><button id="pvGo"></button><button class="sub" id="pvBack">もどる</button></div></div>
 <div class="ov" id="guide" hidden><button class="mini" id="skipG">スキップ</button><img class="big" id="gEu" alt="ユウロピウム" style="width:calc(var(--k)*44)"><div class="panel bubble2" id="gTxt"></div><div class="dots" id="gDots"></div><div class="act"><button id="gNext">つぎへ</button></div></div>
 <div class="ov" id="title"><div style="margin-top:calc(var(--k)*3)"><div class="gt" style="font-size:calc(var(--k)*5);letter-spacing:.2em">～ レアアース図鑑 ～</div><h1 class="gt">鉱物鑑定<br>ハイアンドロー</h1></div><div class="tdeco" id="tdeco"></div><img class="big" id="tEu" alt="ユウロピウム"><div class="tsub">ユウロピウムと、きらめく勝負！</div><div class="act"><button id="tStart">はじめる</button><button class="sub" id="tHow">あそびかた</button></div></div>
</div>

function setCall(c){call=c;phase="pick";$("hand").style.opacity="";status();say(c==="hi"?"ハイね！受けて立つわ。\n手札から1枚えらんでね。":"ローなのね、ひとひねりしたわね。\n手札から1枚えらんでね。");$("msg").textContent="手札をタップして勝負！";setAct([["勝負をえらんでね","",1]])}
function show(id,g){const e=$(id);e.className="gc flip";e.style.opacity="1";e.innerHTML=`<div class="tg">${g.t}</div><div class="art">${art(g)}</div><div class="st">${"★".repeat(g.s)}</div>`}
function count(id,to,done){const e=$(id);let n=0;const t=setInterval(()=>{n+=Math.max(1,Math.ceil(to/14));if(n>=to){n=to;clearInterval(t);done&&done()}e.textContent=n},38)}
function play(i){if(phase!=="pick")return;phase="reveal";status();const y=hand[i],s2=[...eh].sort((a,b)=>a.v-b.v);if(call==="hi")s2.reverse();
 const jk=eh.find(g=>g.id===100),e=jk&&Math.random()<.4?jk:Math.random()<.7?s2[0]:pick_(s2.slice(0,Math.min(2,s2.length))),j=eh.indexOf(e);
 [...$("hand").children][i].classList.add("used");[...$("backs").children][j].classList.add("gone");hand.splice(i,1);eh.splice(j,1);
 show("cYou",y);$("nYou").textContent=y.n;say("さあ、オープン！");setAct([["…","",1]]);
 setTimeout(()=>{show("cEu",e);$("nEu").textContent=e.n;let d=0;const fin=()=>{if(++d<2)return;judge(y,e)};count("vYou",y.v,fin);count("vEu",e.v,fin)},700)}
function judge(y,e){const jk2=y.id===100||e.id===100;const w=y.id===100?1:e.id===100?-1:y.v===e.v?0:(call==="hi"?(y.v>e.v?1:-1):(y.v<e.v?1:-1));
 const ex=jk2?"切り札のプリズム鉱！ハイでもローでも必ず勝つのよ。\n":`あなた${y.v}、私${e.v}。`+(call==="hi"?"ハイは高い方":"ローは低い方")+"の勝ち！\n";
 if(w>0){wy++;$("vYou").classList.add("w");say(ex+pick_(LOSE))}else if(w<0){we++;$("vEu").classList.add("w");say(ex+pick_(WIN))}else say(pick_(TIE));
 $("msg").textContent=(w>0?"あなたの勝ち！":w<0?"ユウロピウムの勝ち…":"引き分け")+(call==="hi"?"（高い方が勝ち）":"（低い方が勝ち）");status();
 setAct([[R>=MAX?"結果を見る":"次のラウンドへ",R>=MAX?finish:newRound]])}
function finish(){phase="end";status();let bonus=0;const m=wy>we?"win":wy<we?"lose":"tie";let extra="";
 if(m==="win"){SV.streak=(SV.streak||0)+1;bonus=SV.streak>=2?Math.min(SV.streak-1,3)*50:0;pay(200+bonus);const un=[];for(let i=101;i<=120;i++)if(!SV.houseki[i])un.push(i);
  const id=un.length?pick_(un):1+(Math.random()*120|0),isNew=!SV.houseki[id];
  SV.jewelCounts=SV.jewelCounts||{};SV.jewelCounts[id]=(SV.jewelCounts[id]!==undefined?SV.jewelCounts[id]:(SV.houseki[id]?1:0))+1;SV.houseki[id]=true;
  const lamp=Math.random()<.25+.1*Math.min(SV.streak,5);if(lamp)SV.blacklight++;save();const g=mk(id);
  extra=`<br>${isNew?"NEW！図鑑に登録しました":"ダブりました（図鑑で売却できます）"}${card(g)}<small>${DS[g.id-1]}</small>${lamp?"<br>🔦 ブラックライトも手に入れた！":""}`}
 else if(m==="tie")pay(100);else{SV.streak=0;save()}
 $("endT").textContent=m==="win"?"あなたの勝利！":m==="lose"?"ユウロピウムの勝利":"引き分け";
 $("endM").innerHTML=`${wy} − ${we}／所持金 ${fmt(gold)} G${m==="win"?`（賞金${200+bonus}G！）${SV.streak>=2?"<br>🔥 "+SV.streak+"連勝ボーナス +"+bonus+"G":""}`:m==="tie"?"（参加料を返却）":""}${extra}`;
 say(m==="win"?"完敗ね。賞金と鉱物をどうぞ！":m==="lose"?"今回は私の勝ち。また挑戦してね。":"いい勝負だったわ。");$("end").hidden=false;$("again").focus()}

  else{first=w>0?"you":"eu";$("rTxt").textContent=w>0?`ぽん！あなたは${HN[y]}、私は${HN[e]}。\nあなたの勝ち！最初の「親」はあなただよ。`:`ぽん！私は${HN[e]}、あなたは${HN[y]}。\n私の勝ち！最初の「親」は私だね。`;$("rBtns").style.display="none";$("rGo").hidden=false;$("rGo").focus()}},1000)});
