<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gdリバー – ガドリニウム造影剤アクション</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a41;--paper:#f2fbfd;--pink:#ef476f;--sun:#ffd23f;--mri:#8b5cf6;--aqua:#2bb3d1;--bg:#bfeaf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a2a3a}}
:root[data-theme="dark"]{--bg:#0a2a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;font-weight:700;color:var(--ink);display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none}
#g{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;background:#35b5d3;box-shadow:0 0 0 4px var(--ink)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:3px 10px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
#hud{position:absolute;top:8px;left:8px;right:8px;display:grid;grid-template-columns:1fr auto;gap:6px;pointer-events:none}
#bars{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bar small{display:block;font-size:10px;margin-bottom:2px}
.bg{height:9px;border:2px solid var(--ink);border-radius:6px;background:#dbe7ec;overflow:hidden}
.bg i{display:block;height:100%;width:100%;background:#3ddc84}
#ex{width:0;background:var(--mri)}
#ctl{position:absolute;bottom:14px;left:10px;right:10px;display:flex;justify-content:space-between;gap:10px}
.btn{font:inherit;font-weight:900;font-size:15px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:26px;padding:12px 18px;box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.s{background:#c4b5fd}.btn.g{background:#fff}
#toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:84%;text-align:center;font-size:13px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 var(--ink);opacity:0;transition:opacity .25s;pointer-events:none}
#bn{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:30px;font-weight:900;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;pointer-events:none;opacity:0;transition:opacity .4s}
#ov{position:absolute;inset:0;background:rgba(11,110,153,.86);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
[hidden]{display:none!important}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:16px;text-align:center;width:100%;max-height:100%;overflow:auto}
.card h1{font-size:26px;margin:4px 0}.card h2{font-size:19px;margin:2px 0 8px}
.card p{font-size:13.5px;line-height:1.7;margin:6px 0;text-align:left}
.row{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin:6px 0}
.row>div{flex:1;font-size:12px;line-height:1.55;text-align:left;background:#e3f6fa;border:2px solid var(--ink);border-radius:14px;padding:8px}
.row img{height:96px;display:block;margin:0 auto 4px}
.hero{height:150px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:9px;height:9px;border-radius:50%;background:#b8cfd6;border:2px solid var(--ink)}.dots i.on{background:var(--pink)}
.ic{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);vertical-align:middle;margin-right:6px}
.c1{background:var(--sun)}.c2{background:#5ac8fa;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}.c3{background:#c4b5fd;border-radius:6px;width:34px}
.sk{font-size:12px;color:#55707a;text-decoration:underline;cursor:pointer;margin-top:6px;display:inline-block}
.stars{font-size:34px;color:var(--sun);-webkit-text-stroke:2px var(--ink);letter-spacing:4px}
.fact{background:#e3f6fa;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:13px;line-height:1.7;text-align:left;margin:8px 0}
.btn small{display:block;font-size:10px;font-weight:700;opacity:.8}
.btn.s{opacity:.6}.btn.s.on{opacity:1;background:#a78bfa;animation:pl .45s infinite alternate}
@keyframes pl{to{transform:scale(1.08);box-shadow:0 0 0 7px rgba(139,92,246,.45),0 5px 0 var(--ink)}}
#tip{position:absolute;top:56%;left:8%;right:8%;text-align:center;font-size:17px;font-weight:900;line-height:1.4;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;pointer-events:none;opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<div id="g">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="chip" id="sc">SCORE 0</div>
    <div class="chip" id="md">浮き輪（環状型）</div>
    <div id="bars">
      <div class="bar"><small>キレート保持力（HP）</small><div class="bg"><i id="hp"></i></div></div>
      <div class="bar"><small id="stn">体内排出ゲージ</small><div class="bg"><i id="ex"></i></div></div>
    </div>
  </div>
  <div id="toast"></div><div id="bn"></div><div id="tip"></div>
  <div id="ctl" hidden>
    <button class="btn g" id="bm">形態チェンジ</button>
    <button class="btn s" id="bs">📡 スキャン<small>紫のMRIゾーンで押す</small></button>
  </div>
  <div id="ov"></div>
</div>

()=>`<h2>ガドリニウムのひみつ</h2><div class="row"><div><img src="${U.cyc}" alt="">浮き輪<br>（環状型）</div><div><img src="${U.lin}" alt="">ベルト<br>（直鎖型）</div></div><p>ガドリニウムは、MRIの写真をくっきりさせてくれる金属。でも、そのままだと体によくないんだ。だから<b>「キレート」</b>という入れ物でぎゅっと包んで、安全にして使うよ。</p><p>ゲームの<b>浮き輪</b>と<b>ベルト</b>が、その入れ物なんだ！</p>`,
()=>`<h2>やくめが終わったら…</h2><img src="${U.props}" style="width:100%;border-radius:14px;border:3px solid var(--ink)" alt=""><p>MRIで病気を見つけるお手伝いをしたあと、ガドリニウムは${ZR('腎臓','じんぞう')}からおしっことして<b>体の外へ</b>出ていくよ。ゲームのゴールは、この「体の外へ出ること」なんだ。</p><p>見えないところで、みんなの安全と健康をガードしているんだね！</p>`];

/* ---------- actions ---------- */

else if(k=='coin'){const b=X();for(let i=0;i<4;i++)ents.push({t:'coin',x:clamp(b+Math.sin(i*1.2)*34,BL+16,BR-16),y:-30-i*30})}
else if(k=='drop')ents.push({t:'drop',x:X(),y:-30});
else if(k=='gate')ents.push({t:'gate',x:BL+40+Math.random()*(BR-BL-80),y:-30,half:23});

function upd(dt){const L=LV[lv];let sp=L.sp*(1+dist/L.goal*.25);const tz=ents.find(e=>e.tut&&!e.done);if(tz){if(tz.y>=PY-6){sp=0;const t=$('tip');t.textContent='右下の「スキャン」ボタンをタップ！アイスをゲット🍨';t.style.opacity=1}else if(tz.y>PY-tz.h/2-90)sp*=.45}dist+=sp*dt;T+=dt;
acc+=sp*dt;if(acc>L.gap){acc=0;spawn()}mriAcc+=sp*dt;if(mriAcc>1100){mriAcc=0;ents.push({t:'mri',y:-50,h:70})}

const wo=wv(PY);p.tx=clamp(p.tx,BL+wo+R(),BR+wo-R());p.push=0;if(!seen.wv&&Math.abs(wv(60))>8){seen.wv=1;toast('川がうねうね！ダメージはないけど流されないでね',3000)}

if(e.o){e.o[2]+=.04*dt;e.x=e.o[0]+Math.cos(e.o[2])*46;e.y=e.y}

else if(e.t=='coin'&&d<20+R()*.5){e.dead=1;combo++;const g=100*(1+Math.floor(combo/5));score+=g;bp(880+Math.min(combo,12)*40,.08,'triangle');ps.push({t:'txt',x:e.x,y:e.y-14,vy:-1,l:40,m:40,s:'+'+g,c:'#e0a800'})}
else if(e.t=='drop'&&d<22+R()*.5){e.dead=1;hp=Math.min(100,hp+12);bp(660,.12,'triangle');setTimeout(()=>bp(880,.12,'triangle'),90);setTimeout(()=>bp(1320,.25,'triangle'),180);ps.push({t:'ring',x:e.x,y:e.y,r:8,l:24,m:24,c:'#2b8cff'});ps.push({t:'txt',x:e.x,y:e.y-14,vy:-1,l:50,m:50,s:'HP回復 +12',c:'#2b8cff'})}
else if(e.t=='cur'&&Math.abs(PY-e.y)<e.h/2)p.push+=e.d*6;
else if(e.t=='whirl'&&Math.abs(PY-e.y)<70&&Math.abs(e.x-px)<110)p.push+=clamp((e.x-px)/25,-1,1)*4.5;
else if(e.t=='mri'&&!e.done&&!e.m&&e.y>PY+e.h/2+20){e.m=1;combo=0;toast('スキャンし損ねた…',1200)}
if(e.y>H+120)e.dead=1}
ents=ents.filter(e=>!e.dead);
p.x=clamp(p.x+p.push*dt+(p.tx-p.x)*.14*dt,BL+wo+R(),BR+wo-R());

for(const q of ps){q.l-=dt;if(q.t=='dot'){q.x+=q.vx*dt;q.y+=q.vy*dt}else if(q.t=='txt'||q.t=='ice')q.y+=q.vy*dt;else q.r+=(q.n?.5:3.2)*dt}
