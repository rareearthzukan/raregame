<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e4a72">
<title>スカンジウム・ラボ</title>
<style>
:root{
  --ink:#0d2438; --cyan:#3de0ff; --mint:#7dffd4; --yellow:#ffd23f; --pink:#ff5d8f; --orange:#ff8a4f; --red:#ff3b4e;
  --font:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:#fff;background:#050e1c;display:flex;justify-content:center;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit}
.app{position:relative;width:100%;max-width:560px;height:100dvh;overflow:hidden;background:linear-gradient(165deg,#0a2540 0%,#0e4a72 55%,#168a92 100%)}
@media (min-width:640px){
  body{align-items:center;background:radial-gradient(circle at 50% 30%,#12304f,#050e1c)}
  .app{height:min(calc(100dvh - 32px),900px);border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 4px #08182c}
}
.bg{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(125,255,212,.16) 2px,transparent 2.5px),radial-gradient(rgba(61,224,255,.10) 1.5px,transparent 2px);background-size:46px 46px,23px 23px;background-position:0 0,11px 11px;opacity:.9}
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.screen.active{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== ボタン ===== */
.btn{display:block;font-weight:900;font-size:16px;text-align:center;text-decoration:none;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;cursor:pointer;color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;filter:grayscale(.6);pointer-events:none}
.btn-cyan{background:linear-gradient(#a8f4ff,#3de0ff)}
.btn-mint{background:linear-gradient(#c5ffe9,#5fe8b4)}
.btn-yellow{background:linear-gradient(#fff3a0,#ffd23f)}
.btn-pink{background:linear-gradient(#ffb3cf,#ff5d8f);color:#fff}
.btn-white{background:#fff}
.btn.big{font-size:22px;padding:15px}
.nav{display:flex;gap:8px}
.nav .btn{flex:1;font-size:13px;padding:10px 4px}
.icon{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0;line-height:1;flex:none}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* ===== ラボ（トップ） ===== */
.top-row{display:flex;justify-content:space-between;align-items:center;min-height:42px;position:relative}
.pill{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:5px 12px;font-size:12px;font-weight:bold}
.pill b{color:var(--yellow)}
.title-wrap{text-align:center;position:relative}
.badge-pill{display:inline-block;background:var(--cyan);color:var(--ink);font-weight:900;font-size:12px;padding:3px 14px;border-radius:999px;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.title-main{font-size:clamp(30px,9vw,44px);font-weight:900;line-height:1.1;margin-top:6px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 24px rgba(61,224,255,.7)}
.title-main span{color:var(--mint)}
.title-sub{font-size:12px;font-weight:bold;margin-top:6px;opacity:.9}
.hero{position:relative;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);overflow:hidden;flex:none;max-height:26vh;display:flex;justify-content:center}
.hero img{height:100%;max-height:26vh;object-fit:contain;display:block;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.modes{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.mode-card{flex:1;min-height:70px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(205,240,255,.92));color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:8px 12px;box-shadow:0 5px 0 var(--ink);cursor:pointer;text-align:left;transition:transform .08s}
.mode-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mode-ic{flex:none;width:56px;height:56px;border-radius:16px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(#a8f4ff,#3de0ff)}
.mode-card:nth-child(2) .mode-ic{background:linear-gradient(#fff3a0,#ffd23f)}
.mode-card:nth-child(3) .mode-ic{background:linear-gradient(#c5ffe9,#5fe8b4)}
.mode-tx{flex:1;min-width:0}
.mode-tx b{display:block;font-size:17px;font-weight:900;line-height:1.2}
.mode-tx small{display:block;font-size:11px;font-weight:bold;color:#3b5a73;line-height:1.35;margin-top:2px}
.mode-st{flex:none;text-align:center;font-weight:900;font-size:13px;line-height:1.2}
.mode-st i{display:block;font-style:normal;color:#f59e0b;font-size:15px}
.master{display:none;background:linear-gradient(#fff3a0,#ffd23f);color:var(--ink);font-weight:900;font-size:13px;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;text-align:center;box-shadow:0 3px 0 var(--ink);align-self:center}
.master.show{display:block}

/* ===== ステージ選択 ===== */
.ss-head{display:flex;align-items:center;gap:10px}
.ss-head h2{margin:0;font-size:20px;line-height:1.2;flex:1;text-shadow:0 3px 0 var(--ink)}
.ss-head h2 small{display:block;font-size:12px;opacity:.9}
.ss-hero{display:flex;align-items:center;gap:10px}
.ss-hero img{height:90px;flex:none;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25));animation:floaty 2.4s ease-in-out infinite}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0;align-content:center}
.stage{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:130px}
.stage:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.stage .n{font-size:11px;font-weight:900;color:#3b5a73}
.stage .ic{font-size:40px;line-height:1.1}
.stage .nm{font-size:15px;font-weight:900}
.stage .st{font-size:18px;color:#f59e0b;letter-spacing:2px}
.stage .st .off{color:#c3ccd8}
.stage.lock{background:#6b7a8c;color:#d6dde6;cursor:default}
.stage.lock .ic{filter:grayscale(1);opacity:.6}
.stage.lock:active{transform:none;box-shadow:0 5px 0 var(--ink)}

/* ===== ゲーム共通 ===== */
.topbar{display:flex;align-items:center;gap:8px}
.gt{flex:1;font-size:15px;font-weight:900;text-align:center;line-height:1.2;text-shadow:0 2px 0 var(--ink)}
.mode{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
.mode.on{display:flex}
.hud{display:flex;gap:8px}
.chip{flex:1;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:3px 8px;text-align:center;line-height:1.1}
.chip small{display:block;font-size:10px;opacity:.85}
.chip b{font-size:21px;font-variant-numeric:tabular-nums}
.chip.bump{animation:bump .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{0%{transform:scale(.8)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.say{display:flex;align-items:center;gap:10px;min-height:56px}
.say img{width:54px;height:54px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.say img.jump{animation:jump .5s cubic-bezier(.2,1.5,.4,1)}
.say img.shake{animation:shakeA .45s}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-8deg) scale(1.1)}100%{transform:translateY(0)}}
@keyframes shakeA{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-8deg)}60%{transform:translateX(7px) rotate(8deg)}}
.bubble{position:relative;flex:1;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:900;line-height:1.4;box-shadow:0 3px 0 var(--ink)}
.bubble::before{content:"";position:absolute;left:-11px;top:16px;border:8px solid transparent;border-right:10px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-6px;top:18px;border:6px solid transparent;border-right:8px solid #fff;border-left:0}
.bubble.ng{background:#ffe3ea;color:#b3123a}
.bubble.ok{background:#e3fff3;color:#0b6b46}
.stagebox{position:relative;flex:1;min-height:0;border-radius:20px;border:4px solid var(--ink);background:#0a1f36;box-shadow:0 6px 0 var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center}
.stagebox.shake{animation:shakeB .4s}
@keyframes shakeB{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
canvas.game{display:block;touch-action:none}
.startov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,14,28,.55);z-index:5}
.startov .btn{min-width:200px}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1;font-size:14px;padding:10px 6px}

/* ===== 酸素イオン ===== */
.gridwrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.ion-grid{position:relative;display:grid;gap:3px}
.cell{width:var(--cs);height:var(--cs);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;position:relative;cursor:pointer;transition:transform .1s,background .2s}
.cell.wall{background:linear-gradient(145deg,#41607f,#2a4260);border:2px solid #1a2f48;color:rgba(255,255,255,.28);font-size:calc(var(--cs)*.26)}
.cell.wall::after{content:"Zr";}
.cell.open{background:radial-gradient(circle,#c9f6ff 0 28%,#4aa8c7 30% 100%);border:2px solid #1d6f93;cursor:default}
.cell.rock{background:repeating-linear-gradient(45deg,#6e7480 0 6px,#58606c 6px 12px);border:2px solid #2c323c;cursor:not-allowed;color:#d5d9e0;font-size:calc(var(--cs)*.42)}
.cell.rock::after{content:"🪨"}
.cell.sc{background:linear-gradient(145deg,#aff7ff,#3de0ff);border:2px solid #0b6d86;color:var(--ink);font-size:calc(var(--cs)*.36);animation:scPop .3s cubic-bezier(.2,1.8,.4,1)}
.cell.sc::after{content:"Sc"}
@keyframes scPop{from{transform:scale(.4)}to{transform:scale(1)}}
.cell.lit{box-shadow:0 0 0 3px #7dffd4,0 0 14px #7dffd4}
.cell.hint{animation:hintP .5s ease-in-out 4}
@keyframes hintP{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,210,63,0)}50%{transform:scale(1.14);box-shadow:0 0 0 4px #ffd23f,0 0 16px #ffd23f}}
.cell.nope{animation:shakeA .35s}
.ring-ent,.ring-ext{width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.6)}
.ring-ext.on{filter:drop-shadow(0 0 10px #ffe66d) drop-shadow(0 0 20px #ffe66d);animation:bump .5s}
.ring-ext.off{filter:grayscale(1) brightness(.7)}
.ring-ext.off.reach{filter:grayscale(.1) brightness(1.1) drop-shadow(0 0 8px #7dffd4)}
.ring-ent{position:relative;transition:filter .2s}
.ring-ent.ok{filter:drop-shadow(0 0 8px #7dffd4) drop-shadow(0 0 14px #7dffd4)}
.ring-ent.ok::after{content:"✓";position:absolute;right:2px;top:0;font-size:calc(var(--cs)*.34);font-weight:900;color:#7dffd4;text-shadow:0 1px 0 var(--ink)}
.deco{width:var(--cs);height:var(--cs);border-radius:8px;background:rgba(0,0,0,.28)}
.drop{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5;transition:transform .16s linear}
.drop i{font-style:normal;width:78%;height:78%;border-radius:50% 50% 50% 8%;transform:rotate(-45deg) scale(1);background:radial-gradient(circle at 35% 30%,#fff,#5ec8ff 45%,#1f78d6);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.drop i b{transform:rotate(45deg);font-size:calc(var(--cs)*.26);color:var(--ink)}

/* ===== 電波あわせ ===== */
.gauge{height:18px;border-radius:10px;background:rgba(0,0,0,.4);border:2px solid var(--ink);overflow:hidden;position:relative}
.gauge i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#3de0ff,#7dffd4)}
.gauge span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;text-shadow:0 1px 0 var(--ink)}
.slider-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);border-radius:18px;padding:8px 10px}
.slider-box .nudge{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.slider-box .nudge:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:14px;border-radius:8px;background:linear-gradient(90deg,#ff8a4f,#ffd23f,#7dffd4,#3de0ff);border:2px solid var(--ink);outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:#fff;border:4px solid var(--ink);cursor:pointer}

/* ===== 演出 ===== */
.flash{position:absolute;inset:0;pointer-events:none;z-index:45;opacity:0;box-shadow:inset 0 0 70px 14px var(--c,#fff)}
.flash.go{animation:flashA .45s ease-out}
@keyframes flashA{0%{opacity:.9}100%{opacity:0}}
.splash{position:absolute;left:0;right:0;top:32%;text-align:center;z-index:42;pointer-events:none;font-size:40px;font-weight:900;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 24px rgba(255,210,63,.8);opacity:0}
.splash.go{animation:splashA .95s ease-out}
@keyframes splashA{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.15) rotate(2deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}
.modal{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,10,22,.78)}
.modal.show{display:flex}
.modal-card{width:100%;max-width:340px;max-height:100%;overflow-y:auto;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:24px;padding:16px;text-align:center;box-shadow:0 8px 0 var(--ink);animation:popIn .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h3{margin:0 0 8px;font-size:20px}
.modal-card p{margin:0 0 12px;font-size:14px;line-height:1.5;font-weight:bold}
.modal-card .btn{margin-top:8px}
.tut-step{display:flex;align-items:center;gap:10px;text-align:left;background:#eef8ff;border:2px solid #bcdcf0;border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:13px;font-weight:bold;line-height:1.45}
.tut-step span{font-size:30px;flex:none;width:40px;text-align:center}
.fact-item{text-align:left;background:#fffbe0;border:2px solid #f0d36a;border-radius:14px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;font-weight:bold;line-height:1.5}
.fact-item.locked{background:#e9edf3;border-color:#c3ccd8;color:#8a97a8}
.fact-item small{display:block;font-size:11px;color:#9a7b00;margin-bottom:2px}
.fact-item.locked small{color:#8a97a8}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ===== リザルト ===== */
#result{overflow-y:auto;gap:8px}
.rs-title{text-align:center;font-size:28px;font-weight:900;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.rs-title.ng{color:#9fd8ff}
.rs-hero{display:flex;justify-content:center;align-items:center;gap:6px}
.rs-hero img{height:108px;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:floaty 2s ease-in-out infinite}
.rs-stars{display:flex;gap:4px;font-size:44px;line-height:1}
.rs-stars span{color:#31506a;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;transform:scale(1)}
.rs-stars span.on{color:var(--yellow);animation:starIn .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starIn{0%{transform:scale(3) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.rs-sub{text-align:center;font-size:13px;font-weight:900;opacity:.95}
.rs-card{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:20px;padding:6px 12px;box-shadow:0 5px 0 var(--ink)}
.rs-row{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;font-weight:900;font-size:14px;border-bottom:2px dashed #d8dbe9;opacity:0;transform:translateY(8px)}
.rs-row:last-child{border-bottom:0}
.rs-row.in{animation:rowIn .4s ease-out forwards}
@keyframes rowIn{to{opacity:1;transform:none}}
.rs-row b{font-size:16px;font-variant-numeric:tabular-nums}
.rs-row.coin b{color:#d97706}
.rs-row.exp{background:linear-gradient(90deg,#fff3c4,#ffe28a);border-radius:10px;color:#7a4a00}
.fact{background:#fffbe0;color:var(--ink);border:3px solid #e8c84a;border-radius:16px;padding:8px 12px;font-size:12.5px;font-weight:bold;line-height:1.5;box-shadow:0 4px 0 #b99a1c;opacity:0}
.fact.in{animation:rowIn .5s ease-out forwards}
.fact b{display:block;font-size:12px;color:#9a7b00;margin-bottom:2px}
.rs-btns{display:flex;flex-direction:column;gap:8px}
.rs-btns .row2{display:flex;gap:8px}
.rs-btns .row2 .btn{flex:1;font-size:14px;padding:10px 4px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bg"></div>

  <!-- ===== ラボ（トップ） ===== -->
  <section id="hub" class="screen active">
    <div class="top-row">
      <div class="pill">ぜんぶの ★ <b id="totalStars">0 / 36</b></div>
      <button class="icon snd" aria-label="おと">🔊</button>
    </div>
    <div class="title-wrap">
      <span class="badge-pill">🔬 レアアース・ミニゲーム</span>
      <div class="title-main">スカンジウム<span>・ラボ</span></div>
