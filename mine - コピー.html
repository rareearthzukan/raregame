<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レアアース・クラフト - 採掘場</title>
  <style>
    /* ─── スクロールバーのおしゃれカスタマイズ（全画面共通） ─── */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #00fff5, #3b82f6);
      border-radius: 10px;
      box-shadow: 0 0 6px rgba(0, 255, 245, 0.5);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ffde59;
    }

    body { background-color: #1a1a2e; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .phone { width: 360px; height: 740px; background: #0f3460; border: 4px solid #16213e; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box; }
    .header { background: #16213e; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; border-bottom: 2px solid #e94560; flex-shrink: 0; }
    
    /* BGMトグルボタンのスタイル */
    .bgm-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #00fff5;
      color: #00fff5;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s;
    }
    .bgm-btn.muted {
      border-color: #e94560;
      color: #e94560;
      background: rgba(233, 69, 96, 0.2);
    }

    /* ─── 工程ナビゲーションバー ─── */
    .koutei-bar {
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid #00fff5;
      padding: 6px 4px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
    }
    .koutei-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .koutei-item {
      width: 36px;
      height: 36px;
      background: #000;
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .koutei-item.active {
      border-color: #00fff5;
      box-shadow: 0 0 10px rgba(0, 255, 245, 0.8);
      animation: kouteiGlow 1.2s infinite alternate;
    }
    @keyframes kouteiGlow {
      from { border-color: #00fff5; box-shadow: 0 0 4px rgba(0,255,245,0.4); }
      to { border-color: #ffde59; box-shadow: 0 0 12px rgba(255,222,89,0.9); }
    }
    .koutei-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .koutei-label {
      font-size: 8px;
      color: #94a3b8;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
    }
    .koutei-wrapper:has(.koutei-item.active) .koutei-label {
      color: #00fff5;
    }
    
    .content { 
      flex: 1; 
      background: linear-gradient(180deg, #1b4f72 0%, #0f3460 100%); 
      padding: 6px 10px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between; 
      text-align: center; 
      overflow-y: auto; 
    }
    
    .area-title { 
      font-weight: bold; 
      color: #00fff5; 
      font-size: 13px; 
      margin: 2px 0;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .area-description {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00fff5;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 10px;
      color: #dcdde1;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.2;
      margin: 2px 0;
      flex-shrink: 0;
    }

    /* ─── エリア風景画像BOX ─── */
    .area-visual-box {
      width: 100%;
      height: 175px;
      background: #000;
      border: 2px solid #ffde59;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      margin: 2px 0;
      flex-shrink: 0;
    }

    .area-visual-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tool-overlay {
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-size: 16px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      animation: float 2s infinite alternate;
    }

    @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-2px); } }

    .split-status-section {
      width: 100%;
      display: flex;
      gap: 6px;
      align-items: center;
      margin: 2px 0;
      flex-shrink: 0;
    }

    /* ─── キャラクターアニメBOX ─── */
    .anim-box {
      width: 50%;
      height: 155px;
      background: #000;
      border: 1px solid #00fff5;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .anim-gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .result-box {
      width: 50%;
      height: 155px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #ffde59;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .mining-status-text {
      font-size: 12px;
      color: #ffde59;
      line-height: 1.4;
      text-align: center;
      font-weight: bold;
      z-index: 2;
    }

    .jumping-ore {
      position: absolute;
      bottom: 10px;
      width: 54px;
      height: 54px;
      object-fit: contain;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes oreJump {
      0% { transform: translateY(40px) scale(0.4) rotate(0deg); opacity: 0; }
      40% { transform: translateY(-8px) scale(1.2) rotate(180deg); opacity: 1; }
      70% { transform: translateY(4px) scale(1) rotate(270deg); opacity: 1; }
      100% { transform: translateY(0px) scale(1) rotate(360deg); opacity: 1; }
    }

    .jump-active {
      animation: oreJump 0.6s ease-out forwards;
    }
    
    .btn-mine { background: #e94560; color: #fff; border: none; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; box-shadow: 0 2px 6px rgba(233, 69, 96, 0.4); margin: 2px 0; flex-shrink: 0; }
    .btn-mine:active { transform: scale(0.97); }

    .btn-back { background: #16213e; border: 1px solid #00fff5; color: #00fff5; padding: 5px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; width: 100%; margin: 2px 0; flex-shrink: 0; }
    .btn-back:active { transform: scale(0.97); }

    .btn-recycle-shortcut {
      background: rgba(0, 255, 245, 0.15);
      border: 1px solid #00fff5;
      color: #00fff5;
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      width: 100%;
      margin: 2px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .btn-recycle-shortcut:active { background: rgba(0, 255, 245, 0.3); }

    /* 下部ナビゲーション */
    .nav { 
      height: 56px; 
      background: #16213e; 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      padding: 0 8px;
      flex-shrink: 0; 
      border-top: 2px solid #1f293d;
      box-sizing: border-box;
    }
    .nav-item { 
      color: #a0aec0; 
      cursor: pointer; 
      text-align: center; 
      background: rgba(255, 255, 255, 0.05); 
      border: 1px solid rgba(0, 255, 245, 0.2); 
      border-radius: 10px; 
      padding: 4px 8px;
      font-size: 10px; 
      font-weight: bold;
      flex: 1;
      margin: 0 3px;
      transition: all 0.2s;
    }
    .nav-item:active {
      transform: scale(0.95);
    }
    .nav-item.active { 
      color: #00fff5; 
      background: rgba(0, 255, 245, 0.15); 
      border-color: #00fff5;
      box-shadow: 0 0 8px rgba(0, 255, 245, 0.3);
    }

    /* カスタムモーダル */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 30, 0.85);
      display: flex; justify-content: center; align-items: center;
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .modal-content {
      background: #16213e;
      border: 2px solid #00fff5;
      border-radius: 16px;
      padding: 16px 12px;
      width: 260px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 245, 0.3);
      animation: popup 0.3s ease-out;
    }
    @keyframes popup {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <audio id="bgm-mine" preload="auto" loop></audio>
  <audio id="se-gusa" src="gusa.mp3" preload="auto"></audio>
  <audio id="se-type" src="type.mp3" preload="auto"></audio>
  <audio id="se-gogogo" src="gogogo.mp3" preload="auto"></audio>

  <div class="phone">
    <div class="header">
      <span>💰 <span id="money">1,500</span> G</span>
      <span>🌟 Lv.<span id="level">1</span></span>
      <span>📦 採掘物: <span id="mud">0</span>個</span>
      <button id="bgm-btn" class="bgm-btn" onclick="toggleBGM()">🎵 ON</button>
    </div>
    
    <!-- 工程ナビゲーションバー -->
    <div class="koutei-bar">
      <div class="koutei-wrapper">
        <div class="koutei-item active"><img src="koutei1.png" alt="採掘" onerror="this.style.display='none'"></div>
        <div class="koutei-label">1.採掘</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item active"><img src="koutei2.png" alt="運搬" onerror="this.style.display='none'"></div>
        <div class="koutei-label">2.運搬</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei3.png" alt="精製" onerror="this.style.display='none'"></div>
        <div class="koutei-label">3.精製</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei4.png" alt="インゴット" onerror="this.style.display='none'"></div>
        <div class="koutei-label">4.素材</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei5.png" alt="製造" onerror="this.style.display='none'"></div>
        <div class="koutei-label">5.製造</div>
      </div>
      <div class="koutei-wrapper">
        <div class="koutei-item"><img src="koutei6.png" alt="出荷" onerror="this.style.display='none'"></div>
        <div class="koutei-label">6.出荷</div>
      </div>
    </div>

    <div class="content">
      <div class="area-title" id="current-area-title">【 エリア名 】</div>

      <div class="area-description" id="area-feature-text">
        エリアの特徴説明
      </div>

      <!-- 密着風景画像BOX -->
      <div class="area-visual-box">
        <img id="area-img" class="area-visual-img" src="area_cn.png" alt="エリアビジュアル">
        <div class="tool-overlay" id="tool-icon">🚚🚜</div>
      </div>

      <!-- 左右分割エリア -->
      <div class="split-status-section">
        <div class="anim-box">
          <img id="anim-img" class="anim-gif" src="anime_cn.gif" alt="動作アニメ">
        </div>
        <div class="result-box">
          <div class="mining-status-text" id="mining-status">資源を採取する準備ができました</div>
          <img id="jumping-ore-img" class="jumping-ore" src="kouseki1.png" alt="鉱石">
        </div>
      </div>

      <div style="width: 100%; display: flex; flex-direction: column; gap: 2px;">
        <button class="btn-mine" onclick="mineMud()">⛏️ 資源を採掘する (<span id="mine-cost">10</span>G)</button>
        <button class="btn-recycle-shortcut" onclick="goToRecycle()">
          ♻️ リサイクル工場（資金稼ぎ）へ行く
        </button>
        <button class="btn-back" onclick="goBackMap()">🗺️ マップに戻ってエリアを変更する</button>
      </div>
    </div>

    <!-- 下部ナビゲーション -->
    <div class="nav">
      <div class="nav-item active" onclick="goBackMap()"><span style="font-size:14px; display:block; margin-bottom:1px;">🗺️</span>マップ</div>
      <div class="nav-item" onclick="location.href='seisei.html'"><span style="font-size:14px; display:block; margin-bottom:1px;">🧪</span>精製</div>
      <div class="nav-item" onclick="location.href='factory.html'"><span style="font-size:14px; display:block; margin-bottom:1px;">🏭</span>工場</div>
      <div class="nav-item" onclick="location.href='zukan.html'"><span style="font-size:14px; display:block; margin-bottom:1px;">📖</span>図鑑</div>
    </div>

    <!-- 資金不足ポップアップ -->
    <div id="noMoneyModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div style="font-size: 26px;">⚠️</div>
        <div style="font-size: 13px; font-weight: bold; color: #ff4757; margin: 4px 0;">資金が足りません！</div>
        <div style="font-size: 12px; color: #dcdde1; margin-bottom: 10px; line-height: 1.4;">
          リサイクル工場（都市鉱山）に行って<br>資金を稼ぎますか？
        </div>
        <div class="modal-btn-row">
          <button class="btn-back" style="margin-top:0; background:#333; border-color:#888; color:#fff;" onclick="closeNoMoneyModal()">キャンセル</button>
          <button class="btn-mine" style="margin-top:0; background:#00fff5; color:#0f3460;" onclick="goToRecycleWithSound()">行く！</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let gameState = JSON.parse(localStorage.getItem('rareEarthGameState')) || { money: 1500, level: 1, mudStock: 5, elements: {} };
    let spotId = localStorage.getItem('currentSelectedSpot') || 'baiyun';
    let oreToggle = false;

    const spotConfig = {
      'baiyun': { name: '中国 モンゴル自治区 白雲鄂博', cost: 10, desc: '世界最大の軽レアアース鉱山。ランタンやセリウムの生産拠点。', img: 'area_cn.png', anim: 'anime_cn.gif', isSea: false },
      'america': { name: 'アメリカ マウンテンパス鉱山', cost: 30, desc: 'かつて世界のユーロピウム供給を支えた歴史ある名門露天掘り鉱山。', img: 'area_us.png', anim: 'anime_us.gif', isSea: false },
      'mount': { name: 'オーストラリア マウント・ウェルド鉱山', cost: 50, desc: '高品質な磁石向け軽レアアース（ネオジム等）を産出する安定供給地。', img: 'area_au.png', anim: 'anime_au.gif', isSea: false },
      'myanmar': { name: 'ミャンマー イオン吸着鉱床', cost: 100, desc: 'EVや風力発電に不可欠な「重レアアース」が豊富にとれる粘土層鉱床。', img: 'area_mm.png', anim: 'anime_mm.png', isSea: false },
      'africa': { name: '🌍 アフリカ新興鉱床', cost: 150, desc: '脱・中国依存に向けて近年世界中から開発が進む注目のフロンティア。', img: 'area_af.png', anim: 'anime_af.gif', isSea: false },
      'greenland': { name: 'グリーンランド クバネフエルド鉱床', cost: 300, desc: '氷河の下に眠る、世界最大級の未開発レアアース・ウラン複合鉱床。', img: 'area_greenisland.png', anim: 'anime_BIG_GL.gif', isSea: false },
      'tahiti': { name: 'タヒチ 南太平洋・マンガン団塊', cost: 200, desc: '深海底に転がる金属塊。重レアアースやコバルトを含む高価なゾーン。', img: 'area_tahiti.png', anim: 'anime_tahiti.gif', isSea: true },
      'okinotori': { name: '日本 沖ノ鳥島沖（EEZ海底泥）', cost: 500, desc: '日本の未来を担う！水深数千mの海底に眠る超高濃度レアアース泥。', img: 'area_japan.png', anim: 'anime_cn.gif', isSea: true }
    };

    const currentSpot = spotConfig[spotId] || spotConfig['baiyun'];

    // BGM切り替え設定
    const bgm = document.getElementById('bgm-mine');
    const bgmBtn = document.getElementById('bgm-btn');
    bgm.volume = 0.4;

    if (currentSpot.isSea) {
      bgm.src = 'BGM_mine2.ogg';
    } else {
      bgm.src = 'BGM_mine.ogg';
    }

    let isMuted = localStorage.getItem('bgmMutedMine') === 'true';

    function updateBgmUI() {
      if (isMuted) {
        bgm.muted = true;
        bgmBtn.innerText = '🔇 OFF';
        bgmBtn.classList.add('muted');
      } else {
        bgm.muted = false;
        bgmBtn.innerText = '🎵 ON';
        bgmBtn.classList.remove('muted');
      }
    }

    function toggleBGM() {
      isMuted = !isMuted;
      localStorage.setItem('bgmMutedMine', isMuted);
      updateBgmUI();
      if (!isMuted) {
        bgm.play().catch(() => {});
      } else {
        bgm.pause();
      }
    }

    function unlockAndPlayMine() {
      if (!isMuted) {
        bgm.play().then(() => {
          document.removeEventListener('click', unlockAndPlayMine);
          document.removeEventListener('touchstart', unlockAndPlayMine);
          document.removeEventListener('keydown', unlockAndPlayMine);
        }).catch(() => {});
      }
    }

    window.addEventListener('load', () => {
      updateBgmUI();
      if (!isMuted) {
        bgm.play().catch(() => {
          document.addEventListener('click', unlockAndPlayMine);
          document.addEventListener('touchstart', unlockAndPlayMine);
          document.addEventListener('keydown', unlockAndPlayMine);
        });
      }
    });

    function updateUI() {
      document.getElementById('money').innerText = gameState.money.toLocaleString();
      document.getElementById('level').innerText = gameState.level;
      document.getElementById('mud').innerText = gameState.mudStock;
      document.getElementById('current-area-title').innerText = `【 ${currentSpot.name} 】`;
      document.getElementById('area-feature-text').innerText = currentSpot.desc;
      document.getElementById('mine-cost').innerText = currentSpot.cost;
      document.getElementById('area-img').src = currentSpot.img;
      document.getElementById('anim-img').src = currentSpot.anim;

      const toolIcon = document.getElementById('tool-icon');
      if (currentSpot.isSea) {
        toolIcon.innerHTML = '🚢⚓';
      } else {
        toolIcon.innerHTML = '🚚🚜';
      }
    }

    function mineMud() {
      if (gameState.money < currentSpot.cost) {
        document.getElementById('noMoneyModal').style.display = 'flex';
        return;
      }

      const se = document.getElementById('se-gusa');
      se.currentTime = 0;
      se.play().catch(e => console.log('音声再生エラー:', e));

      gameState.money -= currentSpot.cost;

      // ★ミャンマー（'myanmar'）での採掘時、8%の確率でカラオケレアイベントが発生
      if (spotId === 'myanmar' && Math.random() < 0.08) {
        localStorage.setItem('rareEarthGameState', JSON.stringify(gameState));
        setTimeout(() => {
          location.href = 'karaoke.html';
        }, 300);
        return;
      }

      const gained = Math.floor(Math.random() * 2) + 1;
      gameState.mudStock += gained;
      gameState.lastMinedSpot = spotId;

      localStorage.setItem('rareEarthGameState', JSON.stringify(gameState));
      updateUI();

      oreToggle = !oreToggle;
      const oreImg = document.getElementById('jumping-ore-img');
      oreImg.src = oreToggle ? 'kouseki1.png' : 'kouseki2.png';

      oreImg.classList.remove('jump-active');
      void oreImg.offsetWidth;
      oreImg.classList.add('jump-active');

      document.getElementById('mining-status').innerText = `✨ 資源を\n${gained} 個獲得！`;
    }

    function closeNoMoneyModal() {
      document.getElementById('noMoneyModal').style.display = 'none';
    }

    function goToRecycle() {
      const se = document.getElementById('se-gogogo');
      se.currentTime = 0;
      se.play().catch(e => console.log('音声再生エラー:', e));
      setTimeout(() => {
        location.href = 'recycle.html';
      }, 300);
    }

    function goToRecycleWithSound() {
      goToRecycle();
    }

    function goBackMap() {
      const se = document.getElementById('se-type');
      se.currentTime = 0;
      se.play().catch(e => console.log('音声再生エラー:', e));

      setTimeout(() => {
        location.href = 'map.html';
      }, 150);
    }

    updateUI();
  </script>
</body>
</html>
