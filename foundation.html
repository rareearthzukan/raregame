<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16213e">
<title>みんなのレアアース17元素財団</title>
<style>
:root{--maxw:720px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:clamp(14px,min(calc(12px + 1.1vw),3.2vh),21px);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b1224;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;-webkit-user-select:none;user-select:none}
.phone{position:fixed;inset:0;width:100%;max-width:var(--maxw);margin:0 auto;background:#0f3460;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px #16213e,0 0 40px rgba(0,0,0,.6)}
.header{background:#16213e;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:calc(.4rem + env(safe-area-inset-top,0px)) .6rem .4rem;font-size:.78rem;font-weight:bold;border-bottom:2px solid #00fff5;gap:.1rem .5rem;flex-wrap:wrap}
.header>span{white-space:nowrap}
.btn-top-link{background:rgba(0,255,245,.15);border:1px solid #00fff5;color:#00fff5;border-radius:1rem;padding:.25rem .6rem;font-size:.75rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:.2rem}
.content{flex:1;min-height:0;background:linear-gradient(180deg,#1b4f72 0%,#0f3460 100%);padding:.6rem .7rem;display:flex;flex-direction:column;gap:.6rem;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* 財団バナー */
.foundation-banner{border-radius:.7rem;border:2px solid #ffde59;background:linear-gradient(135deg,#16213e 0%,#1b4f72 50%,#0f3460 100%);box-shadow:0 4px 15px rgba(0,0,0,.5);padding:.7rem;display:flex;align-items:center;gap:.7rem;flex-shrink:0}
.banner-img-mock{width:3.6rem;height:3.6rem;border-radius:50%;background:rgba(0,255,245,.2);border:2px solid #00fff5;display:flex;align-items:center;justify-content:center;font-size:1.9rem;flex-shrink:0;box-shadow:0 0 10px rgba(0,255,245,.4)}
.banner-text h2{margin:0 0 .2rem;font-size:.95rem;color:#ffde59}
.banner-text p{margin:0;font-size:.7rem;color:#cbd5e1;line-height:1.4}
/* 評判ゲージ */
.reputation-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;flex-shrink:0}
.rep-card{background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:.6rem;padding:.45rem .55rem;display:flex;flex-direction:column;gap:.3rem}
.rep-header{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;font-weight:bold}
.rank{font-size:.62rem;font-weight:bold;color:#0f172a;background:linear-gradient(90deg,#00fff5,#ffde59);border-radius:.8rem;padding:.02rem .45rem}
.rep-bar{height:.45rem;background:#0b1224;border-radius:1rem;overflow:hidden;border:1px solid #334155}
.rep-fill{height:100%;background:linear-gradient(90deg,#00fff5,#ffde59);transition:width .8s}
.rep-fill.neg{background:linear-gradient(90deg,#f87171,#fb923c)}
.rep-card.glow{animation:repglow 1.4s ease-out 2}
@keyframes repglow{0%,100%{box-shadow:none;border-color:#334155}40%{box-shadow:0 0 14px rgba(255,222,89,.9);border-color:#ffde59}}
.chips{display:flex;gap:.3rem;flex-wrap:wrap}
.chip{border:1px solid #ffde59;color:#ffde59;border-radius:1rem;padding:.1rem .6rem;font-size:.68rem;font-weight:bold}
/* 封筒 */
.envelope-card{border-radius:.8rem;padding:1rem;text-align:center;cursor:pointer;flex-shrink:0;border:2px dashed;animation:shake 2.2s infinite,pulse-env 1.5s infinite}
.envelope-card.quake{background:linear-gradient(135deg,#3b1313,#7f1d1d);border-color:#fb923c}
.envelope-card.bad{background:linear-gradient(135deg,#2b1b3d,#4c1d95);border-color:#c4b5fd}
.envelope-card.good{background:linear-gradient(135deg,#14301c,#166534);border-color:#a8e6a1}
.envelope-card:active{transform:scale(.97)}
.envelope-card.opening{animation:envopen .35s ease-in forwards}
.env-ico{font-size:2.4rem;display:block;margin-bottom:.2rem}
.env-t{font-size:.95rem;font-weight:bold;color:#ffde59;margin-bottom:.2rem}
.env-s{font-size:.72rem;color:#e2e8f0}
@keyframes shake{0%,70%,100%{transform:rotate(0)}74%{transform:rotate(-3deg)}78%{transform:rotate(3deg)}82%{transform:rotate(-3deg)}86%{transform:rotate(3deg)}90%{transform:rotate(0)}}
@keyframes pulse-env{0%,100%{box-shadow:0 0 10px rgba(255,152,0,.3)}50%{box-shadow:0 0 22px rgba(255,235,59,.65)}}
@keyframes envopen{0%{transform:scale(1)}100%{transform:scale(1.15) translateY(-20px);opacity:0}}
/* 手紙カード */
.letter-card{background:#fdfbf7;color:#1e293b;border:2px solid #d97706;border-radius:.8rem;padding:.8rem;display:flex;flex-direction:column;gap:.55rem;box-shadow:0 6px 20px rgba(0,0,0,.4);position:relative;animation:slidein .45s ease-out;flex-shrink:0}
@keyframes slidein{0%{transform:translateY(60px) scale(.95);opacity:0}100%{transform:none;opacity:1}}
.letter-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f3f4f6;padding-bottom:.4rem;gap:.3rem}
.letter-badge{color:#fff;font-size:.68rem;padding:.15rem .5rem;border-radius:.3rem;font-weight:bold;background:#3b82f6}
.letter-badge.quake{background:#dc2626}.letter-badge.bad{background:#7c3aed}.letter-badge.good{background:#16a34a}
.ltr-sub{font-size:.66rem;color:#92400e;font-weight:bold}
.letter-title{margin:0;font-size:.92rem;color:#1e293b}
.cutin-box{width:100%;height:5.2rem;border-radius:.5rem;display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:#fff;box-shadow:inset 0 2px 6px rgba(0,0,0,.3);border:1px solid #93c5fd;position:relative;overflow:hidden;background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.cutin-box.quake{background:linear-gradient(135deg,#7f1d1d,#ea580c);border-color:#fdba74}
.cutin-box.bad{background:linear-gradient(135deg,#4c1d95,#7c3aed);border-color:#c4b5fd}
.cutin-box.good{background:linear-gradient(135deg,#166534,#22c55e);border-color:#86efac}
.cutin-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.line{animation:pop .3s ease-out}
@keyframes pop{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.news-desc{font-size:.8rem;color:#374151;line-height:1.6;background:#f8fafc;border-left:3px solid #94a3b8;padding:.4rem .55rem;border-radius:.3rem;margin:.15rem 0}
.char-speech-row{display:flex;align-items:flex-start;gap:.5rem;margin:.25rem 0}
.char-avatar{width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid #d97706;object-fit:cover;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#92400e;font-size:1rem}
.char-body{flex:1;min-width:0}
.char-name{font-size:.62rem;color:#92400e;font-weight:bold;margin-bottom:.1rem}
.char-text{position:relative;font-size:.8rem;color:#78350f;line-height:1.55;font-weight:bold;background:#fffbeb;border:1px solid #fde68a;padding:.45rem .6rem;border-radius:.2rem .8rem .8rem .8rem}
.tapnext{align-self:center;background:#f59e0b;color:#fff;border:none;border-radius:1rem;padding:.35rem 1.2rem;font-size:.75rem;font-weight:bold;font-family:inherit;cursor:pointer;animation:bob 1.1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.skipln{align-self:flex-end;background:none;border:none;color:#9ca3af;font-size:.65rem;font-family:inherit;text-decoration:underline;cursor:pointer}
.tip{font-size:.72rem;background:#ecfeff;border:1px dashed #67e8f9;border-radius:.5rem;padding:.4rem .5rem;color:#155e75}
.guide{font-size:.72rem;color:#4b5563;font-weight:bold;margin-top:.1rem}
/* 支援ボタン */
.support-btn-group{display:flex;flex-direction:column;gap:.4rem;margin-top:.2rem}
.support-btn{background:#fff;border:2px solid #cbd5e1;border-radius:.5rem;padding:.5rem .7rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;cursor:pointer;font-family:inherit;color:#1e293b;text-align:left;transition:transform .1s}
.support-btn:active{transform:scale(.98)}
.support-btn.s{border-color:#60a5fa;background:#eff6ff}
.support-btn.m{border-color:#34d399;background:#ecfdf5}
.support-btn.l{border:3px solid #f59e0b;background:linear-gradient(135deg,#fffbeb,#fde68a);box-shadow:0 0 10px rgba(245,158,11,.45)}
.support-btn.skip{background:#f3f4f6;color:#6b7280}
.support-btn.no{opacity:.45}
.sb-title{font-size:.78rem;font-weight:bold;display:flex;flex-direction:column;gap:.15rem}
.sb-badge{align-self:flex-start;font-size:.6rem;font-weight:bold;color:#92400e;background:#fff7ed;border:1px solid #f59e0b;border-radius:.8rem;padding:0 .4rem}
.sb-cost{font-size:.85rem;font-weight:bold;color:#d97706;flex-shrink:0}
.approved-stamp{position:fixed;left:50%;top:48%;border:4px solid #dc2626;color:#dc2626;font-size:2rem;font-weight:900;padding:.3rem 1rem;border-radius:.6rem;transform:translate(-50%,-50%) rotate(-15deg) scale(2.4);pointer-events:none;opacity:0;background:rgba(254,226,226,.92);box-shadow:0 0 18px rgba(220,38,38,.5);z-index:60;letter-spacing:.15em}
.approved-stamp.show{opacity:1;transform:translate(-50%,-50%) rotate(-15deg) scale(1);transition:all .22s cubic-bezier(.2,1.6,.4,1)}
/* 汎用カード */
.card{background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:.7rem;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.4rem;flex-shrink:0}
.card h2{font-size:.85rem;margin:0;color:#ffde59}
.sub-t{font-size:.7rem;color:#cbd5e1;line-height:1.5}
.empty{text-align:center;color:#94a3b8;font-size:.76rem;line-height:1.7;padding:.5rem 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-bottom:1px dashed #334155;padding:.3rem 0;font-size:.75rem}
.row:last-child{border-bottom:none}
.tag{font-size:.62rem;font-weight:bold;border-radius:.5rem;padding:.05rem .4rem;border:1px solid #475569;white-space:nowrap}
.r-great{color:#fbbf24;border-color:#fbbf24}.r-good{color:#34d399;border-color:#34d399}.r-bitter{color:#fb923c;border-color:#fb923c}.r-odd{color:#a78bfa;border-color:#a78bfa}.r-skip{color:#94a3b8}
.tbbox{display:flex;gap:.6rem;align-items:center;background:#14301c;border:1px solid #a8e6a1;border-radius:.7rem;padding:.5rem;flex-shrink:0}
.tbbox .char-avatar{border-color:#a8e6a1}
.tbbox div{font-size:.76rem;line-height:1.5}
.btn{background:#3b82f6;color:#fff;border:none;border-radius:.6rem;min-height:2.1rem;padding:.3rem .9rem;font-size:.76rem;font-weight:bold;cursor:pointer;font-family:inherit}
.btn.tb{background:#a8e6a1;color:#14301c}.btn.sub{background:#475569}
.dbg{border:1px dashed #f59e0b;color:#fcd34d;font-size:.7rem;line-height:1.6}
.dbg .btn{min-height:1.7rem;font-size:.66rem;padding:.15rem .5rem;margin:.12rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
.modal{background:#fdfbf7;color:#1e293b;border:2px solid #d97706;border-radius:1rem;padding:1rem;width:100%;max-width:24rem;text-align:center;animation:pop .25s ease-out}
.modal h3{margin:.1rem 0 .5rem;font-size:.95rem}.modal p{font-size:.8rem;line-height:1.6;margin:.3rem 0}
.modal .btns{display:flex;gap:.5rem;margin-top:.8rem}.modal .btns .btn{flex:1}
/* 下部ナビ */
.nav{flex-shrink:0;position:relative;z-index:50;background:#16213e;border-top:2px solid #1f293d;display:flex;justify-content:space-around;align-items:stretch;gap:.2rem;padding:.4rem .3rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.nav-item{color:#a0aec0;cursor:pointer;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(0,255,245,.2);border-radius:.7rem;padding:.3rem .1rem;min-height:3rem;font-size:.68rem;font-weight:bold;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem}
.nav-ico{font-size:1.05rem;line-height:1;display:block}
.nav-item:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <span>💰 <span id="money">0</span> G</span>
    <span>🏛️ 財団</span>
    <span style="display:flex;gap:.3rem"><button class="btn-top-link" id="sndBtn" onclick="toggleSnd()" title="効果音">🔊</button><button class="btn-top-link" onclick="location.href='home.html#obs'">🔭 観測室へ</button></span>
  </div>
  <div class="content" id="app"></div>
  <div class="nav" id="bottom-nav">
    <div class="nav-item" onclick="location.href='map.html'"><span class="nav-ico">🗺️</span>マップ</div>
    <div class="nav-item" onclick="location.href='seisei.html'"><span class="nav-ico">🧪</span>精製</div>
    <div class="nav-item" onclick="location.href='factory.html'"><span class="nav-ico">🏭</span>工場</div>
    <div class="nav-item" onclick="location.href='export.html'"><span class="nav-ico">🌐</span>貿易</div>
    <div class="nav-item" onclick="location.href='zukan.html'"><span class="nav-ico">📖</span>図鑑</div>
    <div class="nav-item" onclick="location.href='home.html'"><span class="nav-ico">🏠</span>ホーム</div>
  </div>
</div>
<div class="overlay" id="ov"><div class="modal" id="mdl"></div></div>

<script src="areaconfig.js"></script>
<script src="foundation.js"></script>
<script>
const Q=new URLSearchParams(location.search), FORCE=Q.has('force'), DEBUG=Q.has('debug')||FORCE;
const $=id=>document.getElementById(id);
const fmt=n=>(n||0).toLocaleString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let gs=FD.loadGS();
let shown=1;            // いま開いている知らせで、見えている文の数（タップで1つずつ増える）
let shownFor=null;      // どの知らせの shown か

/* ───── 効果音（音声ファイルなしで鳴らす。🔊で切替）───── */
let AC=null, SND=localStorage.getItem('fdSound')!=='off';
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,t0,d,type,g){ const a=ac(); if(!a||!SND) return; const o=a.createOscillator(), v=a.createGain(); o.type=type; o.frequency.value=f; const t=a.currentTime+t0;
  v.gain.setValueAtTime(g,t); v.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(v); v.connect(a.destination); o.start(t); o.stop(t+d+.02); }
function noise(t0,d,g){ const a=ac(); if(!a||!SND) return; const n=a.sampleRate*d, b=a.createBuffer(1,n,a.sampleRate), x=b.getChannelData(0); for(let i=0;i<n;i++) x[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), v=a.createGain(), f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; s.buffer=b; v.gain.value=g; s.connect(f); f.connect(v); v.connect(a.destination); s.start(a.currentTime+t0); }
const sndOpen=()=>{ noise(0,.22,.35); tone(520,.12,.12,'triangle',.12); };
const sndPop=()=>tone(700,0,.06,'sine',.08);
const sndStamp=()=>{ tone(110,0,.22,'sine',.5); noise(0,.08,.3); };
const sndCoin=()=>{ tone(988,.12,.08,'square',.09); tone(1319,.2,.3,'square',.09); };
function toggleSnd(){ SND=!SND; localStorage.setItem('fdSound',SND?'on':'off'); $('sndBtn').textContent=SND?'🔊':'🔇'; if(SND) sndPop(); }

function save(){ FD.persist(gs); }
function reload(){ gs=FD.loadGS(); FD.ensure(gs); FD.tick(gs,{force:FORCE}); }

/* ───── 評判 ───── */
const RANK=['はじめの一歩','見習い','頼れる存在','名の知れた','世界が認める'];
function axisCard(a,F,glow){
  const v=F.axes[a.k]||0, lv=Math.max(1,Math.min(5,Math.floor(v/3)+1));
  const pct=v<0?Math.min(100,8+Math.abs(v)*10):(lv>=5?100:Math.max(6,((v-(lv-1)*3)/3)*100));
  return `<div class="rep-card ${glow?'glow':''}"><div class="rep-header"><span>${a.e} ${a.n}</span><span class="rank">Lv.${lv}</span></div>
    <div class="rep-bar"><div class="rep-fill ${v<0?'neg':''}" style="width:${pct}%"></div></div>
    <div style="font-size:.62rem;color:#94a3b8;display:flex;justify-content:space-between"><span>${v<0?'ちょっとピンチ':RANK[lv-1]}</span><span>${v>0?'+':''}${v}</span></div></div>`;
}
/* ───── 知らせ（封筒 → 手紙）───── */
const KIND={quake:{t:'🚨 緊急要請が届いています！',tag:'🌏 災害支援'},bad:{t:'⚠️ 相談したいことがあります',tag:'⚠️ 課題'},good:{t:'📩 お便りが届いています',tag:'🌟 応援'}};
function envelope(ev,o){
  const k=KIND[ev.kind]||KIND.good;
  return `<div class="envelope-card ${ev.kind}" id="env" onclick="openEnvelope()"><span class="env-ico">${ev.kind==='quake'?'🚨':ev.kind==='bad'?'📨':'💌'}</span><div class="env-t">${k.t}</div><div class="env-s">${o.retry?'もう一度のご相談です。':''}タップして開封</div></div>`;
}
function openEnvelope(){
  const F=gs.foundation; if(!F.open||F.open.opened) return;
  ac(); sndOpen(); $('env').classList.add('opening');
  setTimeout(()=>{ F.open.opened=true; save(); shown=1; shownFor=F.open.id; render(); },320);
}
function visibleLines(ev,F){ return ev.news.filter(n=>!n[2]||F.flags[n[2]]); }
function lineHtml(n){
  if(!n[0]) return `<div class="news-desc line">${esc(n[1])}</div>`;
  const nm=FD.WHO[n[0]]||n[0];
  return `<div class="char-speech-row line"><img class="char-avatar" src="chara0_${n[0]}.png" alt="${esc(nm)}" onerror="avFail(this,'${esc(nm)}')"><div class="char-body"><div class="char-name">${esc(nm)}</div><div class="char-text">${esc(n[1])}</div></div></div>`;
}
function avFail(img,nm){ const s=document.createElement('div'); s.className='char-avatar'; s.textContent=nm.slice(0,1); img.replaceWith(s); }
function nextLine(){ sndPop(); shown++; render(); }
function skipLines(){ shown=999; render(); }
function letter(ev,o,F){
  const lines=visibleLines(ev,F), k=KIND[ev.kind]||KIND.good, more=shown<lines.length;
  const opts=FD.optionsFor(ev,o.retry);
  return `<div class="letter-card" id="letter"><div class="approved-stamp" id="stamp">承認済</div>
    <div class="letter-header"><span class="letter-badge ${ev.kind}">${k.tag}</span><span class="ltr-sub">${o.retry?'もう一度のご相談（半額）':''}</span></div>
    <h3 class="letter-title">${esc(ev.title)}</h3>
    <div class="cutin-box ${ev.kind}"><span>${ev.icon}</span><img src="cutin_${ev.id}.png" alt="" onerror="this.remove()"></div>
    ${lines.slice(0,Math.min(shown,lines.length)).map(lineHtml).join('')}
    ${more?`<button class="tapnext" onclick="nextLine()">▼ タップでつづき</button><button class="skipln" onclick="skipLines()">全部読む</button>`
    :`${ev.tip?`<div class="tip line">💡 ${esc(ev.tip)}</div>`:''}
      <div class="guide line">支援のしかたを選んでください。結果は、行動（採掘・精製・貿易）を<b>${ev.wait}回</b>すすめると観測室に届きます。</div>
      <div class="support-btn-group">${opts.map(x=>optBtn(x,ev,F)).join('')}</div>`}
  </div>`;
}
function optBtn(x,ev,F){
  if(x.id==='skip') return `<button class="support-btn skip" onclick="choose('skip')"><span class="sb-title">🚪 ${esc(x.label)}</span><span class="sb-cost">0 G</span></button>`;
  const badge=x.tier==='l'?'<span class="sb-badge">⭐ 大成功のチャンス大</span>':'';
  return `<button class="support-btn ${x.tier} ${gs.money<x.cost?'no':''}" onclick="choose('${x.id}')"><span class="sb-title"><span>${esc(x.label)}${badge?'':` <small style="opacity:.6">（${FD.TIER[x.tier].n}）</small>`}</span>${badge}</span><span class="sb-cost">${fmt(x.cost)} G</span></button>`;
}
function eventSection(F){
  const o=F.open;
  if(!o) return `<div class="card"><h2>📨 届いている知らせ</h2><div class="empty">いまは新しい知らせはありません。<br>採掘・精製・貿易をすすめると、次の知らせが届きます。</div></div>`;
  const ev=FD.byId(o.id);
  if(shownFor!==o.id){ shownFor=o.id; shown=1; }
  return o.opened?letter(ev,o,F):envelope(ev,o);
}
function pendingCard(F){
  if(!F.pending.length) return '';
  const a=FD.acts(gs);
  return `<div class="card"><h2>⏳ 結果を待っている支援</h2>${F.pending.map(p=>{ const ev=FD.byId(p.id), left=Math.max(0,p.due-a);
    return `<div class="row"><span>${ev.icon} ${esc(ev.title)}</span><span class="sub-t">あと ${left} 回の行動</span></div>`; }).join('')}</div>`;
}
function historyCard(F){
  const rows=F.log.slice().reverse().map(l=>{ const ev=FD.byId(l.id);
    const t=l.skipped?'<span class="tag r-skip">見送り</span>':`<span class="tag r-${l.result}">${FD.RESULT_NAME[l.result]}</span>`;
    return `<div class="row"><span>${ev.icon} ${esc(ev.title)}</span>${t}</div>`; }).join('');
  return `<div class="card"><h2>📖 これまでの歩み</h2>${rows||'<div class="empty">これまでの支援実績はありません。<br>最初の支援を行ってみましょう！</div>'}</div>`;
}
function debugCard(F){
  if(!DEBUG) return '';
  return `<div class="card dbg"><h2>🛠 テスト用（?debug=1）</h2><div>
    行動の回数：<b>${FD.acts(gs)}</b>（採掘 ${(gs.actCount||{}).mine||0} ／ 精製 ${(gs.actCount||{}).refine||0} ／ 貿易 ${FD.tradeCount(gs)}）<br>
    南鳥島の採掘 ${((gs.actCount||{}).mineBy||{}).okinotori||0} 回<br>
    <button class="btn" onclick="dbgAct(1)">行動+1</button><button class="btn" onclick="dbgAct(5)">行動+5</button><button class="btn" onclick="dbgMoney()">+10万G</button>
    <button class="btn" onclick="dbgOki()">南鳥島の採掘+1</button><button class="btn" onclick="dbgSeen()">Tb・Dy・Euを持った扱い</button><button class="btn sub" onclick="dbgReset()">財団を最初から</button><br>
    フラグ：${Object.keys(F.flags).join('、')||'なし'}</div></div>`;
}
function render(){
  FD.ensure(gs); const F=gs.foundation; $('money').textContent=fmt(gs.money); $('sndBtn').textContent=SND?'🔊':'🔇';
  if((gs.level||1)<FD.FOUND_LEVEL&&!FORCE){ $('app').innerHTML=`<div class="card"><h2>🔒 Lv.${FD.FOUND_LEVEL} で財団が設立されます</h2><div class="empty">いまは Lv.${gs.level||1} です。<br>レベルをあげて、また来てくださいね。</div></div>`; return; }
  F.axisSeen=F.axisSeen||{}; const glow={}; let changed=false;
  FD.AXES.forEach(a=>{ const v=F.axes[a.k]||0; if(F.axisSeen[a.k]===undefined){ F.axisSeen[a.k]=v; changed=true; } else if(v>F.axisSeen[a.k]){ glow[a.k]=true; } if(v!==F.axisSeen[a.k]){ F.axisSeen[a.k]=v; changed=true; } });
  if(changed) save();
  const keep=$('app').scrollTop, unread=gs.observatory.unread.length;
  $('app').innerHTML=`
    <div class="foundation-banner"><div class="banner-img-mock">🏛️</div><div class="banner-text"><h2>みんなのレアアース17元素財団</h2><p>資源を採り、精製し、輸出して社会に還元する。あなたの支援が、世界の「評判」になります。</p></div></div>
    <div class="reputation-grid">${FD.AXES.map(a=>axisCard(a,F,glow[a.k])).join('')}</div>
    ${F.titles.length?`<div class="chips">${F.titles.map(t=>`<span class="chip">🏅 ${esc(t)}</span>`).join('')}</div>`:''}
    ${unread?`<div class="tbbox"><img class="char-avatar" src="chara0_Tb.png" alt="テルビウム" onerror="avFail(this,'テルビウム')"><div><b>テルビウム</b><br>観測室に、まだ見ていない結果が${unread}件あります。<br><button class="btn tb" style="margin-top:.3rem" onclick="location.href='home.html#obs'">観測室へ</button></div></div>`:''}
    <div id="event-container">${eventSection(F)}</div>
    ${pendingCard(F)}${historyCard(F)}${debugCard(F)}`;
  $('app').scrollTop=keep;
}
function modal(h){ $('mdl').innerHTML=h; $('ov').style.display='flex'; }
function closeModal(){ $('ov').style.display='none'; }
function choose(id){
  const F=gs.foundation, ev=FD.byId(F.open.id), x=FD.optionsFor(ev,F.open.retry).find(o=>o.id===id);
  if(id==='skip') return modal(`<h3>見送りますか？</h3><p>${ev.kind==='bad'?'このまま見送ると、財団の評判に影響が出るかもしれません。':'今回は支援しないことにします。'}</p><div class="btns"><button class="btn sub" onclick="closeModal()">やめる</button><button class="btn" onclick="doSpend('skip')">見送る</button></div>`);
  if(gs.money<x.cost) return modal(`<h3>所持金が足りません</h3><p>${fmt(x.cost)} G が必要です。<br>採掘・精製・貿易で貯めてから、また来てください。</p><div class="btns"><button class="btn" onclick="closeModal()">わかった</button></div>`);
  modal(`<h3>この支援でよいですか？</h3><p><b>${esc(x.label)}</b><br>${fmt(x.cost)} G を使います</p><div class="btns"><button class="btn sub" onclick="closeModal()">やめる</button><button class="btn" onclick="doSpend('${id}')">支援する</button></div>`);
}
function doSpend(id){
  closeModal();
  if(id==='skip') return finishSpend(id);
  const st=$('stamp'); if(st){ st.classList.add('show'); ac(); sndStamp(); sndCoin(); }
  setTimeout(()=>finishSpend(id),900);
}
function finishSpend(id){
  const r=FD.spend(gs,id);
  if(!r.ok){ modal(`<h3>うまくいきませんでした</h3><p>${esc(r.msg)}</p><div class="btns"><button class="btn" onclick="closeModal()">閉じる</button></div>`); render(); return; }
  shownFor=null; render();
  if(r.skipped) modal(`<h3>見送りました</h3><p>${esc(r.text)}</p>${r.tb?`<p style="color:#166534;font-weight:bold">テルビウム${esc(r.tb)}</p>`:''}${r.retry?'<p style="font-size:.72rem;color:#6b7280">しばらくすると、半額でもう一度ご相談が届きます。</p>':''}<div class="btns"><button class="btn" onclick="closeModal()">閉じる</button></div>`);
  else modal(`<h3>支援しました</h3><p>ありがとうございます。<br>行動を <b>${r.wait}回</b> すすめると、結果が観測室に届きます。</p><div class="btns"><button class="btn sub" onclick="closeModal()">閉じる</button><button class="btn" onclick="location.href='home.html#obs'">観測室へ</button></div>`);
}
/* ── テスト用 ── */
function dbgAct(n){ gs.actCount=gs.actCount||{mine:0,refine:0,mineBy:{}}; gs.actCount.mine+=n; save(); reload(); render(); }
function dbgMoney(){ gs.money=(gs.money||0)+100000; save(); render(); }
function dbgOki(){ gs.actCount=gs.actCount||{mine:0,refine:0,mineBy:{}}; gs.actCount.mineBy=gs.actCount.mineBy||{}; gs.actCount.mineBy.okinotori=(gs.actCount.mineBy.okinotori||0)+1; gs.actCount.mine+=1; save(); reload(); render(); }
function dbgSeen(){ gs.elements=gs.elements||{}; ['Tb','Dy','Eu'].forEach(k=>gs.elements[k]=Math.max(1,gs.elements[k]||0)); save(); reload(); render(); }
function dbgReset(){ if(!confirm('財団の進行・結果・おみやげを最初に戻します。よいですか？')) return; delete gs.foundation; gs.observatory={unread:[],souvenirs:[],decor:[]}; save(); reload(); render(); }

reload(); render();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ reload(); render(); } });
</script>
</body>
</html>
