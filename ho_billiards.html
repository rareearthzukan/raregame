<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホルミウム・レーザー：体内ミッション</title>
  <style>
    body { background-color: #1a1a2e; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    .phone { flex-shrink: 0; }
    .phone { width: 360px; height: 740px; background: #0f3460; border: 4px solid #16213e; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-sizing: border-box; }
    .header { background: #16213e; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; border-bottom: 2px solid #e94560; flex-shrink: 0; gap: 6px; }
    .bgm-btn { background: rgba(0,0,0,.4); border: 1px solid #00fff5; color: #00fff5; border-radius: 12px; padding: 2px 8px; font-size: 12px; cursor: pointer; transition: all .2s; }
    .bgm-btn.muted { border-color: #e94560; color: #e94560; background: rgba(233,69,96,.2); }
    .content { flex: 1; padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 5px; position: relative; overflow: hidden; box-sizing: border-box; }

    /* ステータス */
    .status-panel { display: flex; align-items: center; gap: 8px; background: rgba(22,33,62,.85); border: 1px solid #00fff5; padding: 4px 8px; border-radius: 8px; font-size: 11px; flex-shrink: 0; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #00fff5; background: rgba(15,23,42,.85); overflow: hidden; flex-shrink: 0; transition: transform .15s, border-color .2s, box-shadow .2s; }
    .avatar.foe { border-color: #ff758c; }
    .avatar.shake { animation: shake .4s; }
    .avatar.glow { box-shadow: 0 0 12px #ffb347; border-color: #ffb347; }
    .avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .stat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: center; }
    .stat-title { font-size: 12px; font-weight: bold; color: #ffeb3b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-line { font-size: 10px; color: #dcdde1; white-space: nowrap; }
    .stat-line b { color: #00fff5; }
    .dots { letter-spacing: 2px; color: #ffb347; font-size: 12px; }
    .hp { color: #ff758c; letter-spacing: 1px; }

    /* 台 */
    .game-area { position: relative; flex: none; display: flex; justify-content: center; align-items: center; background: #1b2438; border: 2px solid #00fff5; border-radius: 12px; overflow: hidden; padding: 2px 0; }
    #cv { display: block; touch-action: none; border-radius: 10px; cursor: crosshair; }
    .speech { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 6; background: #fff; color: #16213e; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 12px; border: 2px solid #ffb347; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; max-width: 95%; overflow: hidden; text-overflow: ellipsis; }
    .speech.show { opacity: 1; }
    .banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(.85); z-index: 6; font-weight: bold; font-size: 14px; text-align: center; padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,.8); border: 2px solid #ffde59; color: #ffde59; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; line-height: 1.6; white-space: nowrap; }
    .banner.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .banner.bad { border-color: #ff4757; color: #ff9aa5; }

    /* 操作 */
    .power-row { display: flex; align-items: center; gap: 8px; background: rgba(22,33,62,.85); border: 1px solid #00fff5; border-radius: 8px; padding: 3px 10px; flex-shrink: 0; font-size: 11px; }
    .power-row b { color: #ffb347; min-width: 34px; text-align: right; }
    input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 8px; border-radius: 6px; background: linear-gradient(90deg, #00fff5, #ffb347, #ff4757); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid #ffb347; box-shadow: 0 0 8px #ffb347; cursor: pointer; }
    input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #ffb347; cursor: pointer; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1.7fr; gap: 5px; flex-shrink: 0; }
    .ctrl-btn { background: #16213e; border: 2px solid #00fff5; color: #fff; padding: 5px 1px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; transition: background .1s; touch-action: none; line-height: 1.15; }
    .ctrl-btn small { display: block; font-size: 9px; }
    .ctrl-btn:active { background: #00fff5; color: #0f3460; }
    .ctrl-btn.shot { border-color: #ffb347; color: #ffb347; background: rgba(255,179,71,.12); font-size: 16px; }
    .ctrl-btn.shot:active { background: #ffb347; color: #3a1f00; }
    .ctrl-btn:disabled { opacity: .4; }
    .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; }
    .btn-back { background: #e94560; color: #fff; border: none; padding: 7px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 11px; box-sizing: border-box; }
    .btn-back.sel { background: #16213e; color: #00fff5; border: 1px solid #00fff5; }

    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px) rotate(-4deg); } 60% { transform: translateX(4px) rotate(4deg); } }
    @keyframes popup { 0% { transform: scale(.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* モーダル */
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,15,30,.93); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(2px); box-sizing: border-box; padding: 12px; }
    .modal-content { background: #16213e; border: 2px solid #00fff5; border-radius: 16px; padding: 14px; width: 100%; max-width: 316px; text-align: center; box-shadow: 0 0 20px rgba(0,255,245,.3); animation: popup .3s ease-out; box-sizing: border-box; max-height: 100%; overflow-y: auto; }
    .modal-avatar { width: 64px; height: 64px; object-fit: contain; border-radius: 50%; border: 2px solid #ffb347; background: rgba(15,23,42,.85); margin: 0 auto; display: block; }
    .btn-main { background: #00fff5; color: #0f3460; font-size: 12px; padding: 10px; }
    .btn-sub { background: #16213e; color: #00fff5; border: 1px solid #00fff5; font-size: 11px; padding: 8px; margin-top: 6px; }
    .result-breakdown { background: rgba(15,23,42,.8); border: 1px solid #00fff5; border-radius: 8px; padding: 8px; margin: 8px 0; font-size: 11px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
    .result-row { display: flex; justify-content: space-between; gap: 8px; }
    .stars { font-size: 26px; letter-spacing: 4px; color: #ffde59; text-shadow: 0 0 10px #ffb347; margin: 2px 0; }
    .stars .off { color: rgba(255,255,255,.2); text-shadow: none; }

    /* チュートリアル */
    .tutor-head { font-size: 13px; font-weight: bold; color: #ffeb3b; margin-bottom: 8px; }
    .tutor-canvas { display: block; margin: 0 auto 8px; width: 250px; height: 120px; border: 2px solid #ffb347; border-radius: 12px; background: #0a1a35; box-shadow: 0 0 14px rgba(255,179,71,.35); }
    .tutor-title { font-size: 13px; font-weight: bold; color: #00fff5; margin-bottom: 4px; }
    .tutor-desc { font-size: 11px; color: #f1f5f9; line-height: 1.55; text-align: left; background: rgba(0,0,0,.3); padding: 8px 10px; border-radius: 8px; min-height: 92px; margin-bottom: 8px; box-sizing: border-box; }
    .tutor-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
    .tutor-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .tutor-dots span.on { background: #ffb347; box-shadow: 0 0 6px #ffb347; }
    .tutor-btns { display: flex; gap: 8px; }
    .tutor-btns .btn-back { flex: 1 1 0; width: auto; min-width: 0; margin: 0; padding: 10px 4px; white-space: nowrap; font-size: 12px; }
    .skip-link { background: none; border: none; color: #94a3b8; font-size: 10px; margin-top: 8px; cursor: pointer; text-decoration: underline; }

    /* ステージ選択 */
    .sel-card { background: rgba(15,23,42,.8); border: 1px solid rgba(0,255,245,.5); border-radius: 10px; padding: 8px; margin-bottom: 8px; text-align: left; }
    .sel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .sel-head img { width: 40px; height: 40px; object-fit: contain; border-radius: 50%; border: 2px solid #ff758c; background: #190c2e; flex-shrink: 0; }
    .sel-name { font-size: 12px; font-weight: bold; color: #ffeb3b; }
    .sel-desc { font-size: 9px; color: #b8c2d6; line-height: 1.35; }
    .sel-stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .st-btn { background: #16213e; border: 2px solid #00fff5; color: #fff; border-radius: 8px; padding: 5px 0; font-size: 12px; font-weight: bold; cursor: pointer; line-height: 1.25; }
    .st-btn small { display: block; font-size: 10px; color: #ffde59; letter-spacing: 1px; }
    .st-btn.boss { border-color: #ff758c; }
    .st-btn.lock { opacity: .35; cursor: default; border-color: #555; }
    .st-btn:not(.lock):active { background: #00fff5; color: #0f3460; }

    /* ===== かんたん版 追加CSS ===== */
    .phone { height: 810px; }
    .avatar { width: 58px; height: 54px; border: none; border-radius: 0; background: none; overflow: visible; }
    .avatar.foe, .avatar.glow { border: none; box-shadow: none; background: none; }
    .avatar.glow img { filter: drop-shadow(0 0 6px #7dff9b); }
    .avatar img { animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .m-happy { animation: jump .5s ease-in-out 3 !important; }
    .m-sad { transform: rotate(-8deg); filter: saturate(.5); animation: none !important; }
    .m-hurt { filter: brightness(1.5) sepia(1) hue-rotate(-30deg) saturate(3); }
    .m-win { filter: grayscale(.8) opacity(.6); transform: rotate(12deg) scale(.85); animation: none !important; }
    @keyframes jump { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.1); } }
    .mission { display: flex; gap: 7px; align-items: center; background: #fffbe8; color: #16213e; border: 2px solid #ffb347; border-radius: 12px; padding: 4px 8px; font-size: 12px; font-weight: bold; line-height: 1.35; min-height: 40px; flex-shrink: 0; box-sizing: border-box; }
    .mission img { width: 36px; height: 30px; object-fit: contain; flex-shrink: 0; }
    .mission b { color: #d9480f; }
    .spot { animation: spot 1s ease-in-out infinite; position: relative; z-index: 5; }
    @keyframes spot { 0%,100% { box-shadow: 0 0 0 0 rgba(255,235,59,.9); } 50% { box-shadow: 0 0 14px 5px rgba(255,235,59,.95); } }
    .legend { display: flex; justify-content: space-between; gap: 3px; font-size: 10px; font-weight: bold; flex-shrink: 0; }
    .lg { display: flex; align-items: center; gap: 3px; background: rgba(22,33,62,.9); border: 1px solid #3b5a8a; border-radius: 8px; padding: 2px 5px; white-space: nowrap; }
    .lg img { width: 18px; height: 18px; object-fit: contain; }
    .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; font-style: normal; font-size: 10px; line-height: 16px; text-align: center; }
    .dot.core { background: radial-gradient(circle at 35% 35%, #fff, #ffa630 70%, #e8590c); }
    .dot.cell { background: radial-gradient(circle at 35% 35%, #ffe3ea, #ff9fb8 60%, #d4527a); color: #5a1a33; }
    .dot.hole { background: #04252e; border: 2px solid #3ff0d2; box-sizing: border-box; }
    .power-row small { color: #94a3b8; font-size: 9px; }
    .ctrl-btn small { font-size: 9px; white-space: nowrap; }
    .controls { grid-template-columns: 1fr 1fr 1fr 1.1fr 1.5fr; }
    .ctrl-btn.shot { font-size: 13px; white-space: nowrap; }
    .title { position: absolute; inset: 0; z-index: 90; background: radial-gradient(circle at 50% 28%, #1f6b52, #0f3460 58%, #0a1230); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px; text-align: center; }
    .t-sub { color: #9dffbd; font-size: 13px; font-weight: bold; letter-spacing: 2px; }
    .t-main { font-size: 34px; font-weight: 900; line-height: 1.1; color: #fff; text-shadow: 0 0 14px #35ff8a, 0 3px 0 #0a5a30; }
    .t-ho { width: 250px; animation: bob 2s ease-in-out infinite; filter: drop-shadow(0 0 12px #35ff8a); }
    .t-vs { color: #ff9aa5; font-size: 12px; font-weight: bold; }
    .t-foes { display: flex; gap: 10px; align-items: flex-end; justify-content: center; }
    .t-foes img { height: 62px; max-width: 90px; object-fit: contain; animation: bob 2.4s ease-in-out infinite; }
    .t-foes img:nth-child(2) { animation-delay: .4s; } .t-foes img:nth-child(3) { animation-delay: .8s; }
    .t-cap { font-size: 13px; font-weight: bold; color: #ffeb3b; }
    .t-btn { width: 230px; border: none; border-radius: 28px; padding: 13px; font-size: 20px; font-weight: 900; background: linear-gradient(#ffd45e, #ff9f1c); color: #4a2500; box-shadow: 0 5px 0 #b86800; cursor: pointer; animation: pulse 1.4s ease-in-out infinite; }
    .t-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b86800; }
    .t-btn.sub { background: #16213e; color: #00fff5; border: 2px solid #00fff5; box-shadow: none; font-size: 14px; padding: 8px; animation: none; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .tutor-desc { min-height: 170px; text-align: center; font-size: 12px; line-height: 1.6; }
    .tutor-desc b { color: #ffde59; }
    .tu-row { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin-bottom: 8px; }
    .tu-row img { height: 56px; max-width: 80px; object-fit: contain; }
    .tu-item { display: flex; align-items: center; gap: 8px; text-align: left; margin: 5px 0; background: rgba(255,255,255,.07); border-radius: 8px; padding: 4px 6px; font-size: 11px; }
    .tu-item .ic { width: 38px; flex-shrink: 0; display: flex; justify-content: center; }
    .tu-item .ic img { height: 34px; max-width: 38px; object-fit: contain; }
    .tu-item .dot { width: 24px; height: 24px; line-height: 24px; font-size: 14px; }
    .tu-step { font-size: 14px; font-weight: bold; text-align: left; margin: 7px 0; }
    .sel-head img { width: 54px; height: 54px; border: none; border-radius: 0; background: none; }
    .sel-note { font-size: 11px; color: #ffeb3b; margin-bottom: 8px; }
    .st-btn { padding: 8px 0; font-size: 15px; }
    .st-btn.next { border-color: #ffeb3b; animation: spot 1s infinite; background: #3a3300; }
    .modal-avatar.big { width: 160px; height: auto; border: none; border-radius: 0; background: none; animation: bob 1.2s ease-in-out infinite; filter: drop-shadow(0 0 14px #35ff8a); }
    .cf { position: absolute; top: -20px; font-size: 20px; z-index: 120; pointer-events: none; animation: fall 2.6s linear forwards; }
    @keyframes fall { to { transform: translateY(840px) rotate(360deg); opacity: .8; } }
  </style>
</head>
<body>

  <audio id="bgm" src="BGM_billiard.ogg" loop preload="auto"></audio>

  <div class="phone">
    <div class="header">
      <span>ホルミウム・レーザー</span>
      <span><button id="helpBtn" class="bgm-btn">❓ あそびかた</button> <button id="bgm-btn" class="bgm-btn">🔊 おと ON</button></span>
    </div>

    <div class="content">
      <div class="status-panel">
        <div class="avatar" id="avHo"><img id="imgHo" alt="Ho"></div>
        <div class="stat-col">
          <div class="stat-title" id="stTitle">-</div>
          <div class="stat-line">うてる回数 <span class="dots" id="stShots"></span></div>
          <div class="stat-line">てきのHP <span class="hp" id="stHp"></span></div>
        </div>
        <div class="avatar foe" id="avFoe"><img id="imgFoe" alt="foe"></div>
      </div>

      <div class="mission"><img id="imgCoach" alt=""><div id="missionTxt"></div></div>

      <div class="game-area" id="gameArea">
        <canvas id="cv"></canvas>
        <div class="speech" id="speech"></div>
        <div class="banner" id="banner"></div>
      </div>

      <div class="legend" id="legend"></div>

      <div class="power-row" id="powerRow">
        <span>⚡ パワー</span><small>よわい</small>
        <input type="range" id="power" min="5" max="100" value="60">
        <small>つよい</small><b id="powerVal">60%</b>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="btnL">◀<small>すこし左</small></button>
        <button class="ctrl-btn" id="btnR">▶<small>すこし右</small></button>
        <button class="ctrl-btn" id="btnHint">💡<small>ヒント</small></button>
        <button class="ctrl-btn" id="btnRetry">↺<small>やりなおし</small></button>
        <button class="ctrl-btn shot" id="btnShot">🔴 はっしゃ！</button>
      </div>

      <div class="nav-row">
        <button class="btn-back sel" id="btnSelect">📋 ステージえらび</button>
        <button class="btn-back" onclick="location.href='map.html'">🗺️ マップにもどる</button>
      </div>
    </div>

    <!-- タイトル -->
    <div id="titleScreen" class="title">
      <div class="t-sub">からだの中の ミッション</div>
      <div class="t-main">ホルミウム<br>レーザー</div>
      <img id="titleHo" class="t-ho" alt="ホルミウム">
      <div class="t-vs">⚔ びょうきの てき ⚔</div>
      <div class="t-foes"><img id="tf0" alt=""><img id="tf1" alt=""><img id="tf2" alt=""></div>
      <div class="t-cap">ビリヤードで てきを やっつけろ！</div>
      <button class="t-btn" id="tStart">▶ はじめる</button>
      <button class="t-btn sub" id="tHelp">📖 あそびかた</button>
    </div>

    <!-- チュートリアル -->
    <div id="tutorialModal" class="modal-overlay">
      <div class="modal-content">
        <div class="tutor-head">📖 あそびかた</div>
        
        <div class="tutor-title" id="tutorTitle"></div>
        <div class="tutor-desc" id="tutorDesc"></div>
        <div class="tutor-dots" id="tutorDots"></div>
        <div class="tutor-btns">
          <button class="btn-back btn-sub" id="tutorPrevBtn" style="visibility:hidden;">◀ もどる</button>
          <button class="btn-back btn-main" id="tutorNextBtn">つぎへ ▶</button>
        </div>
        <button class="skip-link" id="tutorSkip">スキップ</button>
      </div>
    </div>

    <!-- ステージ選択 -->
    <div id="selectModal" class="modal-overlay" style="display:none;">
      <div class="modal-content">
        <div class="tutor-head">🩺 どの てきを たおす？</div>
        <div class="sel-note">やりたい ステージを タッチ！ クリアすると つぎが ひらくよ 🔓</div>
        <div id="selectList"></div>
        <button class="btn-back btn-sub" id="selHelp">📖 あそびかたを見る</button>
        <button class="btn-back btn-sub" id="selClose" style="display:none;">とじる</button>
        <button class="btn-back btn-sub" onclick="location.href='map.html'">🗺️ マップに戻る</button>
      </div>
    </div>

    <!-- 結果 -->
    <div id="resultModal" class="modal-overlay" style="display:none;">
      <div class="modal-content">
        <img id="resAvatar" class="modal-avatar" alt="">
        <div id="resTitle" style="font-size:15px;font-weight:bold;color:#00fff5;margin:6px 0 2px;"></div>
        <div class="stars" id="resStars"></div>
        <div id="resMsg" style="font-size:11px;color:#dcdde1;line-height:1.5;"></div>
        <div class="result-breakdown" id="resBox"></div>
        <button class="btn-back btn-main" id="resMain"></button>
        <button class="btn-back btn-sub" id="resSub"></button>
        <button class="btn-back btn-sub" id="resSel">📋 ステージ選択</button>
      </div>
    </div>
  </div>

  <script>
/* ホルミウム・ビリヤード 物理コア（ブラウザ／Node共通）
   ・クッションは「完全ミラー」：入射角＝反射角（速度は落ちない）
   ・玉どうしは等質量の弾性衝突
   ・摩擦は一定の減速。固定タイムステップなので、同じ入力なら必ず同じ結果になる */
const Core = (function () {
  const R = 10, W = 272, H = 412;            // 玉の半径 / プレイフィールドの幅・高さ
  const DT = 1 / 240, DECEL = 130, STOP_V = 6, E_BALL = 0.98;
  const VMIN = 180, VSPAN = 460;             // パワー0〜1 → 初速
  const POCKETS = [
    { x: 0, y: 0, r: 17 }, { x: W, y: 0, r: 17 }, { x: 0, y: H, r: 17 }, { x: W, y: H, r: 17 },
    { x: 0, y: H / 2, r: 15 }, { x: W, y: H / 2, r: 15 }
  ];
  const speedOf = p => VMIN + VSPAN * p;
  const reachOf = p => { const v = speedOf(p); return v * v / (2 * DECEL); };   // 転がる距離

  function clone(balls) {

        if (e.kind === 'target') { setFoeMood('hurt', 900); } shakeT = .2;
      }
    });
    const cue = S.shotBalls.find(b => b.kind === 'cue');
    if (cue.alive && (cue.vx || cue.vy) && Math.random() < .6) parts.push({ x: OX + cue.x, y: OY + cue.y, vx: (Math.random() - .5) * 20, vy: (Math.random() - .5) * 20, life: .45, max: .45, c: '#ffb347', r: 2.2 });
    if (!C.moving(S.shotBalls)) finishShot();

  function finishShot() {

    if (!res.scratch && !res.foul && targetsLeft() === 0) return finishStage(true);

    if (lastAim && !(res.scratch || res.foul)) { const tg = tgs.reduce((m, b) => !m || Math.hypot(b.x - cue.x, b.y - cue.y) < Math.hypot(m.x - cue.x, m.y - cue.y) ? b : m, null); S.angle = Math.atan2(tg.y - cue.y, tg.x - cue.x); }
    updateTrace(); updateHUD(); updateButtons(); setTimeout(() => { if (S.mode === 'aim') setHoMood('aim'); }, 1500);
    refreshGuide(res.foul ? '⚠ なかまの さいぼうを おとしちゃった…もとに もどすよ' : res.scratch ? '⚠ レーザー玉が あなに おちちゃった…もとに もどすよ' : got ? '🎉 ナイス！ てきに あたったよ！ つぎも ねらおう' : '😮 おしい！ もう一回 ねらおう（💡ヒントも あるよ）');
  }

  /* ═════════ クリア／失敗・報酬 ═════════ */
  function finishStage(win) {
    S.mode = 'result'; updateHUD(); updateButtons(); S.trace = null;
    const st = S.stage, D = DISEASES[st.d], par = st.par;
    if (win) {
      let stars = S.shotsUsed <= par ? 3 : S.shotsUsed <= par + 1 ? 2 : 1; if (S.hints > 0) stars = Math.min(stars, 2);
      const best = progress.stars[st.id] || 0, first = best === 0;
      const money = (first ? 200 + 120 * st.d + 60 * st.n : 0) + 80 * Math.max(0, stars - best);
      const ho = first ? 1 + (st.n === PER - 1 ? 1 : 0) : 0, exp = first ? 20 + 10 * st.d + (st.n === PER - 1 ? 30 : 0) : 0;
      S.result = { win, stars, money, ho, exp, first, best }; S.claimed = false;

    } else {

      setTimeout(() => showResult(), 900);
    }
  }
  function calcLevel(add) { let gs = {}; try { gs = JSON.parse(localStorage.getItem('rareEarthGameState')) || {}; } catch (e) {} let lv = gs.level || 1, ex = (gs.exp || 0) + add, up = false; while (ex >= lv * 100) { ex -= lv * 100; lv++; up = true; } return { level: lv, exp: ex, up }; }
  function claim() {
    if (S.claimed || !S.result || !S.result.win) return; S.claimed = true; const r = S.result, st = S.stage;
    let gs = {}; try { gs = JSON.parse(localStorage.getItem('rareEarthGameState')) || {}; } catch (e) {}
    if (gs.money == null) gs.money = 1500; if (gs.level == null) { gs.level = 1; gs.mudStock = gs.mudStock == null ? 5 : gs.mudStock; }
    gs.money += r.money; gs.elements = gs.elements || {}; gs.elements.Ho = (gs.elements.Ho || 0) + r.ho;
    const lv = calcLevel(r.exp); gs.level = lv.level; gs.exp = lv.exp;
    try { localStorage.setItem('rareEarthGameState', JSON.stringify(gs)); } catch (e) {}

  }
  function confetti() {

  }
  function showResult() {

    const hasNext = st.id < STAGES.length - 1;
    $('resBox').innerHTML = r.win ? '<div class="result-row"><span>🎯 使ったレーザー:</span><span style="color:#00fff5;">' + S.shotsUsed + ' / ' + st.limit + '（目安 ' + st.par + '）</span></div>'
      + '<div class="result-row"><span>💡 ヒント:</span><span style="color:#ffde59;">' + S.hints + ' 回</span></div>'

      + '<div style="border-top:1px dashed #00fff5;margin-top:2px;padding-top:4px;font-weight:bold;display:flex;justify-content:space-between;"><span>💰 獲得賞金:</span><span style="color:#55ff55;">+' + r.money + ' G</span></div>'
      + (r.first ? '' : '<div style="font-size:10px;color:#94a3b8;">※ 2回目以降は★が増えたぶんだけ賞金がもらえます</div>')
      : '<div class="result-row"><span>🎯 使ったレーザー:</span><span style="color:#ff8a96;">' + S.shotsUsed + ' / ' + st.limit + '</span></div>';
    $('resMain').textContent = r.win ? (hasNext ? '▶ つぎのステージへ' : '🏁 ぜんぶクリア！ステージ選択へ') : '🔄 もう一度ちょうせん';
    $('resSub').textContent = r.win ? '🔄 もう一度あそぶ' : '💡 ヒントを見てやり直す';
    $('resMain').onclick = () => { sfx('click'); claim(); if (r.win) { hasNext ? startStage(st.id + 1) : openSelect(); } else startStage(st.id); };
    $('resSub').onclick = () => { sfx('click'); claim(); startStage(st.id); };
    $('resSel').onclick = () => { sfx('click'); claim(); $('resultModal').style.display = 'none'; openSelect(); };
  }

  /* ═════════ ステージ選択 ═════════ */
  function openSelect() {

    const list = $('selectList'); list.innerHTML = ''; const nextId = [...Array(STAGES.length).keys()].find(i => stageUnlocked(i) && !(progress.stars[i] > 0));
    DISEASES.forEach((D, di) => {
      const card = document.createElement('div'); card.className = 'sel-card';
      card.innerHTML = '<div class="sel-head"><img data-d="' + di + '" alt=""><div><div class="sel-name">' + D.name + '（' + D.kana + '）</div><div class="sel-desc">' + D.desc + '</div></div></div><div class="sel-stages"></div>';
      const box = card.querySelector('.sel-stages');
      for (let n = 0; n < PER; n++) {
        const id = di * PER + n, ok = stageUnlocked(id), s = progress.stars[id] || 0, b = document.createElement('button');
        b.className = 'st-btn' + (n === PER - 1 ? ' boss' : '') + (ok ? '' : ' lock') + (id === nextId ? ' next' : '');
        b.innerHTML = (ok ? (n === PER - 1 ? 'BOSS' : (n + 1)) : '🔒') + '<small>' + (ok ? (id === nextId ? 'ここ！' : '★'.repeat(s) + '☆'.repeat(3 - s)) : 'ロック') + '</small>';
        if (ok) b.onclick = () => { sfx('click'); startStage(id); }; else b.onclick = () => sfx('ng');
        box.appendChild(b);
      }
      list.appendChild(card); setImg(card.querySelector('img'), 'dis', di, 'idle');
    });
    $('selClose').style.display = S.stage ? 'block' : 'none';
    $('selectModal').style.display = 'flex'; updateButtons();
  }
  $('btnSelect').addEventListener('click', () => { if (S.mode === 'roll' || S.mode === 'strike') return; sfx('click'); S.backMode = S.mode; openSelect(); });
  $('selClose').addEventListener('click', () => { $('selectModal').style.display = 'none'; S.mode = S.result && !S.claimed ? 'result' : 'aim'; if (S.mode === 'result') showResult(); updateTrace(); updateButtons(); });
  $('selHelp').addEventListener('click', () => { sfx('click'); openTutorial(true); });

  /* ═════════ チュートリアル ═════════ */
  const im = k => '<img src="' + IMG[k] + '">';
  const TUTOR = [
    { t: 'ホルミウムくんと びょうきを やっつけよう！', d: '<div class="tu-row">' + im('ho') + '</div><div class="tu-row">' + im('d0') + im('d1') + im('d2') + '</div>からだの中に いる わるい<b>「びょうき」</b>を、<b>レーザーの玉</b>を ぶつけて <b>あな</b>に おとして なおす ゲームだよ！' },
    { t: 'この玉は なに？', d: '<div class="tu-item"><span class="ic"><i class="dot core"></i></span><span><b>レーザー玉</b>（オレンジ）<br>これを うつよ。ここから スタート！</span></div><div class="tu-item"><span class="ic">' + im('d0') + '</span><span><b>てき</b>（びょうきの玉）<br>黄色い わっかが めじるし。<b>あなに おとそう！</b></span></div><div class="tu-item"><span class="ic"><i class="dot cell">☺</i></span><span><b>ニコニコ玉</b>＝ なかまの さいぼう<br><b>あなに おとしちゃ ダメ！</b></span></div><div class="tu-item"><span class="ic"><i class="dot hole"></i></span><span><b>あな</b>（カプセル）<br>てきを おとす ところ。</span></div>' },
    { t: 'やることは 3つ！', d: '<div class="tu-step">① 👆 画面を なぞって <b>ねらう</b></div><div class="tu-step">② ⚡ <b>パワー</b>を えらぶ</div><div class="tu-step">③ 🔴 <b>はっしゃ！</b>ボタンを おす</div>うてる回数は きまってるよ。<b>少ない回数</b>で たおすと <b>★3つ</b>！<br>つぎは 本番の 前に <b>れんしゅう</b>しよう！' }
  ];
  let tutorIdx = 0, tutorOpen = true, tutorFromSel = false;
  $('tutorDots').innerHTML = TUTOR.map(() => '<span></span>').join('');
  function showTutorSlide(i) {
    tutorIdx = i; $('tutorTitle').textContent = TUTOR[i].t; $('tutorDesc').innerHTML = TUTOR[i].d;
    [...$('tutorDots').children].forEach((d, k) => d.classList.toggle('on', k === i));
    $('tutorPrevBtn').style.visibility = i > 0 ? 'visible' : 'hidden';
    $('tutorNextBtn').textContent = i === TUTOR.length - 1 ? (tutorFromSel ? 'とじる' : '🎮 れんしゅうGO！') : 'つぎへ ▶';
  }
  function openTutorial(fromSel) { tutorFromSel = fromSel; tutorOpen = true; $('tutorSkip').textContent = fromSel ? 'とじる' : 'スキップ'; $('tutorialModal').style.display = 'flex'; showTutorSlide(0); }
  function closeTutorial() {

  }
  $('tutorNextBtn').addEventListener('click', () => { sfx('click'); tutorIdx < TUTOR.length - 1 ? showTutorSlide(tutorIdx + 1) : closeTutorial(); });
  $('tutorPrevBtn').addEventListener('click', () => { sfx('click'); if (tutorIdx > 0) showTutorSlide(tutorIdx - 1); });
  $('tutorSkip').addEventListener('click', () => { sfx('click'); closeTutorial(); });

  /* ═════════ 入力 ═════════ */
  let dragging = false;
  function aimFromEvent(e) {
    if (S.mode !== 'aim') return; const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * (CW / r.width) - OX, py = (e.clientY - r.top) * (CH / r.height) - OY, c = cueBall();
    if (Math.hypot(px - c.x, py - c.y) < 4) return; S.angle = Math.atan2(py - c.y, px - c.x); updateTrace(); if (Math.abs(S.angle - lastTickA) > .05) { sfx('tick'); lastTickA = S.angle; } stepGuide(1);
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); ac(); if (S.mode === 'roll') { S.ff = true; return; } tapInfo(e); dragging = true; try { cv.setPointerCapture(e.pointerId); } catch (er) {} aimFromEvent(e); });
  cv.addEventListener('pointermove', e => { if (dragging) aimFromEvent(e); });

  bindHold($('btnL'), () => nudge(-1)); bindHold($('btnR'), () => nudge(1));
  $('power').addEventListener('input', () => { S.power = $('power').value / 100; updateHUD(); sfx('charge', S.power * 500); stepGuide(2); });
  $('btnShot').addEventListener('click', shoot);
  $('helpBtn').addEventListener('click', () => { if (S.mode === 'roll' || S.mode === 'strike') return; sfx('click'); openTutorial(true); });
  $('btnRetry').addEventListener('click', () => { if (S.mode === 'aim' && S.stage) { sfx('click'); startStage(S.stage.id); } });
  $('btnHint').addEventListener('click', () => {
    if (S.mode !== 'aim') return; if (S.hints >= 3) { say('ホルミウム', 'ヒントは1ステージ3回までだよ', 1800); return; }
    banner('💡 解き方を考え中…', 800); setTimeout(() => {
      const f = C.findShots(S.balls, { angleStep: 1, want: 1 });
      if (f.best.length) { const b = f.best[0]; S.angle = b.a; S.power = b.p; $('power').value = Math.round(b.p * 100); S.hints++; sfx('hint'); updateTrace(); updateHUD(); say('ホルミウム', 'この狙いで入りそう！「発射」を押してね', 2400); }
      else say('ホルミウム', 'うーん…この配置は「やり直し」が早いかも', 2400);
    }, 40);
  });
  document.addEventListener('keydown', e => {
    if (S.mode !== 'aim') return;

    else if (e.key === 'ArrowUp') { S.power = Math.min(1, S.power + .05); $('power').value = Math.round(S.power * 100); updateHUD(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { S.power = Math.max(.05, S.power - .05); $('power').value = Math.round(S.power * 100); updateHUD(); e.preventDefault(); }

  });

  /* ═════════ メインループ ═════════ */
  let last = 0;
  function frame(ts) {

    requestAnimationFrame(frame);
  }

      const c = cueBall(); let pull = 8 + 40 * S.power;
      if (S.mode === 'strike') { const k = Math.min(1, S.strikeT / .17); pull = pull * (1 - k * k) - 5 * k; }
      drawCue(g, OX + c.x, OY + c.y, S.angle, pull, 1);
    }
    if (S.labelT > 0 && S.mode === 'aim') {
      S.labelT -= dt; g.save(); g.globalAlpha = Math.min(1, S.labelT); g.font = 'bold 10px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 3;
      S.balls.forEach(b => { if (!b.alive) return; const tx = b.kind === 'cue' ? 'レーザー玉' : b.kind === 'target' ? 'てき' : 'なかま', y = OY + b.y + (b.y < 40 ? 25 : -23);
        g.strokeStyle = 'rgba(10,15,30,.95)'; g.strokeText(tx, OX + b.x, y); g.fillStyle = b.kind === 'cue' ? '#ffd27a' : b.kind === 'target' ? '#ff9aa5' : '#9dffbd'; g.fillText(tx, OX + b.x, y); });
      g.restore();
    }
    // 演出
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94; g.globalAlpha = p.life / p.max; g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill(); }
    for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life -= dt; if (r.life <= 0) { rings.splice(i, 1); continue; } r.r += 140 * dt; g.globalAlpha = r.life / .6; g.strokeStyle = '#ffe9b8'; g.lineWidth = 3; g.beginPath(); g.arc(r.x, r.y, r.r, 0, 6.283); g.stroke(); }
    g.restore(); g.globalAlpha = 1;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let i = texts.length - 1; i >= 0; i--) { const f = texts[i]; f.life -= dt; if (f.life <= 0) { texts.splice(i, 1); continue; } f.y -= 22 * dt; g.globalAlpha = Math.min(1, f.life * 2); g.font = 'bold 14px sans-serif'; g.lineWidth = 3; g.strokeStyle = 'rgba(10,15,30,.9)'; g.strokeText(f.text, f.x, f.y); g.fillStyle = f.col; g.fillText(f.text, f.x, f.y); }
    g.globalAlpha = 1; g.restore();
    if (flashT > 0) { g.fillStyle = 'rgba(255,200,120,' + flashT * .4 + ')'; g.fillRect(0, 0, CW, CH); flashT = Math.max(0, flashT - dt * 2); }
  }

  /* ═════════ デバッグ用フック（#debug のときだけ）═════════ */
  if (location.hash === '#debug') window.__ho = { S, start: startStage, aim: (a, p) => { S.angle = a; S.power = p; $('power').value = Math.round(p * 100); updateTrace(); updateHUD(); }, shoot, stages: STAGES, progress };

  /* ═════════ 初期化 ═════════ */
  const phoneEl = document.querySelector('.phone');
  function fitScreen() { const k = Math.min(window.innerWidth / 368, window.innerHeight / 818, 1.6); phoneEl.style.transform = 'scale(' + k + ')'; }
  window.addEventListener('resize', fitScreen); window.addEventListener('orientationchange', fitScreen); fitScreen();
  buildTable(); setHoMood('idle'); S.balls = []; updateButtons();
  $('imgCoach').src = IMG.ho; $('titleHo').src = IMG.ho; [0, 1, 2].forEach(i => $('tf' + i).src = IMG['d' + i]);
  tutorOpen = false; $('tutorialModal').style.display = 'none'; $('selectModal').style.display = 'none'; buildLegend(); refreshGuide('ホルミウムくんと いっしょに びょうきを やっつけよう！');
  $('tStart').addEventListener('click', () => { ac(); sfx('start'); if (!isMuted) bgm.play().catch(() => {}); $('titleScreen').style.display = 'none'; if (!progress.seen) openTutorial(false); else openSelect(); });
  $('tHelp').addEventListener('click', () => { ac(); sfx('click'); openTutorial(true); });
  $('selHelp').addEventListener('click', () => { sfx('click'); openTutorial(true); });
    requestAnimationFrame(frame);
})();
  </script>
